<style>
/* ==================== YWAM GP PORTAL — its own look ====================
   Deliberately NOT the GP app's theme (that block lives in index / teams /
   help and test-theme keeps those three identical — this page is outside
   it). Black, white type, one card in the middle of the screen, the way an
   application portal reads: the logo and the portal's name on top, then
   exactly one thing to do. Status colours are the only colour on the page. */
:root {
  --bg:#000000; --surface:#111111; --surface2:#1A1A1A; --border:#2A2A2A; --border2:#3A3A3A;
  --ink:#FFFFFF; --muted:#A3A3A3; --faint:#737373; --onDark:#FFFFFF; --onDarkFaint:#A3A3A3;
  --accent:#FFFFFF; --accentInk:#000000; --link:#FFFFFF;
  --good:#4ADE80; --warn:#FBBF24; --bad:#F87171; --info:#60A5FA;
  --r:14px; --rSm:10px;
  color-scheme:dark;
}
* { box-sizing:border-box; }
html, body { margin:0; padding:0; overflow-x:hidden; }
body { background:var(--bg); color:var(--ink); font-family:'Inter','Kantumruy Pro',system-ui,-apple-system,sans-serif; font-size:15px; line-height:1.5;
  min-height:100vh; padding-bottom:env(safe-area-inset-bottom); -webkit-text-size-adjust:100%; -webkit-font-smoothing:antialiased; }
button, select, input, textarea { font-family:inherit; font-size:inherit; color:inherit; }
input:focus, select:focus, textarea:focus, button:focus-visible { outline:2px solid var(--ink); outline-offset:2px; }
a { color:var(--link); }
/* ---- header: a slim bar when signed in, a centred hero on the gate ---- */
header { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:calc(14px + env(safe-area-inset-top)) 20px 14px; border-bottom:1px solid var(--border); }
.brandRow { display:flex; align-items:center; gap:12px; min-width:0; }
.logoImg { height:34px; width:auto; display:block; }
.brandTitle { font-weight:600; font-size:16px; letter-spacing:.2px; white-space:nowrap; }
.brandSub { display:none; }
.hbtns { display:flex; gap:8px; align-items:center; }
.hbtn { border:1px solid var(--border2); background:transparent; color:var(--ink); border-radius:999px; padding:7px 14px; font-size:13px; cursor:pointer; }
.hbtn:hover { border-color:var(--ink); }
body.gate header { flex-direction:column; justify-content:center; gap:14px; border-bottom:0; padding:calc(48px + env(safe-area-inset-top)) 20px 8px; text-align:center; }
body.gate .brandRow { flex-direction:column; gap:14px; }
body.gate .logoImg { height:72px; }
body.gate .brandTitle { font-size:30px; font-weight:700; letter-spacing:-.3px; line-height:1.1; }
body.gate .brandSub { display:block; font-size:13px; color:var(--muted); letter-spacing:2px; text-transform:uppercase; margin-top:6px; }
body.gate .hbtns { position:absolute; top:calc(14px + env(safe-area-inset-top)); right:16px; }
body.gate main { padding-top:12px; }
/* ---- type & layout ---- */
main { padding:20px 16px 48px; max-width:1100px; margin:0 auto; }
h1 { font-size:28px; font-weight:700; letter-spacing:-.3px; margin:0 0 4px; line-height:1.15; }
h2 { font-size:20px; font-weight:600; margin:0 0 4px; }
h3 { font-size:13px; font-weight:600; letter-spacing:1.4px; text-transform:uppercase; color:var(--muted); margin:18px 0 10px; }
.sub { font-size:14px; color:var(--muted); margin:0 0 14px; line-height:1.5; }
.card { background:var(--surface); border:1px solid var(--border); border-radius:var(--r); padding:20px; margin-bottom:14px; }
.card.hero { background:transparent; border-color:var(--border2); }
.center { max-width:440px; margin:0 auto; }
.wide { max-width:680px; margin:0 auto; }
.gateTitle { text-align:center; margin:0 0 18px; }
.gateTitle h2 { font-size:22px; }
.eyebrow { font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--muted); font-weight:600; margin-bottom:6px; }
.btn { width:100%; margin-top:14px; padding:13px 16px; font-weight:600; font-size:15px; background:var(--accent); color:var(--accentInk); border:none; border-radius:var(--rSm); cursor:pointer; transition:opacity .12s, transform .08s; }
.btn:hover { opacity:.9; } .btn:active { transform:scale(.99); } .btn:disabled { opacity:.5; cursor:default; }
.btn.ghost { background:transparent; color:var(--ink); border:1px solid var(--border2); }
.btn.ghost:hover { border-color:var(--ink); opacity:1; }
.btn.small { width:auto; margin:0; padding:9px 14px; font-size:14px; }
.linkbtn { background:none; border:none; color:var(--link); font-size:14px; cursor:pointer; text-decoration:underline; text-underline-offset:3px; padding:10px; width:100%; margin-top:6px; }
.linkbtn.inline { width:auto; padding:0; margin:0; }
.linkbtn.danger { color:var(--bad); }
label.f { display:block; font-size:12.5px; font-weight:600; color:var(--muted); margin:14px 0 6px; }
input[type=text], input[type=tel], input[type=email], input[type=number], input[type=password], input[type=date], select, textarea {
  width:100%; padding:12px 14px; border:1px solid var(--border2); border-radius:var(--rSm); background:var(--bg); color:var(--ink); font-size:16px; }
input::placeholder, textarea::placeholder { color:var(--faint); }
input:focus, select:focus, textarea:focus { border-color:var(--ink); outline:none; }
select { appearance:none; -webkit-appearance:none; background-image:linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position:calc(100% - 20px) 50%, calc(100% - 14px) 50%; background-size:6px 6px; background-repeat:no-repeat; padding-right:38px; }
textarea { min-height:80px; resize:vertical; }
.hint { font-size:12.5px; color:var(--faint); margin-top:6px; line-height:1.45; }
.seg { display:flex; gap:8px; }
.seg button { flex:1; padding:11px; border-radius:var(--rSm); border:1px solid var(--border2); background:var(--bg); font-size:15px; cursor:pointer; }
.seg button.on { background:var(--ink); border-color:var(--ink); color:var(--accentInk); font-weight:600; }
.row { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:11px 0; border-bottom:1px solid var(--border); }
.row:last-child { border-bottom:0; }
.rowName { font-size:14.5px; } .rowSub { display:block; font-size:12.5px; color:var(--muted); margin-top:2px; }
.banner { background:var(--surface2); border:1px solid var(--border2); border-radius:var(--rSm); padding:11px 13px; font-size:13.5px; line-height:1.45; margin-bottom:14px; }
.msg { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--ink); color:var(--accentInk);
  padding:10px 16px; border-radius:999px; font-size:13.5px; font-weight:500; opacity:0; transition:opacity .2s; pointer-events:none; z-index:80; max-width:92vw; text-align:center; }
.msg.show { opacity:1; }
.chips { display:flex; gap:8px; flex-wrap:wrap; margin:0 0 12px; }
.chip { border:1px solid var(--border2); background:transparent; border-radius:999px; padding:7px 13px; font-size:13px; cursor:pointer; color:var(--muted); }
.chip:hover { border-color:var(--ink); color:var(--ink); }
.chip.on { background:var(--ink); border-color:var(--ink); color:var(--accentInk); font-weight:600; }
.pill { display:inline-flex; align-items:center; gap:6px; border-radius:999px; padding:5px 12px; font-size:12.5px; font-weight:600; border:1px solid var(--border2); background:var(--surface2); color:var(--muted); white-space:nowrap; }
.pill.pending, .pill.in_review, .pill.interview { color:var(--warn); border-color:var(--warn); background:transparent; }
.pill.accepted, .pill.practical, .pill.arrived { color:var(--good); border-color:var(--good); background:transparent; }
.pill.closed { color:var(--bad); border-color:var(--bad); background:transparent; }
.pill.big { font-size:15px; padding:9px 16px; }
/* the choices */
.choices { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:8px; }
.choice { text-align:left; background:var(--surface); border:1px solid var(--border); border-radius:var(--r); padding:16px; cursor:pointer; min-height:96px; display:flex; flex-direction:column; gap:4px; color:var(--ink); transition:border-color .12s; }
.choice:hover, .choice:focus-visible { border-color:var(--ink); }
.choiceKey { font-size:20px; font-weight:700; letter-spacing:-.2px; }
.choiceSub { font-size:12.5px; color:var(--muted); line-height:1.35; }
.prereq { display:inline-block; margin-top:6px; font-size:11.5px; color:var(--warn); }
.campusSeg button { font-size:14px; }
/* the applicant's dashboard */
.two { display:grid; grid-template-columns:1fr; gap:0; }
.timeline { list-style:none; margin:6px 0 0; padding:0; }
.step { display:grid; grid-template-columns:28px 1fr; gap:12px; align-items:start; position:relative; padding-bottom:16px; }
.step:not(:last-child)::before { content:''; position:absolute; left:13px; top:26px; bottom:0; width:2px; background:var(--border2); }
.step.done:not(:last-child)::before { background:var(--good); }
.dot { width:28px; height:28px; border-radius:50%; border:2px solid var(--border2); background:var(--bg); display:flex; align-items:center; justify-content:center; font-size:12.5px; color:var(--muted); font-weight:600; }
.step.done .dot { background:var(--good); border-color:var(--good); color:var(--accentInk); }
.step.current .dot { background:var(--ink); border-color:var(--ink); color:var(--accentInk); box-shadow:0 0 0 5px rgba(255,255,255,.14); }
.stepName { font-size:15px; font-weight:600; padding-top:3px; } .step.todo .stepName { color:var(--muted); font-weight:400; }
.stepNote { font-size:12.5px; color:var(--muted); margin-top:2px; line-height:1.4; }
.subItems { margin:6px 0 0; padding:0; list-style:none; font-size:13px; }
.whoTag { font-size:10.5px; font-weight:700; letter-spacing:.4px; text-transform:uppercase; border-radius:999px; padding:1px 7px; margin-left:4px; vertical-align:2px; border:1px solid var(--border2); color:var(--muted); }
.whoTag.you { color:var(--ink); border-color:var(--ink); }
.flowList { list-style:none; margin:0; padding:0; font-size:14px; }
.flowList li { padding:5px 8px; border-radius:8px; }
.flowList li.cur { background:var(--surface2); font-weight:600; }
.flowList li.auto { color:var(--muted); } .flowList li.auto.done { color:var(--ink); }
.flowMark { display:inline-block; width:18px; text-align:center; }
.trow .nextStep { color:var(--ink); }
.subItems li { display:flex; gap:8px; align-items:center; padding:3px 0; color:var(--muted); }
.subItems li.done { color:var(--good); }
.kv { display:flex; justify-content:space-between; gap:12px; padding:10px 0; border-bottom:1px solid var(--border); font-size:14px; }
.kv:last-child { border-bottom:0; } .kv b { font-weight:600; } .kv span { color:var(--muted); text-align:right; }
.chatBtn { display:inline-flex; align-items:center; gap:6px; border-radius:999px; padding:8px 14px; border:1px solid var(--border2); color:var(--ink); text-decoration:none; font-weight:600; font-size:13.5px; white-space:nowrap; background:transparent; }
.chatBtn:hover { border-color:var(--ink); }
/* the staff side */
.whatTabs { display:flex; gap:6px; flex-wrap:wrap; margin:4px 0 16px; padding:6px; background:var(--surface); border:1px solid var(--border); border-radius:var(--r); }
.whatTab { flex:1 1 auto; min-width:0; padding:10px 14px; border-radius:var(--rSm); border:1px solid transparent; background:transparent; color:var(--muted); font-weight:600; font-size:14px; cursor:pointer; white-space:nowrap; display:flex; align-items:center; justify-content:center; gap:6px; }
.whatTab:hover { color:var(--ink); }
.whatTab.on { background:var(--ink); color:var(--accentInk); }
.whatTab .n { font-size:11.5px; font-weight:600; opacity:.7; }
/* the application form */
.formProgress { display:flex; flex-direction:column; align-items:center; gap:8px; font-size:13px; color:var(--muted); }
.formProgress .bar { width:220px; max-width:70vw; height:4px; background:var(--border2); border-radius:2px; overflow:hidden; }
.formProgress .bar div { height:100%; background:var(--ink); border-radius:2px; transition:width .3s; }
.qBlock { padding:14px 0; border-bottom:1px solid var(--border); }
.qBlock:last-child { border-bottom:0; }
.qBlock.missing { border-left:3px solid var(--warn); padding-left:12px; margin-left:-12px; }
.qLabel { font-size:15px; font-weight:600; margin-bottom:6px; } .req { color:var(--warn); }
.qHelp { font-size:13px; color:var(--muted); margin:-2px 0 8px; }
.optList { display:flex; flex-direction:column; gap:6px; }
.opt { display:flex; align-items:center; gap:10px; padding:10px 12px; border:1px solid var(--border2); border-radius:var(--rSm); cursor:pointer; }
.opt:has(input:checked) { border-color:var(--ink); background:var(--surface2); }
.opt input { width:18px; height:18px; accent-color:var(--ink); margin:0; }
.formNav { display:flex; justify-content:space-between; gap:10px; margin-top:6px; }
.formNav .btn { margin-top:0; }
.guide { margin:6px 0 0; padding-left:22px; font-size:14px; line-height:1.55; } .guide li { margin-bottom:6px; }
.ansSec { margin-top:10px; } .kv.ans { flex-direction:column; align-items:flex-start; gap:2px; } .kv.ans span { text-align:left; color:var(--ink); white-space:pre-wrap; }
/* the forms editor */
.two2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.refBox { margin-top:12px; padding-top:12px; border-top:1px solid var(--border); }
.stays { display:flex; flex-direction:column; gap:10px; }
.people { display:flex; flex-direction:column; gap:10px; }
.people .btn { align-self:flex-start; }
.personRow { border:1px solid var(--border); border-radius:var(--r); padding:10px; background:var(--bg); }
.personHead { display:flex; justify-content:space-between; align-items:center; margin:0 0 8px; }
.personHead .stayDel { padding:4px 10px; }
.stayRow { border:1px solid var(--border); border-radius:var(--r); padding:10px; background:var(--bg); }
.stayRow.open { border-color:var(--ink); }
.stayPlace.base { font-weight:600; font-size:14px; margin:0 0 8px; }
.stayPlaceRow { display:flex; gap:8px; margin:0 0 8px; }
.stayPlaceRow input { flex:1; min-width:0; }
.stayDel { border:1px solid var(--border2); background:transparent; color:var(--muted); border-radius:var(--rSm); padding:0 12px; cursor:pointer; }
.stayDates { display:flex; align-items:center; gap:10px; width:100%; text-align:left; border:1px solid var(--border2); background:var(--surface); color:var(--ink); border-radius:var(--rSm); padding:10px 12px; cursor:pointer; font:inherit; }
.stayDates .sdPart { display:flex; flex-direction:column; min-width:0; }
.stayDates small { font-size:11px; letter-spacing:1px; text-transform:uppercase; color:var(--muted); }
.stayDates b { font-size:15px; font-weight:600; }
.stayDates:not(.set) b { color:var(--muted); font-weight:500; }
.stayDates .sdArrow { color:var(--muted); }
.stayDates .sdDays { margin-left:auto; font-size:12.5px; color:var(--muted); white-space:nowrap; }
.stayAdd { align-self:flex-start; }
.staySum { font-size:13.5px; color:var(--muted); line-height:1.5; }
.staySum b { color:var(--ink); }
.cal { margin-top:10px; }
.calHead { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:6px; }
.calHint { font-size:13px; color:var(--muted); text-align:center; }
.calNav { border:1px solid var(--border2); background:transparent; color:var(--ink); border-radius:999px; width:34px; height:34px; font-size:18px; cursor:pointer; }
.calMonths { display:grid; grid-template-columns:1fr; gap:16px; }
.calMonth2 { display:none; }
@media (min-width:600px) { .calMonths { grid-template-columns:1fr 1fr; } .calMonth2 { display:block; } }
.calTitle { font-weight:600; text-align:center; margin:4px 0 6px; font-size:14px; }
.calGrid { display:grid; grid-template-columns:repeat(7, 1fr); gap:2px; }
.calWd { font-size:11px; color:var(--faint); text-align:center; padding:4px 0; }
.calDay { border:0; background:transparent; color:var(--ink); font:inherit; font-size:14px; aspect-ratio:1/1; border-radius:8px; cursor:pointer; }
.calDay:hover { background:var(--surface2); }
.calDay.past { color:var(--faint); }
.calDay.today { box-shadow:inset 0 0 0 1px var(--border2); }
.calDay.in { background:var(--surface2); border-radius:0; }
.calDay.from, .calDay.to { background:var(--ink); color:var(--accentInk); font-weight:700; }
.calFoot { display:flex; justify-content:space-between; align-items:center; margin-top:8px; }
.qAttach { margin-top:10px; padding:10px 12px; border:1px dashed var(--border2); border-radius:var(--rSm); }
.qAttach .docKind { padding:0; border:0; }
.docKind { padding:10px 0; border-bottom:1px solid var(--border); }
.docKind:last-child { border-bottom:0; }
.docList { list-style:none; padding:0; margin:6px 0; }
.docList li { display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:13.5px; padding:4px 0; }
.docName { flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.docWhen { font-size:12px; color:var(--faint); }
.docUp { display:inline-block; margin-top:6px; cursor:pointer; }
.tripBox .kv, .hospBox { font-size:14px; }
.hospBox { margin-top:10px; }
.hospBox textarea { width:100%; margin-top:6px; font-family:inherit; font-size:14px; line-height:1.5; }
.staffNav { display:flex; flex-wrap:wrap; gap:6px; margin:0 0 16px; padding:4px; background:var(--surface); border:1px solid var(--border); border-radius:var(--r); }
.staffNavBtn { flex:1 1 auto; border:0; background:transparent; color:var(--muted); font:inherit; font-size:13.5px; font-weight:600; padding:9px 12px; border-radius:var(--rSm); cursor:pointer; white-space:nowrap; }
.staffNavBtn:hover { color:var(--ink); }
.staffNavBtn.on { background:var(--ink); color:var(--accentInk); }
a.staffNavBtn { text-decoration:none; text-align:center; }
.staffNavBtn.home { border:1px solid var(--border2); }
.pvBar { display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin:0 0 10px; }
.pvWho { font-size:13px; color:var(--muted); }
.pvFrame { border:2px dashed var(--border2); border-radius:var(--r); padding:14px; pointer-events:none; user-select:none; opacity:.96; }
.pvFrame .two { grid-template-columns:1fr; }
#refLinkBox { font-size:13px; }
.qcard { background:var(--bg); border:1px solid var(--border2); border-radius:var(--rSm); padding:12px; margin-top:10px; }
.audTag { display:inline-block; font-size:11px; font-weight:600; letter-spacing:.6px; text-transform:uppercase; color:var(--warn); margin-bottom:8px; }
.qcard.aud-khmer { border-left:3px solid var(--warn); } .qcard.aud-international { border-left:3px solid var(--info); }
.qcard.aud-international .audTag { color:var(--info); }
.qcardRow { display:grid; grid-template-columns:1fr 1fr auto; gap:8px; align-items:center; margin-top:8px; }
.feTools { display:flex; gap:6px; flex-wrap:wrap; }
.feTools .hbtn { padding:5px 10px; font-size:12px; } .hbtn.danger { color:var(--bad); border-color:var(--bad); }
.btn.danger { color:var(--bad); border-color:var(--bad); }
.portalTick { display:flex; align-items:center; gap:8px; font-size:13.5px; cursor:pointer; } .portalTick input { width:18px; height:18px; accent-color:var(--ink); }
@media (max-width:599px) { .two2, .qcardRow { grid-template-columns:1fr; } }
.tiles { display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:10px; margin-bottom:16px; }
.tile { background:var(--surface); border:1px solid var(--border); border-radius:var(--rSm); padding:12px 14px; }
.tileNum { font-size:26px; font-weight:700; letter-spacing:-.5px; line-height:1.1; }
.tileLbl { font-size:12px; color:var(--muted); margin-top:2px; }
.crm { display:grid; grid-template-columns:1fr; gap:16px; align-items:start; }
.tools { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:10px; }
.tools input[type=text] { flex:1 1 200px; width:auto; padding:10px 14px; border-radius:999px; font-size:14px; }
.tbl { background:var(--surface); border:1px solid var(--border); border-radius:var(--r); overflow:hidden; }
.thead { display:none; }
.trow { display:grid; grid-template-columns:1fr auto; gap:6px 12px; padding:12px 16px; border-bottom:1px solid var(--border); cursor:pointer; text-align:left; width:100%; background:none; border-left:0; border-right:0; border-top:0; color:inherit; }
.trow:last-child { border-bottom:0; } .trow:hover, .trow.on { background:var(--surface2); }
.trow .who { font-weight:600; font-size:15px; } .trow .meta { font-size:12.5px; color:var(--muted); }
.trow .stage { grid-column:2; grid-row:1 / span 2; align-self:center; }
.panel { background:var(--surface); border:1px solid var(--border); border-radius:var(--r); padding:18px; }
.panelHead { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
.log { list-style:none; padding:0; margin:8px 0 0; font-size:13.5px; }
.log li { padding:8px 0; border-bottom:1px solid var(--border); } .log li:last-child { border-bottom:0; }
.log .when { color:var(--faint); font-size:11.5px; display:block; }
.empty { font-size:13.5px; color:var(--muted); padding:16px; text-align:center; }
.langRow { text-align:center; margin-top:22px; font-size:13px; color:var(--faint); }
.langRow button { background:none; border:0; color:var(--muted); text-decoration:underline; text-underline-offset:3px; cursor:pointer; font-size:13px; padding:4px 6px; }
@media (min-width:900px) {
  main { padding:28px 24px 64px; }
  .choices { grid-template-columns:repeat(4,1fr); }
  .two { grid-template-columns:400px 1fr; gap:20px; }
  .crm.open { grid-template-columns:1fr 420px; }
  .thead { display:grid; grid-template-columns:2fr 1.2fr 1fr 1fr auto; gap:12px; padding:10px 16px; font-size:11px; letter-spacing:1.4px; text-transform:uppercase; color:var(--faint); font-weight:600; border-bottom:1px solid var(--border); }
  .trow { grid-template-columns:2fr 1.2fr 1fr 1fr auto; align-items:center; }
  .trow .stage { grid-column:auto; grid-row:auto; }
  .trow .meta.sm { display:none; }
  .panel { position:sticky; top:16px; }
}
@media (max-width:899px) { .trow .desk { display:none; } }
</style>
</head>
<body class="gate">
<header>
  <div class="brandRow">
    <img id="brandLogo" alt="YWAM" class="logoImg">
    <div><div class="brandTitle">YWAM GP Portal</div><div class="brandSub" id="brandSub">Siem Reap</div></div>
  </div>
  <div class="hbtns" id="hbtns"></div>
</header>
<main id="main"></main>
<div class="msg" id="msg"></div>
<script src="logo.js"></script>
<script src="km.js"></script>
<script src="taxonomy.js"></script>
<script>
/* ==================== YWAM GP Portal ====================
   Two sides of one page. An applicant signs up (or arrives from the public
   website with ?apply=dts), sees their application's status and timeline,
   and keeps their contact details current. Portal staff — only people an
   admin has ticked on Admin → Portal access — see every applicant, move
   them along, assign an owner and keep notes, on the same CRM records HR's
   Candidates page uses. Everything is one portalBoot call per open, same as
   the staff app; the session is kept under its own key ('gp-portal') so a
   staff member can be signed into both.
   See docs/portal-plan.md for the milestones; this is milestone 1. */
function lsGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
function lsSet(k, v){ try { localStorage.setItem(k, v); } catch(e){} }
function lsDel(k){ try { localStorage.removeItem(k); } catch(e){} }
var LANG = (function(){ return lsGet('gp-lang') || 'en'; })();
var KM = (typeof BUILTIN_KM==='object' && BUILTIN_KM) ? BUILTIN_KM : {};
function t(s){ return LANG==='km' ? (KM[s] || s) : s; }
function gpT(s, vars){ var out=t(s); Object.keys(vars||{}).forEach(function(k){ out=out.split('{'+k+'}').join(String(vars[k])); }); return out; }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;'); }
function showMsg(txt){ var m=document.getElementById('msg'); m.textContent=txt; m.classList.add('show'); clearTimeout(m._t); m._t=setTimeout(function(){ m.classList.remove('show'); }, 2600); }
var REQUEST_TIMEOUT_MS = 20000;
function run(fn, args, onOk, onErr){
  var ctl = (typeof AbortController === 'function') ? new AbortController() : null, settled=false;
  var timer = setTimeout(function(){ if(!settled && ctl) ctl.abort(); }, REQUEST_TIMEOUT_MS);
  fetch('/.netlify/functions/api', { method:'POST', headers:{ 'Content-Type':'application/json' }, body:JSON.stringify({ fn:fn, args:args }), signal: ctl ? ctl.signal : undefined })
    .then(function(res){
      if(!res.ok) return res.text().then(function(txt){ var msg='HTTP '+res.status; try { var j=JSON.parse(txt); if(j && j.error) msg+=' — '+j.error; } catch(e2){} throw new Error(msg); });
      return res.json();
    })
    .then(function(d){ settled=true; clearTimeout(timer); onOk(d); })
    .catch(function(e){ settled=true; clearTimeout(timer); if(onErr) onErr(e); else { P.busy=false; showMsg(t('Connection problem — try again.')); render(); } });
}

/* ---- what you can apply for ---- */
/* Where: each campus runs its own schools (mirrors PORTAL_CAMPUSES in api.js,
   which is what actually decides). DBS, BCS and SMS are secondary schools —
   a completed DTS is the prerequisite — so their cards say so. */
var CAMPUS_SCHOOLS = { poipet:['dts','dbs'], siemreap:['dts','dbs','bcs','sms'] };
var CAMPUS_LIST = [['siemreap','YWAM Siem Reap','Siem Reap'],['poipet','YWAM Poipet','Poipet']];
var DEFAULT_CAMPUS = 'siemreap';
/* Which campuses take applications right now. Poipet is set up (schools,
   forms, the staff side all know it) but hidden until the base says go —
   add it here and every picker, chip and deep link comes back. */
var PORTAL_OPEN = ['siemreap'];
function openCampuses_(){ return CAMPUS_LIST.filter(function(c){ return PORTAL_OPEN.indexOf(c[0])>-1; }); }
function isOpenCampus_(id){ return PORTAL_OPEN.indexOf(id)>-1; }
function campusName_(id){ for(var i=0;i<CAMPUS_LIST.length;i++) if(CAMPUS_LIST[i][0]===id) return t(CAMPUS_LIST[i][1]); return id||''; }
function campusShort_(id){ for(var i=0;i<CAMPUS_LIST.length;i++) if(CAMPUS_LIST[i][0]===id) return t(CAMPUS_LIST[i][2]); return id||''; }
var APPLY = [
  { key:'dts', type:'student', school:'dts', label:'DTS', blurb:'Discipleship Training School' },
  { key:'dbs', type:'student', school:'dbs', label:'DBS', blurb:'Discipleship Bible School', secondary:true },
  { key:'bcs', type:'student', school:'bcs', label:'BCS', blurb:'Biblical Counseling School', secondary:true },
  { key:'sms', type:'student', school:'sms', label:'SMS', blurb:'Social Media School', secondary:true },
  { key:'staff', type:'staff', school:'', label:'Staff', blurb:'Join the staff team' },
  { key:'volunteer', type:'volunteer', school:'', label:'Volunteer', blurb:'Serve with us for a season' },
  { key:'team', type:'team', school:'', label:'Team', blurb:'Bring a short-term team' }
];
function applyByKey_(k){ for(var i=0;i<APPLY.length;i++) if(APPLY[i].key===k) return APPLY[i]; return null; }
function offeredAt_(a, campus){ return !a.school || (CAMPUS_SCHOOLS[campus]||[]).indexOf(a.school)>-1; }
function applyLabel_(type, school){
  if(type==='student'){ var a=applyByKey_(school); return a ? a.label+' · '+t(a.blurb) : t('Student'); }
  if(type==='staff') return t('Staff'); if(type==='volunteer') return t('Volunteer'); if(type==='team') return t('Short-term team');
  return type||'—';
}
var STATUS_LABEL = { draft:'Not submitted yet', pending:'Application pending', in_review:'In review — we’ll be in touch', interview:'Interview stage', accepted:'Accepted!', practical:'Getting ready', arrived:'Arrived', closed:'Closed' };
var STATUS_NOTE = {
  draft:'Fill out your application when you are ready — it saves as you go.',
  pending:'We have your application. One of our team will message you on {app} soon.',
  in_review:'Our team has reached out. Keep an eye on {app} and send anything we ask for.',
  interview:'We will arrange a video call with you — watch for a message on {app}.',
  accepted:'Welcome! Next comes the practical part: fees, packing list, visa and travel.',
  practical:'Fees, packing list, visa and travel — we will walk you through each one.',
  arrived:'You are here. Welcome to {campus}!',
  closed:'This application is closed. Message us if you think that is a mistake.'
};
var STEP_LABEL = { account:'Create your account', form:'Fill out the application', received:'Application received', contact:'We get in touch', docs:'Documents & reference', interview:'Video interview', accepted:'Accepted', practical:'Getting ready — fees, packing, visa, travel', arrived:'Arrival at the base' };
var STEP_NOTE = { form:'Your answers save as a draft — come back any time.', contact:'On WhatsApp or Telegram, whichever you chose.', docs:'What to send depends on what you are applying for.', interview:'A video call with someone from the school or the team.' };
var SUBITEM_LABEL = { documents:'Documents', reference:'Leader reference' };
/* A team's own journey (teamSteps_ in api.js): what each step is called, a
   line on what it means while it is still ahead, and who does it. */
var TEAM_STEP_LABEL = { account:'Create your account', form:'Send your application', call:'Video call with our team', accepted:'Your team is accepted',
  passports:'Passport copies', invitation:'Letter of invitation', flights:'Flight itineraries', evisa:'E-visas', orientation:'Cultural orientation',
  checkin:'Last check-in before you travel', arrived:'Arrival at the base' };
var TEAM_STEP_NOTE = {
  form:'Your answers save as a draft — come back any time.',
  call:'A video call between your team leader and ours. We message you to find a time.',
  accepted:'We let you know as soon as your team is confirmed.',
  passports:'Needed as soon as possible — we write your letter of invitation from them. Upload them under Documents.',
  invitation:'We send it once we have your passport copies. It appears under Documents for you to download.',
  flights:'Upload your itineraries once they are booked — we arrange your airport pick-up from them.',
  evisa:'Apply at evisa.gov.kh with your letter of invitation, then upload each person’s e-visa under Documents.',
  orientation:'Time with us to prepare for Cambodian culture and serving here.',
  checkin:'A last call to go over the details before you fly.'
};
var TEAM_STATUS_NOTE = {
  accepted:'Welcome! Next come your passport copies, the letter of invitation, flights and e-visas — each step is below.',
  practical:'Nearly there — orientation and a last check-in before you travel.'
};
var STAGE_LABEL = { 'new':'New', contacted:'Contacted', applied:'Applied', interview:'Interview', accepted:'Accepted', practical:'Getting ready', arrived:'Arrived' };
var MESSENGER_LABEL = { whatsapp:'WhatsApp', telegram:'Telegram' };
function chatHref_(messenger, phone){
  var digits=String(phone||'').replace(/\D/g,''); if(!digits) return '';
  return messenger==='telegram' ? 'https://t.me/+'+digits : 'https://wa.me/'+digits;
}
function fmtDate_(iso){ if(!iso) return ''; var d=new Date(iso); if(isNaN(d)) return String(iso).slice(0,10); return d.toLocaleDateString(LANG==='km'?'km-KH':'en-GB', { day:'numeric', month:'short', year:'numeric' }); }

/* ---- state ---- */
var P = { auth:null, boot:null, view:'landing', apply:null, campus:DEFAULT_CAMPUS, reg:{}, busy:false, err:'', sel:null, filter:'', campusFilter:null, what:null, q:'', formSec:0, answers:{}, formMissing:null, draftSaved:'', formKey:null, formDraft:null, formDirty:false, editAnswers:false, staffAnswers:{}, feAud:'all', audFilter:'', editContact:false, note:'', accounts:null, accSel:null, accNew:false, accForm:{}, accQ:'', editMine:false, cal:null, pv:{ mode:'sample', key:'dts', aud:'international', stage:'new', candId:null, q:'', screen:'me', sec:0, boot:null, busy:false }, refToken:'', refData:null, refAnswers:{}, refMissing:null, refDone:false, refLink:null, showRef:false };
(function(){
  var qs={}; try { String(location.search||'').replace(/^\?/,'').split('&').forEach(function(kv){ if(!kv) return; var p=kv.split('='); qs[decodeURIComponent(p[0])]=decodeURIComponent(p[1]||''); }); } catch(e){}
  if(qs.lang==='km' || qs.lang==='en'){ LANG=qs.lang; lsSet('gp-lang', LANG); }
  if(qs.campus && CAMPUS_SCHOOLS[qs.campus] && isOpenCampus_(qs.campus)) P.campus=qs.campus;
  if(qs.apply && applyByKey_(qs.apply)){ P.apply=qs.apply; P.view='register'; if(!offeredAt_(applyByKey_(qs.apply), P.campus)) P.campus=DEFAULT_CAMPUS; }
  if(qs.ref){ P.view='ref'; P.refToken=String(qs.ref); }
  var saved=null; try { saved=JSON.parse(lsGet('gp-portal')||'null'); } catch(e){}
  if(saved && saved.user && saved.pin){ P.auth=saved; P.view='booting'; boot_(); }
})();
function boot_(){
  run('portalBoot', [P.auth.user, P.auth.pin], function(d){
    if(d && d.ok){ P.boot=d; if(d.role==='applicant') P.answers=(d.application && d.application.answers)||{}; P.view = d.role==='applicant' ? 'me' : 'crm'; lsSet('gp-portal', JSON.stringify(P.auth)); render(); return; }
    if(d && d.err==='auth'){ lsDel('gp-portal'); P.auth=null; P.view='login'; showMsg(t('Your PIN didn’t work — please sign in again.')); render(); return; }
    if(d && d.err==='not_authorized'){ P.view='noaccess'; render(); return; }
    if(d && d.err==='no_application'){ P.view='noaccess'; P.err='no_application'; render(); return; }
    P.view='login'; P.err='boot'; render();
  }, function(e){ P.view='login'; P.err='boot'; render(); showMsg(t('Connection problem — try again.')); });
}
function signOut_(){ lsDel('gp-portal'); P.auth=null; P.boot=null; P.sel=null; P.view='login'; render(); }

/* ---- the logo ----
   PORTAL_LOGO is the YWAM mark for the top of the page — drop the file into
   public/ (white on transparent, for the black page) and name it here, e.g.
   'ywam-logo.png'. Left empty, the GP mark from logo.js stands in, and no
   request is made for a file that is not there. */
var PORTAL_LOGO = 'ywam-logo.png';
(function(){
  var img=document.getElementById('brandLogo'); if(!img) return;
  img.onerror=function(){ img.onerror=null; if(typeof GP_LOGO==='string') img.src=GP_LOGO; else img.style.display='none'; };
  if(PORTAL_LOGO) img.src=PORTAL_LOGO; else if(typeof GP_LOGO==='string') img.src=GP_LOGO; else img.style.display='none';
})();
/* ---- render ---- */
function render(){
  var hb=document.getElementById('hbtns');
  hb.innerHTML='<button class="hbtn" id="langBtn">'+(LANG==='km'?'EN':'ខ្មែរ')+'</button>'+

    (P.auth && P.boot ? '<button class="hbtn" id="outBtn">'+esc(t('Sign out'))+'</button>' : '');
  var m=document.getElementById('main');
  var v=P.view;
  /* The gate — everything before you are signed in — is the portal's name
     and logo on top and one card underneath; signed in, the bar goes slim. */
  document.body.classList.toggle('gate', v!=='me' && v!=='crm' && v!=='form' && v!=='forms' && v!=='accounts' && v!=='preview');
  var staffView = P.auth && P.boot && P.boot.role!=='applicant' && (v==='crm'||v==='forms'||v==='accounts'||v==='preview');
  try { m.innerHTML = (staffView ? staffNavHtml_(v) : '') + (v==='booting' ? '<p class="sub" style="text-align:center;padding:40px 0">'+esc(t('Loading…'))+'</p>'
    : v==='register' ? registerHtml_() : v==='choose' ? chooseHtml_() : v==='me' ? meHtml_() : v==='crm' ? crmHtml_() : v==='form' ? formHtml_() : v==='forms' ? formsHtml_() : v==='accounts' ? accountsHtml_() : v==='preview' ? previewHtml_()
    : v==='noaccess' ? noAccessHtml_() : v==='ref' ? refHtml_() : loginHtml_());
  bind_();
  } catch (e) {
    /* A dead screen where nothing responds is the worst outcome — show what
       broke and a way out, and keep the error in the console for the report. */
    console.error(e);
    m.innerHTML='<div class="center"><div class="card"><h2>'+esc(t('Something went wrong on this screen'))+'</h2><p class="sub">'+esc(String(e && e.message || e))+'</p>'+
      '<button class="btn small" id="errBack">'+esc(t('Back'))+'</button> <button class="linkbtn inline" id="errOut">'+esc(t('Sign out'))+'</button></div></div>';
    on_('errBack', function(){ P.view = (P.boot && P.boot.role==='applicant') ? 'me' : (P.boot ? 'crm' : 'login'); P.sel=null; P.formDraft=null; P.accSel=null; P.accNew=false; render(); });
    on_('errOut', signOut_);
  }
}
/* The staff side's tools, as a bar under the header rather than buttons in
   it — a phone's header has room for the name, the language and Sign out,
   not four more. Forms and Accounts are portal-admin only. */
function staffNavHtml_(v){
  var admin=P.boot.role==='portal-admin';
  var items=[['crm','navCrm','📋 '+t('Applications')]];
  if(admin){ items.push(['forms','toForms','📝 '+t('Forms')]); items.push(['accounts','toAccounts','👤 '+t('Accounts')]); }
  items.push(['preview','toPreview','👁 '+t('View as applicant')]);
  /* Staff come here from the GP app; this takes them back to its home. */
  return '<nav class="staffNav" id="staffNav"><a class="staffNavBtn home" id="toGpApp" href="teams.html">🏠 '+esc(t('GP app home'))+'</a>'+
    items.map(function(x){ return '<button class="staffNavBtn'+(v===x[0]?' on':'')+'" id="'+x[1]+'">'+esc(x[2])+'</button>'; }).join('')+'</nav>';
}
function langRowHtml_(){
  return '<div class="langRow"><button id="langBtn2">'+(LANG==='km' ? 'English' : 'ភាសាខ្មែរ')+'</button></div>';
}
function campusSegHtml_(attr, current){
  var open=openCampuses_(); if(open.length<2) return '';
  return '<div class="seg campusSeg">'+open.map(function(c){ return '<button '+attr+'="'+c[0]+'" class="'+(current===c[0]?'on':'')+'">'+esc(t(c[1]))+'</button>'; }).join('')+'</div>';
}
function chooseHtml_(){
  var here=P.campus||DEFAULT_CAMPUS;
  return '<div class="wide"><div class="gateTitle"><h2>'+esc(t('I want to apply'))+'</h2><p class="sub">'+esc(t('Pick where, then what you are applying for. You will create a small account so you can come back to it on your phone.'))+'</p></div>'+
    (openCampuses_().length>1 ? '<div class="center" style="margin-bottom:14px"><label class="f" style="text-align:center">'+esc(t('Where'))+'</label>'+campusSegHtml_('data-campus', here)+'</div>' : '')+
    '<div class="choices">'+APPLY.filter(function(a){ return offeredAt_(a, here); }).map(function(a){ return '<button class="choice" data-apply="'+a.key+'"><span class="choiceKey">'+esc(a.label)+'</span><span class="choiceSub">'+esc(t(a.blurb))+(a.secondary?'<br><span class="prereq">'+esc(t('Requires a completed DTS'))+'</span>':'')+'</span></button>'; }).join('')+'</div>'+
    '<button class="linkbtn" id="toLogin">'+esc(t('I already have an account'))+'</button>'+langRowHtml_()+'</div>';
}
/* ==================== the leader reference (no account) ====================
   A pastor or leader opens portal.html?ref=<token>. The server answers with
   the applicant's name and the reference form, or why the link no longer
   works; the whole form is one page with Submit at the bottom. */
function refHtml_(){
  var d=P.refData;
  var h='<div class="center"><div class="gateTitle"><h2>'+esc(t('Leader reference'))+'</h2>';
  if(d===null){ return h+'</div><div class="card"><p class="sub">'+esc(t('Loading…'))+'</p></div></div>'; }
  if(P.refDone){ return h+'</div><div class="card"><h3 style="margin-top:0">✓ '+esc(t('Thank you'))+'</h3><p class="sub">'+esc(gpT('Your reference for {name} has reached our applications team. You can close this page.',{name:d.applicantName||''}))+'</p></div></div>'; }
  if(!d.ok){
    var why = d.err==='used' ? t('This reference has already been submitted — thank you. Nothing more is needed.') : d.err==='expired' ? t('This link has expired or was replaced. Please ask the applicant to send you a new one.') : t('This link is not valid. Please ask the applicant to send you a new one.');
    return h+'</div><div class="card"><p class="sub">'+esc(why)+'</p><button class="linkbtn" id="toLanding">'+esc(t('Back to the portal'))+'</button></div>'+langRowHtml_()+'</div>';
  }
  var form=d.form;
  h+='<p class="sub">'+esc(gpT('For {name}, applying for {what} with YWAM GP.',{name:d.applicantName||'', what:d.applyingFor||''}))+'</p></div>';
  (form.sections||[]).forEach(function(sec){
    var qs=askedIn_(sec, 'all'); if(!qs.length) return;
    h+='<div class="card"><h3 style="margin-top:0">'+esc(lt_(sec.title))+'</h3>'+(lt_(sec.help)?'<p class="sub">'+esc(lt_(sec.help))+'</p>':'')+
      qs.map(function(q){ return questionHtml_(q, P.refAnswers[q.id], 'r_', P.refMissing && P.refMissing.indexOf(q.id)>-1); }).join('')+'</div>';
  });
  h+='<div class="card"><p class="hint" style="margin:0 0 10px"><span class="req">*</span> '+esc(t('required'))+' · '+esc(t('Only our applications team sees what you write; the applicant does not.'))+'</p>'+
    '<button class="btn" id="refSubmit"'+(P.busy?' disabled':'')+'>'+esc(P.busy?t('Sending…'):t('Submit the reference'))+'</button></div>'+langRowHtml_()+'</div>';
  return h;
}
/* On the applicant's dashboard: one leader reference — make the link, pass it
   on with one tap, see when it has arrived. The link itself is only known
   here right after it is made (the server keeps a hash), so a lost link
   means a new one. */
function refCardHtml_(app){
  var r=app.reference||{ status:'none' };
  var h='<div class="refBox"><div class="eyebrow">'+esc(t('Leader reference'))+'</div>';
  if(r.status==='received'){
    return h+'<p class="sub" style="margin:0">✓ '+esc(gpT('Received{from} on {when}.',{from: r.leaderName ? ' '+gpT('from {name}',{name:r.leaderName}) : '', when: fmtDate_(r.receivedAt)}))+'</p></div>';
  }
  h+='<p class="sub" style="margin:0 0 8px">'+esc(t('We ask your pastor or a leader who knows you well for one short reference. Make a link and send it to them; they fill it in online, no account needed.'))+'</p>';
  if(P.refLink){
    var txt=gpT('Hi! I am applying to YWAM GP and they ask for a short leader reference. Could you fill this in for me? {link}',{link:P.refLink});
    h+='<input type="text" id="refLinkBox" readonly value="'+esc(P.refLink)+'" onclick="this.select()">'+
      '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"><button class="btn small" id="refCopy">'+esc(t('Copy link'))+'</button>'+
      '<a class="chatBtn" href="https://wa.me/?text='+encodeURIComponent(txt)+'" target="_blank" rel="noopener">💬 WhatsApp</a>'+
      '<a class="chatBtn" href="https://t.me/share/url?url='+encodeURIComponent(P.refLink)+'&text='+encodeURIComponent(txt.replace(P.refLink,'').trim())+'" target="_blank" rel="noopener">✈️ Telegram</a>'+
      '<a class="chatBtn" href="mailto:?subject='+encodeURIComponent(t('Leader reference for my YWAM GP application'))+'&body='+encodeURIComponent(txt)+'">✉️ '+esc(t('Email'))+'</a></div>'+
      '<p class="hint">'+esc(gpT('Valid until {when}. Keep this page open until you have sent it — the link is not shown again.',{when:fmtDate_(r.expiresAt||'')}))+'</p>';
  } else if(r.status==='pending'){

/* ==================== the application form (applicant side) ====================
   One section per screen, Google Forms style: a progress line, the
   section's questions for THIS applicant's audience, Back / Next, and
   Submit on the last section. Every change is kept in P.answers and saved
   as a draft (debounced) so a phone that loses the page loses nothing.
   Labels come in Khmer and English from the form itself (lt_). */
function lt_(o){ if(!o) return ''; if(typeof o==='string') return o; return LANG==='km' ? (o.km||o.en||'') : (o.en||o.km||''); }
function askedIn_(sec, aud){ return (sec.questions||[]).filter(function(q){ return q.audience==='all' || q.audience===aud; }); }
function askedAll_(form, aud){ var out=[]; (form.sections||[]).forEach(function(s){ out=out.concat(askedIn_(s, aud)); }); return out; }
function answered_(q, v){ if(v===undefined||v===null) return false; if(q && q.type==='stays') return staysDone_(v); if(q && q.type==='people') return Array.isArray(v) && v.some(function(r){ return r && String(r.name||'').trim(); }); if(Array.isArray(v)) return v.length>0; return String(v).trim()!==''; }
function staysDone_(v){ return Array.isArray(v) && !!v[0] && !!v[0].from && !!v[0].to && v.slice(1).every(function(r){ return r && r.place && r.from && r.to; }); }
function questionInputHtml_(q, v, prefix){
  var id=prefix+q.id, name=esc(id);
  if(q.type==='stays') return staysInputHtml_(q, v, prefix);
  if(q.type==='people') return peopleInputHtml_(q, v, prefix);
  if(q.type==='long') return '<textarea data-ans="'+esc(q.id)+'" id="'+name+'">'+esc(v||'')+'</textarea>';
  if(q.type==='choice' || q.type==='yesno'){
    return '<div class="optList">'+(q.options||[]).map(function(o){ var val=o.en||o.km; return '<label class="opt"><input type="radio" name="'+name+'" data-ans="'+esc(q.id)+'"'+(q.attach?' data-attachq="1"':'')+' value="'+esc(val)+'"'+(v===val?' checked':'')+'> <span>'+esc(lt_(o))+'</span></label>'; }).join('')+'</div>';
  }
  if(q.type==='multi'){
    var arr=Array.isArray(v)?v:[];
    return '<div class="optList">'+(q.options||[]).map(function(o){ var val=o.en||o.km; return '<label class="opt"><input type="checkbox" data-ans="'+esc(q.id)+'" data-multi="1" value="'+esc(val)+'"'+(arr.indexOf(val)>-1?' checked':'')+'> <span>'+esc(lt_(o))+'</span></label>'; }).join('')+'</div>';
  }
  var type = q.type==='date' ? 'date' : q.type==='number' ? 'number' : q.type==='email' ? 'email' : q.type==='phone' ? 'tel' : 'text';
  return '<input type="'+type+'" data-ans="'+esc(q.id)+'" id="'+name+'" value="'+esc(v||'')+'"'+(q.type==='number'?' inputmode="numeric"':'')+'>';
}
function questionHtml_(q, v, prefix, missing){
  return '<div class="qBlock'+(missing?' missing':'')+'" data-qid="'+esc(q.id)+'"><div class="qLabel">'+esc(lt_(q.label))+(q.required?' <span class="req">*</span>':'')+'</div>'+
    (lt_(q.help) ? '<div class="qHelp">'+esc(lt_(q.help))+'</div>' : '')+questionInputHtml_(q, v, prefix)+attachHtml_(q, v, prefix)+'</div>';
}
/* A question with "attach" (a team's "Have you booked your flights yet?")
   opens an upload box for that document once it is answered with its first
   option (Yes), right there in the form. Applicant side only — staff see the
   files in the record's Documents block. */
function attachHtml_(q, v, prefix){
  if(!q.attach || prefix!=='a_' || !P.boot || !P.boot.application) return '';
  var yes=((q.options||[])[0]||{}).en || 'Yes';
  if(v!==yes) return '';
  var app=P.boot.application;
  return '<div class="qAttach" data-attachfor="'+esc(q.id)+'">'+docsBodyHtml_([{ id:q.attach, required:false }], app.docs||[], 'form', '')+'</div>';
}
function formHtml_(){
  var d=P.boot, app=d.application, form=d.form;
  if(!form){ return '<div class="center"><div class="card"><p class="sub">'+esc(t('Loading…'))+'</p><button class="linkbtn" id="formClose2">'+esc(t('Back to my application'))+'</button></div></div>'; }
  var secs=(form.sections||[]).filter(function(s){ return askedIn_(s, app.audience).length; });
  if(!secs.length){ return '<div class="center"><div class="card"><p class="sub">'+esc(t('This form has no questions yet — our team is still setting it up. Please check back soon.'))+'</p><button class="linkbtn" id="formClose2">'+esc(t('Back to my application'))+'</button></div></div>'; }
  if(P.formSec>=secs.length) P.formSec=secs.length-1; if(P.formSec<0) P.formSec=0;
  var sec=secs[P.formSec], qs=askedIn_(sec, app.audience);
  var h='<div class="wide"><div class="gateTitle"><div class="eyebrow">'+esc(lt_(form.title))+'</div>'+
    '<div class="formProgress"><span>'+esc(gpT('Section {i} of {n}',{i:P.formSec+1, n:secs.length}))+'</span><div class="bar"><div style="width:'+Math.round((P.formSec+1)/secs.length*100)+'%"></div></div></div></div>';
  h+='<div class="card"><h2>'+esc(lt_(sec.title))+'</h2>'+(lt_(sec.help)?'<p class="sub">'+esc(lt_(sec.help))+'</p>':'')+
    qs.map(function(q){ return questionHtml_(q, P.answers[q.id], 'a_', P.formMissing && P.formMissing.indexOf(q.id)>-1); }).join('')+'</div>';
  /* Two modes: filling in (draft autosave, Submit on the last section) and,
     after submitting, updating — nothing autosaves, Save changes is on every
     section, so a team leader can fix one date and be done. */
  var updating = !!app.submittedAt;
  h+='<div class="formNav">'+(P.formSec>0 ? '<button class="btn ghost small" id="formBack">← '+esc(t('Back'))+'</button>' : '<button class="btn ghost small" id="formClose">'+esc(updating ? t('Cancel') : t('Save and close'))+'</button>')+
    (P.formSec<secs.length-1 ? '<button class="btn '+(updating?'ghost ':'')+'small" id="formNext">'+esc(t('Next'))+' →</button>' : '')+
    (updating ? '<button class="btn small" id="formSubmit"'+(P.busy?' disabled':'')+'>'+esc(P.busy?t('Saving…'):t('Save changes'))+'</button>'
      : (P.formSec<secs.length-1 ? '' : '<button class="btn small" id="formSubmit"'+(P.busy?' disabled':'')+'>'+esc(P.busy?t('Sending…'):t('Submit my application'))+'</button>'))+'</div>';
  h+='<p class="hint" style="text-align:center">'+esc(updating ? t('Your changes are kept when you press Save changes.') : (P.draftSaved ? gpT('Draft saved {when}',{when:P.draftSaved}) : t('Your answers save as a draft as you go.')))+' · <span class="req">*</span> '+esc(t('required'))+'</p>';
  h+='<button class="linkbtn" id="formClose2">'+esc(updating ? t('Back without saving') : t('Back to my application'))+'</button></div>';
  return h;
}
function readAnswers_(root){
  root=root||document;
  root.querySelectorAll('[data-ans]').forEach(function(el){
    var id=el.getAttribute('data-ans');
    if(el.type==='radio'){ if(el.checked) P.answers[id]=el.value; return; }
    if(el.type==='checkbox'){ var arr=Array.isArray(P.answers[id])?P.answers[id].slice():[]; var i=arr.indexOf(el.value); if(el.checked && i===-1) arr.push(el.value); if(!el.checked && i>-1) arr.splice(i,1); P.answers[id]=arr; return; }
    P.answers[id]=el.value;
  });
}
var draftTimer_=null;
function saveDraft_(now){
  if(!P.boot || P.boot.role!=='applicant' || P.boot.application.submittedAt) return;
  clearTimeout(draftTimer_);
  var go=function(){ run('portalSaveDraft', [P.auth.user, P.auth.pin, P.answers], function(d){ if(d && d.ok){ P.draftSaved=fmtTime_(d.savedAt); var el=document.querySelector('.formNav + .hint'); if(el) el.firstChild.textContent=gpT('Draft saved {when}',{when:P.draftSaved})+' · '; } }, function(){}); };
  if(now) go(); else draftTimer_=setTimeout(go, 800);
}
function fmtTime_(iso){ var d=new Date(iso); return isNaN(d) ? '' : d.toLocaleTimeString(LANG==='km'?'km-KH':'en-GB', { hour:'2-digit', minute:'2-digit' }); }
function sectionMissing_(sec, aud){ return askedIn_(sec, aud).filter(function(q){ return q.required && !answered_(q, P.answers[q.id]); }).map(function(q){ return q.id; }); }
function bindForm_(){
  if(P.view!=='form') return;
  var app=P.boot.application, form=P.boot.form;
  if(!form){ on_('formClose2', function(){ P.view='me'; render(); }); return; }
  var secs=(form.sections||[]).filter(function(s){ return askedIn_(s, app.audience).length; });
  document.querySelectorAll('[data-ans]').forEach(function(el){ el.oninput=el.onchange=function(){ readAnswers_(); P.formMissing=null; saveDraft_(false); if(el.hasAttribute('data-attachq')){ var y=window.scrollY; render(); window.scrollTo(0, y); } }; });
  var close=function(){ readAnswers_(); saveDraft_(true); if(app.submittedAt){ P.answers=JSON.parse(JSON.stringify(app.answers||{})); P.editMine=false; } P.view='me'; render(); };
  on_('formClose', close); on_('formClose2', close);
  on_('formBack', function(){ readAnswers_(); saveDraft_(true); P.formSec--; P.formMissing=null; render(); window.scrollTo(0,0); });
  on_('formNext', function(){
    readAnswers_();
    var miss=sectionMissing_(secs[P.formSec], app.audience);
    if(miss.length){ P.formMissing=miss; render(); showMsg(t('Please answer the questions marked *')); var first=document.querySelector('.qBlock.missing'); if(first) first.scrollIntoView({ behavior:'smooth', block:'center' }); return; }
    saveDraft_(true); P.formSec++; P.formMissing=null; render(); window.scrollTo(0,0);
  });
  on_('formSubmit', function(){
    readAnswers_();
    var miss=sectionMissing_(secs[P.formSec], app.audience);
    if(miss.length){ P.formMissing=miss; render(); showMsg(t('Please answer the questions marked *')); return; }
    clearTimeout(draftTimer_); P.busy=true; render();
    var updating=!!app.submittedAt;
    run(updating ? 'portalUpdateAnswers' : 'portalSubmit', [P.auth.user, P.auth.pin, P.answers], function(d){
      P.busy=false;
      if(d && d.ok){ P.boot=d; P.answers=d.application.answers||{}; P.editMine=false; P.view='me'; P.formSec=0; showMsg(updating ? t('Your changes are saved.') : t('Your application is in. We will be in touch!')); render(); return; }
      if(d && d.err==='missing' && d.missing){
        P.formMissing=d.missing;
        for(var i=0;i<secs.length;i++){ if(askedIn_(secs[i], app.audience).some(function(q){ return d.missing.indexOf(q.id)>-1; })){ P.formSec=i; break; } }
        showMsg(t('A few required answers are still missing.')); render(); return;
      }
      showMsg(d && d.err==='submitted' ? t('This application was already submitted.') : t('Could not send — try again.')); render();
    });
  });
}
/* ==================== View as applicant (staff side) ====================

function shrinkImage_(file, done){
  if(!/^image\/(jpeg|png|webp)$/.test(file.type) || file.size<=1.5*1024*1024) return done(null);
  try {
    var url=URL.createObjectURL(file), img=new Image();
    img.onload=function(){
      var max=2000, w=img.naturalWidth, h=img.naturalHeight, k=Math.min(1, max/Math.max(w,h));
      var c=document.createElement('canvas'); c.width=Math.round(w*k); c.height=Math.round(h*k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      done(c.toDataURL('image/jpeg', 0.85));
    };
    img.onerror=function(){ URL.revokeObjectURL(url); done(null); };
    img.src=url;
  } catch(e){ done(null); }
}
function uploadDocs_(files, kind, candId){
  var i=0, okN=0;
  var next=function(){
    if(i>=files.length){ P.busy=false; showMsg(okN ? (okN===1 ? t('Uploaded') : gpT('{n} files uploaded',{n:okN})) : t('Nothing was uploaded.')); render(); return; }
    var file=files[i++];
    var send=function(mime, b64, name){
      if(b64.length > 5.6*1024*1024){ showMsg(gpT('{name} is too big — keep it under 4 MB.',{name:file.name})); return next(); }
      showMsg(files.length>1 ? gpT('Uploading {i} of {n}…',{i:i, n:files.length}) : t('Uploading…'));
      run('portalUploadDoc', [P.auth.user, P.auth.pin, kind, name, mime, b64].concat(candId ? [candId] : []), function(d){
        if(d && d.ok){ okN++; if(candId){ var c=(P.boot.applicants||[]).filter(function(x){ return x.id===candId; })[0]; if(c){ c.portal=c.portal||{}; c.portal.docs=d.docs; } } else if(d.application) P.boot.application=d.application; }
        else showMsg(d && d.err==='too_large' ? gpT('{name} is too big — keep it under 4 MB.',{name:file.name}) : d && d.err==='bad_type' ? t('Only PDFs and pictures can be uploaded.') : d && d.err==='not_submitted' ? t('Submit your application first.') : t('Could not upload — try again.'));
        next();
      }, function(){ showMsg(t('Connection problem — try again.')); next(); });
    };
    var mime=file.type || (/\.pdf$/i.test(file.name)?'application/pdf':'');
    shrinkImage_(file, function(dataUrl){
      if(dataUrl) return send('image/jpeg', dataUrl.split(',')[1]||'', file.name.replace(/\.[a-z0-9]+$/i,'')+'.jpg');
      if(file.size>4*1024*1024){ showMsg(gpT('{name} is too big — keep it under 4 MB.',{name:file.name})); return next(); }
      var r=new FileReader(); r.onload=function(){ send(mime, String(r.result||'').split(',')[1]||'', file.name); }; r.onerror=function(){ next(); }; r.readAsDataURL(file);
    });
  };
  P.busy=true; next();
}
function openDataUrl_(dataUrl, name){
  try {
    var m=/^data:([^;]+);base64,(.*)$/.exec(dataUrl); if(!m) throw new Error('bad');
    var bin=atob(m[2]), arr=new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
    var url=URL.createObjectURL(new Blob([arr],{type:m[1]}));
    var a=document.createElement('a'); a.href=url; a.target='_blank'; a.rel='noopener';
    if(!/^(application\/pdf|image\/)/.test(m[1])) a.download=name||'file';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 60000);
  } catch(e){ showMsg(t('Could not open the file')); }
}

  }; });

/* ==================== trips: dates like booking a flight ====================
   A team's stay is a list of places with dates, our base first. Tap the
   dates to open a two-month calendar: tap the day you arrive, then the day
   you leave. "Add another location" adds a place in Cambodia with its own
   dates. The total in Cambodia runs from the first arrival to the last
   departure. Old applications (arrival / departure fields) read the same. */
function ymd_(d){ return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
function parseYmd_(v){ var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(v||''); return m ? new Date(+m[1], +m[2]-1, +m[3]) : null; }
function daysIncl_(from, to){ var a=parseYmd_(from), b=parseYmd_(to); if(!a||!b||b<a) return 0; return Math.round((b-a)/86400000)+1; }
function fmtDay_(v, weekday){ var d=parseYmd_(v); if(!d) return ''; return d.toLocaleDateString(LANG==='km'?'km-KH':'en-GB', weekday ? { weekday:'short', day:'numeric', month:'short', year:'numeric' } : { day:'numeric', month:'short', year:'numeric' }); }
function rangeLabel_(from, to, weekday){ return from && to ? fmtDay_(from, weekday)+' – '+fmtDay_(to, weekday) : from ? fmtDay_(from, weekday)+' – …' : t('no dates yet'); }
function daysLabel_(n){ return n===1 ? t('1 day') : gpT('{n} days',{n:n}); }
function nightsLabel_(n){ return n===1 ? t('1 night') : gpT('{n} nights',{n:n}); }
function addMonths_(ym, k){ var y=+ym.slice(0,4), m=+ym.slice(5,7)-1+k; var d=new Date(y, m, 1); return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2); }
function basePlace_(){
  var c = (P.view==='crm' && typeof selected_==='function' && P.boot && P.boot.applicants) ? selected_() : (P.boot && P.boot.application);
  return campusName_((c && c.campus) || DEFAULT_CAMPUS);
}
function staysOf_(v, base){
  var a=Array.isArray(v) ? v.map(function(r){ return { place:(r && r.place)||'', from:(r && r.from)||'', to:(r && r.to)||'' }; }) : [];
  if(!a.length) a=[{ place:base, from:'', to:'' }];
  a[0].place=base; a[0].base=true;
  return a;
}
function tripOf_(ans, base){
  ans=ans||{};
  var stays=null, note='';
  if(Array.isArray(ans.itinerary) && ans.itinerary.length) stays=staysOf_(ans.itinerary, base);
  else if(ans.arrival || ans.departure){ stays=[{ place:base, from:ans.arrival||'', to:ans.departure||'', base:true }]; note=ans.otherLocations||''; }
  if(!stays) return null;
  var dated=stays.filter(function(r){ return r.from && r.to; });
  var start='', end='';
  dated.forEach(function(r){ if(!start || r.from<start) start=r.from; if(!end || r.to>end) end=r.to; });
  if(!Array.isArray(ans.itinerary) && ans.arrivalKh && ans.departureKh){ start=ans.arrivalKh; end=ans.departureKh; }
  var first=dated.slice().sort(function(a,b){ return a.from<b.from?-1:a.from>b.from?1:(a.base?-1:1); })[0]||null;
  return { stays:stays, start:start, end:end, days:daysIncl_(start, end), first:first, note:note };
}
function ansStore_(prefix){ return prefix==='s_' ? P.staffAnswers : prefix==='r_' ? P.refAnswers : P.answers; }

  if(prefix==='s_'){ var saved=P.answers; P.answers=P.staffAnswers; readAnswers_(document.getElementById('panel')); P.staffAnswers=P.answers; P.answers=saved; }

}

function calendarHtml_(r){
  var today=ymd_(new Date()), wk=[];
  for(var i=0;i<7;i++) wk.push(new Date(2024,0,1+i).toLocaleDateString(LANG==='km'?'km-KH':'en-GB',{ weekday:'narrow' }));

    var g=wk.map(function(w){ return '<span class="calWd">'+esc(w)+'</span>'; }).join('');
    for(var b=0;b<lead;b++) g+='<span></span>';
    for(var d=1; d<=n; d++){
      var iso=ymd_(new Date(y, mo, d)), cls='calDay';
      if(iso===r.from) cls+=' from'; if(iso===r.to) cls+=' to';

  var c=selected_(); if(!c) return;
  var rec=Object.assign({}, c, { stage:document.getElementById('p_stage').value, assignedTo:document.getElementById('p_owner').value,
    nextStep:document.getElementById('p_next').value.trim(), nextDate:document.getElementById('p_date').value });
  P.busy=true; render();
  run('hrSaveCandidate', [P.auth.user, P.auth.pin, rec], function(d){
    P.busy=false;
    if(putCand_(d)){ showMsg(t('Saved')); boot_(); return; }
    render();
  });
}
function addNote_(){
  var c=selected_(); if(!c) return;
  var txt=String((document.getElementById('p_note')||{}).value||'').trim();
  if(!txt){ showMsg(t('Write the note first.')); return; }
  P.busy=true; render();
  run('hrCandidateNote', [P.auth.user, P.auth.pin, c.id, txt], function(d){
    P.busy=false; P.note='';
    if(putCand_(d)) showMsg(t('Note added'));
    render();
  });
}
/* Permanent, admins only: the application and, when there is one, the
   applicant's account. Asks twice in one breath — the name has to be typed
   back — because there is no undo. */
function deleteCand_(){
  var c=selected_(); if(!c) return;
  var typed=prompt(gpT('This deletes {name}’s application{account} for good. Type their name to confirm.', {name:candName_(c), account: c.hasAccount ? t(' and their account') : ''}));
  if(typed===null) return;
  if(String(typed).trim().toLowerCase()!==String(candName_(c)).trim().toLowerCase()){ showMsg(t('The name did not match — nothing was deleted.')); return; }
  P.busy=true; render();
  run('portalDeleteApplicant', [P.auth.user, P.auth.pin, c.id], function(d){
    P.busy=false;
    if(d && d.ok){ P.boot=d; P.sel=null; showMsg(t('Deleted')); render(); return; }
    showMsg(d && d.err==='not_authorized' ? t('Only a portal admin can delete') : t('Could not delete'));
    render();
  });
}
function archiveCand_(){
  var c=selected_(); if(!c) return;
  var info = c.archived ? null : { reason: prompt(t('Why is this application closing? (optional)')) || '' };
  if(!c.archived && info.reason===null) return;
  run('hrArchiveCandidate', [P.auth.user, P.auth.pin, c.id, info], function(d){
    if(putCand_(d)){ showMsg(c.archived ? t('Reopened') : t('Closed')); boot_(); return; }
    render();
  });
}
render();
function keepReg_(){
  var g=function(id){ var el=document.getElementById(id); return el ? el.value : undefined; };
  ['name','email','phone','username','country'].forEach(function(k){ var v=g('r_'+(k==='username'?'user':k)); if(v!==undefined) P.reg[k]=v; });
}
function register_(){
  keepReg_();
  var a=applyByKey_(P.apply);
  var pin=(document.getElementById('r_pin')||{}).value||'', pin2=(document.getElementById('r_pin2')||{}).value||'';
  var r=P.reg;
  if(!a){ showMsg(t('Pick what you are applying for.')); return; }
  if(!offeredAt_(a, P.campus||DEFAULT_CAMPUS)){ showMsg(t('That school is not run at this campus — pick another.')); return; }
  if(!String(r.name||'').trim()){ showMsg(t('Add your full name.')); return; }
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(r.email||'').trim())){ showMsg(t('Add a real email address.')); return; }
  if(String(r.phone||'').replace(/\D/g,'').length<6){ showMsg(t('Add a phone number with the country code.')); return; }
  if(!r.messenger){ showMsg(t('Choose WhatsApp or Telegram.')); return; }
  if(!/^[a-z0-9._-]{2,20}$/.test(String(r.username||'').trim().toLowerCase())){ showMsg(t('Username: lowercase letters, numbers, dots or dashes — 2 to 20 characters.')); return; }
  if(!/^\d{4}$/.test(pin)){ showMsg(t('The PIN is 4 digits.')); return; }
  if(pin!==pin2){ showMsg(t('The two PINs don’t match.')); return; }
  P.busy=true; render();
  var payload={ username:String(r.username).trim().toLowerCase(), pin:pin, name:String(r.name).trim(), email:String(r.email).trim(), phone:String(r.phone).trim(), messenger:r.messenger, country:r.country||'', type:a.type, school:a.school, campus:P.campus||DEFAULT_CAMPUS };
  run('portalRegister', [payload], function(d){
    P.busy=false;
    if(d && d.ok){ P.auth={ user:payload.username, pin:pin }; lsSet('gp-portal', JSON.stringify(P.auth)); P.boot=d; P.answers={}; P.view='me'; P.reg={}; showMsg(t('Welcome — your account is ready.')); render(); return; }
    var e=d && d.err;
    showMsg(e==='taken' ? t('That username is taken — try another.') : e==='email_taken' ? t('There is already an account with that email. Sign in instead.')
      : e==='bad_email' ? t('Add a real email address.') : e==='phone_required' ? t('Add a phone number with the country code.') : t('Check your details and try again.'));
    render();
  });
}
function login_(){
  var u=String((document.getElementById('l_user')||{}).value||'').trim().toLowerCase(), pin=String((document.getElementById('l_pin')||{}).value||'');
  if(!u || !/^\d{4}$/.test(pin)){ showMsg(t('Enter your username and 4-digit PIN.')); return; }
  P.busy=true; P.reg.username=u; render();
  P.auth={ user:u, pin:pin };
  run('portalBoot', [u, pin], function(d){
    P.busy=false;
    if(d && d.ok){ P.boot=d; if(d.role==='applicant') P.answers=(d.application && d.application.answers)||{}; P.view = d.role==='applicant' ? 'me' : 'crm'; lsSet('gp-portal', JSON.stringify(P.auth)); render(); return; }
    if(d && d.err==='not_authorized'){ P.view='noaccess'; render(); return; }
    if(d && d.err==='no_application'){ P.view='noaccess'; P.err='no_application'; render(); return; }
    P.auth=null; showMsg(t('Wrong username or PIN.')); render();
  });
}


</script>
