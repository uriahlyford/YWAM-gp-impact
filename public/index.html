<script>
/*  Error boundary — must come first, before any other script.

    The page depends on taxonomy.js loading; if that request fails (flaky
    connection, cache miss) the app's globals are missing and everything after
    it dies, which used to mean a silent blank screen with no way out. Show
    something honest and recoverable instead.  */
(function(){
  var shown = false;
  function fallback(what){
    if(shown) return; shown = true;
    // Latch it so a later render() can't paint over the message.
    window.gpDead = true;
    var html =
      '<div style="max-width:420px;margin:14vh auto;padding:0 22px;text-align:center;'+
      'font-family:system-ui,sans-serif;color:#17150F">'+
      '<div style="font-size:40px;line-height:1">✦</div>'+
      '<h2 style="font-size:19px;margin:14px 0 8px">This didn’t load properly</h2>'+
      '<p style="font-size:14.5px;line-height:1.5;color:#6b6557;margin:0 0 18px">'+
      'Usually a connection hiccup. Your data is safe — nothing was lost.</p>'+
      '<button id="gpReload" style="width:100%;padding:14px;border:0;border-radius:12px;'+
      'background:#1F44FF;color:#fff;font-size:16px;font-weight:700;cursor:pointer">Try again</button>'+
      '<div style="font-size:11px;color:#a09a8c;margin-top:20px">'+String(what||'').slice(0,140)+'</div>'+
      '</div>';
    function paint(){
      var host = document.getElementById('main') || document.body;
      if(!host) return;
      host.innerHTML = html;
      var r = document.getElementById('gpReload');
      if(r) r.onclick = function(){ location.reload(); };
    }
    if(document.body) paint();
    else document.addEventListener('DOMContentLoaded', paint);
  }
  window.addEventListener('error', function(e){
    // A failed <script src> fires an error event on the element itself.
    if(e && e.target && e.target.tagName === 'SCRIPT'){ fallback('could not load ' + (e.target.src||'a script')); return; }
    if(e && e.message) fallback(e.message);
  }, true);
  window.addEventListener('unhandledrejection', function(e){
    fallback((e && e.reason && e.reason.message) || 'unexpected error');
  });
  window.gpBootFailed = fallback;
})();
</script>

<script>
/* If taxonomy.js didn't land, stop here with a real message rather than
   throwing halfway through rendering. */
if(typeof getDepartments !== 'function' || typeof CAMPUSES === 'undefined'){
  window.gpBootFailed('taxonomy.js did not load');
  // Throwing stops the rest of this script, so nothing paints over the message.
  throw new Error('taxonomy.js missing');
}

/* Staff who've logged in get their own page as the app's front door — opening
   the PWA drops them straight into their Teams home instead of the leadership
   dashboard. Tapping "← Dashboard" over there sets gp-skip-teams for the rest
   of the browser session so they don't get bounced back here. Runs before
   anything renders, so there's no flash of the wrong page. */
(function(){
  try {
    if(sessionStorage.getItem('gp-skip-teams')) return;
    var saved = JSON.parse(localStorage.getItem('gp-staff')||'null');
    if(saved && saved.user && saved.pin) window.location.replace('teams.html');
  } catch(e){}

/* count-up animation for big dashboard numbers */
function animateCounts(){
  document.querySelectorAll('[data-count]').forEach(function(el){
    var target = Number(el.getAttribute('data-count'));
    if(isNaN(target)) return;
    var prefix = el.getAttribute('data-prefix')||'';
    var suffix = el.getAttribute('data-suffix')||'';
    var dec = el.getAttribute('data-dec')==='1';
    var start = performance.now(), dur = 700;
    function tick(now){
      var p = Math.min(1,(now-start)/dur);
      var eased = 1-Math.pow(1-p,3);
      var v = target*eased;
      el.textContent = prefix + (dec ? v.toFixed(1) : Math.round(v).toLocaleString()) + suffix;
      if(p<1) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  });
}


function ring(p, size){
  p = Math.max(0, Math.round(p));
  var shown = Math.min(100, p);
  var r = (size-10)/2, c = 2*Math.PI*r, off = c*(1-shown/100);
  var cx = size/2;
  return '<svg class="ring'+(p>=100?' done':'')+'" width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'">'+
    '<circle class="ringBg" cx="'+cx+'" cy="'+cx+'" r="'+r+'" fill="none" stroke-width="6"/>'+
    '<circle class="ringFg" cx="'+cx+'" cy="'+cx+'" r="'+r+'" fill="none" stroke-width="6" stroke-linecap="round" '+
      'stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" transform="rotate(-90 '+cx+' '+cx+')"/>'+
    '<text x="'+cx+'" y="'+(cx+5)+'" text-anchor="middle" font-size="'+(size*0.28)+'">'+p+'%</text></svg>';
}

function mondayOfW1(){
  var y = new Date().getFullYear();
  var jan1 = new Date(y, 0, 1);
  return new Date(y, 0, 1 - ((jan1.getDay() + 6) % 7));
}
function weekRange(w){

function weekLabel(w){

  return 'W'+w+' · '+fmtDate(r[0])+'–'+fmtDate(r[1])+' · Q'+(qOf(w)+1);
}
function currentWeek(){
  var diff = Math.floor((new Date() - mondayOfW1()) / (7*86400000)) + 1;
  return Math.max(1, Math.min(52, diff));
}

/* ---------- aggregation ---------- */
function aggregate(entries, mode, quarter){
  if(!entries) return null;
  var pairs = [];
  for(var w in entries){
    var wk = Number(w), v = Number(entries[w]);
    if(isNaN(v)) continue;
    if(quarter !== undefined && quarter !== null && qOf(wk) !== quarter) continue;
    pairs.push([wk, v]);
  }
  if(!pairs.length) return null;
  pairs.sort(function(a,b){ return a[0]-b[0]; });
  if(mode==='avg'){ var s=0; pairs.forEach(function(p){s+=p[1];}); return s/pairs.length; }
  if(mode==='latest') return pairs[pairs.length-1][1];
  var tt=0; pairs.forEach(function(p){tt+=p[1];}); return tt;
}

/* Most recent recorded value STRICTLY BEFORE a given week. Used by the log
   form to carry a headcount forward so nobody retypes an unchanged number
   every week. */
function lastBefore(weeks, week){
  if(!weeks) return null;
  var best = null;
  for(var w in weeks){
    var wk = Number(w), v = Number(weeks[w]);
    if(isNaN(v) || wk >= Number(week)) continue;
    if(!best || wk > best.week) best = { week:wk, value:v };
  }
  return best;
}

function fmt(v, metric){
  if(v===null||v===undefined) return '—';
  var money = metric && metric.indexOf('($)')>-1;
  if(metric && (metric.indexOf('(1-10)')>-1)) return v.toFixed(1);
  if(metric && metric.indexOf('(%)')>-1) return Math.round(v)+'%';
  var n = Math.round(v).toLocaleString();
  return money ? '$'+n : n;
}
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;'); }

/* ---------- weekly trend (vs the week before) ---------- */
var LOWER_BETTER = {'Staff Debt ($)':1,'Weekly Expenses ($)':1,'Students Struggling':1};
function pctChange(prev,cur){
  if(prev===null||cur===null||prev===undefined||cur===undefined||isNaN(prev)||isNaN(cur)) return null;
  if(prev===0) return null;
  return Math.round((cur-prev)/Math.abs(prev)*100);
}
function lastTwo(valFn, maxW){
  maxW = maxW || currentWeek();
  var arr=[];
  for(var w=1; w<=maxW; w++){ var v=valFn(w); if(v!==null && v!==undefined && !isNaN(v)) arr.push(v); }
  if(arr.length<2) return null;
  return [arr[arr.length-2], arr[arr.length-1]];
}
function trendBadge(pct, higherBetter){
  if(pct===null||pct===undefined) return '';
  if(pct===0) return '<span class="trend flat">— 0%</span>';
  var up = pct>0, good = up ? higherBetter : !higherBetter;
  return '<span class="trend '+(good?'up':'down')+'">'+(up?'▲':'▼')+' '+Math.abs(pct)+'%</span>';
}
function trendB(valFn, higherBetter, maxW){
  var lt=lastTwo(valFn, maxW); if(!lt) return '';
  return trendBadge(pctChange(lt[0],lt[1]), higherBetter!==false);
}
function trendFor(valFn, metric, maxW){
  return trendB(valFn, (metric && LOWER_BETTER[metric]) ? false : true, maxW);
}
function metricWeekSum(ids, metric, w){

/* ---------- headline roll-ups: schools, teams, churches ----------
   Nothing new is stored for these. They read the same weekly entries as every
   other figure on the page; the only new thing is which
   (department | ministry | metric) triples get added together. The ministry
   groups live in taxonomy.js so the log form and the dashboard stay in step.

   Each metric keeps its own aggregation rule, so headcounts ('Students
   Enrolled', 'Partner Churches Supported') take the latest week rather than
   summing the same people every week, while events ('Teams Hosted',
   'Students Graduated') accumulate across the year. */

function entryWeeks(campus, dept, ministry, metric){
  return (state.data.entries[campus]||{})[dept+'|'+ministry+'|'+metric];
}

/* null + null stays null — "nothing logged yet" is different from zero, and the
   dashboard shows an em dash for it rather than a misleading 0. */
function addKnown(vals){
  var total=0, any=false;
  vals.forEach(function(v){ if(v!==null && v!==undefined && !isNaN(v)){ total+=v; any=true; } });
  return any ? total : null;
}

/* One metric added across a named set of ministries in one department. */
function ministryRollup(ids, dept, ministries, metric, quarter){
  var mode = modeOf(metric), vals = [];
  ids.forEach(function(cid){
    ministries.forEach(function(min){
      vals.push(aggregate(entryWeeks(cid, dept, min, metric), mode, quarter));
    });
  });
  return addKnown(vals);
}

/* The same roll-up for a single week, which is what the ▲/▼ trend badges
   compare. Reads the raw week rather than aggregating, so a 'latest' metric
   gives that week's level and a 'sum' metric that week's events. */
function ministryRollupWeek(ids, dept, ministries, metric, week){
  var vals = [];
  ids.forEach(function(cid){
    ministries.forEach(function(min){
      var weeks = entryWeeks(cid, dept, min, metric);
      var v = weeks ? Number(weeks[week]) : NaN;
      vals.push(isNaN(v) ? null : v);
    });
  });
  return addKnown(vals);
}

/* Has anything at all been logged for this ministry? Lets a school count as
   running without asking anyone to type a "1" every week. */
function ministryLogged(campus, dept, ministry){
  var entries = state.data.entries[campus]||{}, pre = dept+'|'+ministry+'|';
  for(var k in entries){
    if(k.indexOf(pre)!==0) continue;
    for(var w in entries[k]) if(!isNaN(Number(entries[k][w]))) return true;
  }
  return false;
}

/* How many schools a group of ministries is running. A ministry reporting its
   own 'Schools' figure contributes that number; otherwise a ministry with any
   data at all is the one school it is — YDC is one school, and nobody should
   have to log that separately. */
function schoolCount(ids, dept, ministries){
  var n=0, any=false;
  ids.forEach(function(cid){
    ministries.forEach(function(min){
      var reported = aggregate(entryWeeks(cid, dept, min, 'Schools'), 'latest');
      if(reported!==null && reported>0){ n += reported; any=true; return; }
      if(ministryLogged(cid, dept, min)){ n += 1; any=true; }
    });
  });
  return any ? n : null;
}

/* ---------- survey ---------- */
function surveyRows(ids, week){
  return state.data.survey.filter(function(r){
    return ids.indexOf(r.campus)>-1 && (week===undefined || Number(r.week)===Number(week));
  });

function pct(rows, id){
  var v = rows.filter(function(r){ return r[id]!==null && r[id]!==undefined; });
  if(!v.length) return null;
  var y=0; v.forEach(function(r){ if(r[id]) y++; });
  return Math.round(y/v.length*100);
}
function avg(rows, id){
  var v = rows.filter(function(r){ return r[id]!==null && r[id]!==undefined; });
  if(!v.length) return null;
  var s=0; v.forEach(function(r){ s+=Number(r[id])||0; });
  return s/v.length;
}
function healthScore(ids, week){
  var rows = surveyRows(ids, week);
  if(!rows.length) return null;
  var s=0; rows.forEach(function(r){ s+=compositeOf(r); });
  return s/rows.length;
}

  if(window.gpDead) return;   // an error message is on screen; leave it there
  /* The front door comes before anything else — and before the data has even
     arrived, so an undecided visitor never sees the dashboard flash behind it. */
  if(!isSignedIn() && !isGuest()){ renderWelcome(); return; }

  if(!state.loaded){ m.innerHTML = loadingHtml(); return; }
  if(state.view==='all') m.innerHTML = dashboardHtml(t('All Campuses — Combined Impact'), CAMPUSES.map(function(c){return c.id;}), true);

  else if(state.view==='okr') m.innerHTML = okrHtml();
  else m.innerHTML = healthHtml();
  bindEvents();
  animateCounts();
}

/* ---------- who is here: signed in, guest, or undecided ----------
   Reading the dashboard has never needed an account and still doesn't. Typing
   into it is the part that does: a number logged anonymously can't be traced
   back to a person or a campus, which is how the wrong campus gets a week of
   somebody else's figures.

   So the front door asks once — create a profile, log in, or browse as a guest
   — and guests get every screen except the two that write: Log Numbers and the
   health check-in. This is the first half of tying logging to your own campus;
   the campus lock itself waits until everyone has an account.

   Note this is a UI gate, not a server one. `saveEntries` still accepts an
   unauthenticated POST, so this stops the accident, not a determined person.
   Closing that properly means passing staff credentials to saveEntries and
   checking them in api.js. */
function staffSession(){
  try { return JSON.parse(localStorage.getItem('gp-staff')||'null'); } catch(e){ return null; }
}
function isSignedIn(){ var s=staffSession(); return !!(s && s.user && s.pin); }
function isGuest(){ try { return sessionStorage.getItem('gp-guest')==='1'; } catch(e){ return false; } }
function canEnterData(){ return isSignedIn(); }
var WRITE_VIEWS = ['log','health'];
function isWriteView(v){ return WRITE_VIEWS.indexOf(v)>-1; }

    '<p class="wSub">'+esc(t('Ministry numbers for YWAM GonPreah \u2014 Poipet and Siem Reap.'))+'</p>'+
    '<button class="wBtn" id="wCreate">'+esc(t('Create my profile'))+'</button>'+
    '<button class="wBtn ghost" id="wLogin">'+esc(t('I already have a profile'))+'</button>'+
    '<button class="wGuest" id="wGuest">'+esc(t('View as guest'))+'</button>'+
    '<p class="wNote">'+esc(t('Guests can see everything. Logging numbers needs an account.'))+'</p>'+

}

/* ---------- drill-down: click a total to see what it's made of ---------- */
function campusShort_(id){ for(var i=0;i<CAMPUSES.length;i++) if(CAMPUSES[i].id===id) return CAMPUSES[i].short; return id; }

function drillDownRows(filterFn){
  var rows = [];
  Object.keys(state.data.entries).forEach(function(campus){
    var entries = state.data.entries[campus];
    Object.keys(entries).forEach(function(key){
      var parts = key.split('|');
      var dept = parts[0], ministry = parts[1], metric = parts[2];
      if(!filterFn(campus, dept, ministry, metric)) return;
      var weeks = entries[key];
      var total = aggregate(weeks, modeOf(metric));
      if(total===null) return;
      rows.push({ campus:campus, dept:dept, ministry:ministry, metric:metric, weeks:weeks, total:total });
    });
  });
  return rows;
}

function openDrillDown(title, rows){
  rows = rows.slice().sort(function(a,b){ return b.total-a.total; });
  var h = '<div class="ddOverlay" id="ddOverlay"><div class="ddModal">'+
    '<div class="ddHead"><h3>'+esc(title)+'</h3><button class="ddClose" id="ddClose">✕</button></div>';
  if(!rows.length){
    h += '<p class="ddSub">Nothing logged for this yet.</p>';
  } else {
    rows.forEach(function(r){
      var weeksList = Object.keys(r.weeks).map(Number).sort(function(a,b){ return a-b; });
      h += '<div class="ddRow"><div class="ddRowHead"><span>'+esc(t(campusShort_(r.campus)))+' · '+emj(r.dept)+esc(t(r.dept))+' · '+esc(t(r.ministry))+'</span><span class="ddRowVal">'+fmt(r.total, r.metric)+'</span></div>'+
        '<div class="ddWeeks">'+weeksList.map(function(w){ return 'W'+w+': '+fmt(r.weeks[w], r.metric); }).join(' · ')+'</div></div>';
    });
  }
  h += '</div></div>';
  document.getElementById('ddRoot').innerHTML = h;
  document.getElementById('ddClose').onclick = closeDrillDown;
  document.getElementById('ddOverlay').onclick = function(e){ if(e.target.id==='ddOverlay') closeDrillDown(); };
}

/* ---------- dashboard tiles ----------
   statTile keeps the count-up animation contract in one place: render the
   number as "0" with a data-count for animateCounts() to drive, or an em dash
   when nothing has been logged. */
function drillAttrs(metric, ids, dept, ministry, quarter){
  return ' data-drill-metric="'+esc(metric)+'" data-drill-ids="'+ids.join(',')+'"'+
    (dept ? ' data-drill-dept="'+esc(dept)+'"' : '')+
    (ministry ? ' data-drill-ministry="'+esc(ministry)+'"' : '')+
    (quarter!==undefined && quarter!==null ? ' data-drill-quarter="'+quarter+'"' : '');
}
function statTile(label, value, opts){
  opts = opts || {};
  var known = (value!==null && value!==undefined && !isNaN(value));
  var attrs = '';
  if(known){
    attrs = ' data-count="'+value+'"';
    if(opts.dec) attrs += ' data-dec="1"';
    if(opts.prefix) attrs += ' data-prefix="'+esc(opts.prefix)+'"';
    if(opts.suffix) attrs += ' data-suffix="'+esc(opts.suffix)+'"';
  }
  return '<div class="stat'+(opts.cls?' '+opts.cls:'')+(opts.drill?' drillable':'')+'"'+(opts.drill||'')+'>'+
    '<div class="statNum"'+attrs+'>'+(known?'0':'—')+'</div>'+
    '<div class="statLabel">'+esc(label)+(opts.trend?'<span class="statTrend">'+opts.trend+'</span>':'')+'</div></div>';
}
/* Q1–Q4 chips under a section heading, so "per quarter" is answerable without
   leaving the dashboard. valFn(quarter) returns that quarter's figure. */
function quarterChips(label, valFn, drillFn){
  var h = '<div class="qRow"><span class="qRowLabel">'+esc(label)+'</span>';
  for(var q=0;q<4;q++){
    var d = drillFn ? drillFn(q) : '';
    h += '<span'+(d?' class="drillable"'+d:'')+'>Q'+(q+1)+' <b>'+fmt(valFn(q))+'</b></span>';
  }
  return h+'</div>';
}

  }
  visibleMetrics(deps[state.dept][state.ministry]).forEach(function(metric){
    var key = state.dept+'|'+state.ministry+'|'+metric;
    var mode = modeOf(metric);
    var wks = entries[key] || {};
    var agg = aggregate(wks, mode);
    var cur = wks[state.week]!==undefined ? wks[state.week] : '';
    var sub, extra = '';
    if(mode==='latest'){
      // Headcounts (students enrolled, staff, schools…) rarely change week to
      // week, so carry the last figure forward already filled in instead of
      // making someone retype it. Still editable, so real growth or decline
      // still registers — and the ▲/▼ badge shows the change.
      var prev = lastBefore(wks, state.week);
      var isCarried = (cur==='' && prev!==null);
      if(isCarried){ cur = prev.value; extra = ' data-carried="1"'; }
      sub = esc(t('now'))+' '+fmt(agg,metric);
      if(prev!==null){
        sub += ' · ' + (isCarried
          ? esc(t('carried from week'))+' '+prev.week

      }

      sub = esc(t('avg'))+' '+fmt(agg,metric);
    } else {
      // Running totals: this box is the week's ADDITION, not the new total.
      // Spelling that out stops people entering "105" when they mean "+5".
      sub = esc(t('total so far'))+' '+fmt(agg,metric)+'<span class="newTot"></span>';
      extra = ' data-run="'+(agg===null?0:agg)+'"';
    }
    h += '<div class="row"><div><div class="rowName">'+esc(t(metric))+'</div><div class="rowSub">'+sub+'</div></div>'+
      '<input type="number" inputmode="decimal" placeholder="'+(mode==='sum'?'+0':'0')+'" data-metric="'+esc(metric)+'" data-mode="'+mode+'" value="'+cur+'"'+extra+'></div>';
  });
  h += '<button class="saveBtn" id="saveBtn">'+esc(t('Save Week'))+' '+state.week+'</button></div>';
  h += '<p class="note">'+esc(t('Entries save to the shared GP Impact Data sheet — every leader sees the same live numbers.'))+'</p>';
  return h;
}

/* ---------- OKR ---------- */
function objProgress(o){
  var pcts = o.krs.map(function(kr){ return krProgress(o, kr).pct; }).filter(function(p){ return p!==null; });
  if(!pcts.length) return 0;
  var s=0; pcts.forEach(function(p){s+=p;});
  return Math.round(s/pcts.length);
}

function krProgress(o, kr){
  if(kr.metricKey){
    var parts = kr.metricKey.split('|');
    var mode = modeOf(parts[2]);
    var actual = aggregate((state.data.entries[o.campus]||{})[kr.metricKey], mode, Number(o.quarter)-1);
    if(actual===null) return { pct:0, actual:null };
    var p = kr.target>0 ? Math.round(actual/kr.target*100) : 0;
    return { pct:Math.max(0,p), actual:actual };
  }
  return { pct:Math.max(0,Math.min(100,Number(kr.manual)||0)), actual:null };
}

function deviceId(){
  var id = localStorage.getItem('gp-device');
  if(!id){ id = 'd'+Math.random().toString(36).slice(2)+Date.now().toString(36); localStorage.setItem('gp-device', id); }
  return id;
}
function hasSubmitted(campus, week){
  var id = deviceId();
  return state.data.survey.some(function(r){ return r.campus===campus && Number(r.week)===Number(week) && r.device===id; });
}

/* ---------- events & server ---------- */
function apiCall(fn, args){
  return fetch('/.netlify/functions/api', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ fn: fn, args: args || [] })
  }).then(function(res){
    if(!res.ok) throw new Error('HTTP '+res.status);
    return res.json();
  });
}

function toggleLeader(){
  if(state.data.leader){
    state.leaderCode=''; localStorage.removeItem('gp-leadercode');
    fetchData(); return;
  }
  var code = prompt(t('Enter leadership code'));
  if(!code) return;
  apiCall('getData', [code]).then(function(d){
    if(d.leader){
      state.leaderCode = code; localStorage.setItem('gp-leadercode', code);
      state.data = d; render();
    } else {
      showError(t('Wrong code'));
    }
  }).catch(function(){ showError(t('Wrong code')); });
}

      var dept = el.getAttribute('data-drill-dept');
      var ministry = el.getAttribute('data-drill-ministry');

      var quarter = (qAttr===null || qAttr==='') ? null : Number(qAttr);
      var rows = drillDownRows(function(campus, d, min, met){
        if(ids.indexOf(campus)===-1 || met!==metric) return false;

        if(!dept && d===BL_DEPT) return false; // matches how the totals above are computed
        return true;
      });
      if(quarter!==null){
        rows = rows.map(function(r){
          var w={};
          Object.keys(r.weeks).forEach(function(wk){ if(qOf(Number(wk))===quarter) w[wk]=r.weeks[wk]; });
          var total = aggregate(w, modeOf(r.metric));
          return total===null ? null : { campus:r.campus, dept:r.dept, ministry:r.ministry, metric:r.metric, weeks:w, total:total };
        }).filter(Boolean);
      }
      var title = t(metric) + (dept ? ' · '+t(ministry||dept) : '') + (quarter!==null ? ' · Q'+(quarter+1) : '');

    inp.oninput=function(){
      var row = inp.parentNode;

      if(!out) return;
      var add = Number(inp.value);
      if(inp.value==='' || isNaN(add) || add===0){ out.textContent=''; return; }

  });
  document.querySelectorAll('[data-manual]').forEach(function(inp){
    inp.onchange=function(){
      var parts = inp.getAttribute('data-manual').split('|');
      var okr=null; state.data.okrs.forEach(function(o){ if(o.id===parts[0]) okr=o; });
      if(!okr) return;
      okr.krs[Number(parts[1])].manual = Number(inp.value)||0;
      serverCall('saveObjective', [okr, state.leaderCode]);
    };
  });

  var svw=document.getElementById('svWeekSel');
  if(svw) svw.onchange=function(){ state.surveyWeek=Number(svw.value); state.surveyDraft={}; render(); };
  document.querySelectorAll('[data-scale]').forEach(function(b){
    b.onclick=function(){
      var p=b.getAttribute('data-scale').split('|');
      state.surveyDraft[p[0]]=Number(p[1]); render();
    };
  });
  document.querySelectorAll('[data-yn]').forEach(function(b){
    b.onclick=function(){
      var p=b.getAttribute('data-yn').split('|');
      state.surveyDraft[p[0]]=Number(p[1]); render();
    };
  });
  document.querySelectorAll('[data-num]').forEach(function(inp){
    inp.onchange=function(){ state.surveyDraft[inp.getAttribute('data-num')] = inp.value===''?undefined:Number(inp.value); };
  });
  var svs=document.getElementById('svSubmit');
  if(svs) svs.onclick=function(){ submitSurvey(svs); };
}

function serverCall(fn, args){
  hideError();
  apiCall(fn, args).then(function(d){ state.data=d; render(); })
    .catch(function(){ showError("Couldn't save. Check your connection and try again."); });
}

function saveCard(btn){
  var updates=[];
  document.querySelectorAll('#logCard input[data-metric]').forEach(function(inp){
    updates.push({ dept:state.dept, ministry:state.ministry, metric:inp.getAttribute('data-metric'),
      week:state.week, value: inp.value==='' ? null : Number(inp.value) });
  });
  btn.disabled=true; btn.textContent=t('Saving…'); hideError();
  apiCall('saveEntries', [state.campus, updates, state.leaderCode]).then(function(d){
    state.data = d; btn.innerHTML='<span class="savedSpark">✦</span> '+t('Saved');
    setTimeout(function(){ render(); }, 900);
  }).catch(function(){
    btn.disabled=false; btn.textContent=t('Save Week')+' '+state.week;
    showError("Couldn't save. Check your connection and press Save again.");
  });
}

function saveOkrForm(btn){
  var text = document.getElementById('objText').value.trim();
  if(!text){ showError(t('Objective')+'?'); return; }
  var krs=[];
  for(var k=0;k<3;k++){
    var tx = document.getElementById('krText'+k).value.trim();
    if(!tx) continue;
    krs.push({ text:tx, metricKey:document.getElementById('krMetric'+k).value,
      target:Number(document.getElementById('krTarget'+k).value)||0, manual:0 });
  }
  if(!krs.length){ showError(t('Key result')+'?'); return; }
  if(state.editingId){
    state.data.okrs.forEach(function(o){
      if(o.id===state.editingId){
        krs.forEach(function(nk){
          o.krs.forEach(function(ok){ if(ok.text===nk.text && !nk.metricKey && !ok.metricKey) nk.manual=ok.manual; });
        });
      }
    });
  }
  var obj = { id: state.editingId || ('o'+Date.now()), campus: state.campus, quarter: state.okrQuarter,
    dept: document.getElementById('objDept').value, objective: text, krs: krs };
  btn.disabled=true; btn.textContent=t('Saving…');
  apiCall('saveObjective', [obj, state.leaderCode]).then(function(d){
    state.data=d; state.okrFormOpen=false; state.editingId=null; render();
  }).catch(function(){
    btn.disabled=false; btn.textContent=t('Add objective');
    showError("Couldn't save. Check your connection and try again.");
  });
}

function submitSurvey(btn){
  var d = state.surveyDraft;
  var missing = SCALE_QS.some(function(q){ return d[q.id]===undefined; }) ||
                YESNO_QS.some(function(q){ return d[q.id]===undefined; });
  if(missing){ showError(t('My check-in')+': '+t('Yes')+'/'+t('No')+' + 1–10'); return; }
  var payload = { campus: state.campus, week: state.surveyWeek, device: deviceId(),
    lonely: d.lonely, clarity: d.clarity, growth: d.growth, porn: d.porn, oneOnOne: d.oneOnOne,
    exercise: d.exercise, quietTime: d.quietTime, debt: d.debt,
    sharedFaith: d.sharedFaith, sabbath: d.sabbath,
    langHours: d.langHours||0, minHours: d.minHours||0 };
  btn.disabled=true; btn.textContent=t('Saving…'); hideError();
  apiCall('saveSurvey', [payload, state.leaderCode]).then(function(d){
    state.data=d; state.surveyDraft={}; render();
  }).catch(function(){
    btn.disabled=false; btn.textContent=t('Submit my check-in');
    showError("Couldn't save. Check your connection and try again.");
  });
}

function showError(msg){ var e=document.getElementById('errorBar'); e.textContent=msg; e.classList.remove('hidden'); }
function hideError(){ document.getElementById('errorBar').classList.add('hidden'); }

function loadRoster(){
  apiCall('teamRoster', []).then(function(r){ state.roster=Array.isArray(r)?r:[]; render(); })
    .catch(function(){});
}
function fetchData(){
  loadRoster();
  // Returns the promise so pull-to-refresh knows when to stop spinning.
  return apiCall('getData', [state.leaderCode]).then(function(d){
    state.data=d; state.loaded=true;
    if(state.lang==='km'){
      var cached = localStorage.getItem('gp-km-v2');
      if(cached) state.km = JSON.parse(cached); else state.lang='en';
    }
    render();
  }).catch(function(){ showError("Couldn't load data. Pull down to refresh."); });
}

/* The dashboard is the public face of the app — anyone can read it without an
   account. The chip in the top right is the one place that changes: it's your
   face and a door to your own page if you're signed in, and an invitation to
   sign in if you're not. */
function renderUserChip(){
  var chip=document.getElementById('userChip');
  if(!chip) return;
  var card=null, session=null;
  try {
    session = JSON.parse(localStorage.getItem('gp-staff')||'null');
    card = JSON.parse(localStorage.getItem('gp-staff-card')||'null');
  } catch(e){}
  var signedIn = !!(session && session.user);

  if(!signedIn){
    chip.className='userChip guest';
    chip.innerHTML='<span aria-hidden="true">✦</span> '+esc(t('Sign in'));
    chip.setAttribute('aria-label', t('Sign in to your staff page'));
  } else {
    var name=(card&&card.name)||session.user;
    var first=String(name).trim().split(/\s+/)[0];
    var av=(card&&card.photo)
      ? '<img class="uAv" src="'+esc(card.photo)+'" alt="">'
      : '<span class="uAv">'+esc(initialsOf(name))+'</span>';
    chip.className='userChip';
    chip.innerHTML=av+'<span class="uName">'+esc(first)+'</span>';
    chip.setAttribute('aria-label', t('Open my page'));
  }
  chip.onclick=function(){
    // Going to my own page means I want to be taken there next time too.
    try { sessionStorage.removeItem('gp-skip-teams'); } catch(e){}
    window.location.href='teams.html';
  };
}
function initialsOf(name){
  return String(name||'?').trim().split(/\s+/).map(function(w){return w[0];})
    .slice(0,2).join('').toUpperCase();
}

(function(){
  renderUserChip();
  var hb=document.getElementById('helpBtn');
  if(hb) hb.onclick=function(){ window.location.href='help.html'; };
})();

/* ---------- pull to refresh ----------
   Only engages at the very top of the page, and never while the drill-down
   sheet is open (that panel scrolls on its own). Haptics use the Vibration
   API — Android fires it, iOS Safari doesn't implement it at all, so on
   iPhone this is visual only. */
(function(){
  var ptr = document.getElementById('ptr');
  if(!ptr || !('ontouchstart' in window)) return;
  var logo = document.getElementById('ptrLogo');
  if(logo) logo.src = GP_LOGO;

  var THRESHOLD = 68;   // pull needed to arm a refresh
  var MAX = 108;        // furthest the coin travels
  var RESIST = 0.55;    // <1 so the pull feels weighted
  var startY = null, pull = 0, armed = false, busy = false;

  function coin(){ return logo || ptr.querySelector('img'); }
  function buzz(pattern){
    if(!navigator.vibrate) return;
    try { navigator.vibrate(pattern); } catch(e){}
  }
  function setPull(px){
    pull = px;
    ptr.style.transform = 'translateY('+(Math.min(px, MAX) - 60)+'px)';
    ptr.style.opacity = Math.min(1, px / THRESHOLD);
    var c = coin();
    if(c) c.style.transform = 'rotate('+Math.round(px * 3)+'deg)';
  }
  function reset(){
    ptr.classList.remove('dragging');
    ptr.style.transform = ''; ptr.style.opacity = '';
    var c = coin();
    if(c) c.style.transform = '';
    startY = null; pull = 0; armed = false;
  }

  document.addEventListener('touchstart', function(e){
    if(busy || e.touches.length !== 1) return;
    if(window.scrollY > 0) return;
    if(document.getElementById('ddOverlay')) return;
    startY = e.touches[0].clientY;
    ptr.classList.add('dragging');
  }, { passive:true });

  document.addEventListener('touchmove', function(e){
    if(startY === null || busy) return;
    var dy = e.touches[0].clientY - startY;
    if(dy <= 0 || window.scrollY > 0){ if(pull) reset(); return; }
    e.preventDefault();            // take over from the native rubber-band
    setPull(dy * RESIST);
    if(!armed && pull >= THRESHOLD){ armed = true; buzz(12); }
    else if(armed && pull < THRESHOLD){ armed = false; }
  }, { passive:false });

  document.addEventListener('touchend', function(){
    if(startY === null || busy) return;
    if(pull < THRESHOLD){ reset(); return; }
    busy = true; startY = null;
    ptr.classList.remove('dragging');
    ptr.classList.add('spinning');
    ptr.style.transform = 'translateY(14px)';
    ptr.style.opacity = '1';
    buzz([8, 40, 12]);
    Promise.resolve(fetchData()).then(function(){
      ptr.classList.remove('spinning');
      busy = false; reset();
    });
  }, { passive:true });

  document.addEventListener('touchcancel', function(){
    if(!busy) reset();
  }, { passive:true });
})();

render(); fetchData();
</script>
