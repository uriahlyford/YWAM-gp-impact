
<!DOCTYPE html>

<title>GonPreah Impact</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Koulen&family=Kantumruy+Pro:wght@400;500;700&display=swap');
* { box-sizing: border-box; margin: 0; }
html { overscroll-behavior:none; height:100%; }
body { background:#FAF6F0; color:#17150F; font-family:'Kantumruy Pro',system-ui,sans-serif; padding-bottom:44px; overscroll-behavior:none; overflow-x:hidden; -webkit-text-size-adjust:100%; }
button, select, input, textarea { font-family:inherit; }
input:focus, select:focus, textarea:focus, button:focus-visible { outline:3px solid #1F44FF; outline-offset:1px; }

header { background:#17150F; color:#FAF6F0; padding:18px 16px 14px; }
.topRow { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; flex-wrap:wrap; }
.brandRow { display:flex; align-items:center; gap:12px; }
.brandKh { font-family:'Koulen',sans-serif; font-size:26px; line-height:1.05; letter-spacing:1px; }
.brandEn { font-size:10px; letter-spacing:3px; color:#FFB323; font-weight:700; }
.langBtn { border:1px solid #4a463d; background:transparent; color:#FAF6F0; border-radius:999px; padding:6px 12px; font-size:13px; cursor:pointer; }
.hbtns { display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; align-items:center; }
/* Who you are, top right — the way in to your own page (or to signing in). */
.userChip { display:flex; align-items:center; gap:7px; border:1px solid #4a463d; background:transparent;
  color:#FAF6F0; border-radius:999px; padding:4px 12px 4px 4px; font-size:13px; font-family:inherit;
  cursor:pointer; max-width:46vw; }
.userChip.guest { padding:6px 13px; gap:5px; border-color:#FFB323; color:#FFB323; font-weight:700; }
.userChip .uAv { width:26px; height:26px; border-radius:50%; flex:0 0 auto; object-fit:cover;
  background:#1F44FF; color:#fff; display:flex; align-items:center; justify-content:center;
  font-size:11px; font-weight:700; letter-spacing:.3px; overflow:hidden; }
.userChip .uName { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
@media (max-width:480px){
  header { padding:14px 12px 12px; }
  .brandKh { font-size:22px; }
  .brandRow img { height:44px !important; }
  .langBtn { padding:6px 10px; font-size:12px; }
  .hbtns { gap:6px; }
  main { padding:16px 12px; }
}
.campusRow { display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; }
.cbtn { border:1px solid #4a463d; background:transparent; color:#FAF6F0; border-radius:999px; padding:7px 14px; font-size:14px; cursor:pointer; }
.cbtn.on { background:#1F44FF; border-color:#1F44FF; font-weight:700; }
.cbtn.all { border-color:#FFB323; color:#FFB323; }
.cbtn.all.on { background:#FFB323; color:#17150F; font-weight:700; }

nav { display:flex; border-bottom:2px solid #17150F; background:#FAF6F0; position:sticky; top:0; z-index:5; }
nav button { flex:1; padding:12px 2px; background:transparent; border:none; font-size:13.5px; cursor:pointer; color:#17150F; border-bottom:3px solid transparent; }
nav button.on { border-bottom-color:#1F44FF; font-weight:700; color:#1F44FF; }

main { padding:18px 16px; max-width:640px; margin:0 auto; }
h2 { font-family:'Koulen',sans-serif; font-size:22px; margin:4px 0 14px; letter-spacing:.5px; }
h2 small { font-family:'Kantumruy Pro',sans-serif; font-size:14px; color:#6b6557; font-weight:400; }
h3 { font-family:'Koulen',sans-serif; font-size:16px; margin:22px 0 8px; letter-spacing:.5px; }

.hero { background:#17150F; color:#FAF6F0; border-radius:14px; padding:18px 18px 16px; margin-bottom:14px; }
.heroLabel { font-size:11px; letter-spacing:3px; color:#FFB323; font-weight:700; }
.heroNum { font-family:'Koulen',sans-serif; font-size:56px; line-height:1.05; color:#FFB323; }
.heroQ { display:flex; gap:14px; flex-wrap:wrap; margin-top:6px; font-size:13px; color:#c9c3b6; }

.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:10px; }
.stat { background:#fff; border:1px solid #e4ddd0; border-radius:12px; padding:12px 12px 10px; }
.statNum { font-family:'Koulen',sans-serif; font-size:26px; color:#1F44FF; line-height:1.1; }
.statLabel { font-size:11.5px; color:#6b6557; margin-top:2px; line-height:1.3; }
.stat.gold .statNum { color:#c98700; }

.card { background:#fff; border:1px solid #e4ddd0; border-radius:12px; padding:6px 14px; margin-bottom:12px; }
.row { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:11px 0; border-bottom:1px solid #f0eadf; }
.row:last-child { border-bottom:none; }
.rowName { font-size:14.5px; line-height:1.3; }
.rowSub { font-size:12px; color:#6b6557; margin-top:1px; }
.rowVal { font-family:'Koulen',sans-serif; font-size:18px; color:#1F44FF; white-space:nowrap; }

.pickerRow { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px; }
.pick { display:flex; flex-direction:column; gap:4px; flex:1 1 140px; }
.pick span { font-size:11px; letter-spacing:1.5px; font-weight:700; color:#6b6557; text-transform:uppercase; }
select, textarea, input[type=text] { font-size:15px; padding:10px; border-radius:10px; border:1.5px solid #17150F; background:#fff; color:#17150F; width:100%; }
input[type=number] { width:96px; font-size:17px; padding:9px 10px; border-radius:10px; border:1.5px solid #c9c3b6; text-align:right; background:#FAF6F0; }

.saveBtn { width:100%; margin:14px 0 10px; padding:13px; font-family:'Koulen',sans-serif; font-size:18px; letter-spacing:1px; background:#1F44FF; color:#fff; border:none; border-radius:12px; cursor:pointer; }
.saveBtn:disabled { opacity:.7; }
.ghostBtn { background:transparent; border:1.5px solid #17150F; border-radius:10px; padding:9px 14px; font-size:14px; cursor:pointer; }
.dangerBtn { background:transparent; border:none; color:#a33; font-size:13px; cursor:pointer; padding:6px; }
.note { font-size:12.5px; color:#6b6557; margin-top:10px; line-height:1.5; }
.errorBar { background:#FFB323; color:#17150F; padding:10px 16px; font-size:14px; font-weight:500; }
.loading { padding:40px; text-align:center; color:#6b6557; }
.loadingBox { text-align:center; padding:56px 16px 40px; }
.loadCoin { width:92px; height:92px; border-radius:50%; margin:0 auto; background:#17150F; display:flex; align-items:center; justify-content:center; box-shadow:0 12px 30px rgba(31,68,255,.28), 0 0 0 4px rgba(31,68,255,.12); }
.loadLogo { width:66px; height:auto; animation:spin 1.4s linear infinite; }
@keyframes spin { to { transform:rotate(360deg) } }
.loadText { font-family:'Koulen',sans-serif; font-size:22px; letter-spacing:1px; color:#17150F; margin-top:18px; }
.ldots::after { content:''; animation:ldots 1.4s steps(1,end) infinite; }
@keyframes ldots { 0%{content:''} 25%{content:'.'} 50%{content:'..'} 75%,100%{content:'...'} }
@media (prefers-reduced-motion: reduce){ .loadLogo{ animation:none } .ldots::after{ content:'...' } }

/* pull-to-refresh indicator */
.ptr { position:fixed; top:0; left:0; right:0; z-index:60; display:flex; justify-content:center;
  pointer-events:none; opacity:0; transform:translateY(-60px);
  transition:transform .22s ease, opacity .22s ease; }
.ptr.dragging { transition:none; }
.ptrCoin { width:40px; height:40px; border-radius:50%; margin-top:10px; background:#17150F;
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 6px 18px rgba(31,68,255,.3), 0 0 0 3px rgba(31,68,255,.12); }
.ptrCoin img { width:27px; height:auto; }
.ptr.spinning .ptrCoin img { animation:spin 1s linear infinite; transform:none !important; }
@media (prefers-reduced-motion: reduce){ .ptr.spinning .ptrCoin img { animation:none } }
/* Touch devices pull to refresh; the button stays for mouse/desktop. */
@media (pointer:coarse){ #refreshBtn { display:none; } }
.hidden { display:none; }
footer { text-align:center; font-size:12px; color:#6b6557; margin-top:30px; padding:0 16px; }

.okrCard { background:#fff; border:1px solid #e4ddd0; border-radius:12px; padding:14px; margin-bottom:12px; }
.okrHead { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
.okrObj { font-size:15.5px; font-weight:700; line-height:1.35; }
.okrDept { font-size:11px; letter-spacing:1px; color:#6b6557; text-transform:uppercase; margin-top:2px; }
.okrPct { font-family:'Koulen',sans-serif; font-size:26px; color:#1F44FF; white-space:nowrap; }
.bar { height:8px; background:#f0eadf; border-radius:99px; margin:10px 0 4px; overflow:hidden; }
.barFill { height:100%; background:#1F44FF; border-radius:99px; }
.barFill.done { background:#FFB323; }
.kr { padding:9px 0 2px; border-top:1px solid #f0eadf; margin-top:9px; }
.krText { font-size:13.5px; line-height:1.35; }
.krMeta { font-size:12px; color:#6b6557; margin-top:2px; display:flex; justify-content:space-between; align-items:center; gap:8px; }
.krBar { height:5px; background:#f0eadf; border-radius:99px; margin-top:6px; overflow:hidden; }
.manualIn { width:64px !important; font-size:14px !important; padding:5px 8px !important; }
.formBlock { border-top:1px dashed #d8d2c6; padding-top:12px; margin-top:12px; }
.formBlock label, .qLabel { display:block; font-size:11px; letter-spacing:1.5px; font-weight:700; color:#6b6557; text-transform:uppercase; margin:10px 0 4px; }

.seg { display:flex; gap:8px; }
.seg button { flex:1; padding:10px; border-radius:10px; border:1.5px solid #c9c3b6; background:#FAF6F0; font-size:15px; cursor:pointer; }
.seg button.on { background:#1F44FF; border-color:#1F44FF; color:#fff; font-weight:700; }
.scale { display:flex; gap:4px; flex-wrap:wrap; }
.scale button { width:38px; height:38px; border-radius:10px; border:1.5px solid #c9c3b6; background:#FAF6F0; font-size:14px; cursor:pointer; }
.scale button.on { background:#1F44FF; border-color:#1F44FF; color:#fff; font-weight:700; }
.qBlock { padding:12px 0; border-bottom:1px solid #f0eadf; }
.qText { font-size:14.5px; margin-bottom:8px; line-height:1.35; }
/* --- Gen Z polish --- */
button { transition: transform .08s ease, background .15s ease; }
button:active { transform: scale(.95); }
.saveBtn:active { transform: scale(.97); }
.stat, .card, .okrCard { transition: transform .08s ease; }
@keyframes popIn { 0%{transform:scale(.9);opacity:.4} 60%{transform:scale(1.04)} 100%{transform:scale(1);opacity:1} }
.hero, .stat { animation: popIn .3s ease both; }
@keyframes sparkPop { 0%{transform:scale(.4) rotate(-20deg);opacity:0} 50%{transform:scale(1.3) rotate(8deg);opacity:1} 100%{transform:scale(1) rotate(0);opacity:1} }
.savedSpark { display:inline-block; animation: sparkPop .5s ease both; }
.mEmoji { margin-right:6px; }

.ring { display:block; }
.ring .ringBg { stroke:#f0eadf; }
.ring .ringFg { stroke:#1F44FF; transition: stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1); }
.ring.done .ringFg { stroke:#FFB323; }
.ring text { font-family:'Koulen',sans-serif; fill:#17150F; }
.streak { display:inline-block; background:#FFF1D6; border:1px solid #ffd98a; color:#17150F;
  border-radius:999px; padding:4px 12px; font-size:13px; font-weight:700; margin-left:8px; vertical-align:middle;
  animation: popIn .3s ease both; }

.verse { background:#fff; border:1px dashed #e0d8c8; border-radius:12px; padding:12px 14px;
  font-size:13.5px; line-height:1.5; color:#4a463d; margin-bottom:14px; font-style:italic; }
.verse b { color:#1F44FF; font-style:normal; }
.trend { display:inline-block; font-size:12px; font-weight:700; padding:1px 7px; border-radius:6px; white-space:nowrap; margin-left:6px; vertical-align:middle; }
.trend.up { color:#0a7d3c; background:#e3f6ea; }
.trend.down { color:#b3261e; background:#fbe6e6; }
.trend.flat { color:#6b6557; background:#efeae0; }
.newTot { font-weight:700; color:#1F44FF; }
input[data-carried] { color:#6b6557; background:#F5F0E6; }
.heroTrend { margin-top:6px; font-size:13px; color:#c9c3b6; }
.statTrend { display:block; margin-top:4px; }

.drillable { cursor:pointer; }
.ddOverlay { position:fixed; inset:0; background:rgba(23,21,15,.55); z-index:50; display:flex; align-items:flex-end; justify-content:center; }
.ddModal { background:#FAF6F0; border-radius:16px 16px 0 0; max-width:640px; width:100%; max-height:78vh; overflow-y:auto; padding:16px; animation:ddUp .18s ease both; }
@keyframes ddUp { 0%{transform:translateY(24px);opacity:0} 100%{transform:translateY(0);opacity:1} }
.ddHead { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:6px; position:sticky; top:0; background:#FAF6F0; padding-bottom:10px; border-bottom:1px solid #e4ddd0; }
.ddHead h3 { font-family:'Koulen',sans-serif; font-size:18px; letter-spacing:.5px; margin:0; }
.ddSub { font-size:12px; color:#6b6557; margin-top:10px; }
.ddClose { background:transparent; border:none; font-size:20px; cursor:pointer; color:#6b6557; padding:4px 8px; line-height:1; }
.ddRow { padding:10px 0; border-bottom:1px solid #f0eadf; }
.ddRowHead { display:flex; justify-content:space-between; gap:10px; font-size:14px; }
.ddRowVal { font-family:'Koulen',sans-serif; color:#1F44FF; white-space:nowrap; }
.ddWeeks { font-size:12px; color:#6b6557; margin-top:4px; line-height:1.5; }

</style>
</head>

<script>
/*  Error boundary — must come first, before any other script.

    The page depends on taxonomy.js loading; if that request fails (flaky
    connection, cache miss) the app's globals are missing and everything after
    it dies, which used to mean a silent blank screen with no way out. Show
    something honest and recoverable instead.  */
(function(){
  var shown = false;
  function fallback(what){
    if(shown) return; shown = true;
    // Latch it so a later render() can't paint over the message.
    window.gpDead = true;
    var html =
      '<div style="max-width:420px;margin:14vh auto;padding:0 22px;text-align:center;'+
      'font-family:system-ui,sans-serif;color:#17150F">'+
      '<div style="font-size:40px;line-height:1">✦</div>'+
      '<h2 style="font-size:19px;margin:14px 0 8px">This didn’t load properly</h2>'+
      '<p style="font-size:14.5px;line-height:1.5;color:#6b6557;margin:0 0 18px">'+
      'Usually a connection hiccup. Your data is safe — nothing was lost.</p>'+
      '<button id="gpReload" style="width:100%;padding:14px;border:0;border-radius:12px;'+
      'background:#1F44FF;color:#fff;font-size:16px;font-weight:700;cursor:pointer">Try again</button>'+
      '<div style="font-size:11px;color:#a09a8c;margin-top:20px">'+String(what||'').slice(0,140)+'</div>'+
      '</div>';
    function paint(){
      var host = document.getElementById('main') || document.body;
      if(!host) return;
      host.innerHTML = html;
      var r = document.getElementById('gpReload');
      if(r) r.onclick = function(){ location.reload(); };
    }
    if(document.body) paint();
    else document.addEventListener('DOMContentLoaded', paint);
  }
  window.addEventListener('error', function(e){
    // A failed <script src> fires an error event on the element itself.
    if(e && e.target && e.target.tagName === 'SCRIPT'){ fallback('could not load ' + (e.target.src||'a script')); return; }
    if(e && e.message) fallback(e.message);
  }, true);
  window.addEventListener('unhandledrejection', function(e){
    fallback((e && e.reason && e.reason.message) || 'unexpected error');
  });
  window.gpBootFailed = fallback;
})();
</script>

/* Staff who've logged in get their own page as the app's front door — opening
   the PWA drops them straight into their Teams home instead of the leadership
   dashboard. Tapping "← Dashboard" over there sets gp-skip-teams for the rest
   of the browser session so they don't get bounced back here. Runs before
   anything renders, so there's no flash of the wrong page. */
(function(){
  try {
    if(sessionStorage.getItem('gp-skip-teams')) return;
    var saved = JSON.parse(localStorage.getItem('gp-staff')||'null');
    if(saved && saved.user && saved.pin) window.location.replace('teams.html');

/* count-up animation for big dashboard numbers */
function animateCounts(){
  document.querySelectorAll('[data-count]').forEach(function(el){
    var target = Number(el.getAttribute('data-count'));
    if(isNaN(target)) return;
    var prefix = el.getAttribute('data-prefix')||'';
    var suffix = el.getAttribute('data-suffix')||'';
    var dec = el.getAttribute('data-dec')==='1';
    var start = performance.now(), dur = 700;
    function tick(now){
      var p = Math.min(1,(now-start)/dur);
      var eased = 1-Math.pow(1-p,3);
      var v = target*eased;
      el.textContent = prefix + (dec ? v.toFixed(1) : Math.round(v).toLocaleString()) + suffix;
      if(p<1) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  });
}


function ring(p, size){
  p = Math.max(0, Math.round(p));
  var shown = Math.min(100, p);
  var r = (size-10)/2, c = 2*Math.PI*r, off = c*(1-shown/100);
  var cx = size/2;
  return '<svg class="ring'+(p>=100?' done':'')+'" width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'">'+
    '<circle class="ringBg" cx="'+cx+'" cy="'+cx+'" r="'+r+'" fill="none" stroke-width="6"/>'+
    '<circle class="ringFg" cx="'+cx+'" cy="'+cx+'" r="'+r+'" fill="none" stroke-width="6" stroke-linecap="round" '+
      'stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" transform="rotate(-90 '+cx+' '+cx+')"/>'+
    '<text x="'+cx+'" y="'+(cx+5)+'" text-anchor="middle" font-size="'+(size*0.28)+'">'+p+'%</text></svg>';
}

/* ---------- weeks & dates ---------- */
function mondayOfW1(){
  var y = new Date().getFullYear();
  var jan1 = new Date(y, 0, 1);
  return new Date(y, 0, 1 - ((jan1.getDay() + 6) % 7));
}
function weekRange(w){
  var start = new Date(mondayOfW1().getTime() + (w-1)*7*86400000);
  var end = new Date(start.getTime() + 6*86400000);
  return [start, end];
}
function fmtDate(d){
  var loc = state.lang === 'km' ? 'km-KH' : 'en-US';
  try { return d.toLocaleDateString(loc, { month:'short', day:'numeric' }); }
  catch(e){ return (d.getMonth()+1)+'/'+d.getDate(); }
}
function weekLabel(w){
  var r = weekRange(w);
  return 'W'+w+' · '+fmtDate(r[0])+'–'+fmtDate(r[1])+' · Q'+(qOf(w)+1);
}
function currentWeek(){
  var diff = Math.floor((new Date() - mondayOfW1()) / (7*86400000)) + 1;
  return Math.max(1, Math.min(52, diff));
}

/* ---------- aggregation ---------- */
function aggregate(entries, mode, quarter){
  if(!entries) return null;
  var pairs = [];
  for(var w in entries){
    var wk = Number(w), v = Number(entries[w]);
    if(isNaN(v)) continue;
    if(quarter !== undefined && quarter !== null && qOf(wk) !== quarter) continue;
    pairs.push([wk, v]);
  }
  if(!pairs.length) return null;
  pairs.sort(function(a,b){ return a[0]-b[0]; });
  if(mode==='avg'){ var s=0; pairs.forEach(function(p){s+=p[1];}); return s/pairs.length; }
  if(mode==='latest') return pairs[pairs.length-1][1];
  var tt=0; pairs.forEach(function(p){tt+=p[1];}); return tt;
}

/* Most recent recorded value STRICTLY BEFORE a given week. Used by the log
   form to carry a headcount forward so nobody retypes an unchanged number
   every week. */
function lastBefore(weeks, week){
  if(!weeks) return null;
  var best = null;
  for(var w in weeks){
    var wk = Number(w), v = Number(weeks[w]);
    if(isNaN(v) || wk >= Number(week)) continue;
    if(!best || wk > best.week) best = { week:wk, value:v };
  }
  return best;
}

function fmt(v, metric){
  if(v===null||v===undefined) return '—';
  var money = metric && metric.indexOf('($)')>-1;
  if(metric && (metric.indexOf('(1-10)')>-1)) return v.toFixed(1);
  if(metric && metric.indexOf('(%)')>-1) return Math.round(v)+'%';
  var n = Math.round(v).toLocaleString();
  return money ? '$'+n : n;
}
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;'); }

/* ---------- weekly trend (vs the week before) ---------- */
var LOWER_BETTER = {'Staff Debt ($)':1,'Weekly Expenses ($)':1,'Students Struggling':1};
function pctChange(prev,cur){
  if(prev===null||cur===null||prev===undefined||cur===undefined||isNaN(prev)||isNaN(cur)) return null;
  if(prev===0) return null;
  return Math.round((cur-prev)/Math.abs(prev)*100);
}
function lastTwo(valFn, maxW){
  maxW = maxW || currentWeek();
  var arr=[];
  for(var w=1; w<=maxW; w++){ var v=valFn(w); if(v!==null && v!==undefined && !isNaN(v)) arr.push(v); }
  if(arr.length<2) return null;
  return [arr[arr.length-2], arr[arr.length-1]];
}
function trendBadge(pct, higherBetter){
  if(pct===null||pct===undefined) return '';
  if(pct===0) return '<span class="trend flat">— 0%</span>';
  var up = pct>0, good = up ? higherBetter : !higherBetter;
  return '<span class="trend '+(good?'up':'down')+'">'+(up?'▲':'▼')+' '+Math.abs(pct)+'%</span>';
}
function trendB(valFn, higherBetter, maxW){
  var lt=lastTwo(valFn, maxW); if(!lt) return '';
  return trendBadge(pctChange(lt[0],lt[1]), higherBetter!==false);
}
function trendFor(valFn, metric, maxW){
  return trendB(valFn, (metric && LOWER_BETTER[metric]) ? false : true, maxW);
}
function metricWeekSum(ids, metric, w){
  var total=0, any=false;
  ids.forEach(function(cid){
    var entries = state.data.entries[cid]||{};
    for(var k in entries){ var parts=k.split('|'); if(parts[0]===BL_DEPT) continue;
      if(parts[2]===metric){ var v=entries[k][w]; if(v!==undefined && v!==null && !isNaN(Number(v))){ total+=Number(v); any=true; } } }
  });
  return any ? total : null;
}

function headlineFor(ids, metric, quarter){
  var total=0, any=false;
  ids.forEach(function(cid){
    var entries = state.data.entries[cid]||{};
    for(var k in entries){
      var parts = k.split('|');
      if(parts[0]===BL_DEPT) continue;
      if(parts[2]===metric){
        var v = aggregate(entries[k],'sum',quarter);
        if(v!==null){ total+=v; any=true; }
      }
    }
  });
  return any ? total : null;
}

/* Community Service Hours × Volunteers Mobilized, per week, summed */
function volunteerHours(ids, quarter){
  var total=0, any=false;
  ids.forEach(function(cid){
    var entries = state.data.entries[cid]||{};
    for(var k in entries){
      var parts = k.split('|');
      if(parts[0]===BL_DEPT || parts[2]!=='Community Service Hours') continue;
      var hours = entries[k];
      var vols = entries[parts[0]+'|'+parts[1]+'|Volunteers Mobilized'] || {};
      for(var w in hours){
        if(quarter!==undefined && quarter!==null && qOf(Number(w))!==quarter) continue;
        var hv = Number(hours[w]); if(isNaN(hv)) continue;
        var vv = Number(vols[w]); if(isNaN(vv) || vv<=0) vv = 1;
        total += hv*vv; any=true;
      }
    }
  });
  return any ? total : null;
}

function salvByDept(ids){
  var out={ 'Community Service':null, 'Youth Education':null, 'Leadership Development':null, 'Skills Training':null };

    for(var k in entries){
      var parts = k.split('|');
      if(parts[0]===BL_DEPT || out[parts[0]]===undefined) continue;
      if(parts[2]==='Salvations'){
        var v = aggregate(entries[k],'sum');
        if(v!==null) out[parts[0]] = (out[parts[0]]||0)+v;
      }
    }
  });
  return out;
}

function blAgg(campus, metric){
  var mode = modeOf(metric), vals=[];
  Object.keys(getDepartments(campus)[BL_DEPT]).forEach(function(min){
    var e = (state.data.entries[campus]||{})[BL_DEPT+'|'+min+'|'+metric];
    var v = aggregate(e, mode);
    if(v!==null) vals.push(v);
  });
  if(!vals.length) return null;
  var tt=0; vals.forEach(function(v){tt+=v;});
  return mode==='avg' ? tt/vals.length : tt;

/* Media roll-up across campuses */
function mediaSummary(ids){
  var pages=0, followers=0, views=0, platCount=0, any=false;
  PLATFORMS.forEach(function(p){
    var pPages=0, pAny=false;
    ids.forEach(function(cid){
      var e = state.data.entries[cid]||{};
      var pg = aggregate(e['Youth Education|GP Media|'+p+' Pages'],'latest');
      var fl = aggregate(e['Youth Education|GP Media|'+p+' Followers'],'latest');
      var vw = aggregate(e['Youth Education|GP Media|'+p+' Views'],'sum');
      if(pg!==null){ pPages+=pg; pAny=true; }
      if(fl!==null){ followers+=fl; any=true; }
      if(vw!==null){ views+=vw; any=true; }
    });
    if(pAny && pPages>0){ platCount++; pages+=pPages; any=true; }
  });
  return any ? { platforms:platCount, pages:pages, followers:followers, views:views } : null;
}

function pct(rows, id){
  var v = rows.filter(function(r){ return r[id]!==null && r[id]!==undefined; });
  if(!v.length) return null;
  var y=0; v.forEach(function(r){ if(r[id]) y++; });
  return Math.round(y/v.length*100);
}
function avg(rows, id){
  var v = rows.filter(function(r){ return r[id]!==null && r[id]!==undefined; });
  if(!v.length) return null;
  var s=0; v.forEach(function(r){ s+=Number(r[id])||0; });
  return s/v.length;
}
function compositeOf(r){
  var parts = [ 10-(Number(r.lonely)||0), Number(r.clarity)||0,
    r.porn?0:10, r.oneOnOne?10:0, r.exercise?10:0, r.quietTime?10:0, r.debt?0:10 ];
  if(r.growth!==null && r.growth!==undefined) parts.push(Number(r.growth)||0);
  if(r.sharedFaith!==null && r.sharedFaith!==undefined) parts.push(r.sharedFaith?10:0);
  if(r.sabbath!==null && r.sabbath!==undefined) parts.push(r.sabbath?10:0);
  var s=0; parts.forEach(function(p){s+=p;});
  return s/parts.length;
}
function healthScore(ids, week){
  var rows = surveyRows(ids, week);
  if(!rows.length) return null;
  var s=0; rows.forEach(function(r){ s+=compositeOf(r); });
  return s/rows.length;
}

  return '<div class="loadingBox">'+
    '<div class="loadCoin"><img class="loadLogo" src="'+GP_LOGO+'" alt=""></div>'+

function render(){
  if(window.gpDead) return;   // an error message is on screen; leave it there
  renderCampusRow(); renderNav();
  document.getElementById('langBtn').textContent = state.lang==='km' ? 'EN' : 'ខ្មែរ';
  document.getElementById('lockBtn').textContent = state.data.leader ? '🔓' : '🔒';
  document.getElementById('refreshBtn').textContent = '\u21bb';
  renderUserChip();
  document.getElementById('footerLine').textContent = '✦ '+t('Every number is a person. The goal is people knowing Jesus.');
  var m = document.getElementById('main');
  if(!state.loaded){ m.innerHTML = loadingHtml(); return; }
  if(state.view==='all') m.innerHTML = dashboardHtml(t('All Campuses — Combined Impact'), CAMPUSES.map(function(c){return c.id;}), true);
  else if(state.view==='dashboard') m.innerHTML = dashboardHtml(t(campusName()), [state.campus], false);
  else if(state.view==='log') m.innerHTML = logHtml();
  else if(state.view==='okr') m.innerHTML = okrHtml();
  else m.innerHTML = healthHtml();
  bindEvents();
  animateCounts();
}

function campusName(){ for(var i=0;i<CAMPUSES.length;i++) if(CAMPUSES[i].id===state.campus) return CAMPUSES[i].name; }

function renderCampusRow(){
  var h='';
  CAMPUSES.forEach(function(c){
    h += '<button class="cbtn'+(state.campus===c.id&&state.view!=='all'?' on':'')+'" data-campus="'+c.id+'">'+esc(t(c.short))+'</button>';
  });
  h += '<button class="cbtn all'+(state.view==='all'?' on':'')+'" data-all="1">✦ '+esc(t('All Campuses — Combined Impact').split(' — ')[0])+'</button>';
  document.getElementById('campusRow').innerHTML = h;
}

function renderNav(){
  var n = document.getElementById('nav');
  if(state.view==='all'){ n.innerHTML=''; return; }
  var tabs=[['dashboard','Dashboard','\ud83d\udcca'],['log','Log Numbers','\u270f\ufe0f'],['okr','OKRs','\ud83c\udfaf'],['health','Health','\ud83d\udc9a']];
  n.innerHTML = tabs.map(function(tb){
    return '<button class="'+(state.view===tb[0]?'on':'')+'" data-view="'+tb[0]+'">'+tb[2]+' '+esc(t(tb[1]))+'</button>';
  }).join('');
}

/* ---------- drill-down: click a total to see what it's made of ---------- */
function campusShort_(id){ for(var i=0;i<CAMPUSES.length;i++) if(CAMPUSES[i].id===id) return CAMPUSES[i].short; return id; }

function drillDownRows(filterFn){
  var rows = [];
  Object.keys(state.data.entries).forEach(function(campus){
    var entries = state.data.entries[campus];
    Object.keys(entries).forEach(function(key){
      var parts = key.split('|');
      var dept = parts[0], ministry = parts[1], metric = parts[2];
      if(!filterFn(campus, dept, ministry, metric)) return;
      var weeks = entries[key];
      var total = aggregate(weeks, modeOf(metric));
      if(total===null) return;
      rows.push({ campus:campus, dept:dept, ministry:ministry, metric:metric, weeks:weeks, total:total });
    });
  });
  return rows;
}

function openDrillDown(title, rows){
  rows = rows.slice().sort(function(a,b){ return b.total-a.total; });
  var h = '<div class="ddOverlay" id="ddOverlay"><div class="ddModal">'+
    '<div class="ddHead"><h3>'+esc(title)+'</h3><button class="ddClose" id="ddClose">✕</button></div>';
  if(!rows.length){
    h += '<p class="ddSub">Nothing logged for this yet.</p>';
  } else {
    rows.forEach(function(r){
      var weeksList = Object.keys(r.weeks).map(Number).sort(function(a,b){ return a-b; });
      h += '<div class="ddRow"><div class="ddRowHead"><span>'+esc(t(campusShort_(r.campus)))+' · '+emj(r.dept)+esc(t(r.dept))+' · '+esc(t(r.ministry))+'</span><span class="ddRowVal">'+fmt(r.total, r.metric)+'</span></div>'+
        '<div class="ddWeeks">'+weeksList.map(function(w){ return 'W'+w+': '+fmt(r.weeks[w], r.metric); }).join(' · ')+'</div></div>';
    });
  }
  h += '</div></div>';
  document.getElementById('ddRoot').innerHTML = h;
  document.getElementById('ddClose').onclick = closeDrillDown;
  document.getElementById('ddOverlay').onclick = function(e){ if(e.target.id==='ddOverlay') closeDrillDown(); };
}
function closeDrillDown(){ var r=document.getElementById('ddRoot'); if(r) r.innerHTML=''; }

function dashboardHtml(title, ids, perCampus){
  var salv = headlineFor(ids,'Salvations');
  var h = '<h2>'+esc(title)+'</h2>';
  h += '<div class="hero"><div class="heroLabel">'+esc(t('SALVATIONS — YTD'))+'</div>';
  var salvTrend = trendFor(function(w){return metricWeekSum(ids,'Salvations',w);}, 'Salvations');
  h += '<div class="heroNum drillable" data-drill-metric="Salvations" data-drill-ids="'+ids.join(',')+'"'+(salv===null?'':' data-count="'+salv+'"')+'>'+(salv===null?'—':'0')+'</div>';
  if(salvTrend) h += '<div class="heroTrend">'+salvTrend+' vs last week</div>';
  h += '<div class="heroQ">';
  for(var q=0;q<4;q++) h += '<span class="drillable" data-drill-metric="Salvations" data-drill-ids="'+ids.join(',')+'" data-drill-quarter="'+q+'">Q'+(q+1)+' <b>'+fmt(headlineFor(ids,'Salvations',q))+'</b></span>';
  h += '</div></div>';
  h += verseOfWeek();

  var hs = healthScore(ids);
  h += '<div class="grid">';
  var hsTrend = trendFor(function(w){return healthScore(ids,w);}, null);
  h += '<div class="stat gold"><div class="statNum"'+(hs===null?'':' data-count="'+hs+'" data-dec="1" data-suffix="/10"')+'>'+(hs===null?'—':'0')+'</div><div class="statLabel">'+esc(t('Staff Health Score'))+(hsTrend?'<span class="statTrend">'+hsTrend+'</span>':'')+'</div></div>';
  var vh = volunteerHours(ids);
  h += '<div class="stat"><div class="statNum"'+(vh===null?'':' data-count="'+vh+'"')+'>'+(vh===null?'—':'0')+'</div><div class="statLabel">'+esc(t('Total Volunteer Hours'))+'</div></div>';
  var cr = checkinRate(ids, currentWeek());
  h += '<div class="stat"><div class="statNum">'+cr.n+(cr.total?' / '+cr.total:'')+'</div><div class="statLabel">'+esc(t('Checked in this week'))+(cr.total&&cr.total>0?' · '+Math.round(cr.n/cr.total*100)+'%':'')+'</div></div>';
  HEADLINE.forEach(function(m){
    if(m==='Salvations') return;
    var hv = headlineFor(ids,m);
    var tr = trendFor(function(w){return metricWeekSum(ids,m,w);}, m);
    h += '<div class="stat drillable" data-drill-metric="'+esc(m)+'" data-drill-ids="'+ids.join(',')+'"><div class="statNum"'+(hv===null?'':' data-count="'+hv+'"')+'>'+(hv===null?'—':'0')+'</div><div class="statLabel">'+esc(t(m))+(tr?'<span class="statTrend">'+tr+'</span>':'')+'</div></div>';
  });
  h += '</div>';

  var ms = mediaSummary(ids);
  h += '<h3>\ud83d\udcf1 '+esc(t('Media reach'))+'</h3><div class="grid">';
  h += '<div class="stat"><div class="statNum">'+(ms?ms.platforms:'—')+'</div><div class="statLabel">'+esc(t('Platforms'))+'</div></div>';
  h += '<div class="stat"><div class="statNum">'+(ms?ms.pages.toLocaleString():'—')+'</div><div class="statLabel">'+esc(t('Total Pages'))+'</div></div>';
  h += '<div class="stat"><div class="statNum">'+(ms?ms.followers.toLocaleString():'—')+'</div><div class="statLabel">'+esc(t('Total Followers'))+'</div></div>';
  h += '<div class="stat"><div class="statNum">'+(ms?ms.views.toLocaleString():'—')+'</div><div class="statLabel">'+esc(t('Views YTD'))+'</div></div>';
  h += '</div>';

  h += '<h3>\ud83d\ude4c '+esc(t('Salvations by department'))+'</h3><div class="card">';
  var bd = salvByDept(ids);
  Object.keys(bd).forEach(function(d){
    h += '<div class="row drillable" data-drill-metric="Salvations" data-drill-ids="'+ids.join(',')+'" data-drill-dept="'+esc(d)+'"><span class="rowName">'+emj(d)+esc(t(d))+'</span><span class="rowVal">'+fmt(bd[d])+'</span></div>';
  });
  h += '</div>';

  if(perCampus){
    h += '<h3>\ud83c\udfeb '+esc(t('By campus'))+'</h3><div class="card">';
    CAMPUSES.forEach(function(c){
      var chs = healthScore([c.id]);
      h += '<div class="row"><span class="rowName">'+esc(t(c.name))+'</span><span class="rowVal">'+
        fmt(headlineFor([c.id],'Salvations'))+' '+esc(t('salvations'))+' · '+fmt(headlineFor([c.id],'People Served'))+' '+esc(t('served'))+
        ' · '+(chs===null?'—':chs.toFixed(1))+'/10 '+esc(t('staff health'))+'</span></div>';
    });
    h += '</div>';
  } else {
    h += '<h3>\ud83c\udfe0 '+esc(t('Base health'))+'</h3><div class="grid">';
    var blShow = ['Total Staff','Staff Debt ($)','One-on-Ones Held','Partner Connections',
      'Spoke at Churches','Spoke at YWAM Bases','Hours Sharing the Gospel','Base Vision (1-10)',
      'Communications (1-10)','Partner Relationships (1-10)'];
    blShow.forEach(function(m){
      var val = (m==='Total Staff') ? totalStaff([state.campus]) : blAgg(state.campus,m);
      h += '<div class="stat"><div class="statNum">'+fmt(val,m)+'</div><div class="statLabel">'+
        esc(t(m).replace(' ($)','').replace(' (1-10)',''))+'</div></div>';
    });
    h += '</div>';

    if(state.data.leader){
      h += '<h3>\ud83d\udd10 '+esc(t('Leadership detail'))+'</h3><div class="card">';
      h += '<div class="row"><span class="rowName">'+esc(t('Base Finances ($)').replace(' ($)',''))+'</span><span class="rowVal">'+

        fmt(blAgg(state.campus,'Funds Raised ($)'),'Funds Raised ($)')+'</span></div>';
      var finKeys = [['Skills Training|Finances|Finances Consolidated ($)','Finances Consolidated ($)'],
                     ['Skills Training|Finances|Base Cash Reserve ($)','Base Cash Reserve ($)']];
      finKeys.forEach(function(fk){
        var v = aggregate((state.data.entries[state.campus]||{})[fk[0]],'latest');

      });

  h += '<label class="pick"><span>'+esc(t(state.dept===BL_DEPT?'Oversees':'Ministry'))+'</span><select id="minSel">'+
    Object.keys(deps[state.dept]).map(function(m){ return '<option value="'+esc(m)+'"'+(state.ministry===m?' selected':'')+'>'+(MIN_EMOJI[m]?MIN_EMOJI[m]+' ':'')+esc(t(m))+'</option>'; }).join('')+'</select></label>';
  h += '<label class="pick"><span>'+esc(t('Week'))+'</span><select id="weekSel">'+weekOptions(state.week)+'</select></label>';
  h += '</div><div class="card" id="logCard">';
  var entries = state.data.entries[state.campus]||{};
  if(state.dept===BL_DEPT && state.ministry==='Campus Leadership'){
    var hsNow = healthScore([state.campus]);
    h += '<div class="row"><div><div class="rowName">'+esc(t('Staff Health Score (from survey)'))+'</div>'+
      '<div class="rowSub">'+esc(t('auto from KPI'))+'</div></div><span class="rowVal">'+(hsNow===null?'—':hsNow.toFixed(1)+'/10')+'</span></div>';
  }
  visibleMetrics(deps[state.dept][state.ministry]).forEach(function(metric){
    var key = state.dept+'|'+state.ministry+'|'+metric;
    var mode = modeOf(metric);
    var wks = entries[key] || {};
    var agg = aggregate(wks, mode);
    var cur = wks[state.week]!==undefined ? wks[state.week] : '';
    var sub, extra = '';
    if(mode==='latest'){
      // Headcounts (students enrolled, staff, schools…) rarely change week to
      // week, so carry the last figure forward already filled in instead of
      // making someone retype it. Still editable, so real growth or decline
      // still registers — and the ▲/▼ badge shows the change.
      var prev = lastBefore(wks, state.week);
      var isCarried = (cur==='' && prev!==null);
      if(isCarried){ cur = prev.value; extra = ' data-carried="1"'; }
      sub = esc(t('now'))+' '+fmt(agg,metric);
      if(prev!==null){
        sub += ' · ' + (isCarried
          ? esc(t('carried from week'))+' '+prev.week
          : esc(t('week'))+' '+prev.week+': '+fmt(prev.value,metric));
        var d = Number(cur)-prev.value;
        if(d) sub += '<span class="trend '+(d>0?'up':'down')+'">'+(d>0?'▲':'▼')+' '+fmt(Math.abs(d),metric)+'</span>';
      }
    } else if(mode==='avg'){
      sub = esc(t('avg'))+' '+fmt(agg,metric);
    } else {
      // Running totals: this box is the week's ADDITION, not the new total.
      // Spelling that out stops people entering "105" when they mean "+5".
      sub = esc(t('total so far'))+' '+fmt(agg,metric)+'<span class="newTot"></span>';
      extra = ' data-run="'+(agg===null?0:agg)+'"';
    }
    h += '<div class="row"><div><div class="rowName">'+esc(t(metric))+'</div><div class="rowSub">'+sub+'</div></div>'+
      '<input type="number" inputmode="decimal" placeholder="'+(mode==='sum'?'+0':'0')+'" data-metric="'+esc(metric)+'" data-mode="'+mode+'" value="'+cur+'"'+extra+'></div>';
  });
  h += '<button class="saveBtn" id="saveBtn">'+esc(t('Save Week'))+' '+state.week+'</button></div>';
  h += '<p class="note">'+esc(t('Entries save to the shared GP Impact Data sheet — every leader sees the same live numbers.'))+'</p>';
  return h;
}

/* ---------- OKR ---------- */
function objProgress(o){
  var pcts = o.krs.map(function(kr){ return krProgress(o, kr).pct; }).filter(function(p){ return p!==null; });
  if(!pcts.length) return 0;
  var s=0; pcts.forEach(function(p){s+=p;});
  return Math.round(s/pcts.length);
}

function krProgress(o, kr){
  if(kr.metricKey){
    var parts = kr.metricKey.split('|');
    var mode = modeOf(parts[2]);
    var actual = aggregate((state.data.entries[o.campus]||{})[kr.metricKey], mode, Number(o.quarter)-1);
    if(actual===null) return { pct:0, actual:null };
    var p = kr.target>0 ? Math.round(actual/kr.target*100) : 0;
    return { pct:Math.max(0,p), actual:actual };
  }
  return { pct:Math.max(0,Math.min(100,Number(kr.manual)||0)), actual:null };
}

}

function deviceId(){
  var id = localStorage.getItem('gp-device');
  if(!id){ id = 'd'+Math.random().toString(36).slice(2)+Date.now().toString(36); localStorage.setItem('gp-device', id); }
  return id;
}
function hasSubmitted(campus, week){
  var id = deviceId();
  return state.data.survey.some(function(r){ return r.campus===campus && Number(r.week)===Number(week) && r.device===id; });
}

/* ---------- events & server ---------- */
function apiCall(fn, args){
  return fetch('/.netlify/functions/api', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ fn: fn, args: args || [] })
  }).then(function(res){
    if(!res.ok) throw new Error('HTTP '+res.status);
    return res.json();
  });
}

function toggleLeader(){
  if(state.data.leader){
    state.leaderCode=''; localStorage.removeItem('gp-leadercode');
    fetchData(); return;
  }
  var code = prompt(t('Enter leadership code'));
  if(!code) return;
  apiCall('getData', [code]).then(function(d){
    if(d.leader){
      state.leaderCode = code; localStorage.setItem('gp-leadercode', code);
      state.data = d; render();
    } else {
      showError(t('Wrong code'));
    }
  }).catch(function(){ showError(t('Wrong code')); });
}

function bindEvents(){
  document.getElementById('langBtn').onclick = toggleLang;
  document.getElementById('refreshBtn').onclick = function(){ this.textContent='…'; fetchData(); };
  document.getElementById('lockBtn').onclick = toggleLeader;
  document.querySelectorAll('[data-campus]').forEach(function(b){
    b.onclick = function(){ state.campus=b.getAttribute('data-campus'); state.surveyDraft={}; if(state.view==='all') state.view='dashboard'; render(); };
  });
  var all = document.querySelector('[data-all]');
  if(all) all.onclick = function(){ state.view='all'; render(); };
  document.querySelectorAll('[data-view]').forEach(function(b){
    b.onclick = function(){ state.view=b.getAttribute('data-view'); render(); };
  });
  document.querySelectorAll('[data-drill-metric]').forEach(function(el){
    el.onclick = function(){
      var metric = el.getAttribute('data-drill-metric');
      var ids = el.getAttribute('data-drill-ids').split(',');
      var dept = el.getAttribute('data-drill-dept');
      var ministry = el.getAttribute('data-drill-ministry');
      var qAttr = el.getAttribute('data-drill-quarter');
      var quarter = (qAttr===null || qAttr==='') ? null : Number(qAttr);
      var rows = drillDownRows(function(campus, d, min, met){
        if(ids.indexOf(campus)===-1 || met!==metric) return false;
        if(dept && d!==dept) return false;
        if(ministry && min!==ministry) return false;
        if(!dept && d===BL_DEPT) return false; // matches how the totals above are computed
        return true;
      });
      if(quarter!==null){
        rows = rows.map(function(r){
          var w={};
          Object.keys(r.weeks).forEach(function(wk){ if(qOf(Number(wk))===quarter) w[wk]=r.weeks[wk]; });
          var total = aggregate(w, modeOf(r.metric));
          return total===null ? null : { campus:r.campus, dept:r.dept, ministry:r.ministry, metric:r.metric, weeks:w, total:total };
        }).filter(Boolean);
      }
      var title = t(metric) + (dept ? ' · '+t(ministry||dept) : '') + (quarter!==null ? ' · Q'+(quarter+1) : '');
      openDrillDown(title, rows);
    };
  });
  var ds=document.getElementById('deptSel');
  if(ds) ds.onchange=function(){ state.dept=ds.value; state.ministry=Object.keys(getDepartments(state.campus)[state.dept])[0]; render(); };
  var ms=document.getElementById('minSel');
  if(ms) ms.onchange=function(){ state.ministry=ms.value; render(); };
  var ws=document.getElementById('weekSel');
  if(ws) ws.onchange=function(){ state.week=Number(ws.value); render(); };
  var sb=document.getElementById('saveBtn');
  if(sb) sb.onclick=function(){ saveCard(sb); };
  // Running-total metrics: show what the total becomes as you type the week's
  // addition, so "+5" on top of 100 visibly reads as 105.
  document.querySelectorAll('#logCard input[data-mode="sum"]').forEach(function(inp){
    inp.oninput=function(){
      var row = inp.parentNode;
      var out = row.querySelector('.newTot');
      if(!out) return;
      var add = Number(inp.value);
      if(inp.value==='' || isNaN(add) || add===0){ out.textContent=''; return; }
      var base = Number(inp.getAttribute('data-run'))||0;
      out.textContent = ' → '+fmt(base+add, inp.getAttribute('data-metric'));
    };
  });

  var dds=document.getElementById('dashDeptSel');
  if(dds) dds.onchange=function(){ state.dashDept=dds.value; render(); };
  var qs=document.getElementById('okrQSel');
  if(qs) qs.onchange=function(){ state.okrQuarter=Number(qs.value); render(); };
  var ob=document.getElementById('openOkrBtn');
  if(ob) ob.onclick=function(){ state.okrFormOpen=true; state.editingId=null; render(); };
  var cb=document.getElementById('cancelOkrBtn');
  if(cb) cb.onclick=function(){ state.okrFormOpen=false; state.editingId=null; render(); };
  var sob=document.getElementById('saveOkrBtn');
  if(sob) sob.onclick=function(){ saveOkrForm(sob); };
  document.querySelectorAll('[data-edit]').forEach(function(b){
    b.onclick=function(){ state.editingId=b.getAttribute('data-edit'); state.okrFormOpen=true; render(); };
  });
  document.querySelectorAll('[data-del]').forEach(function(b){
    b.onclick=function(){
      if(!confirm(t('Delete')+'?')) return;
      serverCall('deleteObjective', [b.getAttribute('data-del'), state.leaderCode]);
    };
  });
  document.querySelectorAll('[data-manual]').forEach(function(inp){
    inp.onchange=function(){
      var parts = inp.getAttribute('data-manual').split('|');
      var okr=null; state.data.okrs.forEach(function(o){ if(o.id===parts[0]) okr=o; });
      if(!okr) return;
      okr.krs[Number(parts[1])].manual = Number(inp.value)||0;
      serverCall('saveObjective', [okr, state.leaderCode]);
    };
  });

  var svw=document.getElementById('svWeekSel');
  if(svw) svw.onchange=function(){ state.surveyWeek=Number(svw.value); state.surveyDraft={}; render(); };
  document.querySelectorAll('[data-scale]').forEach(function(b){
    b.onclick=function(){
      var p=b.getAttribute('data-scale').split('|');
      state.surveyDraft[p[0]]=Number(p[1]); render();
    };
  });
  document.querySelectorAll('[data-yn]').forEach(function(b){
    b.onclick=function(){
      var p=b.getAttribute('data-yn').split('|');
      state.surveyDraft[p[0]]=Number(p[1]); render();
    };
  });
  document.querySelectorAll('[data-num]').forEach(function(inp){
    inp.onchange=function(){ state.surveyDraft[inp.getAttribute('data-num')] = inp.value===''?undefined:Number(inp.value); };
  });
  var svs=document.getElementById('svSubmit');
  if(svs) svs.onclick=function(){ submitSurvey(svs); };
}

function serverCall(fn, args){
  hideError();
  apiCall(fn, args).then(function(d){ state.data=d; render(); })
    .catch(function(){ showError("Couldn't save. Check your connection and try again."); });
}

function saveCard(btn){
  var updates=[];
  document.querySelectorAll('#logCard input[data-metric]').forEach(function(inp){
    updates.push({ dept:state.dept, ministry:state.ministry, metric:inp.getAttribute('data-metric'),
      week:state.week, value: inp.value==='' ? null : Number(inp.value) });
  });
  btn.disabled=true; btn.textContent=t('Saving…'); hideError();
  apiCall('saveEntries', [state.campus, updates, state.leaderCode]).then(function(d){
    state.data = d; btn.innerHTML='<span class="savedSpark">✦</span> '+t('Saved');
    setTimeout(function(){ render(); }, 900);
  }).catch(function(){
    btn.disabled=false; btn.textContent=t('Save Week')+' '+state.week;
    showError("Couldn't save. Check your connection and press Save again.");
  });
}

function saveOkrForm(btn){
  var text = document.getElementById('objText').value.trim();
  if(!text){ showError(t('Objective')+'?'); return; }
  var krs=[];
  for(var k=0;k<3;k++){
    var tx = document.getElementById('krText'+k).value.trim();
    if(!tx) continue;
    krs.push({ text:tx, metricKey:document.getElementById('krMetric'+k).value,
      target:Number(document.getElementById('krTarget'+k).value)||0, manual:0 });
  }
  if(!krs.length){ showError(t('Key result')+'?'); return; }
  if(state.editingId){
    state.data.okrs.forEach(function(o){
      if(o.id===state.editingId){
        krs.forEach(function(nk){
          o.krs.forEach(function(ok){ if(ok.text===nk.text && !nk.metricKey && !ok.metricKey) nk.manual=ok.manual; });
        });
      }
    });
  }
  var obj = { id: state.editingId || ('o'+Date.now()), campus: state.campus, quarter: state.okrQuarter,
    dept: document.getElementById('objDept').value, objective: text, krs: krs };
  btn.disabled=true; btn.textContent=t('Saving…');
  apiCall('saveObjective', [obj, state.leaderCode]).then(function(d){
    state.data=d; state.okrFormOpen=false; state.editingId=null; render();
  }).catch(function(){
    btn.disabled=false; btn.textContent=t('Add objective');
    showError("Couldn't save. Check your connection and try again.");
  });
}

function submitSurvey(btn){
  var d = state.surveyDraft;
  var missing = SCALE_QS.some(function(q){ return d[q.id]===undefined; }) ||
                YESNO_QS.some(function(q){ return d[q.id]===undefined; });
  if(missing){ showError(t('My check-in')+': '+t('Yes')+'/'+t('No')+' + 1–10'); return; }
  var payload = { campus: state.campus, week: state.surveyWeek, device: deviceId(),
    lonely: d.lonely, clarity: d.clarity, growth: d.growth, porn: d.porn, oneOnOne: d.oneOnOne,
    exercise: d.exercise, quietTime: d.quietTime, debt: d.debt,
    sharedFaith: d.sharedFaith, sabbath: d.sabbath,
    langHours: d.langHours||0, minHours: d.minHours||0 };
  btn.disabled=true; btn.textContent=t('Saving…'); hideError();
  apiCall('saveSurvey', [payload, state.leaderCode]).then(function(d){
    state.data=d; state.surveyDraft={}; render();
  }).catch(function(){
    btn.disabled=false; btn.textContent=t('Submit my check-in');
    showError("Couldn't save. Check your connection and try again.");
  });
}

function showError(msg){ var e=document.getElementById('errorBar'); e.textContent=msg; e.classList.remove('hidden'); }
function hideError(){ document.getElementById('errorBar').classList.add('hidden'); }

function loadRoster(){
  apiCall('teamRoster', []).then(function(r){ state.roster=Array.isArray(r)?r:[]; render(); })
    .catch(function(){});
}
function fetchData(){
  loadRoster();
  // Returns the promise so pull-to-refresh knows when to stop spinning.
  return apiCall('getData', [state.leaderCode]).then(function(d){
    state.data=d; state.loaded=true;
    if(state.lang==='km'){
      var cached = localStorage.getItem('gp-km-v2');
      if(cached) state.km = JSON.parse(cached); else state.lang='en';
    }
    render();
  }).catch(function(){ showError("Couldn't load data. Pull down to refresh."); });
}

/* The dashboard is the public face of the app — anyone can read it without an
   account. The chip in the top right is the one place that changes: it's your
   face and a door to your own page if you're signed in, and an invitation to
   sign in if you're not. */
function renderUserChip(){
  var chip=document.getElementById('userChip');
  if(!chip) return;
  var card=null, session=null;
  try {
    session = JSON.parse(localStorage.getItem('gp-staff')||'null');
    card = JSON.parse(localStorage.getItem('gp-staff-card')||'null');
  } catch(e){}
  var signedIn = !!(session && session.user);

  if(!signedIn){
    chip.className='userChip guest';
    chip.innerHTML='<span aria-hidden="true">✦</span> '+esc(t('Sign in'));
    chip.setAttribute('aria-label', t('Sign in to your staff page'));
  } else {
    var name=(card&&card.name)||session.user;
    var first=String(name).trim().split(/\s+/)[0];
    var av=(card&&card.photo)
      ? '<img class="uAv" src="'+esc(card.photo)+'" alt="">'
      : '<span class="uAv">'+esc(initialsOf(name))+'</span>';
    chip.className='userChip';
    chip.innerHTML=av+'<span class="uName">'+esc(first)+'</span>';
    chip.setAttribute('aria-label', t('Open my page'));
  }
  chip.onclick=function(){
    // Going to my own page means I want to be taken there next time too.
    try { sessionStorage.removeItem('gp-skip-teams'); } catch(e){}
    window.location.href='teams.html';
  };
}
function initialsOf(name){
  return String(name||'?').trim().split(/\s+/).map(function(w){return w[0];})
    .slice(0,2).join('').toUpperCase();
}

(function(){
  renderUserChip();
  var hb=document.getElementById('helpBtn');
  if(hb) hb.onclick=function(){ window.location.href='help.html'; };
})();

/* ---------- pull to refresh ----------
   Only engages at the very top of the page, and never while the drill-down
   sheet is open (that panel scrolls on its own). Haptics use the Vibration
   API — Android fires it, iOS Safari doesn't implement it at all, so on
   iPhone this is visual only. */
(function(){
  var ptr = document.getElementById('ptr');
  if(!ptr || !('ontouchstart' in window)) return;
  var logo = document.getElementById('ptrLogo');
  if(logo) logo.src = GP_LOGO;

  var THRESHOLD = 68;   // pull needed to arm a refresh
  var MAX = 108;        // furthest the coin travels
  var RESIST = 0.55;    // <1 so the pull feels weighted
  var startY = null, pull = 0, armed = false, busy = false;

  function coin(){ return logo || ptr.querySelector('img'); }
  function buzz(pattern){
    if(!navigator.vibrate) return;
    try { navigator.vibrate(pattern); } catch(e){}
  }
  function setPull(px){
    pull = px;
    ptr.style.transform = 'translateY('+(Math.min(px, MAX) - 60)+'px)';
    ptr.style.opacity = Math.min(1, px / THRESHOLD);
    var c = coin();
    if(c) c.style.transform = 'rotate('+Math.round(px * 3)+'deg)';
  }
  function reset(){
    ptr.classList.remove('dragging');
    ptr.style.transform = ''; ptr.style.opacity = '';
    var c = coin();
    if(c) c.style.transform = '';
    startY = null; pull = 0; armed = false;
  }

  document.addEventListener('touchstart', function(e){
    if(busy || e.touches.length !== 1) return;
    if(window.scrollY > 0) return;
    if(document.getElementById('ddOverlay')) return;
    startY = e.touches[0].clientY;
    ptr.classList.add('dragging');
  }, { passive:true });

  document.addEventListener('touchmove', function(e){
    if(startY === null || busy) return;
    var dy = e.touches[0].clientY - startY;
    if(dy <= 0 || window.scrollY > 0){ if(pull) reset(); return; }
    e.preventDefault();            // take over from the native rubber-band
    setPull(dy * RESIST);
    if(!armed && pull >= THRESHOLD){ armed = true; buzz(12); }
    else if(armed && pull < THRESHOLD){ armed = false; }
  }, { passive:false });

  document.addEventListener('touchend', function(){
    if(startY === null || busy) return;
    if(pull < THRESHOLD){ reset(); return; }
    busy = true; startY = null;
    ptr.classList.remove('dragging');
    ptr.classList.add('spinning');
    ptr.style.transform = 'translateY(14px)';
    ptr.style.opacity = '1';
    buzz([8, 40, 12]);
    Promise.resolve(fetchData()).then(function(){
      ptr.classList.remove('spinning');
      busy = false; reset();
    });
  }, { passive:true });

  document.addEventListener('touchcancel', function(){
    if(!busy) reset();
  }, { passive:true });
})();

render(); fetchData();
</script>
