<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>
/* Staff who've logged in get their own page as the app's front door — opening the
   PWA drops them straight into their Teams home instead of the leadership
   dashboard. Tapping "← Dashboard" over there sets gp-skip-teams for the rest of
   the browser session so they don't get bounced back here.

   This has to sit in <head>, above every byte of body markup, and it touches no
   DOM for exactly that reason. It used to run from a script below the header,
   after the blocking <script src> tags — so the browser had already laid out and
   painted the dashboard chrome by the time the redirect fired, and staff saw the
   dashboard flash for ~200ms on every single app open before landing on their own
   page. Nothing above this line paints. */
(function(){
  try {
    if(sessionStorage.getItem('gp-skip-teams')) return;
    var saved = JSON.parse(localStorage.getItem('gp-staff')||'null');
    if(saved && saved.user && saved.pin){
      /* replace() does not stop this document: scripts below keep running until
         the navigation commits. Left alone they would render the dashboard and
         lift the splash off it — the very flash this is here to prevent — and
         fetchData() would spend a Netlify invocation on a page nobody will see,
         once per staff member per app open. gpLeaving stops both. */
      window.gpLeaving = true;
      window.location.replace('teams.html');
    }
  } catch(e){}
})();
</script>

<!-- Fonts load OUT of the render path, on purpose.

     As an @import inside <style> this was render-blocking, and a pending
     stylesheet also blocks script execution — so on a slow or unreachable font
     CDN the app's JavaScript did not run until the request resolved or timed
     out. Measured at 8.1 seconds of dead app on a hanging font request, which
     is exactly the connection this thing is built for.

     media="print" makes the browser fetch it without blocking; onload promotes
     it to all. Text renders immediately in the fallback face and swaps when the
     webfont lands (the URL already carries display=swap). The <noscript> copy
     keeps fonts working if scripts are off. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Koulen&family=Kantumruy+Pro:wght@400;500;700&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Koulen&family=Kantumruy+Pro:wght@400;500;700&display=swap"></noscript>
<script>
/* Apply a saved theme BEFORE anything paints. Same class of problem as the splash:
   read it late and the reader watches the app flash the wrong colours on every
   open. No attribute means "follow the system", which is the default. */
(function(){
  try {
    var t = localStorage.getItem('gp-theme');
    if(t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  } catch(e){}
})();
</script>
<style>
/* ==================== THEME TOKENS ====================
   THIS BLOCK IS DUPLICATED VERBATIM IN index.html, teams.html AND help.html.
   tests/test-theme.mjs asserts the copies are byte-identical — edit one, edit all.

   Three states, which is what a phone actually has:
     no attribute  -> follow the system (prefers-color-scheme)
     data-theme="light" / "dark" -> the reader chose, and their choice wins both ways
   That is why the media query is guarded with :not([data-theme="light"]) — without
   it, a reader who picks light on a dark phone gets ignored.

   Two pairs must never be collapsed into one token, because they diverge between
   themes and a blind find-and-replace inverts them:
     --ink (body text) vs --headerBg (the black header, hero and coin, which stay
       dark in BOTH themes — this is the brand, not the background)
     --surface (cards) vs --onDark (text sitting on that black header)
   The brand marks in logo.js are white and drawn for the black header, so anything
   showing them needs --headerBg behind it in either theme or they vanish. */
:root {
  --bg:#FAF6F0;            /* page */
  --surface:#fff;          /* cards */
  --surface2:#F0EADF;      /* tracks, subtle fills */
  --ink:#17150F;           /* body text */
  --muted:#6B6557;         /* secondary text */
  --faint:#6F6A5A;         /* tertiary text */
  --line:#F0EADF;          /* hairlines */
  --border:#E4DDD0;        /* card borders */
  --border2:#C9C3B6;       /* input borders */
  --accent:#1F44FF;        /* cobalt */
  --accent2:#5B7BFF;       /* gradient partner */
  --accentInk:#fff;        /* text on cobalt */
  --accentSoft:#E8ECFF;    /* cobalt tint fill */
  --accentSoftBorder:#B9C4FF;
  --amber:#FFB323;
  --amberInk:#17150F;      /* text on amber */
  --amberDeep:#96650A;     /* amber as TEXT, so darker than --amber */
  --good:#0A7D3C;
  --goodSoft:#E3F6EA;
  --bad:#B3261E;
  --badSoft:#FBE6E6;
  --warm:#A84E1C;       /* 'just started' on the goal rings */
  --banner:#FFF1D6;
  --bannerBorder:#FFD98A;
  --bannerInk:#5C4A1E;
  --headerBg:#17150F;      /* header, hero, black cards, loading coin */
  --onDark:#FAF6F0;        /* text on --headerBg */
  --onDarkFaint:#9A9384;   /* tertiary text on --headerBg, which is dark in BOTH themes */
  --onDarkBorder:#4A463D;  /* outlined buttons in the header */
  --shadow:rgba(31,68,255,.28);
  --shadowSoft:rgba(31,68,255,.12);
  --scrim:rgba(23,21,15,.45);
  /* PAPER. The generated Ministry report is a document about to be printed and
     sent, so it looks the same in both themes on purpose — these three are
     defined once here and deliberately NOT redefined below. A reviewer must be
     looking at what the Ministry will receive, not at the app's dark mode. */
  --paper:#ffffff;
  --paperInk:#111111;
  --paperLine:#999999;
  --paperShade:#eeeeee;
  color-scheme:light;
}

@media (prefers-color-scheme: dark) {

    --border2:#463F34;

    --accent2:#8EA0FF;
    --accentInk:#0B0A08;
    --accentSoft:#1B2145;
    --accentSoftBorder:#2F3872;
    --amber:#FFC352;
    --amberInk:#17150F;
    --amberDeep:#E9AE3A;
    --good:#4CC98A;
    --goodSoft:#12301F;
    --bad:#FF7A6B;

    --shadowSoft:rgba(108,134,255,.14);

}

/* Motion: one spring, used everywhere something appears or grows. The overshoot
   is what separates "an app" from "a web page"; honoured only when the reader has
   not asked for less motion. */
:root { --spring:cubic-bezier(.34,1.56,.64,1); --ease:cubic-bezier(.4,0,.2,1);
        --r:18px; --rSm:12px; --rLg:22px; }
@media (prefers-reduced-motion: reduce) { :root { --spring:linear; --ease:linear; } }

/* ---- progress rings, shared ----
   Driven by gpRingHtml()/gpRingVars() in rollup.js. One element, no SVG: the
   conic-gradient is the sweep and the ::after punches the middle out, so the ring
   inherits whatever background it is sitting on. */
.gRing { flex:0 0 auto; width:42px; height:42px; border-radius:50%; position:relative;
  background:conic-gradient(var(--gc) calc(var(--p) * 1%), var(--surface2) 0);
  display:grid; place-items:center; transition:background .3s var(--ease); }
.gRing::after { content:''; position:absolute; inset:4px; border-radius:50%; background:var(--surface); }
.gRing span { position:relative; z-index:1; font-family:'Koulen',sans-serif; font-size:12.5px;
  color:var(--gc); letter-spacing:-.2px; }
.gRing.sm { width:34px; height:34px; }
.gRing.sm span { font-size:10.5px; }
.gRing.sm::after { inset:3px; }
.gRing.lg { width:58px; height:58px; }
.gRing.lg span { font-size:16px; }
.gRing.lg::after { inset:5px; }
/* On the black hero the punched-out middle has to match the hero, not a card. */
.hero .gRing::after, .focusCard .gRing::after { background:var(--headerBg); }
.hero .gRing, .focusCard .gRing { background:conic-gradient(var(--gc) calc(var(--p) * 1%), var(--onDarkBorder) 0); }
/* ...and the digits go to plain light text there. The paper-mode versions of those
   colours are chosen to be readable ON PAPER, so they are far too dark to sit on
   the hero; the sweep still carries the colour, which is where it reads anyway. */
.hero .gRing span, .focusCard .gRing span { color:var(--onDark); }

/* ---- a number that has just landed ----
   Pairs with gpAnimateCounts(): the value climbs and the element settles into
   place, so a figure reads as arriving rather than simply being there. */
@keyframes gpPop { 0%{transform:scale(.88);opacity:.55} 100%{transform:scale(1);opacity:1} }
[data-count] { display:inline-block; animation:gpPop .42s var(--spring) both; }
@media (prefers-reduced-motion: reduce) { [data-count] { animation:none } }

<style>
* { box-sizing: border-box; margin: 0; }
/* ---- locked to the edges of the phone ----
   The page asks for viewport-fit=cover and a black-translucent status bar, which
   together hand it the whole screen INCLUDING the notch and the home-indicator
   strip. Nothing then padded for them, so the header sat under the notch — and
   because iOS reports those insets late and re-reports them on rotation, on
   keyboard open/close and when the URL bar collapses, the content shifted each
   time. That is the wiggle. Pad by the insets and the chrome stops moving.
   overflow-x is on html as well as body on purpose: on iOS, body alone still lets
   the document itself rubber-band sideways. */
html { overscroll-behavior:none; height:100%; overflow-x:hidden; }

<!-- ==================== SPLASH ====================
     THIS BLOCK IS DUPLICATED VERBATIM IN index.html AND teams.html.
     tests/test-splash.mjs asserts the two copies are byte-identical — edit one,
     edit both. It is inlined rather than pulled from a file because it has to
     paint on the very first frame: an external stylesheet is another round trip,
     and a round trip is the whole problem this solves.

     Why it exists: the PWA's start_url is index.html, so every launch loads the
     dashboard and then navigates to the staff page. That second navigation is a
     real network fetch, so for as long as it takes you saw the dashboard. Script
     timing cannot fix that — the splash is in the markup from the first byte and
     covers the viewport, so there is nothing to see underneath at any point.

     background is the manifest's background_color, so the iOS launch screen and
     this are the same colour and the hand-off has no flash of white or paper.

     The ring spins immediately, from CSS alone, because logo.js is 77KB and must
     not block the head. The real GP mark fades into the middle the moment it
     lands — normally within a few tens of ms, and instantly once cached. -->
<style>
#splash { position:fixed; inset:0; z-index:9999; background:var(--headerBg);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px;
  opacity:1; transition:opacity .34s ease; }
#splash.gone { opacity:0; pointer-events:none; }
.spCoin { width:104px; height:104px; border-radius:50%; position:relative;
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 0 0 4px rgba(31,68,255,.16), 0 14px 40px rgba(31,68,255,.34); }
/* The comet ring: visible from frame one, no image needed. Masked to a 3px band
   so it reads as a ring rather than a filled disc. */
.spCoin::before { content:''; position:absolute; inset:-9px; border-radius:50%;
  background:conic-gradient(from 0deg, rgba(31,68,255,0) 0deg, rgba(31,68,255,.15) 200deg, var(--accent) 340deg, var(--accent2) 360deg);
  -webkit-mask:radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px));
  mask:radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px));
  animation:spSpin 1s linear infinite; }
/* The mark is white, drawn for the black header, so it reads on this background
   with no coin behind it. Hidden until it has a src, so it is never a blank gap. */
.spCoin img { width:74px; height:auto; opacity:0; transition:opacity .3s ease;
  animation:spSpin 1.4s linear infinite; }
.spCoin img[src] { opacity:1; }
.spWord { font-family:'Koulen',system-ui,sans-serif; font-size:20px; letter-spacing:2.5px;
  color:var(--onDark); text-transform:uppercase; }
.spWord::after { content:''; animation:spDots 1.4s steps(1,end) infinite; }
@keyframes spSpin { to { transform:rotate(360deg) } }
@keyframes spDots { 0%{content:''} 25%{content:'.'} 50%{content:'..'} 75%,100%{content:'...'} }
@media (prefers-reduced-motion: reduce){
  .spCoin::before, .spCoin img { animation:none }
  .spWord::after { content:'...' }
}
</style>
<div id="splash"><div class="spCoin"><img id="splashLogo" alt=""></div><div class="spWord">Impact Loading</div></div>
<script>
/* Two calls, so nothing else needs to know how the splash is built:
   gpSplashLogo(src) drops the real mark in once logo.js has landed, and
   gpSplashDone() takes the splash down when there is finally something behind it
   worth looking at. Both are safe to call more than once, and safe to call before
   the element exists.

   The timeout is the important part: if any path forgets to call gpSplashDone —
   an error boundary, a branch added later — the splash would sit there covering a
   working app forever. Better to reveal a half-drawn page than to trap it. */
(function(){
  var TIMEOUT = 8000;
  window.gpSplashLogo = function(src){
    var i = document.getElementById('splashLogo');
    if(i && typeof src === 'string' && src && !i.getAttribute('src')) i.src = src;
  };
  window.gpSplashDone = function(){
    var s = document.getElementById('splash');
    if(!s || s.className.indexOf('gone') > -1) return;
    s.className = 'gone';
    setTimeout(function(){ if(s.parentNode) s.parentNode.removeChild(s); }, 420);
  };
  setTimeout(function(){ window.gpSplashDone(); }, TIMEOUT);
})();
</script>

<script>
/*  Error boundary — must come first, before any other script.

    The page depends on taxonomy.js loading; if that request fails (flaky
    connection, cache miss) the app's globals are missing and everything after
    it dies, which used to mean a silent blank screen with no way out. Show
    something honest and recoverable instead.  */
(function(){
  var shown = false;
  function fallback(what){
    if(shown) return; shown = true;
    // Latch it so a later render() can't paint over the message.
    window.gpDead = true;
    // And lift the splash, or the message sits behind it and the app looks hung.
    if(window.gpSplashDone) window.gpSplashDone();
    var html =
      '<div style="max-width:420px;margin:14vh auto;padding:0 22px;text-align:center;'+
      'font-family:system-ui,sans-serif;color:var(--ink)">'+
      '<div style="font-size:40px;line-height:1">✦</div>'+
      '<h2 style="font-size:19px;margin:14px 0 8px">This didn’t load properly</h2>'+
      '<p style="font-size:14.5px;line-height:1.5;color:var(--muted);margin:0 0 18px">'+
      'Usually a connection hiccup. Your data is safe — nothing was lost.</p>'+
      '<button id="gpReload" style="width:100%;padding:14px;border:0;border-radius:12px;'+
      'background:var(--accent);color:var(--accentInk);font-size:16px;font-weight:700;cursor:pointer">Try again</button>'+
      '<div style="font-size:11px;color:var(--faint);margin-top:20px">'+String(what||'').slice(0,140)+'</div>'+
      '</div>';
    function paint(){
      var host = document.getElementById('main') || document.body;
      if(!host) return;
      host.innerHTML = html;
      var r = document.getElementById('gpReload');
      if(r) r.onclick = function(){ location.reload(); };
    }
    if(document.body) paint();
    else document.addEventListener('DOMContentLoaded', paint);
  }
  window.addEventListener('error', function(e){
  /* A failed <script src> fires an error event on the element itself.

     Only some scripts are load-bearing. logo.js and km.js are marked
     data-optional because the page works without them — a missing logo is a
     missing image, and a missing dictionary just leaves the text in English.
     Killing the whole app for either is far worse than the thing it prevents,
     and on the patchy phone connections this is built for, a third request is a
     third chance to fail. taxonomy.js has no fallback and stays fatal. */
    if(e && e.target && e.target.tagName === 'SCRIPT'){
      if(e.target.hasAttribute('data-optional')) return;
      fallback('could not load ' + (e.target.src||'a script'));
      return;
    }
    if(e && e.message) fallback(e.message);
  }, true);
  window.addEventListener('unhandledrejection', function(e){
    fallback((e && e.reason && e.reason.message) || 'unexpected error');
  });
  window.gpBootFailed = fallback;
})();
</script>

function ring(p, size){
  p = Math.max(0, Math.round(p));
  var shown = Math.min(100, p);
  var r = (size-10)/2, c = 2*Math.PI*r, off = c*(1-shown/100);
  var cx = size/2;
  return '<svg class="ring'+(p>=100?' done':'')+'" width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'">'+
    '<circle class="ringBg" cx="'+cx+'" cy="'+cx+'" r="'+r+'" fill="none" stroke-width="6"/>'+
    '<circle class="ringFg" cx="'+cx+'" cy="'+cx+'" r="'+r+'" fill="none" stroke-width="6" stroke-linecap="round" '+
      'stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" transform="rotate(-90 '+cx+' '+cx+')"/>'+
    '<text x="'+cx+'" y="'+(cx+5)+'" text-anchor="middle" font-size="'+(size*0.28)+'">'+p+'%</text></svg>';
}

function lsGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }

/* ---------- weeks & dates ---------- */
function mondayOfW1(){
  var y = new Date().getFullYear();
  var jan1 = new Date(y, 0, 1);
  return new Date(y, 0, 1 - ((jan1.getDay() + 6) % 7));
}
function weekRange(w){
  var start = new Date(mondayOfW1().getTime() + (w-1)*7*86400000);
  var end = new Date(start.getTime() + 6*86400000);
  return [start, end];
}
function fmtDate(d){
  var loc = state.lang === 'km' ? 'km-KH' : 'en-US';
  try { return d.toLocaleDateString(loc, { month:'short', day:'numeric' }); }
  catch(e){ return (d.getMonth()+1)+'/'+d.getDate(); }
}
function weekLabel(w){
  var r = weekRange(w);
  return 'W'+w+' · '+fmtDate(r[0])+'–'+fmtDate(r[1])+' · Q'+(qOf(w)+1);
}
function currentWeek(){
  var diff = Math.floor((new Date() - mondayOfW1()) / (7*86400000)) + 1;
  return Math.max(1, Math.min(52, diff));
}
state.week = currentWeek();

/* ---------- the roll-up engine ----------
   Every figure on this page is computed in rollup.js, which teams.html shares
   so a staff member sees their base's numbers built by exactly this arithmetic.
   What stays here is the wiring: R() hands the engine whatever data is loaded
   right now, and the one-liners below keep this page's call sites unchanged.

   The instance is rebuilt only when the data object itself is replaced, which
   is what a load does — so a render costs one engine, not one per figure. */
var _roll = null;
function R(){
  var d = state.data;
  if(!_roll || _roll.e!==d.entries || _roll.s!==d.survey || _roll.r!==state.roster){
    _roll = { e:d.entries, s:d.survey, r:state.roster,
      api: gpRollup({ entries:d.entries, survey:d.survey, roster:state.roster, week:currentWeek() }) };
  }
  return _roll.api;
}

function render(){

     done its job and comes off here. */
  if(window.gpSplashDone) window.gpSplashDone();

     arrived, so an undecided visitor never sees the dashboard flash behind it. */

  if(!state.loaded){ m.innerHTML = loadingHtml(); return; }
  if(state.view==='all') m.innerHTML = dashboardHtml(t('All Campuses — Combined Impact'), CAMPUSES.map(function(c){return c.id;}), true);
  else if(state.view==='dashboard') m.innerHTML = dashboardHtml(t(campusName()), [state.campus], false);
  else if(isWriteView(state.view) && !canEnterData()) m.innerHTML = gateHtml();
  else if(state.view==='log') m.innerHTML = logHtml();
  else if(state.view==='programs') m.innerHTML = programsHtml();
  else m.innerHTML = okrHtml();
  bindEvents();
  animateCounts();
}

/* ---------- who is here: signed in, guest, or undecided ----------
   Reading the dashboard has never needed an account and still doesn't. Typing
   into it is the part that does: a number logged anonymously can't be traced
   back to a person or a campus, which is how the wrong campus gets a week of
   somebody else's figures.

   So the front door asks once — create a profile, log in, or browse as a guest
   — and guests get every screen except the one that writes: Log Numbers. (The
   health check-in was the other; it lives on the staff page now, derived from
   your daily logs rather than typed a second time.) This is the first half of
   tying logging to your own campus; the campus lock itself waits until everyone
   has an account.

   The server enforces this too now: saveEntries takes either the leadership code
   or a username + PIN, and a staff login may write only its own campus. So this
   gate stops the accident and api.js stops the determined person — the campus lock
   Uriah asked for, which costs nobody access because reaching this form has
   required an account since the front door was added. */
function staffSession(){
  try { return JSON.parse(localStorage.getItem('gp-staff')||'null'); } catch(e){ return null; }
}
function isSignedIn(){ var s=staffSession(); return !!(s && s.user && s.pin); }
function isGuest(){ try { return sessionStorage.getItem('gp-guest')==='1'; } catch(e){ return false; } }
function canEnterData(){ return isSignedIn(); }
/* Health moved to the staff page, which owns the personal half of it. */
/* Programs is a write view for the same reason Log Numbers is: every row is
   stamped with who entered it and which campus they belong to, and the server
   will not hand the list to an anonymous caller. */
var WRITE_VIEWS = ['log','programs'];
function isWriteView(v){ return WRITE_VIEWS.indexOf(v)>-1; }

/* ---------- dashboard tiles ----------
   statTile keeps the count-up animation contract in one place: render the
   number as "0" with a data-count for animateCounts() to drive, or an em dash
   when nothing has been logged. */
function statTile(label, value, opts){
  opts = opts || {};
  var known = (value!==null && value!==undefined && !isNaN(value));
  var attrs = '';
  if(known){
    attrs = ' data-count="'+value+'"';
    if(opts.dec) attrs += ' data-dec="1"';
    if(opts.prefix) attrs += ' data-prefix="'+esc(opts.prefix)+'"';
    if(opts.suffix) attrs += ' data-suffix="'+esc(opts.suffix)+'"';
  }
  return '<div class="stat'+(opts.cls?' '+opts.cls:'')+(opts.drill?' drillable':'')+'"'+(opts.drill||'')+'>'+
    '<div class="statNum"'+attrs+'>'+(known?'0':'—')+'</div>'+
    '<div class="statLabel">'+esc(label)+(opts.trend?'<span class="statTrend">'+opts.trend+'</span>':'')+'</div></div>';
}
/* Q1–Q4 chips under a section heading, so "per quarter" is answerable without
   leaving the dashboard. valFn(quarter) returns that quarter's figure. */
function quarterChips(label, valFn, drillFn){
  var h = '<div class="qRow"><span class="qRowLabel">'+esc(label)+'</span>';
  for(var q=0;q<4;q++){
    var d = drillFn ? drillFn(q) : '';
    h += '<span'+(d?' class="drillable"'+d:'')+'>Q'+(q+1)+' <b>'+fmt(valFn(q))+'</b></span>';
  }
  return h+'</div>';
}

  /* The hero answers "who are we" before "what happened". Staff is the number

     stay in the same black card as the sub-figure, quarters and all. */
  var staff = totalStaff(ids);
  h += '<div class="hero"><div class="heroLabel">'+esc(t('STAFF'))+'</div>';
  h += '<div class="heroNum"'+(staff===null?'':' data-count="'+staff+'"')+'>'+(staff===null?'—':'0')+'</div>';
  var cr = checkinRate(ids, currentWeek());
  if(cr.total && cr.total>0){
    var crp = gpCheckinPct(cr.n, cr.total);
    h += '<div class="heroRow">'+gpRingHtml(crp, 'sm', t('Checked in this week'))+
      '<div class="heroTrend">'+esc(t('Checked in this week'))+' <b class="heroFig">'+cr.n+'</b> / '+cr.total+
      ' · '+crp+'%</div></div>';
  }
  var hs = healthScore(ids);
  if(hs!==null){

function deptDashHtml(){

    visibleMetrics(deps[state.dashDept][min]).forEach(function(metric){
      var mode = modeOf(metric);

      var lbl = mode==='latest'?'now':(mode==='avg'?'avg':'YTD');
      var tr = trendFor(function(w){ var e=entries[mkey]; return (e&&e[w]!==undefined&&e[w]!==null&&!isNaN(Number(e[w])))?Number(e[w]):null; }, metric);
      h += '<div class="row drillable" data-drill-metric="'+esc(metric)+'" data-drill-ids="'+state.campus+'" data-drill-dept="'+esc(state.dashDept)+'" data-drill-ministry="'+esc(min)+'"><span class="rowName">'+esc(t(metric))+' <span style="color:var(--faint);font-size:11px">'+lbl+'</span></span><span class="rowVal">'+fmt(v,metric)+tr+'</span></div>';

  return h;
}

function weekOptions(sel){

function logHtml(){
  var deps = getDepartments(state.campus);
  if(!deps[state.dept]) state.dept = Object.keys(deps)[0];
  if(!deps[state.dept][state.ministry]) state.ministry = Object.keys(deps[state.dept])[0];
  var h = '<h2>'+esc(t('Log Numbers'))+' <small>· '+esc(t(campusName()))+'</small></h2>';
  h += '<div class="pickerRow">';
  h += '<label class="pick"><span>'+esc(t('Department'))+'</span><select id="deptSel">'+
    Object.keys(deps).map(function(d){ return '<option value="'+esc(d)+'"'+(state.dept===d?' selected':'')+'>'+(MIN_EMOJI[d]?MIN_EMOJI[d]+' ':'')+esc(t(d))+'</option>'; }).join('')+'</select></label>';
  h += '<label class="pick"><span>'+esc(t(state.dept===BL_DEPT?'Oversees':'Ministry'))+'</span><select id="minSel">'+
    Object.keys(deps[state.dept]).map(function(m){ return '<option value="'+esc(m)+'"'+(state.ministry===m?' selected':'')+'>'+(MIN_EMOJI[m]?MIN_EMOJI[m]+' ':'')+esc(t(m))+'</option>'; }).join('')+'</select></label>';
  h += '<label class="pick"><span>'+esc(t('Week'))+'</span><select id="weekSel">'+weekOptions(state.week)+'</select></label>';
  h += '</div><div class="card" id="logCard">';
  var entries = state.data.entries[state.campus]||{};
  if(state.dept===BL_DEPT && state.ministry==='Campus Leadership'){
    var hsNow = healthScore([state.campus]);
    h += '<div class="row"><div><div class="rowName">'+esc(t('Staff Health Score (from survey)'))+'</div>'+
      '<div class="rowSub">'+esc(t('auto from KPI'))+'</div></div><span class="rowVal">'+(hsNow===null?'—':hsNow.toFixed(1)+'/10')+'</span></div>';
  }
  visibleMetrics(deps[state.dept][state.ministry]).forEach(function(metric){
    var key = state.dept+'|'+state.ministry+'|'+metric;
    var mode = modeOf(metric);
    var wks = entries[key] || {};
    var agg = aggregate(wks, mode);
    var cur = wks[state.week]!==undefined ? wks[state.week] : '';
    var sub, extra = '';
    if(mode==='latest'){
      // Headcounts (students enrolled, staff, schools…) rarely change week to
      // week, so carry the last figure forward already filled in instead of
      // making someone retype it. Still editable, so real growth or decline
      // still registers — and the ▲/▼ badge shows the change.
      var prev = lastBefore(wks, state.week);
      var isCarried = (cur==='' && prev!==null);
      if(isCarried){ cur = prev.value; extra = ' data-carried="1"'; }
      sub = esc(t('now'))+' '+fmt(agg,metric);
      if(prev!==null){
        sub += ' · ' + (isCarried
          ? esc(t('carried from week'))+' '+prev.week
          : esc(t('week'))+' '+prev.week+': '+fmt(prev.value,metric));
        var d = Number(cur)-prev.value;
        if(d) sub += '<span class="trend '+(d>0?'up':'down')+'">'+(d>0?'▲':'▼')+' '+fmt(Math.abs(d),metric)+'</span>';
      }
    } else if(mode==='avg'){
      sub = esc(t('avg'))+' '+fmt(agg,metric);
    } else {
      // Running totals: this box is the week's ADDITION, not the new total.
      // Spelling that out stops people entering "105" when they mean "+5".
      sub = esc(t('total so far'))+' '+fmt(agg,metric)+'<span class="newTot"></span>';
      extra = ' data-run="'+(agg===null?0:agg)+'"';
    }
    h += '<div class="row"><div><div class="rowName">'+esc(t(metric))+'</div><div class="rowSub">'+sub+'</div></div>'+
      '<input type="number" inputmode="decimal" placeholder="'+(mode==='sum'?'+0':'0')+'" data-metric="'+esc(metric)+'" data-mode="'+mode+'" value="'+cur+'"'+extra+'></div>';
  });
  h += '<button class="saveBtn" id="saveBtn">'+esc(t('Save Week'))+' '+state.week+'</button></div>';
  h += '<p class="note">'+esc(t('Entries save to the shared GP Impact Data sheet — every leader sees the same live numbers.'))+'</p>';
  return h;
}

/* ---------- OKR ---------- */
function objProgress(o){ return R().objProgress(o); }
function krProgress(o, kr){ return R().krProgress(o, kr); }

function metricOptions(selected){
  var deps = getDepartments(state.campus);
  var h = '<option value="">'+esc(t('Manual progress (%)'))+'</option>';
  Object.keys(deps).forEach(function(d){
    h += '<optgroup label="'+esc(t(d))+'">';
    Object.keys(deps[d]).forEach(function(min){
      visibleMetrics(deps[d][min]).forEach(function(met){
        var key = d+'|'+min+'|'+met;
        h += '<option value="'+esc(key)+'"'+(selected===key?' selected':'')+'>'+esc(t(min)+' · '+t(met))+'</option>';
      });
    });
    h += '</optgroup>';
  });
  return h;
}

function okrHtml(){
  var q = state.okrQuarter;
  var h = '<h2>'+esc(t('OKRs'))+' <small>· '+esc(t(campusName()))+'</small></h2>';
  h += '<div class="pickerRow"><label class="pick" style="max-width:180px"><span>'+esc(t('Quarter'))+'</span><select id="okrQSel">';
  for(var i=1;i<=4;i++) h += '<option value="'+i+'"'+(q===i?' selected':'')+'>Q'+i+'</option>';
  h += '</select></label></div>';

  var list = state.data.okrs.filter(function(o){ return o.campus===state.campus && Number(o.quarter)===q; });
  if(!list.length && !state.okrFormOpen) h += '<p class="note">'+esc(t('No objectives yet. Set 2–3 per department — each with measurable key results.'))+'</p>';

  list.forEach(function(o){
    var p = objProgress(o);
    h += '<div class="okrCard"><div class="okrHead"><div><div class="okrObj">'+esc(o.objective)+'</div>'+
      '<div class="okrDept">'+emj(o.dept)+esc(t(o.dept))+' · Q'+o.quarter+'</div></div>'+ring(p,58)+'</div>';
    o.krs.forEach(function(kr, ki){
      var kp = krProgress(o, kr);
      h += '<div class="kr"><div class="krText">'+esc(kr.text)+'</div><div class="krMeta">';
      if(kr.metricKey){
        var met = kr.metricKey.split('|')[2];
        h += '<span>'+fmt(kp.actual,met)+' / '+fmt(kr.target,met)+' · '+esc(t('auto from KPI'))+'</span><span>'+kp.pct+'%</span>';
      } else {
        h += '<span>'+esc(t('manual'))+'</span><span><input type="number" class="manualIn" min="0" max="100" value="'+(Number(kr.manual)||0)+'" data-manual="'+o.id+'|'+ki+'"'+(state.data.leader?'':' disabled')+'> %</span>';
      }
      h += '</div><div class="krBar"><div class="barFill'+(kp.pct>=100?' done':'')+'" style="width:'+Math.min(100,kp.pct)+'%"></div></div></div>';
    });
    if(state.data.leader){
      h += '<div style="display:flex;gap:8px;margin-top:12px;justify-content:flex-end">'+
        '<button class="dangerBtn" data-del="'+o.id+'">'+esc(t('Delete'))+'</button>'+
        '<button class="ghostBtn" data-edit="'+o.id+'">'+esc(t('Edit'))+'</button></div>';
    }
    h += '</div>';
  });

  if(!state.data.leader){
    return h;
  }

  if(state.okrFormOpen){
    var editing = null;
    if(state.editingId) state.data.okrs.forEach(function(o){ if(o.id===state.editingId) editing=o; });
    var krs = editing ? editing.krs : [];
    h += '<div class="okrCard" id="okrForm"><div class="okrObj">'+esc(t(editing?'Edit objective':'New objective'))+'</div><div class="formBlock" style="border:none;margin-top:4px">';
    h += '<label>'+esc(t('Objective'))+'</label><input type="text" id="objText" value="'+(editing?esc(editing.objective):'')+'">';
    h += '<label>'+esc(t('Owner'))+'</label><select id="objDept">'+Object.keys(getDepartments(state.campus)).map(function(d){
      return '<option value="'+esc(d)+'"'+(editing&&editing.dept===d?' selected':'')+'>'+esc(t(d))+'</option>'; }).join('')+'</select>';
    for(var k=0;k<3;k++){
      var kr = krs[k]||{text:'',metricKey:'',target:''};
      h += '<div class="formBlock"><label>'+esc(t('Key result'))+' '+(k+1)+'</label>'+
        '<input type="text" id="krText'+k+'" value="'+esc(kr.text)+'">'+
        '<label>'+esc(t('Measure by'))+'</label><select id="krMetric'+k+'">'+metricOptions(kr.metricKey)+'</select>'+
        '<label>'+esc(t('Target (if linked to a KPI)'))+'</label><input type="number" id="krTarget'+k+'" inputmode="decimal" placeholder="0" value="'+(kr.target||'')+'" style="width:130px">'+
      '</div>';
    }
    h += '<button class="saveBtn" id="saveOkrBtn">'+esc(t(editing?'Save changes':'Add objective'))+'</button>'+
      '<button class="ghostBtn" id="cancelOkrBtn" style="width:100%">'+esc(t('Cancel'))+'</button></div></div>';
  } else {
    h += '<button class="saveBtn" id="openOkrBtn">'+esc(t('+ New Objective'))+'</button>';
  }
  return h;
}

/* ---------- Programs: the Ministry of Education report ----------
   Four project agreements — SVI, YDC, YLT, YAP — reported on twice a year. The
   report asks for things the weekly KPIs do not hold: which country a visiting
   team came from, the dates it was here, how many of a class were girls. Those
   are facts about one thing that happened, not a figure that exists every week,
   so they are typed here as records and nothing about the weekly log changes.

   The shapes live in programs.js, which the API validates against, so a field
   added there appears in this form and is accepted by the server. */
function hasPrograms(){
  return typeof GP_PROGRAMS !== 'undefined' && typeof gpProgramFields === 'function';
}
function progRows(){ return state.progRecords || []; }

/* Rows for the programme and semester currently on screen. Semester 0 is the
   "Whole year" option — the year goal is annual, so somebody checking progress
   against it needs to see the year, not one half of it. */
function progVisible(kind, program){
  return progRows().filter(function(r){
    if(r.kind!==kind) return false;
    if(program && r.program!==program) return false;
    if(state.progSemester && Number(r.semester)!==state.progSemester) return false;
    return true;
  });
}

function fmtDay(s){
  var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(s||''));
  if(!m) return String(s||'');
  var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return Number(m[3])+' '+MON[Number(m[2])-1];
}
function campusTag(id){
  var short = gpCampusShort(id);
  return short ? '<span class="tag">'+esc(t(short))+'</span>' : '';
}

/* One line describing a saved row, in the words the report uses. */
function recLine(r){
  var mf = esc(gpT('{m} men, {f} women', { m:Number(r.male)||0, f:Number(r.female)||0 }));
  if(r.kind==='team'){
    /* Built from the parts that are actually filled in — the dates and the country
       are what the report wants, but a row saved without them should not read as
       " ·  · 5 men, 7 women". */
    var bits = [];
    if(r.from || r.to) bits.push(esc(fmtDay(r.from)+' – '+fmtDay(r.to)));
    if(r.country) bits.push(esc(r.country));
    bits.push(mf);
    return bits.join(' · ');
  }
  if(r.kind==='class') return (Number(r.classes)||0)+' '+esc(t('classes'))+' · '+mf;
  if(r.kind==='cohort'){
    return mf+' · '+(Number(r.khmer)||0)+' '+esc(t('Khmer'))+', '+(Number(r.intl)||0)+' '+esc(t('international'))+
      ' · '+((Number(r.staffMale)||0)+(Number(r.staffFemale)||0))+' '+esc(t('staff'));
  }
  if(r.kind==='group') return mf;
  return '';
}
function recTitle(r){
  return r.name || r.location || t('Untitled');
}

/* The facts strip: the numbers the report asks for, worked out from the rows on
   screen so a mistyped figure is visible while the person who typed it is still
   looking at the form. gpProgramSummary is shared with the report generator. */
function progFactsHtml(p, rows){
  var s = gpProgramSummary(p.id, rows);
  var f = [];
  function add(n, label){ f.push('<div class="progFact"><b>'+n+'</b><span>'+esc(t(label))+'</span></div>'); }
  if(p.id==='SVI'){
    add(s.rows, 'Teams'); add(s.people, 'Volunteers');
    add(s.male, 'Men'); add(s.female, 'Women');
    add(s.countries.length, 'Countries');
  } else if(p.id==='YDC'){
    add(s.locations, 'Locations'); add(s.classes, 'Classes');
    add(s.people, 'Students'); add(s.male, 'Male'); add(s.female, 'Female');
  } else if(p.id==='YLT'){
    add(s.rows, 'Schools'); add(s.people, 'Students');
    add(s.male, 'Male'); add(s.female, 'Female');
    add(s.khmer, 'Khmer'); add(s.intl, 'International'); add(s.staff, 'Staff');
  } else {
    add(s.locations, 'Locations'); add(s.people, 'Participants');
    add(s.male, 'Male'); add(s.female, 'Female');
  }
  var h = '<div class="progFacts">'+f.join('')+'</div>';
  if(p.id==='SVI' && s.countries.length){
    h += '<div class="progBlurb">'+esc(t('From'))+': '+esc(s.countries.join(', '))+'</div>';
  }
  return h;
}

/* The form for one record, built from programs.js. Runs of number fields are laid
   out two to a line — "Men on the team" and "Women on the team" belong beside
   each other, and a column of full-width number boxes is a long scroll on a
   phone. */
function recFormHtml(kind, rec){
  var fields = GP_RECORD_FIELDS[kind] || [];
  rec = rec || {};
  var h = '', i = 0;
  function inputFor(f){
    var v = rec[f.k]===undefined || rec[f.k]===null ? '' : String(rec[f.k]);
    var id = 'pf_'+f.k, hint = f.hint ? ' placeholder="'+esc(t(f.hint))+'"' : '';
    if(f.t==='x') return '<textarea id="'+id+'" rows="3" data-f="'+esc(f.k)+'"'+hint+'>'+esc(v)+'</textarea>';
    if(f.t==='d') return '<input type="date" id="'+id+'" data-f="'+esc(f.k)+'" value="'+esc(v)+'">';
    if(f.t==='n') return '<input type="number" inputmode="numeric" min="0" id="'+id+'" data-f="'+esc(f.k)+'" value="'+esc(v)+'" placeholder="0">';
    return '<input type="text" id="'+id+'" data-f="'+esc(f.k)+'" value="'+esc(v)+'"'+hint+'>';
  }
  function labelFor(f){
    return '<label for="pf_'+f.k+'">'+esc(t(f.label))+(f.optional?' <span style="text-transform:none;letter-spacing:0">('+esc(t('optional'))+')</span>':'')+'</label>';
  }
  while(i < fields.length){
    var run = i;
    while(run < fields.length && fields[run].t==='n') run++;
    if(run - i >= 2){
      h += '<div class="fGrid">';
      for(var j=i;j<run;j++) h += '<div class="fCell">'+labelFor(fields[j])+inputFor(fields[j])+'</div>';
      h += '</div>';
      i = run;
    } else {
      h += labelFor(fields[i]) + inputFor(fields[i]);
      i++;
    }
  }
  return h;
}

function programsHtml(){
  if(!hasPrograms()) return '<p class="note">'+esc(t('This screen could not load. Pull down to refresh.'))+'</p>';
  var h = '<h2>'+esc(t('Programs'))+' <small>· '+state.progYear+'</small></h2>';
  h += '<p class="note" style="margin:-8px 0 14px">'+
    esc(t('Our four project agreements with the Ministry of Education, Youth and Sport. These records cover the whole base — both campuses — and are what the twice-yearly report is written from.'))+'</p>';

  var thisYear = new Date().getFullYear();
  h += '<div class="pickerRow">';
  h += '<label class="pick"><span>'+esc(t('Year'))+'</span><select id="progYearSel">';
  for(var y=thisYear+1; y>=thisYear-3; y--) h += '<option value="'+y+'"'+(state.progYear===y?' selected':'')+'>'+y+'</option>';
  h += '</select></label>';
  h += '<label class="pick"><span>'+esc(t('Semester'))+'</span><select id="progSemSel">'+
    '<option value="1"'+(state.progSemester===1?' selected':'')+'>'+esc(t('Semester 1'))+'</option>'+
    '<option value="2"'+(state.progSemester===2?' selected':'')+'>'+esc(t('Semester 2'))+'</option>'+
    '<option value="0"'+(state.progSemester===0?' selected':'')+'>'+esc(t('Whole year'))+'</option>'+
    '</select></label></div>';

  h += '<div class="progChips">';
  GP_PROGRAMS.forEach(function(p){
    h += '<button class="pchip'+(state.prog===p.id?' on':'')+'" data-prog="'+p.id+'">'+esc(p.id)+'</button>';
  });
  h += '<button class="pchip'+(state.prog==='ISSUES'?' on':'')+'" data-prog="ISSUES">⚑ '+esc(t('Challenges'))+'</button>';
  h += '</div>';

  if(state.progLoading && !state.progRecords) return h + loadingHtml();
  if(!state.progRecords) return h + '<p class="note">'+esc(t("Couldn't load data. Pull down to refresh."))+'</p>';

  h += (state.prog==='ISSUES' ? issuesHtml() : programCardHtml());
  /* The whole point of typing any of this in. Last, because you write the report
     once the records are right. */
  if(typeof gpBuildReport === 'function'){
    h += '<button class="ghostBtn" id="genReportBtn" style="width:100%;margin-top:6px">'+
      '📄 '+esc(t('Generate the Ministry report'))+'</button>'+
      '<p class="note">'+esc(t('Writes the semester report from these records, in the same format as the one already filed. It opens as a draft — read it before it is sent.'))+'</p>';
  }
  return h;
}

function programCardHtml(){
  var p = gpProgram(state.prog);
  if(!p) return '';
  /* The goal is for the year, so it is measured against the year — not against
     whichever semester happens to be showing. */
  var yearRows = progRows().filter(function(r){ return r.program===p.id; });
  var target = gpProgramGoal(p.id, yearRows);
  var reached = gpProgramSummary(p.id, yearRows).people;
  var pct = (target && target > 0) ? Math.round(reached/target*100) : 0;

  var h = '<div class="okrCard"><div class="progHead"><div>'+
    '<div class="progName">'+esc(t(p.name))+'</div>'+
    '<div class="progBlurb">'+esc(t(p.blurb))+'</div></div>'+
    (target===null ? '' : ring(pct, 58))+'</div>';

  h += '<div class="formBlock"><label for="progTarget">'+esc(t('Year goal (per the agreement)'))+'</label>'+
    '<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">'+
    '<input type="number" inputmode="numeric" min="0" id="progTarget" value="'+(target===null?'':target)+'" placeholder="0">'+
    '<span class="rowSub" style="margin:0">'+esc(t(p.unit))+' · '+state.progYear+'</span>'+
    '<button class="ghostBtn" id="saveGoalBtn">'+esc(t('Save goal'))+'</button></div>'+
    (target===null
      ? '<div class="rowSub" style="margin-top:6px">'+esc(t('No goal set for this year yet.'))+'</div>'
      : '<div class="rowSub" style="margin-top:6px">'+esc(gpT('{n} of {t} so far this year', {n:reached, t:target}))+' · '+esc(gpPctWord(pct))+'</div>')+
    '</div>';

  h += progFactsHtml(p, progVisible(p.kind, p.id)) + '</div>';

  var rows = progVisible(p.kind, p.id);
  h += '<div class="card">';
  if(!rows.length){
    h += '<div class="emptyRec">'+esc(t(state.progSemester
      ? 'Nothing recorded yet for this semester.'
      : 'Nothing recorded yet for this year.'))+'</div>';
  } else {
    rows.forEach(function(r){
      h += '<div class="recRow"><div class="recName">'+esc(recTitle(r))+campusTag(r.campus)+'</div>'+
        '<div class="recMeta">'+recLine(r)+'</div>'+
        (r.activities ? '<div class="recMeta">'+esc(r.activities)+'</div>' : '')+
        '<div class="recActs"><button class="ghostBtn" data-prec="'+esc(r.id)+'">'+esc(t('Edit'))+'</button>'+
        '<button class="dangerBtn" data-pdel="'+esc(r.id)+'">'+esc(t('Delete'))+'</button></div></div>';
    });
  }
  h += '</div>';

  h += recordFormBlock(p.kind, p.id, {
    add: p.kind==='team' ? '+ Add a team' : p.kind==='class' ? '+ Add a location' :
         p.kind==='cohort' ? '+ Add a school' : '+ Add a location'
  });
  return h;
}

function issuesHtml(){
  var rows = progVisible('issue', '');
  var h = '<div class="okrCard"><div class="progName">'+esc(t('Challenges and solutions'))+'</div>'+
    '<div class="progBlurb">'+esc(t('What we are actually up against this semester, and what we did about it — lower volunteer numbers, conflict, fewer teachers, students who stop coming.'))+'</div>'+
    '<div class="progBlurb" style="margin-top:8px">'+esc(t('Not "we need more staff" — every organisation needs more staff, and it tells the reader nothing.'))+'</div></div>';

  h += '<div class="card">';
  if(!rows.length) h += '<div class="emptyRec">'+esc(t(state.progSemester
    ? 'Nothing written yet for this semester.'
    : 'Nothing written yet for this year.'))+'</div>';
  else rows.forEach(function(r){
    h += '<div class="recRow"><div class="recName">'+esc(r.challenge||'')+campusTag(r.campus)+'</div>'+
      '<div class="recMeta">'+esc(r.solution||'')+'</div>'+
      '<div class="recActs"><button class="ghostBtn" data-prec="'+esc(r.id)+'">'+esc(t('Edit'))+'</button>'+
      '<button class="dangerBtn" data-pdel="'+esc(r.id)+'">'+esc(t('Delete'))+'</button></div></div>';

/* The add/edit form, or the button that opens it. state.progEditing is the row's
   id, '' for a new row, null for closed. */
function recordFormBlock(kind, program, opts){
  if(state.progEditing===null || state.progEditing===undefined){
    if(state.progSemester===0){
      return '<p class="note">'+esc(t('Pick a semester to add a record — a record belongs to one half of the year.'))+'</p>';
    }
    return '<button class="saveBtn" id="openRecBtn">'+esc(t(opts.add))+'</button>';
  }
  var editing = null;
  progRows().forEach(function(r){ if(r.id===state.progEditing) editing = r; });
  return '<div class="okrCard" id="recForm" data-kind="'+esc(kind)+'" data-program="'+esc(program)+'">'+
    '<div class="progName">'+esc(t(editing?'Edit record':'New record'))+'</div>'+
    '<div class="formBlock" style="border:none;margin-top:0">'+
    recFormHtml(kind, editing)+
    '<button class="saveBtn" id="saveRecBtn">'+esc(t(editing?'Save changes':'Add record'))+'</button>'+
    '<button class="ghostBtn" id="cancelRecBtn" style="width:100%">'+esc(t('Cancel'))+'</button></div></div>';
}

function loadPrograms(){
  var sess = staffSession() || {};
  if(!sess.user) return;
  state.progLoading = true;
  return apiCall('getPrograms', [sess.user, sess.pin, state.progYear]).then(function(d){
    state.progLoading = false;
    if(d && d.ok){ state.progRecords = d.records || []; }
    else showError(t('Sign in again to open Programs.'));
    render();
  }).catch(function(){
    state.progLoading = false;
    showError("Couldn't load data. Pull down to refresh.");
    render();
  });
}

function progErrText(err){
  if(err==='no_campus') return t('Your profile has no campus yet — add one on your profile page.');
  if(err==='auth') return t('Sign in again to save.');
  return t("Couldn't save. Check your connection and try again.");
}

/* One path for every programme write — a record, a challenge and a year goal are
   all the same call with a different `kind`. */
function saveProgram(rec, btn, okLabel){
  var sess = staffSession() || {};
  if(btn){ btn.disabled = true; btn.textContent = t('Saving…'); }
  hideError();
  return apiCall('saveProgramRecord', [sess.user, sess.pin, rec]).then(function(d){
    if(!d || !d.ok){
      if(btn){ btn.disabled = false; btn.textContent = t(okLabel); }
      showError(progErrText(d && d.err));
      return;
    }
    state.progRecords = d.records || [];
    state.progEditing = null;
    render();
  }).catch(function(){
    if(btn){ btn.disabled = false; btn.textContent = t(okLabel); }
    showError("Couldn't save. Check your connection and try again.");
  });
}

function saveRecordForm(btn){
  var form = document.getElementById('recForm');
  if(!form) return;
  var kind = form.getAttribute('data-kind');
  var editing = null;
  if(state.progEditing) progRows().forEach(function(r){ if(r.id===state.progEditing) editing = r; });
  /* An edit keeps the row's own semester. Taking it from the picker instead would
     quietly move a semester-2 team into semester 1 the moment somebody opened it
     from the "Whole year" view — which is exactly the view you use to check the
     year's total, so the corruption would arrive with the proofreading. */
  var rec = { kind:kind, program:form.getAttribute('data-program'), year:state.progYear,
    semester: editing ? (Number(editing.semester) || 1) : (state.progSemester || 1) };
  if(state.progEditing) rec.id = state.progEditing;
  var missing = null;
  (GP_RECORD_FIELDS[kind]||[]).forEach(function(f){
    var el = form.querySelector('[data-f="'+f.k+'"]');
    var v = el ? String(el.value).trim() : '';
    /* Zero is a real answer for a count, so "filled in" means the box is not
       empty — not that the number is truthy. */
    if(!v && !f.optional && !missing) missing = f.label;
    rec[f.k] = f.t==='n' ? (v===''?0:Number(v)) : v;
  });
  if(missing){ showError(t('Please fill in')+': '+t(missing)); return; }
  saveProgram(rec, btn, state.progEditing ? 'Save changes' : 'Add record');
}

function saveProgramGoal(btn){
  var el = document.getElementById('progTarget');
  if(!el) return;
  var p = gpProgram(state.prog);
  if(!p) return;
  var existing = null;
  progRows().forEach(function(r){ if(r.kind==='goal' && r.program===p.id) existing = r; });
  var rec = { kind:'goal', program:p.id, year:state.progYear, semester:1,
    target: Number(el.value)||0, unit: p.unit };
  if(existing) rec.id = existing.id;
  saveProgram(rec, btn, 'Save goal');
}

function deleteProgramRow(id){
  var sess = staffSession() || {};
  hideError();
  apiCall('deleteProgramRecord', [sess.user, sess.pin, id]).then(function(d){
    if(!d || !d.ok){ showError(progErrText(d && d.err)); return; }
    state.progRecords = d.records || [];
    state.progEditing = null;
    render();
  }).catch(function(){ showError("Couldn't save. Check your connection and try again."); });
}

/* ---------- the generated report ----------
   Opened over the app rather than rendered into it: the document has its own
   typography and its own scroll, and a reviewer should see what will be sent.

   Getting it into Google Docs. There is no Google account behind this app and
   adding one would mean an OAuth consent screen for every leader, so the document
   goes onto the clipboard as rich HTML instead — paste into a blank Doc and the
   headings, bullets and tables arrive intact. Downloading the .doc and dropping
   it into Drive works too, and so does printing to PDF. Three ways out, because
   clipboard write is refused on some browsers and iOS Safari has its own rules. */
function openReport(){
  var body = gpBuildReport({ records: progRows(), year: state.progYear, semester: state.progSemester });
  var title = 'GP Activity Report — ' + (state.progSemester ? 'Semester '+state.progSemester+' ' : '') + state.progYear;
  var root = document.getElementById('repRoot');
  if(!root) return;
  root.innerHTML =
    '<div class="repSheet" role="dialog" aria-modal="true" aria-label="'+esc(title)+'">'+
      '<div class="repBar">'+
        '<span class="repTitle">'+esc(t('Ministry report'))+'</span>'+
        '<button class="primary" id="repCopy">'+esc(t('Copy for Google Docs'))+'</button>'+
        '<button id="repDownload">'+esc(t('Download'))+'</button>'+
        '<button id="repPrint">'+esc(t('Print'))+'</button>'+
        '<button id="repClose" aria-label="'+esc(t('Close'))+'">✕</button>'+
      '</div>'+
      '<div class="repPaper">'+
        '<p class="repNote">'+esc(t('A draft, in English — this document goes to the Ministry, so it is not machine-translated. The prose around the numbers is carried over from the last report; read it and edit it in the Doc before sending.'))+'</p>'+
        '<div class="repDoc" id="repDoc">'+body+'</div>'+
      '</div>'+
    '</div>';
  document.body.style.overflow = 'hidden';

  document.getElementById('repClose').onclick = closeReport;
  document.getElementById('repCopy').onclick = function(){ copyReport(this, body); };
  document.getElementById('repDownload').onclick = function(){ downloadReport(body, title); };
  document.getElementById('repPrint').onclick = function(){ printReport(body, title); };
  /* Escape closes it, the same as the drill-down sheet. */
  root._esc = function(e){ if(e.key==='Escape') closeReport(); };
  document.addEventListener('keydown', root._esc);
}
function closeReport(){
  var root = document.getElementById('repRoot');
  if(!root) return;
  if(root._esc) document.removeEventListener('keydown', root._esc);
  root.innerHTML = '';
  document.body.style.overflow = '';
}

/* Rich HTML on the clipboard is what makes the paste land in Google Docs as a
   document rather than as a wall of plain text. Not every browser allows it, so
   the plain-text copy is written alongside as a fallback, and if the whole API is
   refused the button says to use Download instead rather than failing silently. */
function copyReport(btn, body){
  var label = btn.textContent;
  var done = function(msg){
    btn.textContent = msg;
    setTimeout(function(){ btn.textContent = label; }, 2200);
  };
  var docHtml = gpReportDocument(body, 'Activity Report');
  var plain = document.getElementById('repDoc');
  plain = plain ? plain.innerText : body.replace(/<[^>]+>/g, ' ');
  try {
    if(navigator.clipboard && window.ClipboardItem){
      navigator.clipboard.write([ new ClipboardItem({
        'text/html': new Blob([docHtml], {type:'text/html'}),
        'text/plain': new Blob([plain], {type:'text/plain'})
      })]).then(function(){ done(t('Copied — paste into a Doc')); },
                function(){ done(t('Use Download instead')); });
      return;
    }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(plain).then(function(){ done(t('Copied as plain text')); },
                                               function(){ done(t('Use Download instead')); });
      return;
    }
  } catch(e){}
  done(t('Use Download instead'));
}

/* A .doc that is really HTML: Word opens it, and Google Drive converts it to a
   Doc on upload. A real .docx would mean a zip writer in the page for no gain. */
function downloadReport(body, title){
  var blob = new Blob(['﻿' + gpReportDocument(body, title)], {type:'application/msword'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = title.replace(/[^\w\d\- ]+/g, '') .trim() + '.doc';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
}

/* Printing the app's own window would print the app. A detached iframe carries
   only the document and its paper styling. */
function printReport(body, title){
  var f = document.createElement('iframe');
  f.setAttribute('aria-hidden','true');
  f.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0;';
  document.body.appendChild(f);
  var d = f.contentWindow.document;
  d.open(); d.write(gpReportDocument(body, title)); d.close();
  var go = function(){
    try { f.contentWindow.focus(); f.contentWindow.print(); } catch(e){}
    setTimeout(function(){ if(f.parentNode) f.parentNode.removeChild(f); }, 1500);
  };
  if(d.readyState === 'complete') go(); else f.onload = go;
}

function bindPrograms(){
  var ys = document.getElementById('progYearSel');
  if(ys) ys.onchange = function(){
    state.progYear = Number(ys.value);
    /* A different year is a different list — drop the old one so the screen shows
       a spinner rather than last year's rows relabelled with this year's. */
    state.progRecords = null; state.progEditing = null;
    loadPrograms(); render();
  };
  var ss = document.getElementById('progSemSel');
  if(ss) ss.onchange = function(){ state.progSemester = Number(ss.value); state.progEditing = null; render(); };
  document.querySelectorAll('[data-prog]').forEach(function(b){
    b.onclick = function(){ gpTap(); state.prog = b.getAttribute('data-prog'); state.progEditing = null; render(); };
  });
  var ob = document.getElementById('openRecBtn');
  if(ob) ob.onclick = function(){ state.progEditing = ''; render(); };
  var cb = document.getElementById('cancelRecBtn');
  if(cb) cb.onclick = function(){ state.progEditing = null; render(); };
  var sb = document.getElementById('saveRecBtn');
  if(sb) sb.onclick = function(){ saveRecordForm(sb); };
  var gb = document.getElementById('saveGoalBtn');
  if(gb) gb.onclick = function(){ saveProgramGoal(gb); };
  document.querySelectorAll('[data-prec]').forEach(function(b){
    b.onclick = function(){ state.progEditing = b.getAttribute('data-prec'); render(); };
  });
  document.querySelectorAll('[data-pdel]').forEach(function(b){
    b.onclick = function(){
      if(!confirm(t('Delete')+'?')) return;
      deleteProgramRow(b.getAttribute('data-pdel'));
    };
  });
  var rb = document.getElementById('genReportBtn');
  if(rb) rb.onclick = function(){ gpTap(); openReport(); };
}

/* ---------- Health survey ---------- */
/* ---------- events & server ---------- */
function apiCall(fn, args){
  return fetch('/.netlify/functions/api', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ fn: fn, args: args || [] })
  }).then(function(res){
    if(!res.ok) throw new Error('HTTP '+res.status);
    return res.json();
  });
}

function toggleLeader(){
  if(state.data.leader){
    state.leaderCode=''; lsDel('gp-leadercode');
    fetchData(); return;
  }
  var code = prompt(t('Enter leadership code'));
  if(!code) return;
  apiCall('getData', [code]).then(function(d){
    if(d.leader){
      state.leaderCode = code; lsSet('gp-leadercode', code);
      state.data = d; render();
    } else {
      showError(t('Wrong code'));
    }
  }).catch(function(){ showError(t('Wrong code')); });
}

function bindEvents(){
  document.getElementById('langBtn').onclick = toggleLang;
  /* Refresh spins the GP mark, the same way the boot screen and pull-to-refresh
     do. It used to swap in a "…" — a dead ellipsis that looked like nothing was
     happening, and that stayed on the button forever if the request failed,
     because only a successful render put the ↻ back. */
  document.getElementById('refreshBtn').onclick = function(){
    var btn = this;
    if(btn.dataset.busy) return;
    btn.dataset.busy = '1';
    btn.classList.add('spinBtn');
    btn.innerHTML = logoImg('spinMark') || '↻';
    var done = function(){
      delete btn.dataset.busy;
      btn.classList.remove('spinBtn');
      btn.textContent = '↻';
    };
    var p = refreshAll();
    if(p && p.then) p.then(done, done); else done();
  };
  document.getElementById('lockBtn').onclick = toggleLeader;
  document.querySelectorAll('[data-campus]').forEach(function(b){
    b.onclick = function(){ state.campus=b.getAttribute('data-campus'); if(state.view==='all') state.view='dashboard'; render(); };
  });
  var all = document.querySelector('[data-all]');
  if(all) all.onclick = function(){ state.view='all'; render(); };
  document.querySelectorAll('[data-view]').forEach(function(b){
    b.onclick = function(){
      gpTap(); state.view=b.getAttribute('data-view');
      /* The programme records are fetched the first time the tab is opened, not
         at boot: a page open costs one function invocation and most opens never
         reach this screen. Started before the render, not after, so the first
         paint is the spinner rather than a flash of "couldn't load". */
      if(state.view==='programs' && hasPrograms() && !state.progRecords && !state.progLoading && canEnterData()) loadPrograms();
      render();
    };
  });
  var gc=document.getElementById('gCreate');
  if(gc) gc.onclick=function(){ window.location.href='teams.html?reg=1'; };
  var gl=document.getElementById('gLogin');
  if(gl) gl.onclick=function(){ window.location.href='teams.html'; };
  gpBindDrill(R());
  var ds=document.getElementById('deptSel');
  if(ds) ds.onchange=function(){ state.dept=ds.value; state.ministry=Object.keys(getDepartments(state.campus)[state.dept])[0]; render(); };
  var ms=document.getElementById('minSel');
  if(ms) ms.onchange=function(){ state.ministry=ms.value; render(); };
  var ws=document.getElementById('weekSel');
  if(ws) ws.onchange=function(){ state.week=Number(ws.value); render(); };
  var sb=document.getElementById('saveBtn');
  if(sb) sb.onclick=function(){ saveCard(sb); };
  // Running-total metrics: show what the total becomes as you type the week's
  // addition, so "+5" on top of 100 visibly reads as 105.
  document.querySelectorAll('#logCard input[data-mode="sum"]').forEach(function(inp){
    inp.oninput=function(){
      var row = inp.parentNode;
      var out = row.querySelector('.newTot');
      if(!out) return;
      var add = Number(inp.value);
      if(inp.value==='' || isNaN(add) || add===0){ out.textContent=''; return; }
      var base = Number(inp.getAttribute('data-run'))||0;
      out.textContent = ' → '+fmt(base+add, inp.getAttribute('data-metric'));
    };
  });

  var dds=document.getElementById('dashDeptSel');
  if(dds) dds.onchange=function(){ state.dashDept=dds.value; render(); };
  var qs=document.getElementById('okrQSel');
  if(qs) qs.onchange=function(){ state.okrQuarter=Number(qs.value); render(); };
  var ob=document.getElementById('openOkrBtn');
  if(ob) ob.onclick=function(){ state.okrFormOpen=true; state.editingId=null; render(); };
  var cb=document.getElementById('cancelOkrBtn');
  if(cb) cb.onclick=function(){ state.okrFormOpen=false; state.editingId=null; render(); };
  var sob=document.getElementById('saveOkrBtn');
  if(sob) sob.onclick=function(){ saveOkrForm(sob); };
  document.querySelectorAll('[data-edit]').forEach(function(b){
    b.onclick=function(){ state.editingId=b.getAttribute('data-edit'); state.okrFormOpen=true; render(); };
  });
  document.querySelectorAll('[data-del]').forEach(function(b){
    b.onclick=function(){
      if(!confirm(t('Delete')+'?')) return;
      serverCall('deleteObjective', [b.getAttribute('data-del'), state.leaderCode]);
    };
  });
  document.querySelectorAll('[data-manual]').forEach(function(inp){
    inp.onchange=function(){
      var parts = inp.getAttribute('data-manual').split('|');
      var okr=null; state.data.okrs.forEach(function(o){ if(o.id===parts[0]) okr=o; });
      if(!okr) return;
      okr.krs[Number(parts[1])].manual = Number(inp.value)||0;
      serverCall('saveObjective', [okr, state.leaderCode]);
    };
  });

  if(hasPrograms()) bindPrograms();
}

/* What both refresh gestures do: the dashboard's own data always, and the
   programme records as well when that is the screen you are looking at —
   otherwise the pull appears to work while another leader's new team is still
   missing from the list. */
function refreshAll(){
  var jobs = [fetchData()];
  if(state.view==='programs' && hasPrograms() && canEnterData()){
    var p = loadPrograms();
    if(p && p.then) jobs.push(p);
  }
  return Promise.all(jobs);
}

function serverCall(fn, args){
  hideError();
  apiCall(fn, args).then(function(d){ state.data=d; render(); })
    .catch(function(){ showError("Couldn't save. Check your connection and try again."); });
}

function saveCard(btn){
  var updates=[];
  document.querySelectorAll('#logCard input[data-metric]').forEach(function(inp){
    updates.push({ dept:state.dept, ministry:state.ministry, metric:inp.getAttribute('data-metric'),
      week:state.week, value: inp.value==='' ? null : Number(inp.value) });
  });
  btn.disabled=true; btn.textContent=t('Saving…'); hideError();
  /* The server needs to know who is writing: the leadership code, or a staff
     login. Without one of them it refuses, and a staff login may only write its
     own campus. */
  var sess = staffSession() || {};
  apiCall('saveEntries', [state.campus, updates, state.leaderCode, sess.user, sess.pin]).then(function(d){
    if(d && d.ok === false){
      btn.disabled=false; btn.textContent=t('Save Week')+' '+state.week;
      showError(d.err === 'wrong_campus'
        ? t('You can only log numbers for your own campus.')
        : d.err === 'no_campus'
          ? t('Your profile has no campus yet — add one on your profile page.')
          : t('Sign in again to save numbers.'));
      return;
    }
    state.data = d; btn.innerHTML='<span class="savedSpark">✦</span> '+t('Saved');
    setTimeout(function(){ render(); }, 900);
  }).catch(function(){
    btn.disabled=false; btn.textContent=t('Save Week')+' '+state.week;
    showError("Couldn't save. Check your connection and press Save again.");
  });
}

function saveOkrForm(btn){
  var text = document.getElementById('objText').value.trim();
  if(!text){ showError(t('Objective')+'?'); return; }
  var krs=[];
  for(var k=0;k<3;k++){
    var tx = document.getElementById('krText'+k).value.trim();
    if(!tx) continue;
    krs.push({ text:tx, metricKey:document.getElementById('krMetric'+k).value,
      target:Number(document.getElementById('krTarget'+k).value)||0, manual:0 });
  }
  if(!krs.length){ showError(t('Key result')+'?'); return; }
  if(state.editingId){
    state.data.okrs.forEach(function(o){
      if(o.id===state.editingId){
        krs.forEach(function(nk){
          o.krs.forEach(function(ok){ if(ok.text===nk.text && !nk.metricKey && !ok.metricKey) nk.manual=ok.manual; });
        });
      }
    });
  }
  var obj = { id: state.editingId || ('o'+Date.now()), campus: state.campus, quarter: state.okrQuarter,
    dept: document.getElementById('objDept').value, objective: text, krs: krs };
  btn.disabled=true; btn.textContent=t('Saving…');
  apiCall('saveObjective', [obj, state.leaderCode]).then(function(d){
    state.data=d; state.okrFormOpen=false; state.editingId=null; render();
  }).catch(function(){
    btn.disabled=false; btn.textContent=t('Add objective');
    showError("Couldn't save. Check your connection and try again.");
  });
}

function showError(msg){ var e=document.getElementById('errorBar'); e.textContent=msg; e.classList.remove('hidden'); }
function hideError(){ document.getElementById('errorBar').classList.add('hidden'); }

function fetchData(){
  // Returns the promise so pull-to-refresh knows when to stop spinning.
  /* One request: getData brings the roster with it, so the dashboard no longer
     makes a second round trip for the staff headcount. */
  return apiCall('getData', [state.leaderCode]).then(function(d){
    if(d && Array.isArray(d.roster)) state.roster = d.roster;
    state.data=d; state.loaded=true;
    /* Khmer used to be fetched into a `gp-km-v2` cache, and this is where the
       cache was read — falling back to English when it was empty. Nothing writes
       that key any more (km.js ships BUILTIN_KM with the page), so the fallback
       fired every single time: a Khmer reader picked Khmer, reloaded, and the
       first data load quietly put the page back into English while the toggle
       still read ខ្មែរ. The dictionary is local now, so there is nothing to wait
       for and nothing to fall back to. */
    render();
  }).catch(function(){ showError("Couldn't load data. Pull down to refresh."); });
}

/* The dashboard is the public face of the app — anyone can read it without an
   account. The chip in the top right is the one place that changes: it's your
   face and a door to your own page if you're signed in, and an invitation to
   sign in if you're not. */
function renderUserChip(){
  var chip=document.getElementById('userChip');
  if(!chip) return;
  var card=null, session=null;
  try {
    session = JSON.parse(localStorage.getItem('gp-staff')||'null');
    card = JSON.parse(localStorage.getItem('gp-staff-card')||'null');
  } catch(e){}
  var signedIn = !!(session && session.user);

  if(!signedIn){
    chip.className='userChip guest';
    chip.innerHTML='<span aria-hidden="true">✦</span> '+esc(t('Sign in'));
    chip.setAttribute('aria-label', t('Sign in to your staff page'));
  } else {
    var name=(card&&card.name)||session.user;
    var first=String(name).trim().split(/\s+/)[0];
    var av=(card&&card.photo)
      ? '<img class="uAv" src="'+esc(card.photo)+'" alt="">'
      : '<span class="uAv">'+esc(initialsOf(name))+'</span>';
    chip.className='userChip';
    chip.innerHTML=av+'<span class="uName">'+esc(first)+'</span>';
    chip.setAttribute('aria-label', t('Open my page'));
  }
  chip.onclick=function(){
    // Going to my own page means I want to be taken there next time too.
    try { sessionStorage.removeItem('gp-skip-teams'); } catch(e){}
    window.location.href='teams.html';
  };
}
function initialsOf(name){
  return String(name||'?').trim().split(/\s+/).map(function(w){return w[0];})
    .slice(0,2).join('').toUpperCase();
}

(function(){
  renderUserChip();
  var hb=document.getElementById('helpBtn');
  if(hb) hb.onclick=function(){ window.location.href='help.html'; };
})();

/* Shared with the staff page — see gpPullToRefresh in rollup.js. */
gpPullToRefresh(function(){ return refreshAll(); });

render();
if(!window.gpLeaving) fetchData();
</script>
