/* The same Base Health figures the Health tab shows (loneliness, clarity,
   habits…), reachable from Base too, on its own period — This Week, a
   quarter, or the whole year — independent of whatever the Health tab's own
   picker is set to. */
var BASE_HEALTH_PERIODS = ['week','q1','q2','q3','q4','year'];
function baseHealthPeriodLabel(id){
  return id==='week' ? t('This Week') : id==='year' ? t('Year (YTD)') : 'Q'+id.slice(1);
}
function baseHealthAccHtml(){
  var period = S.baseHealthPeriod || 'week';
  var R = baseR(); // Year (YTD) is a chip on the year already loaded — no year picker here, unlike the Health tab's
  var ids = [S.me.campus];
  var wk = thisWeek();
  /* Its own block, same as the mockup, so every row can carry a real ▲/▼ —
     against last week, or the previous quarter. Q1 and Year have nothing
     before them to compare to, same as the mockup's own period chips. */
  var rows, score, prevRows;
  if(period==='year'){
    rows = R.surveyRows(ids); score = R.healthScore(ids); prevRows = null;
  } else if(period==='week'){
    rows = R.surveyRows(ids, wk); score = R.healthScore(ids, wk);
    prevRows = R.surveyRows(ids, wk-1);
  } else {
    var q = Number(period.slice(1))-1;
    rows = R.surveyRows(ids, undefined, q); score = R.healthScore(ids, undefined, q);
    prevRows = q>0 ? R.surveyRows(ids, undefined, q-1) : null;
  }
  var cr = (period==='week') ? R.checkinRate(ids, wk) : null;
  var summary = score===null ? t('No check-ins yet.') :
    (cr && cr.total) ? gpT('Score {n}/10 · {pct}% checked in', {n:score.toFixed(1), pct:gpCheckinPct(cr.n,cr.total)})
      : gpT('Score {n}/10', {n:score.toFixed(1)});
  return accRowHtml('baseAcc', 'health', '🏠 '+esc(t('Base Health')), summary, function(){
    var b = '<div class="deptChips">'+BASE_HEALTH_PERIODS.map(function(id){
      return '<button class="deptChip'+(period===id?' on':'')+'" data-baseHealthPeriod="'+id+'">'+esc(baseHealthPeriodLabel(id))+'</button>';
    }).join('')+'</div>';
    b += hxBtnHtml_('base');
    [['lonely','Loneliness (avg, lower is better)', false],
     ['clarity','Clarity (avg)', true],
     ['growth','Personal growth (avg)', true],
     ['langHours','Language study (avg hrs)', true]
    ].forEach(function(q2){
      var v = rows.length ? R.avg(rows, q2[0]) : null;
      var pv = (prevRows && prevRows.length) ? R.avg(prevRows, q2[0]) : null;
      var tr = (v!==null && pv!==null) ? trendBadge(pctChange(pv,v), q2[2]) : '';
      var suffix = (q2[0]==='langHours') ? '' : '/10';
      b+='<div class="row"><span class="rowName">'+esc(t(q2[1]))+'</span>'+
        '<span class="rowVal">'+(v===null?'—':v.toFixed(1)+suffix)+tr+'</span></div>';
    });
    [['sharedFaith','Shared their faith', true],['sabbath','Took a sabbath', true],
     ['porn','Looked at porn', false],['oneOnOne','Had a one-on-one', true],
     ['exercise','Exercised 3+ days', true],['quietTime','Regular quiet time', true],
     ['debt','Have staff debt', false]
    ].forEach(function(q2){
      var p = rows.length ? R.pct(rows, q2[0]) : null;
      var pp = (prevRows && prevRows.length) ? R.pct(prevRows, q2[0]) : null;
      var tr = (p!==null && pp!==null) ? trendBadge(pctChange(pp,p), q2[2]) : '';
      b+='<div class="row"><span class="rowName">'+esc(t(q2[1]))+'</span>'+
        '<span class="rowVal">'+(p===null?'—':p+'%')+tr+'</span></div>';
    });
    return b+'<p class="hint">🔒 '+esc(t('Base figures are totals only — no names, and nobody sees an individual answer.'))+'</p>';
  });
}

function deptMinistriesHtml_(dept, R, ids){
  var deps=getDepartments(S.me.campus);
  if(!deps[dept]) return '';
  var entries=(S.base && S.base.entries || {})[S.me.campus]||{};
  var b='';
  Object.keys(deps[dept]).forEach(function(min){
    b+='<div class="card"><div class="row" style="border-bottom:2px solid var(--ink)">'+
       '<span class="rowName" style="font-weight:700">'+(MIN_EMOJI[min]?MIN_EMOJI[min]+' ':'')+esc(t(min))+'</span><span></span></div>';
    deps[dept][min].forEach(function(metric){
      var mode=modeOf(metric);
      var mkey=dept+'|'+min+'|'+metric;
      var v=aggregate(entries[mkey], mode);
      var lbl=mode==='latest'?'now':(mode==='avg'?'avg':'YTD');
      var tr=R.trendFor(function(w){
        var en=entries[mkey];
        return (en && en[w]!==undefined && en[w]!==null && !isNaN(Number(en[w]))) ? Number(en[w]) : null;
      }, metric);
      b+='<div class="row drillable"'+gpDrillAttrs(metric, ids, dept, min)+'>'+
         '<span class="rowName">'+esc(t(metric))+' <span style="color:var(--faint);font-size:11px">'+lbl+'</span></span>'+
         '<span class="rowVal">'+fmt(v,metric)+tr+'</span></div>';
    });
    b+='</div>';
  });
  return b;
}

/* Base Health, for Siem Reap only — the plain avg/pct list further down in
   healthHtml() is for every OTHER campus; Siem Reap gets this instead, not
   both, because a one-time import (Jan-Jul 2026, Siem Reap only — see
   sr-checkin-history.js) exists for it and Uriah wants one section, not the
   import sitting next to Base Health's own numbers. Every yes/no question
   Base Health used to list for Siem Reap is here too (see SR_CHECKIN_
   QUESTIONS — some carry real imported history, some are live-only), so this
   IS Base Health for this campus, just with an extra quarter or two of
   history under the ones that have it. The 1-10 scales and hour totals
   (clarity, growth, loneliness, language/ministry hours) have no percentage
   to plot and are left out, same as Uriah asked.

   Every submission in the import was anonymous, so it can only ever be
   team-wide — never folded into anyone's personal health score. The app's
   own weekly check-in now asks the same questions (reworded to match — see
   WEEK_YESNO_QS / WEEK_MONTHLY_QS), so srCheckinPoints_ below appends live
   Siem Reap answers onto the same series the moment the import stops: one
   continuous line, not an old dataset next to a new one. Rendered
   defensively: sr-checkin-history.js is data-optional like km.js, so a
   missing file just means this card doesn't appear rather than breaking
   the page.

   One period at a time — Month, Quarter (the original picker) or Year, same
   three-way View picker the generic Base health section already uses — with
   two views of that period: a line chart of the overall trend (each
   question's "good" direction, so a climbing line always means things got
   better — the same flip lonely/porn/debt already get everywhere else in
   this app) and a bar chart of that period's raw "% said yes" per
   question, which is what the plain numbers elsewhere on the page mean too.
   Year has no year picker of its own (same reasoning as the generic Base
   health section: there's only ever been one year of data so far), so it
   just means "everything" — which for now reads the same as year-to-date.
   Both animate in on render via gpAnimateBars/gpAnimateLine (rollup.js) —
   same "grow from nothing" idea as gpAnimateCounts, just for shapes instead
   of digits. */
function srCheckinPoints_(q){
  var pts=[];
  (SR_CHECKIN_MANUAL_MONTHS||[]).forEach(function(m){
    if(m.pct[q.id]!==undefined){
      pts.push({month:m.month, label:SR_MONTHS_[m.month-1]+' '+m.year, pct:m.pct[q.id],
        good: q.lowerBetter ? 100-m.pct[q.id] : m.pct[q.id]});
    }
  });
  SR_CHECKIN_WEEKS.forEach(function(w){
    var qq=w.q[q.id];
    if(!qq) return;
    var month=Number(w.date.slice(5,7));
    var pct=Math.round(qq.yes/qq.n*100);
    pts.push({month:month, label:w.date.slice(5), pct:pct, good: q.lowerBetter ? 100-pct : pct});
  });
  /* Live data picks up right where the import stopped — the app's own
     weekly check-in now asks this exact question (q.liveId), so it's
     aggregated for Siem Reap the same way Base Health aggregates any other
     weekly question, and appended to the same series. One line, not two. */
  if(q.liveId && S.base){
    var R = baseR();
    var monthly = q.id.charAt(0)==='m';
    var cur = thisWeek();
    for(var wk=1; wk<=cur; wk++){
      var b = weekBounds_(wk);
      if(b.to <= SR_HISTORY_CUTOFF) continue;
      if(monthly && !isMonthEndWeek_(wk)) continue;
      var pct = R.pct(R.surveyRows(['siemreap'], wk), q.liveId);
      if(pct===null) continue;
      pts.push({month:Number(b.to.slice(5,7)), label:b.to.slice(5), pct:pct, good: q.lowerBetter ? 100-pct : pct});
    }
  }
  return pts;
}
var SR_MONTHS_=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
/* scope is 'month' | 'quarter' | 'year'; month is 1-12, quarter is 1-4 —
   only the one that matches scope is used. */
function srScopeMatcher_(scope, month, quarter){
  if(scope==='month') return function(m){ return m===month; };
  if(scope==='year') return function(){ return true; };
  return function(m){ return Math.ceil(m/3)===quarter; };
}
function srCheckinForScope_(scope, month, quarter){
  var inPeriod = srScopeMatcher_(scope, month, quarter);
  // one row per data point in the period: { label, good } averaged across
  // whichever questions actually have that point, so the line has one value
  // per week/month rather than one per question.
  var byPoint = {};
  var order = [];
  SR_CHECKIN_QUESTIONS.forEach(function(q){
    srCheckinPoints_(q).filter(function(p){ return inPeriod(p.month); }).forEach(function(p){
      if(!byPoint[p.label]){ byPoint[p.label]={label:p.label, sum:0, n:0}; order.push(p.label); }
      byPoint[p.label].sum += p.good; byPoint[p.label].n++;
    });
  });
  var line = order.map(function(l){ return {label:l, pct:Math.round(byPoint[l].sum/byPoint[l].n)}; });
  // one bar per question: its own average raw "% yes" across the period, plus
  // its own points (same shape a line chart wants) so tapping it can show its
  // own trend without recomputing anything.
  var bars = SR_CHECKIN_QUESTIONS.map(function(q){
    var pts = srCheckinPoints_(q).filter(function(p){ return inPeriod(p.month); });
    if(!pts.length) return null;
    var avg = Math.round(pts.reduce(function(s,p){ return s+p.pct; },0)/pts.length);
    return {id:q.id, label:q.en, pct:avg, points:pts.map(function(p){ return {label:p.label, pct:p.pct}; })};
  }).filter(Boolean);
  return {line:line, bars:bars};
}
function srScopeNoun_(scope){
  return scope==='month' ? t('month') : scope==='year' ? t('year') : t('quarter');
}
function srLineChartHtml_(points, scopeNoun){
  if(points.length<2) return '<p class="emptyLine">'+esc(gpT('Not enough data points this {scope} for a trend line.',{scope:scopeNoun||t('quarter')}))+'</p>';
  var W=280, H=90, pad=8;
  var step=(W-pad*2)/(points.length-1);
  var xy=points.map(function(p,i){ return [pad+i*step, pad+(H-pad*2)*(1-p.pct/100)]; });
  var path='M'+xy.map(function(p){ return p[0].toFixed(1)+','+p[1].toFixed(1); }).join(' L');
  var dots=xy.map(function(p,i){ return '<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="2.6" fill="var(--accent)"><title>'+esc(points[i].label)+': '+points[i].pct+'%</title></circle>'; }).join('');
  return '<div class="srChartReveal"><svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" class="srLineChart" role="img" aria-label="'+
    esc(gpT('Trend, {a} to {b}',{a:points[0].label,b:points[points.length-1].label}))+'">'+
    '<path d="'+path+'" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>'+
    dots+'</svg></div>'+
    '<div class="pmeta" style="display:flex;justify-content:space-between;margin-top:2px">'+
    '<span>'+esc(points[0].label)+'</span><span>'+esc(points[points.length-1].label)+'</span></div>';
}
/* Each question is its own comparison: the bar shows the quarter at a
   glance, tapping it opens that question's own trend line right underneath
   — one open at a time, so comparing two is still just two taps, not a wall
   of ten charts nobody asked to see. */
function srBarChartHtml_(bars, openId, scopeNoun){
  if(!bars.length) return '<p class="emptyLine">'+esc(gpT('No data for this {scope}.',{scope:scopeNoun||t('quarter')}))+'</p>';
  var h='<div class="srBars">';
  bars.forEach(function(b){
    var open = openId===b.id;
    h+='<div class="srBarItem">'+
      '<button class="srBarRow" data-sropen="'+esc(b.id)+'" aria-expanded="'+(open?'true':'false')+'">'+
        '<span class="rowName" style="font-size:12.5px">'+esc(t(b.label))+'</span>'+
        '<div class="srBarTrack"><div class="srBarFill" data-bar="'+b.pct+'" style="width:0%"></div></div>'+
        '<span class="srBarPct">'+b.pct+'%</span>'+
        '<span class="chev">'+(open?'▴':'▾')+'</span>'+
      '</button>'+
      (open ? '<div class="srBarChart">'+srLineChartHtml_(b.points, scopeNoun)+'</div>' : '')+
    '</div>';
  });
  return h+'</div>';
}
function srCheckinHistoryHtml(){
  if(S.me.campus!=='siemreap') return '';
  if(typeof SR_CHECKIN_QUESTIONS==='undefined' || typeof SR_CHECKIN_WEEKS==='undefined') return '';
  var scope = S.srScope || 'quarter';
  var curQ = Math.ceil((new Date().getMonth()+1)/3);
  var q = Number(S.srQuarter || curQ);
  var m = Number(S.srMonth!=null ? S.srMonth : new Date().getMonth()+1); // 1-12
  var data = srCheckinForScope_(scope, m, q);
  var scopeNoun = srScopeNoun_(scope);
  var h='<h3 style="margin-top:16px">🏠 '+esc(t('Base health'))+' · '+esc(t(campusName(S.me.campus)))+'</h3>';
  h+=hxBtnHtml_('health');
  h+='<div class="card">'+
    '<div class="pmeta" style="margin-bottom:8px">'+
    esc(t('Starts with a Jan–Jul 2026 import from a separate check-in tool, then continues from the weekly check-in below. Team-wide and anonymous — not linked to any individual profile.'))+
    '</div>'+
    '<div class="pickerRow">'+
      '<label class="pick"><span>'+esc(t('View'))+'</span><select id="srScopeSel">'+
        [['month','Month'],['quarter','Quarter'],['quarters','Quarter by quarter'],['year','Year']].map(function(sc){
          return '<option value="'+sc[0]+'"'+(scope===sc[0]?' selected':'')+'>'+esc(t(sc[1]))+'</option>';
        }).join('')+'</select></label>'+
      (scope==='month' ? '<label class="pick" style="max-width:120px"><span>'+esc(t('Month'))+'</span><select id="srMSel">'+
        MONTH_ABBR.map(function(mn,i){ return '<option value="'+(i+1)+'"'+(m===(i+1)?' selected':'')+'>'+mn+'</option>'; }).join('')+
        '</select></label>' : '')+
      (scope==='quarter' ? '<label class="pick" style="max-width:120px"><span>'+esc(t('Quarter'))+'</span><select id="srQSel">'+
        [1,2,3,4].map(function(i){ return '<option value="'+i+'"'+(q===i?' selected':'')+'>Q'+i+'</option>'; }).join('')+
        '</select></label>' : '')+
    '</div>'+
    '</div>';
  if(scope==='quarters') return h + hqHtml_();
  h+='<div class="card">'+
    '<div class="mentorLabel">'+esc(t('Overall trend (higher is better)'))+'</div>'+
    srLineChartHtml_(data.line, scopeNoun)+
    '<div class="mentorDivider"></div>'+
    '<div class="mentorLabel">'+esc(gpT('This {scope}, by question',{scope:scopeNoun||t('quarter')}))+'</div>'+
    '<p class="pmeta" style="margin:0 0 8px">'+esc(t('Tap a question to see its own trend.'))+'</p>'+
    srBarChartHtml_(data.bars, S.srOpenQ, scopeNoun)+
  '</div>';
  return h;
}

/* ---------- OKRs: the objectives that belong to somebody's job ----------
   Objectives are stored per campus, quarter and department, so a person's
   objectives are their department's — that is the only handle the data gives on
   "whose objective is this", and it is the right one: a department's objectives
   are what someone in it is working toward.

   Rendered for two readers: yourself, on Me, and a teammate, when you tap them in
   the Team directory. Both get the same thing — the job first, then what that job
   is aiming at this quarter — because an objective means little without the job it
   belongs to. Nobody's page shows the rest of the base's objectives; this is about
   one person's work.

   Read-only. Writing an objective is a leadership act and stays on the dashboard
   behind the leader code; this is for the people carrying them. */
function okrCardHtml(o, R, editable){
  var p = R.objProgress(o);
  var krs = o.krs||[];
  var open = !!S.krOpen[o.id];
  var h = '<div class="okrCard">'+
    '<div class="okrHead"><div><div class="okrObj">'+esc(o.objective)+'</div>'+
    '<div class="okrDept">'+(MIN_EMOJI[o.dept]?MIN_EMOJI[o.dept]+' ':'')+esc(t(o.dept))+'</div></div>'+
    '<div class="okrPct'+(p>=100?' done':'')+'">'+p+'%</div></div>'+
    '<div class="bar"><div class="barFill'+(p>=100?' done':'')+'" style="width:'+Math.min(100,p)+'%"></div></div>';
  if(krs.length){
    h += '<button class="linkbtn inline" data-kr-toggle="'+esc(o.id)+'" style="padding:8px 0 0">'+
      (open ? esc(t('Hide key results')) : esc(gpT('Show {n} key results',{n:krs.length})))+'</button>';
  }
  if(open) krs.forEach(function(kr, ki){
    var kp = R.krProgress(o, kr);
    /* A key result tied to a KPI shows the quarter's real figure against the
       target, so it is obvious the number came from what the ministry logged —
       and there is nothing to type. One tracked by hand is the only kind with a
       box, because it is the only kind nothing else can answer. */
    var meta, right = kp.pct+'%';
    if(kr.metricKey){
      var met = kr.metricKey.split('|')[2];
      meta = (kp.actual===null) ? esc(t('Nothing logged yet'))
        : fmt(kp.actual, met)+' / '+fmt(kr.target, met);
    } else if(editable){
      meta = esc(t('tracked by hand'));
      /* Empty, not 0, when nobody has set a figure — a 0 sitting in the box is
         a number you have to delete before you can type one. */
      right = '<input type="number" class="manualIn" min="0" max="100" placeholder="0" value="'+
        (Number(kr.manual) ? Number(kr.manual) : '')+
        '" data-okr-manual="'+esc(o.id)+'|'+ki+'">%';
    } else {
      meta = esc(t('tracked by hand'));
    }
    h += '<div class="kr"><div class="krText">'+esc(kr.text)+'</div>'+
      '<div class="krMeta"><span>'+meta+'</span><span>'+right+'</span></div>'+
      '<div class="krBar"><div class="barFill'+(kp.pct>=100?' done':'')+'" style="width:'+Math.min(100,kp.pct)+'%"></div></div>'+gpKrWarnHtml(kp)+'</div>';
  });
  if(editable){
    h += '<div class="okrActions">'+
      '<button class="danger" data-okr-del="'+esc(o.id)+'">'+esc(t('Delete'))+'</button>'+
      '<button class="linkbtn inline" data-okr-edit="'+esc(o.id)+'">'+esc(t('Edit'))+'</button></div>';
  }
  return h+'</div>';
}

/* Every metric on this campus, for tying a key result to a real KPI. Grouped by
   department so the list is navigable — a key result can measure any ministry's
   number, not just your own. */
function okrMetricOptions(selected, noneLabel){
  var deps = getDepartments(S.me.campus);
  var h = '<option value="">'+esc(t(noneLabel||'Manual progress (%)'))+'</option>';
  Object.keys(deps).forEach(function(d){
    h += '<optgroup label="'+esc(t(d))+'">';
    Object.keys(deps[d]).forEach(function(min){
      deps[d][min].forEach(function(met){
        var key = d+'|'+min+'|'+met;
        h += '<option value="'+esc(key)+'"'+(selected===key?' selected':'')+'>'+
          esc(t(min)+' · '+t(met))+'</option>';
      });
    });
    h += '</optgroup>';
  });
  return h;
}

/* Same note as the dashboard's editor, from the same helper. */

/* The write form. Three key-result slots, same as the dashboard's — enough to be
   useful, few enough that an objective stays an objective. */

    esc(t(editing?'Edit objective':'New objective'))+'</div>';

    '<input type="text" id="okrObjText" value="'+(editing?esc(editing.objective):'')+'" '+

      '<input type="text" id="okrKrText'+k+'" value="'+esc(kr.text)+'">'+
      '<label class="f">'+esc(t('Measure by'))+'</label>'+
      '<select id="okrKrMetric'+k+'">'+okrMetricOptions(kr.metricKey)+'</select>'+
      '<label class="f">'+esc(t('Target (if linked to a KPI)'))+'</label>'+

    '<button class="btn ghost" id="okrCancelBtn">'+esc(t('Cancel'))+'</button></div>';
  return h;
}

/* One person's objectives, with the job they belong to on top. `who` is any
   staff record — yourself or a teammate. `mine` turns on the wording addressed
   to you, and the editing controls: you may write your own department's
   objectives, never another department's, which the server enforces too.

   A department overseer (dept: Campus Leadership, ministry: e.g. Community
   Service) sees their OWN department's objectives (Campus Leadership's) plus
   the objectives of the department they lead — two sets, same as the
   "Ministries You Oversee" section on My Ministry. When there's more than
   one objective to show, they're paged one at a time instead of stacked, so
   the section stays short; each card still says which department it
   belongs to. */
function okrSectionHtml(who, mine, noHeading){
  var wk = thisWeek();
  var qNow = Math.min(4, Math.floor((wk-1)/13)+1);
  var dept = who.dept==='Base Director' ? 'Campus Leadership' : who.dept;
  var depts = [dept];
  var oversees = oversightDeptOf_(who);
  if(oversees && depts.indexOf(oversees)===-1) depts.push(oversees);
  var h = noHeading ? '' : ('<h3'+(mine?' id="sec-okr"':'')+'>🎯 Q'+qNow+' '+esc(t('OKRs'))+'</h3>');

  var focus = (typeof jobFocus==='function') ? jobFocus(dept, who.ministry) : null;
  if(focus){
    h += '<div class="focusCard"><div class="fLabel">'+
      esc(t(mine ? 'Your focus' : 'Their focus'))+'</div>'+
      '<div class="fMin">'+esc(t(who.ministry || dept))+'</div>'+
      '<p>'+esc(focus)+'</p></div>';
  }

  if(!S.base){
    return h+'<div class="card"><p class="sub" style="margin:0">'+esc(t('Loading your base…'))+'</p></div>';
  }
  var R = baseR();
  var theirs = (S.base.okrs||[]).filter(function(o){
    return o.campus===who.campus && Number(o.quarter)===qNow && depts.indexOf(o.dept)>-1;
  });

  if(!theirs.length && !(mine && S.okrForm)){
    h += '<div class="card"><p class="sub" style="margin:0">'+
      esc(t(mine ? 'No objectives set for your department this quarter.'
                 : 'No objectives set for their department this quarter.'))+'</p></div>';
  }
  if(theirs.length){
    if(theirs.length>1){
      S.okrIdx = Math.max(0, Math.min(S.okrIdx||0, theirs.length-1));
      h += '<div class="weekNavRow" style="margin-bottom:8px">'+
        '<button class="weekArrow" id="okrPrev" aria-label="'+esc(t('Previous'))+'"'+(S.okrIdx<=0?' disabled':'')+'>‹</button>'+
        '<div class="weekPill">'+esc(gpT('{n} of {total}',{n:S.okrIdx+1,total:theirs.length}))+'</div>'+
        '<button class="weekArrow" id="okrNext" aria-label="'+esc(t('Next'))+'"'+(S.okrIdx>=theirs.length-1?' disabled':'')+'>›</button>'+
      '</div>';
    }
    var shown = theirs.length>1 ? theirs[S.okrIdx] : theirs[0];
    /* Edit/delete only on your OWN department's objective — the server
       refuses a write against a department you merely oversee, same as
       writing its ministries' KPIs numbers goes through a different,
       explicitly-authorized path (saveMinistryFor), not this one. */
    h += okrCardHtml(shown, R, mine && shown.dept===dept);
  }

  if(mine){
    if(S.okrForm){
      var editing = null;
      if(S.okrEditId) theirs.forEach(function(o){ if(o.id===S.okrEditId) editing=o; });
      h += okrFormHtml(editing);
    } else {
      h += '<button class="btn ghost" id="okrNewBtn">+ '+esc(t('New objective'))+'</button>';
    }
  }

  if(theirs.length){
    h += '<p class="hint">'+esc(t('Progress comes from what your ministry logs each week, not from ticking a box here.'))+'</p>';
  }
  return h;
}

/* Writing an objective. The server re-checks everything: it takes the campus and
   department from the staff record rather than from this payload, and refuses an
   id that belongs to another department. So the worst a bad request here can do
   is fail. */
function okrSave(btn){
  var text = (document.getElementById('okrObjText').value||'').trim();
  if(!text){ showMsg(t('Give the objective a name first.')); return; }
  var krs = [];
  for(var k=0;k<3;k++){
    var tx = (document.getElementById('okrKrText'+k).value||'').trim();
    if(!tx) continue;
    krs.push({ text:tx,
      metricKey: document.getElementById('okrKrMetric'+k).value,
      target: Number(document.getElementById('okrKrTarget'+k).value)||0,
      manual: 0 });
  }
  if(!krs.length){ showMsg(t('Add at least one key result.')); return; }

  /* Keep the hand-tracked percentages already entered: the form does not show
     them, so re-saving an objective must not silently reset them to zero. */
  if(S.okrEditId){
    (S.base.okrs||[]).forEach(function(o){
      if(o.id!==S.okrEditId) return;
      krs.forEach(function(nk){
        if(nk.metricKey) return;
        (o.krs||[]).forEach(function(ok){
          if(ok.text===nk.text && !ok.metricKey) nk.manual = Number(ok.manual)||0;
        });
      });
    });
  }

  var myDept = S.me.dept==='Base Director' ? 'Campus Leadership' : S.me.dept;
  var obj = {
    id: S.okrEditId || ('o'+Date.now()),
    campus: S.me.campus,
    quarter: Math.min(4, Math.floor((thisWeek()-1)/13)+1),
    dept: myDept,
    objective: text,
    krs: krs
  };
  btn.disabled = true; btn.textContent = t('Saving…');
  run('saveObjective', [obj, '', S.auth.user, S.auth.pin], function(d){
    // saveObjective answers with the whole getData payload; if it didn't, the
    // write was refused, so say so rather than blanking the page.
    if(d && d.entries){ S.base = d; S.okrForm = false; S.okrEditId = null; showMsg(t('Saved')); }
    else { btn.disabled = false; btn.textContent = t('Save changes'); showMsg(t('That didn’t save — try again.')); }
    render();
  });
}

function okrDelete(id){
  run('deleteObjective', [id, '', S.auth.user, S.auth.pin], function(d){
    if(d && d.entries){ S.base = d; S.okrForm = false; S.okrEditId = null; }
    else showMsg(t('That didn’t save — try again.'));
    render();
  });
}

/* A hand-tracked key result is the one number a person moves themselves, so it
   saves on change rather than making them open the form for it. */
function okrSetManual(id, index, pct){
  var target = null;
  (S.base.okrs||[]).forEach(function(o){ if(o.id===id) target=o; });
  if(!target || !target.krs || !target.krs[index]) return;
  var copy = {
    id: target.id, campus: target.campus, quarter: target.quarter,
    dept: target.dept, objective: target.objective,
    krs: target.krs.map(function(kr, i){
      return { text:kr.text, metricKey:kr.metricKey||'',
        target:Number(kr.target)||0,
        manual: i===index ? Math.max(0, Math.min(100, Number(pct)||0)) : (Number(kr.manual)||0) };
    })
  };
  run('saveObjective', [copy, '', S.auth.user, S.auth.pin], function(d){
    if(d && d.entries){ S.base = d; showMsg(t('Saved')); }
    else showMsg(t('That didn’t save — try again.'));
    render();
  });
}

/* ---------- my week: the personal page ---------- */

/* The app knows what day it is. Monday you're setting goals, midweek you're
   keeping habits, Friday you're closing the week out — so the card that matters
   today sits at the top instead of the same fixed wall every day. */
function weekPhase(){
  var dow=new Date().getDay();               // 0 Sun … 6 Sat
  if(dow===1||dow===2) return 'plan';
  if(dow===5||dow===6||dow===0) return 'review';
  return 'work';
}
function phaseBanner(phase, wk){
  var rec=goalsForWeek(wk);
  var hasGoals=!!(rec && rec.items.some(function(i){return i.text;}));
  if(phase==='plan' && !hasGoals)
    return '<div class="banner big">🎯 <strong>Start of the week.</strong> Pick the three things that matter for week '+wk+'.'+
      ' <button class="linkbtn inline" id="jumpGoals">Set them now</button></div>';
  if(phase==='review'){
    /* Goals-incomplete used to show as its own big banner here — it's in the
       notification bell now (see notifItems_) so My Home isn't stacking
       two "end of the week" banners on top of each other. */
    if(!thisWeekLogs().length)
      return '<div class="banner big">💚 <strong>'+esc(t('End of the week.'))+'</strong> No days logged yet — '+
        'your week’s health figures come straight from these.'+
        ' <button class="linkbtn inline" id="jumpToday">'+esc(t('Log today'))+'</button></div>';
  }
  return '';
}

/* --- annual goals (SMART) ---
   A personal list, by year and category — nothing here feeds the base's own
   figures the way a ministry KPI or a weekly check-in does. Six fixed
   categories from the mockup; the chips are a filter, not a per-goal field,
   so switching category only changes what's showing, never what's saved. */
function smartYear_(){ return S.smartYear==null ? new Date().getFullYear() : S.smartYear; }
function annualGoalsHtml(){
  var year=smartYear_(), cat=S.smartCategory||'Faith';
  var h='<h3 id="sec-annual">'+esc(t('Annual Goals · SMART'))+'</h3><div class="card">';
  h+='<div class="yearPick"><button class="yearBtn" id="smartPrevYear" aria-label="'+esc(t('Previous year'))+'">‹</button>'+
     '<span class="yearNum">'+year+'</span>'+
     '<button class="yearBtn" id="smartNextYear" aria-label="'+esc(t('Next year'))+'">›</button></div>';
  h+='<div class="catChips">'+SMART_CATEGORIES.map(function(c){
    return '<button class="catChip'+(cat===c?' on':'')+'" data-smartcat="'+c+'">'+esc(t(c))+'</button>';
  }).join('')+'</div>';

  var mine=S.smartGoals.filter(function(g){ return Number(g.year)===Number(year) && g.category===cat; });
  if(!mine.length && !(S.smartDraft && !S.smartDraft.id)){
    h+='<p class="sub" style="margin:4px 0 10px">'+esc(t('No goals set for this category yet.'))+'</p>';
  }
  mine.forEach(function(g){

/* The top of My Home — Base's own hero card, styled identically and
   populated with personal figures (streak, this week's goals, today's

function miniDashboardHtml(){
  var wk=thisWeek();
  var st=graceStreak(function(){return true;});
  var rec=goalsForWeek(wk);
  var written=(rec && rec.items ? rec.items : []).filter(function(i){return i && i.text;});

  var log=logForDate(todayStr());

  var habitsPct=list.length ? Math.round(habitsDone/list.length*100) : 0;
  var year=String(new Date().getFullYear());

  var c=checkinForWeek(wk);
  var score=c?compositeOf(c):null;

  var prevC=checkinForWeek(wk-1);
  var prevScore=prevC?compositeOf(prevC):null;
  var healthTrend=(score!==null&&prevScore!==null)?trendBadge(pctChange(prevScore,score),true):'';
  var mentorId=S.me.mentorId||'';
  var mentorRec=mentorId?personOf(mentorId):null;
  var mentorName=mentorId?(mentorRec?mentorRec.name:nameOf(mentorId)):'';
  var mentorPct=mentorId?100:0;
  var habitBest=list.reduce(function(m,hb){ return Math.max(m, bestStreak(habitPred(hb.id))); }, 0);

  var p=S.profile||{};
  var color=p.dashboardColor||'';
  var bg=p.dashboardBg||'';
  var custom=!!(color||bg);
  var open=!!S.dbCustomize;

  /* The name-and-face greeting moved here from Base — Base is ministry
     stats, not a personal page, and this is the one card that's actually
     yours. Same .baseMe markup Base used to show it with. */
  var h='<div class="miniDashHead">'+
      '<div class="baseMe">'+avatarHtml(S.me,'')+
        '<div><div class="pmeta">'+esc(t(greeting()))+'</div>'+
        '<div class="pname">'+esc(S.me.name)+'</div>'+
        '<div class="pmeta">'+esc(t(S.me.role||S.me.dept))+

        '</div></div>'+

        '<span class="ic">⚙️</span></button>'+
    '</div>';

  /* Base's own hero, reused whole — same classes, same look, populated with
     personal figures instead of the base's. The streak leads because it's
     the one number here that's purely for the person holding the phone, the
     same reason Base leads with the campus's total staff. Each ring/sub row
     is a button now: tapping one jumps straight to the section it's about,
     the same [data-jump] the quick-jump strip already uses. */
  /* Two halves, split by a faded rule: what you're aiming at this week (the
     three goals, and the two things you most often come here to do — the
     health check-in and your ministry's numbers), then how the week is going
     (streak, habits, health score, mentor). Goals lead because sitting under
     the big streak number read as an afterthought in the middle of the card. */
  h+='<div class="hero myHero'+(custom?' custom':'')+'"'+
    (custom?' style="'+(color?'background-color:'+esc(color)+';':'')+(bg?'background-image:url(\''+esc(bg)+'\');':'')+'"':'')+'>'+
    '<button class="heroRow'+(written.length?' withList':'')+'" data-jump="sec-goals">'+gpRingHtml(goalsPct,'sm',t('Weekly Goals'))+
      '<div class="heroTrend">'+esc(t('Weekly Goals'))+' <b class="heroFig">'+goalsDone+'</b>/'+written.length+'</div>'+
      (written.length?'<div class="heroGoalsPreview">'+written.map(function(g){
        return '<div><span class="heroGoalDot" style="background:'+gpRingColor(goalItemPct(g))+'"></span>'+esc(g.text)+'</div>';
      }).join('')+'</div>':'')+
    '</button>'+
    '<div class="heroQuick">'+
      '<button id="dashToHealth">💚 '+esc(t('Health check-in'))+'</button>'+
      '<button id="dashToMinistry">📊 '+esc(t('My Ministry'))+'</button>'+
    '</div>'+
    '<div class="heroDivider"></div>'+
    '<div class="heroLabel">'+esc(t('WEEK'))+' '+wk+'</div>'+
    '<div class="heroNum" data-count="'+st+'">0</div>'+

    '<button class="heroRow" data-jump="sec-mentor">'+gpRingHtml(mentorPct,'sm',t('Mentor'))+

  if(open){

        '<button class="btn ghost" id="dashBgBtn" style="width:auto;margin:0;padding:9px 14px">'+(bg?esc(t('Change image')):esc(t('Add image')))+'</button>'+
        (bg?'<button class="btn ghost" id="dashBgClearBtn" style="width:auto;margin:0;padding:9px 14px">'+esc(t('Remove'))+'</button>':'')+
      '</div>'+
      '<input type="file" accept="image/*" id="dashBgInput" style="display:none">'+

  return h;

/* Recent updates for the personal dashboard — leave decisions on my own
   requests, a mentee's leave request waiting on me, and 1-on-1 activity.
   Purely computed from state already on the page (trips, tripRequests,
   oneOnOnes), the same way streaks and badges are derived rather than
   stored — there's no separate "seen/unseen" tracking, just what's recent. */
function notifActionBtnsHtml_(okAttr, okId, noAttr, noId, okLabel, noLabel){
  return '<span class="chips" style="margin:0">'+
    '<button class="linkbtn" style="width:auto;margin:0;padding:6px 10px" data-'+okAttr+'="'+esc(okId)+'">'+esc(okLabel)+'</button>'+
    '<button class="linkbtn" style="width:auto;margin:0;padding:6px 10px;color:var(--faint)" data-'+noAttr+'="'+esc(noId)+'">'+esc(noLabel)+'</button>'+
  '</span>';
}
/* The full list, unfiltered — shared by the My Home card below and the
   header bell, so the two can never show a different set of events. Nothing
   is stored for this: it's read straight off state the page already has
   (trips, tripRequests, oneOnOnes), the same way streaks and badges are
   derived rather than stored. */
function notifItems_(){
  var items=[];
  (S.tripRequests||[]).forEach(function(r){
    var range=r.from+(r.to!==r.from?' → '+r.to:'');
    /* When this was ASKED, not when the leave itself falls — a request
       submitted today for next month must still be clearable today, the
       same way a 1-on-1 request already sorts and clears by S.created. */
    items.push({ when:r.created||r.from, text: gpT('{name} requested leave {range}', {name:r.name, range:range}),
      actions: notifActionBtnsHtml_('trok', r.id, 'trno', r.id, t('Approve'), t('Deny')) });
  });
  (S.oneOnOnes||[]).forEach(function(o){
    if(!o.mine && o.status==='pending'){
      items.push({ when:o.created, text: gpT('{name} requested a 1-on-1', {name:o.otherName}),
        actions: notifActionBtnsHtml_('121accept', o.id, '121decline', o.id, t('Accept'), t('Decline')) });
    } else if(o.mine && o.status==='accepted'){
      items.push({ when:o.decidedAt||o.created, text: gpT('{name} accepted your 1-on-1 request', {name:o.otherName}) });
    } else if(o.mine && o.status==='declined'){
      items.push({ when:o.decidedAt||o.created, text: gpT('{name} declined your 1-on-1 request', {name:o.otherName}) });
    }
  });
  (S.trips && S.trips.trips || []).forEach(function(r){
    var range=r.from+(r.to!==r.from?' → '+r.to:'');
    if(r.status==='approved'){
      items.push({ when: r.decidedAt||r.from, text: gpT('Your {range} leave request was approved', {range:range}) });
    } else if(r.status==='declined'){
      items.push({ when: r.decidedAt||r.from, text: gpT('Your {range} leave request was declined', {range:range}) });
    }
  });
  /* An admin's own words, sent to everyone — free text, so it never runs
     through t()/gpT like the rest of this list; only the "Announcement"
     label is translated. */
  (S.broadcasts||[]).forEach(function(b){
    items.push({ when:b.created, text:'📣 '+t('Announcement')+': '+b.text });
  });
  /* A nudge, not a server-tracked item — Friday through the end of the week,
     if this week's check-in is still unanswered. "when" is that Friday's own
     date, so clearing it only holds through the rest of THIS week: next
     week's Friday is a later date, past the clear cutoff, so the same nudge
     reappears fresh rather than staying cleared forever. */
  if(S.me){
    var nwk=thisWeek(), nfri=new Date(weekBounds_(nwk).from);
    nfri.setDate(nfri.getDate()+4);
    if(new Date(todayStr())>=nfri && !myWeekRow(nwk)){
      items.push({ when:isoDateOf_(nfri), text:t('Your weekly health check-in is due'),
        actions:'<button class="linkbtn" style="width:auto;margin:0;padding:6px 10px" data-gohealth="1">'+esc(t('Answer it'))+'</button>' });
    }
  }
  /* End of the week, goals not all the way there — used to be a big banner
     inline on My Home; it's a bell item instead now so the page isn't
     stacking two "end of the week" banners at once. Same Friday-dated
     "when" as the health nudge above, so it clears with the rest of the
     week and comes back fresh next week. */
  if(S.me && weekPhase()==='review'){
    var ggwk=thisWeek(), ggrec=goalsForWeek(ggwk);
    var ggHasGoals=!!(ggrec && ggrec.items.some(function(i){ return i.text; }));
    if(ggHasGoals && ggrec.pct!==null && ggrec.pct<100){
      var ggfri=new Date(weekBounds_(ggwk).from); ggfri.setDate(ggfri.getDate()+4);
      items.push({ when:isoDateOf_(ggfri), text:gpT('Your three goals are {pct}% of the way there.',{pct:ggrec.pct}),
        actions:'<button class="linkbtn" style="width:auto;margin:0;padding:6px 10px" data-jumpgoals="1">'+
          esc(gpT('Close out week {wk}',{wk:ggwk}))+'</button>' });
    }
  }
  /* Every account made before email became part of sign-up has none yet —
     "when" is always right now, computed fresh every render, so this never
     ages past a Clear the way the others above do: clearing sets
     notifClearedAt to this same instant, and the next render's "now" is
     always a moment later, so the item is straight back. It's meant to
     stay until the email is actually added, not until someone taps Clear.
     bellOnly: this is true for nearly every existing account at once, so an
     inline card on My Home would be permanent, above-the-fold clutter
     for almost everybody — the bell (and its dot) is visible enough. */
  /* HR reminders — for an admin or anyone with HR. Dated today (not now),
     so Clear hides them until tomorrow and they come back while the work
     is still waiting: a contract to renew, a candidate to follow up. */
  if(S.me && (S.me.isAdmin || S.me.hr)){
    var hrBtn='<button class="linkbtn" style="width:auto;margin:0;padding:6px 10px" data-gohr="1">'+esc(t('Open HR'))+'</button>';
    if(S.hrDue) items.push({ when:todayStr()+'T23:59:59.000Z', text: S.hrDue===1 ? t('1 staff contract is due for renewal') : gpT('{n} staff contracts are due for renewal',{n:S.hrDue}), actions:hrBtn });
    if(S.hrFollowUps) items.push({ when:todayStr()+'T23:59:58.000Z', text: S.hrFollowUps===1 ? t('1 candidate follow-up is due') : gpT('{n} candidate follow-ups are due',{n:S.hrFollowUps}), actions:hrBtn });
  }
  if(S.me && !(S.profile && S.profile.email)){
    items.push({ when:new Date().toISOString(), text:t('Add your email to your profile'),
      actions:'<button class="linkbtn" style="width:auto;margin:0;padding:6px 10px" data-goprofile="1">'+esc(t('Add it'))+'</button>',
      bellOnly:true });
  }
  items.sort(function(a,b){ return (b.when||'')<(a.when||'')?-1:1; });
  return items;
}

/* What's actually shown: everything since the last Clear. A single "cleared
   before" cutoff rather than a per-item read flag — Clear on the bell or on
   My Home is the same button, so both can never disagree about what's
   left. Clearing an actionable row (a mentee's leave request, an incoming
   1-on-1) only tidies this feed — the request itself is still sitting in
   Leave Request / Mentorship / Team, waiting on you, either way. */
function visibleNotifItems_(){
  var cut = S.notifClearedAt || '';
  return notifItems_().filter(function(it){ return (it.when||'') > cut; });
}

function clearNotifications(){
  S.notifClearedAt = new Date().toISOString();
  lsSet('gp-notif-cleared', S.notifClearedAt);
  S.bellOpen=false;
  render();
}

/* A little inbox, not a wall of cards: things waiting on you (a mentee's
   leave request, an incoming 1-on-1) get inline Approve/Deny or Accept/
   Decline right here — same handlers the full Leave Request page and the
   Mentorship card already use — so acting on one doesn't require leaving
   the dashboard. Everything else here is just FYI, no action needed. */
function notificationsHtml(){
  // bellOnly items (a standing nudge true of nearly every account, not a
  // one-off event) live in the bell drawer only — see notifItems_.
  var items=visibleNotifItems_().filter(function(it){ return !it.bellOnly; });
  if(!items.length) return '';
  var h='<div class="card"><div class="goalCardTitle" style="margin-bottom:8px">🔔 '+esc(t('Updates'))+'</div>';
  items.slice(0,5).forEach(function(it){
    h+='<div class="row"><span class="rowName">'+esc(it.text)+'</span>'+(it.actions||'')+'</div>';
  });
  h+='<button class="linkbtn" id="notifClearBtn" style="margin-top:4px">'+esc(t('Clear all'))+'</button>';
  return h+'</div>';
}

/* One tap to any section on this tab, instead of scrolling past everything
   above it. Same order as the sections themselves. Account has no section of
   its own to scroll to — it's a card at the very bottom that opens the
   profile screen — so that chip still navigates rather than scrolling. */
function quickJumpHtml(){
  var jumps=[['sec-goals','Weekly Goals'],['sec-habits','Daily'],['sec-kpi','My Ministry'],['sec-okr','OKRs'],
    ['sec-annual','Annual Goals'],['sec-mentor','Mentorship'],['sec-health','My Health'],['sec-leave','Leave']];
  var h='<div class="quickBar">';
  jumps.forEach(function(j){
    h+='<button class="quickChip" data-jump="'+j[0]+'">'+esc(t(j[1]))+'</button>';

/* Streaks, this week's totals, and recent days — carried over from the old
   Me tab verbatim. Folded in here as its own block rather than interleaved
   with the goal/habit/KPI cards above, since it's a look-back, not a task. */
/* This week's totals — sits with My Health, since every figure in it is a
   health-adjacent tally (hours, workouts, one-on-ones), not a habit tap. */
function weekStatsHtml(){
  var wl=thisWeekLogs();
  var h='<h3>📅 '+esc(t('This week'))+'</h3><div class="grid">';
  var cells=[
    [sum(wl,function(r){return r.langHours;}).toFixed(1),'Language hrs'],
    [sum(wl,function(r){return r.minHours;}).toFixed(1),'Ministry hrs'],
    [count(wl,function(r){return r.workout;}),'Workout days'],
    [count(wl,function(r){return r.quietTime;}),'Quiet-time days'],
    [count(wl,function(r){return r.bible;}),'Bible days'],
    [count(wl,function(r){return r.oneOnOne;}),'One-on-ones'],
    [count(wl,function(r){return r.sharedFaith;}),'Shared faith'],
    [count(wl,function(r){return r.sabbath;}),'Sabbaths']
  ];
  cells.forEach(function(c){ h+='<div class="stat"><div class="statNum">'+c[0]+'</div><div class="statLabel">'+esc(t(c[1]))+'</div></div>'; });
  return h+'</div>';
}

/* The daily log, day by day — sits with Habit Tracker, since it's the same
   daily taps read back as a history instead of a run. */
function recentDaysHtml(){
  var h='<div class="card"><div class="goalCardTitle" style="margin-bottom:8px">🗓️ '+esc(t('Recent days'))+'</div>';
  if(!S.logs.length) h+='<p class="sub" style="margin:6px 0">No entries yet — log your first day on the Today tab.</p>';
  S.logs.slice(0,7).forEach(function(l){
    var bits=[];
    if(l.langHours) bits.push(l.langHours+'h lang');
    if(l.minHours) bits.push(l.minHours+'h min');
    if(l.workout) bits.push('workout');
    if(l.quietTime) bits.push('quiet time');
    if(l.bible) bits.push('Bible');
    h+='<div class="row"><span class="rowName">'+esc(l.date)+'<div class="pmeta">'+(bits.join(' · ')||'—')+'</div></span></div>';
  });
  return h+'</div>';
}

/* One line, not a form. If you log days, this is the week those days work out to
   — tap to see what the base would receive. The weekly form on the Health tab is
   the other way in, and the one most people use; a week answered there wins over
   this, so nothing here can overwrite an answer you gave deliberately. */
function weekSummaryHtml(wk){
  var c=checkinForWeek(wk);
  var wl=thisWeekLogs();
  if(!c && !wl.length) return '';
  var open=S.weekOpen;
  // Your own weekly score, using exactly the maths the base dashboard uses on
  // the pooled data — so the chain daily → your week → base health is visible
  // rather than something that happens off-screen.
  var score = c ? compositeOf(c) : null;
  // No score until there's enough of a week to mean anything — showing a low
  // number built from one day would just be wrong, and it isn't sent to the
  // base either. Say how many more days instead.
  var short = MIN_WEEK_DAYS - wl.length;
  var sub = score!==null ? gpT('{n} of 7 days logged',{n:wl.length})
    : (wl.length===0 ? t('log a day and this starts filling in')
                     : gpT('{n} days logged · {m} more for your score',{n:wl.length,m:short}));
  var h='<div class="card slim" id="sec-health"><button class="discloseBtn" id="weekToggle">'+
    '<span><strong>💚 '+esc(t('My health'))+' · '+esc(t('week'))+' '+wk+'</strong>'+
    '<div class="pmeta">'+esc(sub)+'</div></span>'+
    '<span class="'+(score===null?'chev':'pctBig')+'">'+
      (score===null ? (open?'▴':'▾') : score.toFixed(1))+'</span></button>';
  if(score!==null){
    h+='<div class="bar" style="margin-top:8px"><div class="barFill'+(score>=8?' done':'')+
       '" style="width:'+Math.round(score*10)+'%"></div></div>'+
       '<div class="pmeta">'+esc(gpT('Health score out of 10, from the {n} days you logged',{n:wl.length}))+
       ' · '+esc(gpT('feeds the base total for {campus}',{campus:t(campusName(S.me.campus))}))+
       ' · <button class="linkbtn inline" id="toHealthTab">'+esc(t('answer the week directly'))+'</button></div>';
  }
  if(open && c){
    var yn=function(v){ return v? 'yes':'no'; };
    var rows=[
      ['Loneliness (avg)', c.lonely||'—'],
      ['Clarity (avg)', c.clarity||'—'],
      ['Growth (avg)', c.growth||'—'],
      ['Exercised 3+ days', yn(c.exercise)],
      ['Regular quiet time', yn(c.quietTime)],
      ['One-on-one', yn(c.oneOnOne)],
      ['Shared faith', yn(c.sharedFaith)],
      ['Sabbath', yn(c.sabbath)],
      ['Language hours', c.langHours||0],
      ['Ministry hours', c.minHours||0]
    ];
    h+='<div style="margin-top:10px">';
    rows.forEach(function(r){
      h+='<div class="row"><span class="rowName">'+esc(r[0])+'</span><span class="pctSm">'+esc(String(r[1]))+'</span></div>';
    });
    h+='<p class="hint" style="margin-top:8px">Leaders only ever see these pooled with everyone else’s — never your name.</p></div>';
  } else if(open){
    h+='<p class="sub" style="margin:10px 0 0">Nothing yet for this week. It appears once you log a day.</p>';
  }
  return h+'</div>';
}

/* How many days running for each habit you're still keeping. Lives right
   under Habit Tracker — it's the same daily taps, read back as a run. */
function streaksHtml(){
  var runs=myHabits().map(function(hb){
    var meta=habitMeta(hb.id);
    return { label:meta.label, icon:meta.icon, now:graceStreak(habitPred(hb.id)), best:bestStreak(habitPred(hb.id)) };
  }).filter(function(r){ return r.now>0 || r.best>0; });
  if(!runs.length) return '';
  var h='<div class="card"><div class="goalCardTitle" style="margin-bottom:8px">🔥 '+esc(t('Streaks'))+'</div>';
  runs.forEach(function(r){
    h+='<div class="row"><span class="rowName">'+r.icon+' '+esc(t(r.label))+
      '<div class="pmeta">'+esc(gpT('best {n} days',{n:r.best}))+'</div></span>'+
      '<span class="pctSm">'+r.now+'d</span></div>';
  });

function todaySummaryLine(log){
  if(!log) return t('Not logged yet');
  var bits=[];
  if(log.langHours) bits.push(log.langHours+'h language');
  if(log.minHours) bits.push(log.minHours+'h ministry');
  if(log.clarity!=null) bits.push('clarity '+log.clarity);
  if(log.growth!=null) bits.push('growth '+log.growth);
  return bits.length ? bits.join(' · ') : 'Nothing added yet';
}


/* --- three weekly goals --- */
/* ---- goal progress: percentage, not a tick ----
   goalItemPct reads either shape, because rows written before this stored `done`.
   The colour walks amber → blue → green as the number climbs, so a row's state is
   legible before you read the digits; the word underneath says the same thing for
   anyone who cannot pick those colours apart. */
function goalItemPct(g){
  if(!g) return 0;
  var n = Number(g.pct);
  if(g.pct!==undefined && g.pct!==null && g.pct!=='' && isFinite(n)) return Math.max(0, Math.min(100, Math.round(n)));
  return g.done ? 100 : 0;
}
/* The week's own figure is the average of what's actually written — three
   goals at 60% is a 60% week, same rule saveGoals uses server-side. Needed
   client-side too now, for the record an offline save shows before there's
   been any round trip to ask the server what it thinks. */
function gpGoalsWeekPct_(items){
  var written = (items||[]).filter(function(i){ return i && i.text; });
  if(!written.length) return null;
  var sum = written.reduce(function(s,i){ return s+goalItemPct(i); },0);
  return Math.round(sum/written.length);
}
/* Thin wrappers over rollup.js, so the dashboard and this page cannot disagree
   about what 60% looks like. */
function pctColor(p){ return gpPctColor(p); }
function pctWord(p){ return gpPctWord(p); }

/* --- your ministry's KPIs, editable without leaving this page --- */
/*  Everything the dashboard's log form asks of this ministry, on the person's
    own page — and split the way the numbers actually behave, because one box
    cannot serve both kinds:

      · counts (sum mode) — something that happened today. Typed per day; the
        server rolls the days into the week, so the weekly figure is never typed
        twice. The box is today's addition, and it says what the week becomes.
      · levels and scores (latest / avg) — a headcount or a 1-10 judgement about
        the whole week. Typed once for the week, and carried forward already
        filled in from the last week that has one, exactly as the dashboard does
        it, so nobody retypes 280 students every Monday.

    A level must never be written as a daily row: a headcount is not something you
    add up, and the daily roll-up owns any metric it touches (see CLAUDE.md), so
    the two would fight over the same weekly cell.

    Formats come from fmt() and modeOf() — the same two functions the dashboard
    uses — so a dollar figure, a 1-10 score and a percentage read the same in both
    places. */
/*  The last figure a level actually had, and which week it came from.

    `entries` only covers this year, which is right for totals and wrong for the
    headcounts that barely move: "Students Enrolled" last typed in week 50 of last
    year is still the enrolment in week 2 of this one, so the box came up empty and
    somebody had to remember 280 and retype it. A headcount does not reset because
    the calendar did.

    So when this year holds nothing earlier, fall back to the server's `prev` map
    (prevLevels_ in api.js), which looks across every year. Returns
    {week, value, year} — the year is carried through so the label can say week 50,
    2025 instead of implying last week. */
function prevLevel_(wks, wk, metric, prevMap){
  var p = lastBefore(wks, wk);
  if(p !== null) return { week:p.week, value:p.value, year:kpiYear_() };
  var q = prevMap && prevMap[metric];
  if(!q) return null;
  var qy=Number(q.year), qw=Number(q.week), qv=Number(q.value);
  if(!isFinite(qy) || !isFinite(qw) || !isFinite(qv)) return null;
  /* This year's earlier weeks are already in `wks`, so anything the map offers
     from this year is at or after the week on screen — not something to carry. */
  if(qy > kpiYear_() || (qy === kpiYear_() && qw >= Number(wk))) return null;
  return { week:qw, value:qv, year:qy };
}

function kpiYear_(){ return new Date().getFullYear(); }

/*  The " · carried from week 50, 2025 ▲ 12" tail under a level's box. Your own
    ministry's weekly card and an overseer's had drifted into two copies of this
    paragraph; they share it now so a fix lands in both. */
function levelPrevSubHtml_(p, metric, carried, typed){
  var stamp = String(p.week) + ((p.year && p.year !== kpiYear_()) ? ', '+p.year : '');
  var out = ' \u00b7 ' + (carried
    ? esc(t('carried from week'))+' '+stamp
    : esc(t('week'))+' '+stamp+': '+fmt(p.value, metric));
  var d = Number(typed) - p.value;
  if(d && !isNaN(d)) out += '<span class="trend '+(d>0?'up':'down')+'">'+(d>0?'\u25b2':'\u25bc')+' '+fmt(Math.abs(d), metric)+'</span>';
  return out;
}

/* The reverse of kr.metricKey: an OKR key result links FROM the objective TO
   a metric (dept|ministry|metric) to pull its progress live — this is a
   metric asking the question the other way, for whoever is typing the
   number: does this feed anything? Reads S.base.okrs, already on the page
   for everyone by boot time (My Home's roll-up needs it too), so no
   extra fetch. Scoped to the metric's own campus, same as krProgress(). */
function metricOkrNote_(campus, dept, ministry, metric){
  var key = dept+'|'+ministry+'|'+metric;
  var okrs = ((S.base && S.base.okrs) || []).filter(function(o){
    return o.campus===campus && (o.krs||[]).some(function(kr){ return kr.metricKey===key; });
  });
  if(!okrs.length) return '';
  var label = okrs.length===1
    ? gpT('feeds “{objective}”', {objective: okrs[0].objective})
    : gpT('feeds {n} objectives', {n: okrs.length});
  return ' · <span class="okrFeeds">🎯 '+esc(label)+'</span>';
}

/* One row of a weekly figure — latest (carries forward), avg (a score), or
   sum entered directly for the week rather than built up from daily taps
   (a BL_COMMON personal figure, a headcount, or — for a Campus Leadership
   overseer — every metric on their own page, which is weekly-only start to
   finish). Used throughout kpiCardHtml's "This week" section. */
function kpiWeekRowHtml_(metric, wk, entries, prevMap, draft, campus, dept, ministry){
  var mode=modeOf(metric);
  var wks=entries[metric]||{};
  var cur = wks[String(wk)]!==undefined ? wks[String(wk)] : '';
  var carried=false, sub='', extra='';
  if(mode==='latest'){
    var agg=aggregate(wks, mode);
    var prev=prevLevel_(wks, wk, metric, prevMap);
    carried = (cur==='' && prev!==null);
    if(carried){ cur=prev.value; extra=' data-carried="1"'; }
    sub = esc(t('now'))+' '+fmt(agg===null&&prev?prev.value:agg, metric);
    if(prev!==null){
      sub += levelPrevSubHtml_(prev, metric, carried, draft[metric]!==undefined ? draft[metric] : cur);
    } else {
      sub += ' · ' + esc(t('nothing logged before this week'));
    }
  } else if(mode==='sum'){
    sub = esc(t('week total'))+' '+fmt(cur===''?null:Number(cur), metric)+
      gpVsLastWeek(wks, wk, metric, draft[metric]!==undefined ? draft[metric] : cur);
  } else {
    var agg2=aggregate(wks, mode);
    var thisWk = wks[String(wk)];
    sub = esc(t('avg'))+' '+fmt(agg2, metric)+
      gpVsLastWeek(wks, wk, metric, draft[metric]!==undefined ? draft[metric] : thisWk);
  }
  if(campus && dept && ministry) sub += metricOkrNote_(campus, dept, ministry, metric);
  if(draft[metric]!==undefined) cur=draft[metric];
  return '<div class="row"><div><div class="rowName">'+esc(t(metric))+'</div>'+
    '<div class="rowSub">'+sub+'</div></div>'+
    '<input type="number" inputmode="decimal" class="kpiIn"'+kpiInputAttrs_(metric)+
    ' data-kpiweek="'+esc(metric)+'" value="'+esc(String(cur))+'"'+extra+'></div>';
}

/* One row of a monthly/quarterly-cadence metric — one number for the whole
   period, no carry-forward (a fresh month starts blank, unlike a level) and
   no day-by-day or vs-last-period breakdown, since it's typed once. attr is
   'kpimonth' or 'kpiquarter', so the two sections' inputs never collide. */
function kpiPeriodRowHtml_(metric, anchorWeek, entries, draft, attr, campus, dept, ministry){
  var wks=entries[metric]||{};
  var stored = wks[String(anchorWeek)];
  var cur = draft[metric]!==undefined ? draft[metric] : (stored!==undefined ? stored : '');
  var sub = stored!==undefined ? (esc(t('logged'))+' '+fmt(Number(stored), metric)) : esc(t('nothing logged yet'));
  if(campus && dept && ministry) sub += metricOkrNote_(campus, dept, ministry, metric);
  return '<div class="row"><div><div class="rowName">'+esc(t(metric))+'</div>'+
    '<div class="rowSub">'+sub+'</div></div>'+
    '<input type="number" inputmode="decimal" class="kpiIn" data-'+attr+'="'+esc(metric)+'" value="'+esc(String(cur))+'"></div>';
}

function kpiCardHtml(wk){
  if(!S.me.ministry){
    return '<div class="card"><p class="sub" style="margin:4px 0 10px">'+
      'Set your ministry on the Profile tab and your team’s KPIs will show up here, ready to log.</p>'+
      '<button class="btn ghost" id="goProfile">Choose my ministry</button></div>';
  }
  var metrics=metricsFor(S.me.campus, S.me.dept, S.me.ministry);
  if(!metrics.length){
    return '<div class="card"><p class="sub" style="margin:4px 0">'+
      'No KPIs are defined for '+esc(S.me.ministry)+' yet.</p></div>';
  }
  var entries=(S.ministry&&S.ministry.entries)||{};
  var prevMap=(S.ministry&&S.ministry.prev)||{};
  var daily=(S.ministry&&S.ministry.daily)||{};
  var pins=(S.ministry&&S.ministry.pins)||[];
  var today=todayStr();
  var isCurWk=Number(wk)===Number(thisWeek());
  /* Backfilling a past week doesn't have a "today" — daily sum-type numbers
     for that week land on its last day, same as the week's own total is one
     figure rather than a day-by-day breakdown in the section below. */
  var entryDate = kpiEntryDate_(wk);

  /* A metric an admin has set to monthly or quarterly cadence (metricEditorHtml_)
     skips the daily "Today" list entirely and gets its own "This month"/"This
     quarter" section instead — one number for the period, same idea as a
     level, but summed rather than carried forward (see kpiPeriodRowHtml_). */
  var monthlyCounts=metrics.filter(function(m){
    return modeOf(m)==='sum' && cadenceOf(S.me.campus, S.me.dept, S.me.ministry, m)==='month';
  });
  var quarterlyCounts=metrics.filter(function(m){
    return modeOf(m)==='sum' && cadenceOf(S.me.campus, S.me.dept, S.me.ministry, m)==='quarter';
  });
  /* A Campus Leadership overseer's own page is entirely weekly — no daily
     "Today" list at all (their own figures were never really daily, and
     Total Staff/Staff Debt, the two that used to sit in their own separate
     Department Headcount section, are level metrics anyway) — one "This
     week" section holds everything that isn't monthly/quarterly. Every
     other ministry keeps the daily/weekly split its own count metrics
     (Cups Sold, Days Open…) actually need. */
  var isBL = S.me.dept==='Campus Leadership';
  var counts = isBL ? [] : metrics.filter(function(m){
    return modeOf(m)==='sum' && WEEKLY_ONLY_METRICS.indexOf(m)===-1 &&
      monthlyCounts.indexOf(m)===-1 && quarterlyCounts.indexOf(m)===-1;
  });
  var levels=metrics.filter(function(m){
    if(monthlyCounts.indexOf(m)>-1 || quarterlyCounts.indexOf(m)>-1) return false;
    return counts.indexOf(m)===-1;
  });

  /* Pins are about the daily list only — how many boxes you face every day. A
     level carries itself forward, so hiding one saves nobody any typing. */
  var pinnedCounts=pins.filter(function(m){ return counts.indexOf(m)>-1; });
  var showing = (pinnedCounts.length && !S.kpiAll)
    ? counts.filter(function(m){ return pinnedCounts.indexOf(m)>-1; })
    : counts;
  var hiddenN = counts.length - showing.length;

  var h='';

  if(S.kpiPick){
    h+='<div class="card">';
    h+='<p class="sub" style="margin:2px 0 8px">Star the ones you log most days — '+
       'the rest stay one tap away under “show all”.</p>';
    counts.forEach(function(metric){
      var on=pins.indexOf(metric)>-1;
      h+='<div class="habitPick">'+
        '<button class="hpBox'+(on?' on':'')+'" data-kpipin="'+esc(metric)+'">'+(on?'★':'')+'</button>'+
        '<span class="hpLabel">'+esc(t(metric))+'</span></div>';
    });
    return h+'<button class="btn" id="saveKpiPins" style="margin-top:12px">Done</button></div>';
  }

  /* ---- what happened today / what is true of the whole week ----
     Collapsed by default: these boxes are useful when you have numbers to
     log, but sitting open on every visit to My Home pushes everything
     else below the fold. The week picker used to be a card of its own above
     this one — now it's just this box's first section, so switching weeks
     and logging numbers read as one thing instead of two. */
  /* The week picker sits in the status card above this one now (see
     ministryWeekStatusHtml_), which is also where the form is unfolded from. */
  h += '<div class="accCard">';

  if(counts.length){
    var dayTitle = isCurWk ? t('Today') : entryDate;
    var daySummary = isCurWk ? gpT('{n} to log today', {n: showing.length})
      : gpT('{n} to log for {range}', {n: showing.length, range: weekRangeShort_(wk)});
    h += accRowHtml('dbAcc', 'kpiDay', esc(dayTitle), daySummary, function(){
      var b = '<div id="kpiDayCard">';
      b += '<p class="sub" style="margin:4px 0 10px">'+
        (isCurWk
          ? esc(gpT('Log today’s numbers — week {wk} adds up on its own.',{wk:wk}))
          : esc(gpT('Backfilling week {wk} — this lands on {date}.',{wk:wk, date:entryDate})))+
        '</p>';
      showing.forEach(function(metric){
        var days=daily[metric]||{};
        var savedToday = days[entryDate];
        var cur = S.kpiDraft[metric]!==undefined ? S.kpiDraft[metric]
          : (savedToday!==undefined ? savedToday : '');
        var weekVal=(entries[metric]||{})[String(wk)];
        /* What the week is without today, so the running total below the box adds
           up to the week's real figure rather than counting today twice. */
        var base = (weekVal===undefined?0:Number(weekVal)) - (savedToday===undefined?0:Number(savedToday));
        /* Last week next to this one, because "is the cafe up or down" is the
           question anyone typing the number is really asking. */
        b+='<div class="row"><div><div class="rowName">'+esc(t(metric))+'</div>'+
          '<div class="rowSub">'+esc(t('week total'))+' '+fmt(weekVal===undefined?null:Number(weekVal), metric)+
          gpVsLastWeek(entries[metric], wk, metric, weekVal)+
          metricOkrNote_(S.me.campus, S.me.dept, S.me.ministry, metric)+
          '<span class="newTot"></span></div></div>'+
          '<input type="number" inputmode="decimal" class="kpiIn" placeholder="+0" data-kpi="'+esc(metric)+
          '" data-metric="'+esc(metric)+'" data-mode="sum" data-run="'+base+
          '" data-kpimode="sum" value="'+esc(String(cur))+'"></div>';
      });
      b+='<button class="btn" id="saveKpiBtn">'+esc(t('Save today'))+'</button>';
      if(hiddenN>0) b+='<button class="linkbtn" id="kpiShowAll">'+esc(gpT('Show all {total} ({hidden} hidden)',{total:counts.length,hidden:hiddenN}))+'</button>';
      else if(pinnedCounts.length && S.kpiAll) b+='<button class="linkbtn" id="kpiShowLess">Show just my '+pinnedCounts.length+'</button>';
      b+='<button class="linkbtn" id="pickKpis">'+esc(t(pinnedCounts.length?'Change which I log daily':'Pick the ones I log daily'))+'</button>';
      return b+'</div>';
    });
  }

  if(levels.length){
    var weekSummary = gpT('{n} for {range}', {n: levels.length, range: weekRangeShort_(wk)});
    h += accRowHtml('dbAcc', 'kpiWeek', esc(t('This week')), weekSummary, function(){
      var b = '<div id="kpiWeekCard">';
      b += '<p class="sub" style="margin:4px 0 10px">'+
        esc(t('One number per week — headcounts and scores carry forward until changed; the rest is logged fresh each week.'))+'</p>';
      levels.forEach(function(metric){
        b += kpiWeekRowHtml_(metric, wk, entries, prevMap, S.kpiWeekDraft, S.me.campus, S.me.dept, S.me.ministry);
      });
      b+='<button class="btn saveKpiWeekBtn" id="saveKpiWeekBtn">'+esc(t('Save Week'))+' '+wk+'</button>';
      return b+'</div>';
    });
  }

  /* Monthly/quarterly-cadence metrics (set by an admin in "Edit what we
     track") — their own section each, since neither is tied to the weekly
     card's week pointer at the top of this page. */
  if(monthlyCounts.length){
    var mwk = monthAnchorWeek_();
    var monthLabel = MONTH_ABBR[new Date().getMonth()];
    var mSummary = gpT('{n} for {month}', {n: monthlyCounts.length, month: monthLabel});
    h += accRowHtml('dbAcc', 'kpiMonth', esc(t('This month')), mSummary, function(){
      var b = '<div id="kpiMonthCard">';
      b += '<p class="sub" style="margin:4px 0 10px">'+
        esc(gpT('Logged once for {month}, not built up from weekly entries.',{month:monthLabel}))+'</p>';
      monthlyCounts.forEach(function(metric){
        b += kpiPeriodRowHtml_(metric, mwk, entries, S.kpiMonthDraft, 'kpimonth', S.me.campus, S.me.dept, S.me.ministry);
      });
      b+='<button class="btn" id="saveKpiMonthBtn">'+esc(t('Save Month'))+'</button>';
      return b+'</div>';
    });
  }
  if(quarterlyCounts.length){
    var qwk = quarterAnchorWeek_();
    var qNum = Math.floor(new Date().getMonth()/3)+1;
    var qSummary = gpT('{n} for Q{q}', {n: quarterlyCounts.length, q: qNum});
    h += accRowHtml('dbAcc', 'kpiQuarter', esc(t('This quarter')), qSummary, function(){
      var b = '<div id="kpiQuarterCard">';
      b += '<p class="sub" style="margin:4px 0 10px">'+
        esc(gpT('Logged once for Q{q}, not built up from weekly entries.',{q:qNum}))+'</p>';
      quarterlyCounts.forEach(function(metric){
        b += kpiPeriodRowHtml_(metric, qwk, entries, S.kpiQuarterDraft, 'kpiquarter', S.me.campus, S.me.dept, S.me.ministry);
      });
      b+='<button class="btn" id="saveKpiQuarterBtn">'+esc(t('Save Quarter'))+'</button>';
      return b+'</div>';
    });
  }

  h += '</div>';
  return h;
}

/* A ministry you oversee but don't work in day-to-day — so unlike your own
   ministry (kpiCardHtml, which keeps the daily Today log), there's no daily
   entry here at all: everything is one number a week, addressed by an
   explicit dept+ministry and keyed by ministry name in every piece of state
   and every data-* attribute so a department overseer can have several of
   these open on one page (one per ministry they oversee) without one's
   draft or week pointer clobbering another's.

   A count metric (Salvations, Teams Hosted…) is normally built up from the
   ministry's own daily logging (see kpiCardHtml/saveMyKpiDay) — this box
   is a direct overwrite of that week's total instead, for a week nobody on
   the team logged day by day. If the team later does log days for that same
   week, their daily rollup takes the week back over, the same way a
   hand-typed weekly Health check-in only holds until fresher daily logs
   roll a week up on their own.

   Saves go through saveMinistryFor, the same authorization the server
   enforces everywhere else (own ministry, or a department you lead). No
   pin-picking here: hiding a count saves nobody's time when you are not the
   one filling it in most days. */
/* The weekly boxes for a ministry that isn't your own — the overseer's, the
   admin's jump-to-any-ministry — one row per metric and a Save Week button,
   keyed by ministry name so the save handler knows which one. Weekly only:
   day by day belongs to the ministry's own team. The week itself is picked
   in the status card above this (ministryWeekStatusHtml_ with ovMin). */
function ovWeekRowsHtml_(dept, ministry, data, wk){
  S.ovDeptOf[ministry] = dept;
  var metrics = metricsFor(S.me.campus, dept, ministry);
  if(!metrics.length){
    return '<div class="card"><p class="sub" style="margin:4px 0">'+
      esc(gpT('No KPIs are defined for {ministry} yet.',{ministry:t(ministry)}))+'</p></div>';
  }
  var entries=(data&&data.entries)||{};
  var prevMap=(data&&data.prev)||{};
  var weekDraft = S.ovWeekDraft[ministry] || (S.ovWeekDraft[ministry]={});
  var b='<div class="card" id="ovWeekCard">';
  b += '<p class="sub" style="margin:0 0 6px">'+
    esc(t('Logged weekly only — day by day belongs to the ministry’s own team on their My Ministry page. The ones that rarely change are already filled in from last time.'))+'</p>';
    metrics.forEach(function(metric){
      var mode=modeOf(metric);
      var wks=entries[metric]||{};
      var cur = wks[String(wk)]!==undefined ? wks[String(wk)] : '';
      var carried=false;
      var sub='', extra='';
      if(mode==='latest'){
        var agg=aggregate(wks, mode);
        var prev=prevLevel_(wks, wk, metric, prevMap);
        carried = (cur==='' && prev!==null);
        if(carried){ cur=prev.value; extra=' data-carried="1"'; }
        sub = esc(t('now'))+' '+fmt(agg===null&&prev?prev.value:agg, metric);
        if(prev!==null){
          sub += levelPrevSubHtml_(prev, metric, carried,
            weekDraft[metric]!==undefined ? weekDraft[metric] : cur);
        } else {
          sub += ' · ' + esc(t('nothing logged before this week'));
        }
      } else if(mode==='sum'){
        // A count is this week's own figure here, not a running daily total.
        sub = esc(t('week total'))+' '+fmt(cur===''?null:Number(cur), metric)+
          gpVsLastWeek(wks, wk, metric, weekDraft[metric]!==undefined ? weekDraft[metric] : cur);
      } else {
        var agg2=aggregate(wks, mode);
        sub = esc(t('avg'))+' '+fmt(agg2, metric)+
          gpVsLastWeek(wks, wk, metric, weekDraft[metric]!==undefined ? weekDraft[metric] : cur);
      }
      if(weekDraft[metric]!==undefined) cur=weekDraft[metric];
      b+='<div class="row"><div><div class="rowName">'+esc(t(metric))+'</div>'+
        '<div class="rowSub">'+sub+'</div></div>'+
        '<input type="number" inputmode="decimal" class="kpiIn"'+kpiInputAttrs_(metric)+
        ' data-ovweek="'+esc(ministry)+'" data-ovmetric="'+esc(metric)+'" value="'+esc(String(cur))+'"'+extra+'></div>';
    });
  b+='<button class="btn" data-ovsaveweek="'+esc(ministry)+'">'+esc(t('Save Week'))+' '+wk+'</button>';
  return b+'</div>';
}

/* ---------- Admin ----------
   Account management, not the sensitive-dashboard-numbers gate — that stays
   the leader code, exactly as it works today. isAdmin only ever goes to a
   Campus Leadership account, and only the leader code can grant it
   (grantAdmin in api.js), so this screen never has to ask "says who" about
   its own visibility.

   S.adminStaff loads once per visit, lazily, the same pattern the
   ministry-oversight cards already use — nothing here rides along on
   getMyBoot, since almost nobody who opens the app is an admin. */
/* Admin used to be one long scroll — an announcement box, the ministry KPI
   editor, approvals, merge, and the whole staff directory, all stacked on
   top of each other. Finding "did I already approve so-and-so" meant
   scrolling past the KPI picker every time. Splitting it into its own
   sub-pages (a chip row, same pattern as the campus tabs below) means each
   visit shows only the one thing you came here for. */
/* ---------- Admin ----------
   A home menu, then one page per job — Accounts, Approvals, Ministry KPIs,
   Announcements, Merge duplicates — each with its own back link, and one
   page per PERSON under Accounts. The old layout put every tool on one
   screen behind a chip row, with each account an accordion in a long list;
   the redesign is about knowing where you are: the page title says which
   tool, the person page says whose account. Every control keeps its id
   and data- attribute, so the handlers in bindAdmin() are unchanged. */
var ADMIN_SUBS = [
  { id:'accounts', label:'Accounts', emoji:'👤', blurb:'Find someone — edit their profile, reset a PIN, set their mentor or make them a ministry leader' },
  { id:'approvals', label:'Approvals', emoji:'✅', blurb:'New leadership sign-ups waiting for a yes' },

/* Everyone's leave, one campus at a time: what is waiting for a yes (an
   admin may decide it — a mentor normally does, but a request from someone
   with no mentor has nobody else), what is coming up, this year's history,
   and each person's days used against the cap. Read from adminListTrips
   on first open. */
function adminLeaveHtml_(){
  if(S.adminLeaveError) return '<div class="card"><p class="sub" style="margin:0 0 8px">⚠️ '+esc(t('Couldn’t load the leave requests.'))+'</p><p class="hint" style="margin:0 0 8px;overflow-wrap:anywhere">'+esc(S.adminLeaveError)+'</p><button class="btn ghost" id="adminLeaveRetry" style="margin-top:0">'+esc(t('Try again'))+'</button></div>';
  var L=S.adminLeave;
  if(!L) return '<p class="sub">'+esc(t('Loading…'))+'</p>';
  var yNow=new Date().getFullYear(), year=S.adminLeaveYear||yNow, today=todayStr();
  var tabs=CAMPUSES.map(function(c){ return { id:c.id, label:c.short, n:L.trips.filter(function(tr){ return tr.campus===c.id && String(tr.from).slice(0,4)===String(year); }).length }; });
  var activeTab = tabs.some(function(tb){ return tb.id===S.adminLeaveCampus; }) ? S.adminLeaveCampus
    : (tabs.some(function(tb){ return tb.id===S.me.campus; }) ? S.me.campus : tabs[0].id);
  S.adminLeaveCampus=activeTab;
  var years=[]; L.trips.forEach(function(tr){ var y=String(tr.from).slice(0,4); if(years.indexOf(y)===-1) years.push(y); }); if(years.indexOf(String(yNow))===-1) years.push(String(yNow)); years.sort().reverse();
  var h='<div class="deptChips">'+tabs.map(function(tb){
    return '<button class="deptChip'+(activeTab===tb.id?' on':'')+'" data-adminleavecampus="'+esc(tb.id)+'">'+esc(tb.label)+' · '+tb.n+'</button>'; }).join('')+'</div>';
  h+='<div class="pickerRow"><label class="pick" style="max-width:130px"><span>'+esc(t('Year'))+'</span><select id="adminLeaveYear">'+years.map(function(y){ return '<option value="'+y+'"'+(String(year)===y?' selected':'')+'>'+y+'</option>'; }).join('')+'</select></label></div>';
  var mine=L.trips.filter(function(tr){ return tr.campus===activeTab; });
  var inYear=mine.filter(function(tr){ return String(tr.from).slice(0,4)===String(year); });
  var waiting=mine.filter(function(tr){ return (tr.status==='pending'||tr.status==='noted') && tr.active; }).sort(function(a,b){ return a.from<b.from?-1:1; });
  var upcoming=inYear.filter(function(tr){ return tr.status==='approved' && tr.to>=today; }).sort(function(a,b){ return a.from<b.from?-1:1; });
  var away=upcoming.filter(function(tr){ return tr.from<=today; });
  var past=inYear.filter(function(tr){ return !(tr.status==='approved' && tr.to>=today) && !((tr.status==='pending'||tr.status==='noted') && tr.active); }).sort(function(a,b){ return a.from<b.from?1:-1; });
  h+='<div class="mmGrid">'+[
      [t('Waiting for a yes'), waiting.length, waiting.length>0], [t('Away right now'), away.length, false],
      [t('Coming up'), upcoming.length-away.length, false], [gpT('Requests in {year}',{year:year}), inYear.length, false]
    ].map(function(x){ return '<div class="mmTile'+(x[2]?' hot':'')+'"><div class="mmTileName">'+esc(x[0])+'</div><div class="mmTileNum">'+esc(String(x[1]))+'</div></div>'; }).join('')+'</div>';
  var statusChip=function(tr){
    var k=tr.status==='approved'?'active':tr.status==='declined'?'expired':(tr.status==='pending'||tr.status==='noted')?'due':'';
    var label=tr.status==='approved'?t('Approved'):tr.status==='declined'?t('Declined'):tr.status==='noted'?t('Noted — no mentor'):t('Waiting');
    return '<span class="hrChip '+k+'">'+esc(label)+'</span>';
  };
  var row=function(tr, actions){
    var range=teamDate_(tr.from)+(tr.to!==tr.from?' → '+teamDate_(tr.to):'');
    return '<div class="card slim leaveRow" data-adminleave="'+esc(tr.id)+'"><div class="teamHead"><div style="min-width:0">'+
      '<div class="rowName"><button class="linkbtn inline" style="font-size:inherit;font-weight:700;text-decoration:none;color:var(--ink)" data-adminperson="'+esc(tr.staffId)+'">'+esc(tr.name)+'</button> <span class="rowSub">· '+esc(t(tr.dept))+'</span></div>'+
      '<div class="rowSub">📅 '+esc(range)+' · '+esc(gpT('{n} work days',{n:tr.workDays}))+' · '+esc(t(leaveTypeLabel_(tr.type)))+'</div>'+
      (tr.reason?'<div class="rowSub">'+esc(tr.reason)+'</div>':'')+
      (tr.coverage?'<div class="rowSub">🤝 '+esc(t('Cover'))+': '+esc(tr.coverage)+'</div>':'')+
      (tr.status==='pending' && tr.mentorName ? '<div class="hint">'+esc(gpT('Waiting on {name}',{name:tr.mentorName}))+'</div>' : tr.decidedBy ? '<div class="hint">'+esc(gpT('Decided by {name}',{name:tr.decidedBy}))+'</div>' : '')+
      '</div>'+statusChip(tr)+'</div>'+(actions||'')+'</div>';
  };
  var decide=function(tr){ return '<div class="leaveActions"><button class="btn ghost" data-adminleaveok="'+esc(tr.id)+'">'+esc(t('Approve'))+'</button><button class="btn ghost" data-adminleaveno="'+esc(tr.id)+'">'+esc(t('Decline'))+'</button></div>'; };
  h+='<h3>⏳ '+esc(t('Waiting for a yes'))+' <small>· '+waiting.length+'</small></h3>';
  if(!waiting.length) h+='<div class="card slim"><p class="sub" style="margin:0">'+esc(t('Nothing waiting.'))+'</p></div>';
  waiting.forEach(function(tr){ h+=row(tr, decide(tr)); });
  h+='<h3>✈️ '+esc(t('Away now or coming up'))+' <small>· '+upcoming.length+'</small></h3>';
  if(!upcoming.length) h+='<div class="card slim"><p class="sub" style="margin:0">'+esc(t('Nobody is away or booked to be.'))+'</p></div>';
  upcoming.forEach(function(tr){ h+=row(tr); });
  // days used this year, per person on this campus
  var people={}; inYear.forEach(function(tr){ if(tr.status!=='declined') people[tr.staffId]=tr.name; });
  var ids=Object.keys(people).sort(function(a,b){ return people[a]<people[b]?-1:1; });

    ids.forEach(function(id){

    });

  }
  h+='<div class="accCard" style="margin-top:12px">'+accRowHtml('adminAcc', 'leavePast', '🗂️ '+esc(gpT('Earlier in {year}',{year:year}))+' · '+past.length, esc(t('Approved, declined and noted requests that are over')), function(){
    return past.length ? past.map(function(tr){ return row(tr); }).join('') : '<p class="sub" style="margin:0">'+esc(t('Nothing earlier this year.'))+'</p>'; })+'</div>';
  return h;
}
