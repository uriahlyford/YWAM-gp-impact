<!DOCTYPE html>

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>My GP</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="YWAM GP">
<!-- The header is dark in both themes, so the status bar matches it either way. -->
<meta name="theme-color" content="#17150F" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C0B09" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='47' fill='%231F44FF'/%3E%3Ctext x='50' y='64' font-family='Arial' font-weight='bold' font-size='40' fill='%23FAF6F0' text-anchor='middle'%3EGP%3C/text%3E%3Cpath d='M76 12 L78.6 19.4 L86 22 L78.6 24.6 L76 32 L73.4 24.6 L66 22 L73.4 19.4 Z' fill='%23FFB323'/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.json">
<!-- Fonts load OUT of the render path, on purpose.

     As an @import inside <style> this was render-blocking, and a pending
     stylesheet also blocks script execution — so on a slow or unreachable font
     CDN the app's JavaScript did not run until the request resolved or timed
     out. Measured at 8.1 seconds of dead app on a hanging font request, which
     is exactly the connection this thing is built for.

     media="print" makes the browser fetch it without blocking; onload promotes
     it to all. Text renders immediately in the fallback face and swaps when the
     webfont lands (the URL already carries display=swap). The <noscript> copy
     keeps fonts working if scripts are off. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Koulen&family=Kantumruy+Pro:wght@400;500;700&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Koulen&family=Kantumruy+Pro:wght@400;500;700&display=swap"></noscript>
<script>
/* Apply a saved theme BEFORE anything paints. Same class of problem as the splash:
   read it late and the reader watches the app flash the wrong colours on every
   open. No attribute means "follow the system", which is the default. */
(function(){
  try {
    var t = localStorage.getItem('gp-theme');
    if(t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  } catch(e){}
})();
</script>
<style>
/* ==================== THEME TOKENS ====================
   THIS BLOCK IS DUPLICATED VERBATIM IN index.html, teams.html AND help.html.
   tests/test-theme.mjs asserts the copies are byte-identical — edit one, edit all.

   Three states, which is what a phone actually has:
     no attribute  -> follow the system (prefers-color-scheme)
     data-theme="light" / "dark" -> the reader chose, and their choice wins both ways
   That is why the media query is guarded with :not([data-theme="light"]) — without
   it, a reader who picks light on a dark phone gets ignored.

   Two pairs must never be collapsed into one token, because they diverge between
   themes and a blind find-and-replace inverts them:
     --ink (body text) vs --headerBg (the black header, hero and coin, which stay
       dark in BOTH themes — this is the brand, not the background)
     --surface (cards) vs --onDark (text sitting on that black header)
   The brand marks in logo.js are white and drawn for the black header, so anything
   showing them needs --headerBg behind it in either theme or they vanish. */
:root {
  --bg:#FAF6F0;            /* page */
  --surface:#fff;          /* cards */
  --surface2:#F0EADF;      /* tracks, subtle fills */
  --ink:#17150F;           /* body text */
  --muted:#6B6557;         /* secondary text */
  --faint:#6F6A5A;         /* tertiary text */
  --line:#F0EADF;          /* hairlines */
  --border:#E4DDD0;        /* card borders */
  --border2:#C9C3B6;       /* input borders */
  --accent:#1F44FF;        /* cobalt */
  --accent2:#5B7BFF;       /* gradient partner */
  --accentInk:#fff;        /* text on cobalt */
  --accentSoft:#E8ECFF;    /* cobalt tint fill */
  --accentSoftBorder:#B9C4FF;
  --amber:#FFB323;
  --amberInk:#17150F;      /* text on amber */
  --amberDeep:#96650A;     /* amber as TEXT, so darker than --amber */
  --good:#0A7D3C;
  --goodInk:#fff;          /* text on a solid --good fill */
  --goodSoft:#E3F6EA;
  --bad:#B3261E;
  --badSoft:#FBE6E6;
  --warm:#A84E1C;       /* 'just started' on the goal rings */
  --banner:#FFF1D6;
  --bannerBorder:#FFD98A;
  --bannerInk:#5C4A1E;
  --headerBg:#17150F;      /* header, hero, black cards, loading coin */
  --onDark:#FAF6F0;        /* text on --headerBg */
  --onDarkFaint:#9A9384;   /* tertiary text on --headerBg, which is dark in BOTH themes */
  --onDarkBorder:#4A463D;  /* outlined buttons in the header */
  --navBg:var(--surface);  /* bottom tab bar — a card-like surface in light, but
    flush with --headerBg in dark (see the dark blocks below): a visibly lighter
    grey bar was the one thing standing out against an otherwise black shell
    while the rest of the page was still loading. */
  --shadow:rgba(31,68,255,.28);
  --shadowSoft:rgba(31,68,255,.12);
  --scrim:rgba(23,21,15,.45);
  color-scheme:light;
}
/* Dark: warm greys rather than pure black, so the paper-and-ink feel survives.
   Cobalt is lifted to #6C86FF — #1F44FF on a dark ground fails contrast — and the
   text that sits on cobalt goes dark to match. */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:#121110;
    --surface:#1C1A17;
    --surface2:#26231D;
    --ink:#F2EDE4;
    --muted:#A8A192;
    --faint:#8A8474;
    --line:#2A261F;
    --border:#332E26;
    --border2:#463F34;
    --accent:#6C86FF;
    --accent2:#8EA0FF;
    --accentInk:#0B0A08;
    --accentSoft:#1B2145;
    --accentSoftBorder:#2F3872;
    --amber:#FFC352;
    --amberInk:#17150F;
    --amberDeep:#E9AE3A;
    --good:#4CC98A;
    --goodInk:#0B0A08;
    --goodSoft:#12301F;
    --bad:#FF7A6B;
    --badSoft:#38191A;
    --warm:#FF9E6B;
    --banner:#2A2313;
    --bannerBorder:#4C3D18;
    --bannerInk:#F0DFB4;
    --headerBg:#0C0B09;
    --onDark:#F2EDE4;
    --onDarkFaint:#9A9384;
    --onDarkBorder:#3A352B;
    --navBg:var(--headerBg);
    --shadow:rgba(108,134,255,.30);
    --shadowSoft:rgba(108,134,255,.14);
    --scrim:rgba(0,0,0,.62);
    color-scheme:dark;
  }
}
:root[data-theme="dark"] {
  --bg:#121110;
  --surface:#1C1A17;
  --surface2:#26231D;
  --ink:#F2EDE4;
  --muted:#A8A192;
  --faint:#8A8474;
  --line:#2A261F;
  --border:#332E26;
  --border2:#463F34;
  --accent:#6C86FF;
  --accent2:#8EA0FF;
  --accentInk:#0B0A08;
  --accentSoft:#1B2145;
  --accentSoftBorder:#2F3872;
  --amber:#FFC352;
  --amberInk:#17150F;
  --amberDeep:#E9AE3A;
  --good:#4CC98A;
  --goodInk:#0B0A08;
  --goodSoft:#12301F;
  --bad:#FF7A6B;
  --badSoft:#38191A;
  --warm:#FF9E6B;
  --banner:#2A2313;
  --bannerBorder:#4C3D18;
  --bannerInk:#F0DFB4;
  --headerBg:#0C0B09;
  --onDark:#F2EDE4;
  --onDarkFaint:#9A9384;
  --onDarkBorder:#3A352B;
  --navBg:var(--headerBg);
  --shadow:rgba(108,134,255,.30);
  --shadowSoft:rgba(108,134,255,.14);
  --scrim:rgba(0,0,0,.62);
  color-scheme:dark;
}
/* Motion: one spring, used everywhere something appears or grows. The overshoot
   is what separates "an app" from "a web page"; honoured only when the reader has
   not asked for less motion. */
:root { --spring:cubic-bezier(.34,1.56,.64,1); --ease:cubic-bezier(.4,0,.2,1);
        --r:18px; --rSm:12px; --rLg:22px; }
@media (prefers-reduced-motion: reduce) { :root { --spring:linear; --ease:linear; } }

/* ---- progress rings, shared ----
   Driven by gpRingHtml()/gpRingVars() in rollup.js. One element, no SVG: the
   conic-gradient is the sweep and the ::after punches the middle out, so the ring
   inherits whatever background it is sitting on. */
.gRing { flex:0 0 auto; width:42px; height:42px; border-radius:50%; position:relative;
  background:conic-gradient(var(--gc) calc(var(--p) * 1%), var(--surface2) 0);
  display:grid; place-items:center; transition:background .3s var(--ease); }
.gRing::after { content:''; position:absolute; inset:4px; border-radius:50%; background:var(--surface); }
.gRing span { position:relative; z-index:1; font-family:'Koulen',sans-serif; font-size:12.5px;
  color:var(--gc); letter-spacing:-.2px; }
.gRing.sm { width:34px; height:34px; }
.gRing.sm span { font-size:10.5px; }
.gRing.sm::after { inset:3px; }
.gRing.lg { width:58px; height:58px; }
.gRing.lg span { font-size:16px; }
.gRing.lg::after { inset:5px; }
/* On the black hero the punched-out middle has to match the hero, not a card. */
.hero .gRing::after, .focusCard .gRing::after { background:var(--headerBg); }
.hero .gRing, .focusCard .gRing { background:conic-gradient(var(--gc) calc(var(--p) * 1%), var(--onDarkBorder) 0); }
/* ...and the digits go to plain light text there. The paper-mode versions of those
   colours are chosen to be readable ON PAPER, so they are far too dark to sit on
   the hero; the sweep still carries the colour, which is where it reads anyway. */
.hero .gRing span, .focusCard .gRing span { color:var(--onDark); }

/* ---- a number that has just landed ----
   Pairs with gpAnimateCounts(): the value climbs and the element settles into
   place, so a figure reads as arriving rather than simply being there. */
@keyframes gpPop { 0%{transform:scale(.88);opacity:.55} 100%{transform:scale(1);opacity:1} }
[data-count] { display:inline-block; animation:gpPop .42s var(--spring) both; }
@media (prefers-reduced-motion: reduce) { [data-count] { animation:none } }
</style>
<style>
* { box-sizing:border-box; margin:0; }
/* ---- locked to the edges of the phone ----
   The page asks for viewport-fit=cover and a black-translucent status bar, which
   together hand it the whole screen INCLUDING the notch and the home-indicator
   strip. Nothing then padded for them, so the header sat under the notch and the
   tab bar under the indicator — and because iOS reports those insets late and
   re-reports them on rotation, on keyboard open/close and when the URL bar
   collapses, the content shifted each time. That is the wiggle. Pad by the insets
   and the chrome stops moving.
   overflow-x is on html as well as body on purpose: on iOS, body alone still lets
   the document itself rubber-band sideways.

   overscroll-behavior was `none` on both html and body — meant only to stop
   the rubber-band bounce and any scroll chaining past the edges — and that
   was reported, confirmed live in a real user's DevTools, as disabling
   scrolling ENTIRELY on their desktop Chrome: wheel events fired, arrived
   with real deltas, were never preventDefault()'d by anything, and the page
   still would not move — until `overscroll-behavior` was set back to `auto`
   from the console, at which point it scrolled immediately. Switching to
   `contain` was tried next and turned out to trip the very same Chromium
   bug — same live symptom (wheel deltas arriving, nothing scrolling) on a
   fresh live check. So: no overscroll-behavior at all on html/body, which
   is exactly the `auto` the user's own console test proved fixes it. The
   scroll-chaining it would have suppressed (native pull-to-refresh,
   trackpad back/forward swipe) is instead kept off by the touch-gesture
   guards in rollup.js (gpPullToRefresh, gpSlideGuard), which don't rely on
   this CSS property.

   html gets its own background too, matching the splash — reported as a
   sliver of slightly-lighter grey at the very bottom of the splash screen,
   on a real iPhone with a home indicator. The splash is `inset:0` and
   correctly covers nav.bottom (it isn't even on screen yet at that point),
   so the gap isn't from anything z-index can fix — some iOS Safari builds
   compute a position:fixed element's extent against a viewport that
   hasn't yet grown to include the safe area, right at first paint. Without
   this, whatever showed through that gap was body's --bg, a shade darker
   than the splash's --headerBg but not identical to it; with html carrying
   the same colour as the splash, there is nothing left for that gap to
   reveal that reads as a different tone. */
html { overflow-x:hidden; background:var(--headerBg); }
body { background:var(--bg); color:var(--ink); font-family:'Kantumruy Pro',system-ui,sans-serif;
  padding-bottom:calc(76px + env(safe-area-inset-bottom));
  padding-left:env(safe-area-inset-left); padding-right:env(safe-area-inset-right);
  overflow-x:hidden; -webkit-text-size-adjust:100%; }
button, select, input { font-family:inherit; }
input:focus, select:focus, button:focus-visible { outline:3px solid var(--accent); outline-offset:1px; }

header { background:var(--headerBg); color:var(--onDark); display:flex; justify-content:space-between; align-items:center;
  padding:calc(16px + env(safe-area-inset-top)) 16px 16px; }
.brandRow { display:flex; align-items:center; gap:10px; min-width:0; }
.logoImg { height:30px; width:auto; flex-shrink:0; display:block; }
.brand { display:flex; flex-direction:column; padding-left:10px; border-left:1px solid var(--onDarkBorder); }
.brandKh { font-family:'Koulen',sans-serif; font-size:22px; letter-spacing:1px; line-height:1; }
.brandEn { font-size:9px; letter-spacing:3px; color:var(--amber); font-weight:700; }
.hbtns { display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
.hbtn { border:1px solid var(--onDarkBorder); background:transparent; color:var(--onDark); border-radius:999px; padding:6px 12px; font-size:13px; cursor:pointer; }
.hbtn.icon { padding:6px; display:flex; align-items:center; justify-content:center; }
.notifDot { position:absolute; top:2px; right:2px; width:9px; height:9px; border-radius:999px;
  background:var(--bad); border:2px solid var(--headerBg); }

/* ---- hamburger menu drawer ---- */
.scrim { position:fixed; inset:0; background:var(--scrim); z-index:40; }
.drawer { position:fixed; top:0; right:0; bottom:0; width:280px; max-width:82vw; background:var(--surface); z-index:41;
  box-shadow:-8px 0 24px rgba(23,21,15,.18); display:flex; flex-direction:column;
  padding:calc(20px + env(safe-area-inset-top)) 16px 16px; padding-right:calc(16px + env(safe-area-inset-right)); overflow-y:auto; }
.drawerHead { display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; }
.drawerTitle { font-family:'Koulen',sans-serif; font-size:18px; color:var(--ink); }
.drawerItem { display:flex; align-items:center; gap:12px; padding:13px 8px; border-radius:12px; background:none; border:0;
  cursor:pointer; text-align:left; font-family:inherit; color:var(--ink); width:100%; }
.drawerItem:active { background:var(--surface2); }
.drawerIcon { flex:0 0 auto; color:var(--accent); display:flex; }
.drawerLabel { font-size:14.5px; font-weight:600; flex:1; }

main { padding:18px 16px; max-width:640px; margin:0 auto; }
h2 { font-family:'Koulen',sans-serif; font-size:24px; letter-spacing:.5px; margin:0 0 4px; }
h2 small { font-family:'Kantumruy Pro',sans-serif; font-size:14px; color:var(--muted); font-weight:400; }
h3 { font-family:'Koulen',sans-serif; font-size:16px; letter-spacing:.5px; margin:22px 0 8px; }
.sub { font-size:13px; color:var(--muted); margin-bottom:16px; line-height:1.5; }

.card { background:var(--surface); border:1px solid var(--border); border-radius:var(--r); padding:14px; margin-bottom:12px; }
label.f { display:block; font-size:11px; letter-spacing:1.5px; font-weight:700; color:var(--muted); text-transform:uppercase; margin:12px 0 4px; }
label.f:first-child { margin-top:0; }
input[type=text], input[type=tel], input[type=number], input[type=password], select {
  /* 16px is the iOS Safari threshold — anything smaller zooms the whole page in on focus. */
  width:100%; font-size:16px; padding:11px; border-radius:10px; border:1.5px solid var(--ink); background:var(--surface); color:var(--ink); }
.hint { font-size:11.5px; color:var(--faint); margin-top:4px; }
.lock { color:var(--amberDeep); font-size:11px; font-weight:700; }

.btn { width:100%; margin-top:16px; padding:13px; font-family:'Koulen',sans-serif; font-size:18px; letter-spacing:1px;
  background:var(--accent); color:var(--accentInk); border:none; border-radius:12px; cursor:pointer; transition:transform .08s ease; }
.btn:active { transform:scale(.97); }
.btn:disabled { opacity:.6; }
.btn.ghost { background:transparent; color:var(--ink); border:1.5px solid var(--ink); font-size:14px; font-family:'Kantumruy Pro',sans-serif; }
.linkbtn { background:none; border:none; color:var(--accent); font-size:14px; cursor:pointer; text-decoration:underline; padding:8px; width:100%; margin-top:8px; }
.danger { background:none; border:none; color:var(--bad); font-size:13px; cursor:pointer; padding:8px; }

.row { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--line); }
.row:last-child { border-bottom:none; }
.rowName { font-size:14.5px; line-height:1.3; }
.rowVal { font-family:'Koulen',sans-serif; font-size:18px; color:var(--accent); white-space:nowrap; }
.qBlock { padding:12px 0; border-bottom:1px solid var(--line); }
.qBlock:last-of-type { border-bottom:none; }
.qText { font-size:14.5px; margin-bottom:8px; line-height:1.35; }
.seg { display:flex; gap:8px; }
.seg button { flex:1; padding:10px; border-radius:10px; border:1.5px solid var(--border2); background:var(--bg); font-size:15px; cursor:pointer; }
.seg button.on { background:var(--accent); border-color:var(--accent); color:var(--accentInk); font-weight:700; }
.seg button.on.bad { background:var(--bad); border-color:var(--bad); }
.scale { display:flex; gap:4px; flex-wrap:wrap; }
.scale button { width:36px; height:36px; border-radius:9px; border:1.5px solid var(--border2); background:var(--bg); font-size:13px; cursor:pointer; }
.scale button.on { background:var(--accent); border-color:var(--accent); color:var(--accentInk); font-weight:700; }

/* Weekly Health's 1-10 questions, from the mockup — a slider with low/high
   captions and a live readout, instead of a row of ten buttons. Scoped to
   .sliderWrap rather than a bare input[type=range] rule so it can't touch
   the goal ring's own .gSlide styling elsewhere on the page — but the thumb
   and track below are the SAME shape as .gSlide (hollow thumb with a
   colored ring, 10px track, a scale-up on active) so a drag feels like the
   same control everywhere in the app, and now the SAME color walk too
   (warm -> amber -> cobalt -> green via --gc, gpRingColor in rollup.js).

   The direction has to be per-question, not per-value, because higher isn't
   always "better" here — 10 on "how lonely" is bad, 10 on "clarity" is good.
   So --gc is computed from a goodness percentage (data-higherbetter on the
   input decides whether that's the raw value or 100 minus it), while
   --fillpct always tracks the RAW value — that one has to match where the
   thumb actually sits, or the track would look empty under a thumb that's
   dragged all the way to the "bad" end.

   The input box itself is a full 32px tall even though the visible track is
   a thin 10px line drawn by the track pseudo-element; a slider whose hit box
   is exactly as thin as its track is hard to grab and drag smoothly with a
   finger, which read as "unresponsive".

   That 32px band is also why touch-action matters here. It was `none`, meaning
   no gesture starting anywhere in it could pan — and with several of these
   stacked down the Health tab, most of the page's height became somewhere you
   could not scroll from. `pan-y` is the right half: the slider still claims the
   horizontal axis, so a drag on the thumb starts without the browser spending
   frames deciding, and a vertical swipe still scrolls the page. The value the
   browser sets on touch-down is put back by gpSlideGuard() when the gesture
   turns out to have been a scroll. The fill color is a CSS variable set
   from JS (--fillpct, --gc) rather than a `background` on the input, because
   the two-tone track lives on the ::-webkit-slider-runnable-track /
   ::-moz-range-track pseudo-elements, which inline styles on the input
   itself cannot reach. */
.qCaps { display:flex; justify-content:space-between; font-size:10.5px; color:var(--faint); margin-top:2px; }
.qReadout { font-family:'Koulen',sans-serif; font-size:15px; color:var(--accent); }
.sliderWrap { padding:10px 2px 2px; }
.sliderWrap input[type=range] { -webkit-appearance:none; appearance:none; width:100%; height:32px; border-radius:99px;
  outline:none; margin:0; background:transparent; cursor:pointer; touch-action:pan-y; }
.sliderWrap input[type=range]::-webkit-slider-runnable-track { height:10px; border-radius:99px;
  background:linear-gradient(to right, var(--gc,var(--accent)) var(--fillpct,50%), var(--surface2) var(--fillpct,50%)); }
.sliderWrap input[type=range]::-moz-range-track { height:10px; border-radius:99px;
  background:linear-gradient(to right, var(--gc,var(--accent)) var(--fillpct,50%), var(--surface2) var(--fillpct,50%)); }
.sliderWrap input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:24px; height:24px; border-radius:50%;
  background:var(--surface); border:3px solid var(--gc,var(--accent)); box-shadow:0 2px 8px rgba(23,21,15,.22); cursor:pointer;
  /* -webkit-slider-thumb's margin-top is relative to the TRACK box, not the
     input's own padding box (which is 32px tall here vs .gSlide's 26px, for
     a bigger touch target) — so it needs the same -7px .gSlide uses
     ((10px track - 24px thumb) / 2) regardless of that difference. Missing
     it left the thumb sitting off-center from the track it's supposed to
     be riding on. */
  margin-top:-7px;
  transition:transform .12s ease; }
.sliderWrap input[type=range]::-moz-range-thumb { width:24px; height:24px; border-radius:50%; background:var(--surface);
  border:3px solid var(--gc,var(--accent)); box-shadow:0 2px 8px rgba(23,21,15,.22); cursor:pointer; }
.sliderWrap input[type=range]:active::-webkit-slider-thumb { transform:scale(1.18); }
.sliderWrap input[type=range]:focus-visible { outline:2px solid var(--accent); outline-offset:3px; border-radius:99px; }
@media (prefers-reduced-motion: reduce){ .sliderWrap input[type=range]::-webkit-slider-thumb { transition:none } }
.numIn { display:flex; align-items:center; gap:10px; }
.numIn input { width:110px; text-align:right; border:1.5px solid var(--border2); background:var(--bg); }

.pcard { display:flex; align-items:center; gap:14px; }
.avatar { width:64px; height:64px; border-radius:50%; object-fit:cover; border:2px solid var(--border); background:var(--surface2); flex-shrink:0; }
.avatar.lg { width:96px; height:96px; }
.avatar.sm { width:40px; height:40px; }
.avatar.ph { display:flex; align-items:center; justify-content:center; font-family:'Koulen',sans-serif; font-size:26px; color:var(--faint); }
.avatar.sm.ph { font-size:14px; color:var(--muted); } /* --faint is only AA at large-text size; sm's 14px needs the darker pair */

/* ---- inline entry cards: Mentorship, Leave, Account, from the mockup ---- */
.leaveEntry { display:flex; align-items:center; gap:13px; width:100%; text-align:left; cursor:pointer; font-family:inherit; background:none; border:0; color:inherit; }
.leaveEntryIcon { flex:0 0 auto; width:38px; height:38px; border-radius:10px; background:var(--accentSoft); color:var(--accent); display:flex; align-items:center; justify-content:center; }
.mentorLabel { font-size:11px; letter-spacing:1.5px; text-transform:uppercase; color:var(--faint); font-weight:700; margin-bottom:6px; }
.mentorBlock { display:flex; align-items:center; gap:12px; padding:4px 0 14px; }
.mentorName { font-size:14px; font-weight:700; }
.mentorMeta { font-size:12px; color:var(--muted); margin-top:1px; }
.mentorDivider { border-top:1px solid var(--border); margin:2px 0 14px; }
.openBtn { flex:0 0 auto; border:1.5px solid var(--border2); background:var(--bg); border-radius:9px; width:32px; height:32px; display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--ink); }
.emptyLine { font-size:13px; color:var(--muted); font-style:italic; padding:6px 0 14px; }

/* Siem Reap check-in history: a line chart of the quarter's overall trend,
   a bar chart of that quarter's per-question percentages. Both animate in on
   render (gpAnimateLine/gpAnimateBars in rollup.js) via a clip-path/width
   that starts closed and opens — CSS transitions, so prefers-reduced-motion
   just needs one rule apiece rather than touching the JS. */
.srChartReveal { clip-path:inset(0 100% 0 0); transition:clip-path .75s cubic-bezier(.16,1,.3,1); }
.srLineChart { width:100%; height:90px; display:block; }
@media (prefers-reduced-motion: reduce){ .srChartReveal { transition:none } }
.srBars { display:flex; flex-direction:column; gap:4px; margin-top:8px; }
.srBarItem { border-bottom:1px solid var(--border); padding-bottom:4px; }
.srBarItem:last-child { border-bottom:0; }
/* Same button reset .heroRow/.heroSubRow use — a tap target that still lays
   out like the plain row it used to be. */
button.srBarRow { width:100%; background:none; border:none; padding:7px 0; text-align:left; font:inherit;
  color:inherit; cursor:pointer; -webkit-tap-highlight-color:transparent;
  display:grid; grid-template-columns:1fr 2fr auto auto; align-items:center; gap:10px; }
button.srBarRow:active { opacity:.72; }
.srBarRow .chev { color:var(--faint); font-size:11px; }
.srBarTrack { background:var(--surface2); border-radius:99px; height:10px; overflow:hidden; }
.srBarFill { height:100%; border-radius:99px; background:var(--accent); width:0; transition:width .65s cubic-bezier(.16,1,.3,1); }
.srBarPct { font-size:12.5px; font-weight:700; color:var(--muted); min-width:32px; text-align:right; }
.srBarChart { padding:4px 0 10px; }
@media (prefers-reduced-motion: reduce){ .srBarFill { transition:none } }
.pname { font-family:'Koulen',sans-serif; font-size:22px; letter-spacing:.5px; }
.pmeta { font-size:13px; color:var(--muted); margin-top:2px; }

.chips { display:flex; gap:8px; flex-wrap:wrap; margin:6px 0 4px; }
.chip { background:var(--banner); border:1px solid var(--bannerBorder); color:var(--ink); border-radius:999px; padding:5px 12px; font-size:13px; font-weight:700; }
.chip.blue { background:var(--accentSoft); border-color:var(--accentSoftBorder); }

/* Quick-jump bar at the top of My Home — one tap to any section folded in
   from the old My week / Me tabs, instead of scrolling past all of them. A
   single scrolling row rather than wrapping onto several, so it reads as one
   strip of chips instead of pushing everything else down the page. */
.quickBar { display:flex; gap:8px; flex-wrap:nowrap; overflow-x:auto; margin:0 0 14px; padding-bottom:2px;
  scrollbar-width:none; -ms-overflow-style:none;
  /* Both axes, named explicitly. `pan-x` alone reads as "this element permits
     horizontal panning and nothing else", so a vertical swipe starting on the
     strip was not allowed to scroll the page at all — the strip is full width
     and sits at the top of My Home, so that was a dead band across the
     first thing you touch. With both, the browser picks by direction: sideways
     scrolls the chips, up and down scrolls the page. */
  touch-action:pan-x pan-y; }
.quickBar::-webkit-scrollbar { display:none; }
.quickChip { background:var(--surface); border:1.5px solid var(--border2); color:var(--ink); border-radius:999px;
  padding:7px 13px; font-size:12.5px; font-weight:600; cursor:pointer; flex:0 0 auto; white-space:nowrap; }

.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:10px; }
.stat { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:12px; }
.statNum { font-family:'Koulen',sans-serif; font-size:26px; color:var(--accent); line-height:1.1; }
.statLabel { font-size:11.5px; color:var(--muted); margin-top:2px; line-height:1.3; }

/* ---- Base tab accordion ----
   From the redesign mockup: every section below the hero collapses, so landing
   on Base shows what changed (a summary line) rather than every figure the base
   tracks. accBody is only in the DOM while open — same as the mockup's sc-if —
   so a closed section costs nothing to render or to read past. */
.accCard { background:var(--surface); border:1px solid var(--border); border-radius:var(--r); overflow:hidden; margin-bottom:14px; }
.accRow { border-bottom:1px solid var(--border); }
.accRow:last-child { border-bottom:0; }
/* Which row is open should be obvious at a glance, not just inferable from
   the chevron — this is what "confusing to see what profile you selected"
   meant more than any single control being broken. */
.accRow.open { background:var(--surface2); }
.accRow.open .accHead { color:var(--accent); }
/* The week-picker used to sit in its own card above the accordion — two
   boxes for one idea. It's the accCard's own first section now, styled to
   match an accRow's own padding so the seam isn't visible. */
.weekNavBlock { padding:14px 16px; border-bottom:1px solid var(--border); }
.accHead { width:100%; display:flex; justify-content:space-between; align-items:center; gap:10px; padding:16px; background:none; border:0; cursor:pointer; text-align:left; font-family:inherit; color:var(--ink); }
.accTitle { font-weight:700; font-size:15px; }
.accSummary { font-size:12.5px; color:var(--muted); margin-top:2px; }
.accChevron { flex:0 0 auto; color:var(--faint); transition:transform .22s var(--ease); }
.accBody { padding:0 16px 14px; }
.accBody .grid { margin-top:0; }

/* the base hero — same black card and amber figures as the dashboard, because
   it is the dashboard: this page now leads with how the base is doing. */
.hero { background:var(--headerBg); color:var(--onDark); border-radius:14px; padding:17px 17px 15px; margin-bottom:14px; }
/* My Home's own hero only — a plain outline like any other card's,
   just in the dark-background pair (.card's own var(--border) is tuned
   for a light surface); Base's hero stays as it was. */
.hero.myHero { border:1px solid var(--onDarkBorder); }
.heroLabel { font-size:11px; letter-spacing:2.6px; color:var(--amber); font-weight:700; }
.heroNum { font-family:'Koulen',sans-serif; font-size:50px; line-height:1.05; color:var(--amber); }
.heroTrend { margin-top:5px; font-size:13px; color:var(--onDarkFaint); }
.heroFig { font-family:'Koulen',sans-serif; font-weight:400; color:var(--onDark); font-size:16px; }
.heroSubtext { margin-top:1px; font-size:11px; color:var(--onDarkFaint); }
/* the ring and its sentence sit on one line, so the figure reads at a glance */
.heroRow { display:flex; align-items:center; gap:11px; margin-top:8px; }
.heroRow .heroTrend { margin-top:0; }
/* This week's actual goal wording, at a glance from the dashboard instead of
   only as a X/Y count — sits at the right of the Weekly Goals row, top-aligned
   with the ring (align-items:flex-start on this one row only, via .withList)
   rather than centered against three lines, which is what made it read as a
   stray floating column instead of part of the same row. Each dot carries the
   same warm→amber→cobalt→green colour the ring and every goal's own progress
   ring already use, so this reads as more of that language, not a new one.
   Ellipsised per line so up to three full sentences (up to 200 chars each)
   can never force the row to wrap or the page to scroll sideways. */
.heroRow.withList { align-items:flex-start; }
.hero > .heroRow:first-child { margin-top:0; }
/* The faded rule between the card's two halves — same token .heroSub's
   own top border already uses above the time-off row, so the card reads as
   three evenly weighted bands rather than one dense stack. */
.heroDivider { border-top:1px solid var(--onDarkBorder); margin:14px 0 12px; }
/* One tap to the two things people open My Home to actually do. Ghost
   buttons in the hero's own on-dark tokens, so they belong to the card. */
.heroQuick { display:flex; gap:8px; margin-top:12px; }
.heroQuick button { flex:1; min-width:0; padding:9px 8px; border:1px solid var(--onDarkBorder); border-radius:10px;
  background:none; color:var(--onDark); font:inherit; font-size:12.5px; font-weight:700; line-height:1.25; cursor:pointer;
  -webkit-tap-highlight-color:transparent; }
.heroQuick button:active { opacity:.72; }
.heroGoalsPreview { margin-left:auto; padding-top:1px; text-align:right; font-size:12px; font-weight:600; line-height:1.6; color:var(--onDark); max-width:48%; overflow:hidden; min-width:0; }
.heroGoalsPreview div { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.heroGoalDot { display:inline-block; width:6px; height:6px; border-radius:50%; margin-right:5px; vertical-align:middle; }
/* My Home reuses these exact hero rows for stats that jump to a section
   on tap — Base's own rows stay plain divs, so the reset only applies when
   the tag is actually a button, and only those get the pointer cursor. */
button.heroRow, button.heroSubRow { width:100%; background:none; border:none; padding:0;
  text-align:left; font:inherit; color:inherit; cursor:pointer; -webkit-tap-highlight-color:transparent; }
button.heroRow:active, button.heroSubRow:active { opacity:.72; }
/* the hero's day-streak number, the first time it crosses 7 or 30 */
.heroNum.cheer { animation:gpCheer .62s var(--spring) both; }
@keyframes gpCheer { 0%{transform:scale(.8) rotate(-4deg)} 55%{transform:scale(1.14) rotate(3deg)} 100%{transform:scale(1) rotate(0)} }
@media (prefers-reduced-motion: reduce){ .heroNum.cheer { animation:none } }
.heroSub { border-top:1px solid var(--onDarkBorder); margin-top:13px; padding-top:10px; }
.heroSubRow { display:flex; align-items:baseline; gap:8px; }
.heroSubLabel { font-size:11px; letter-spacing:2.2px; color:var(--amber); font-weight:700; }
.heroSubNum { font-family:'Koulen',sans-serif; font-size:29px; line-height:1; color:var(--onDark); margin-left:auto; }
.heroQ { display:flex; gap:13px; flex-wrap:wrap; margin-top:6px; font-size:13px; color:var(--onDarkFaint); }
.heroQ b { color:var(--onDark); font-family:'Koulen',sans-serif; font-weight:400; }
/* who the staff are: kind of staff, and where from (gpStaffMixHtml) */
.staffMix { gap:10px; margin-top:8px; }
.staffMix span { border:1px solid var(--onDarkBorder); border-radius:999px; padding:3px 10px; font-size:12.5px; }
.staffMix b { color:var(--onDark); font-family:'Koulen',sans-serif; font-weight:400; margin-left:2px; }
.staffMixRow { margin-top:6px; }
.staffMixRow.dim { color:var(--onDarkFaint); font-size:12px; }
.mixBtn { background:none; border:0; padding:0; font:inherit; color:var(--onDark); text-align:left; white-space:normal;
  text-decoration:underline; text-decoration-style:dotted; text-underline-offset:3px;
  text-decoration-color:var(--amber); cursor:pointer; }
.mine { border-color:var(--accent) !important; box-shadow:0 0 0 1px var(--accent) inset; }

.dir { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; }
.dircard { background:var(--surface); border:1px solid var(--border); border-radius:var(--r); padding:14px; text-align:center; cursor:pointer; }
.dircard .avatar { margin:0 auto 8px; }
.dircard .pname { font-size:16px; }

nav.bottom { position:fixed; bottom:0; left:0; right:0; background:var(--navBg); border-top:1px solid var(--border);
  display:flex; z-index:10; padding-bottom:env(safe-area-inset-bottom);
  padding-left:env(safe-area-inset-left); padding-right:env(safe-area-inset-right); }
nav.bottom button { flex:1; padding:10px 2px 8px; background:none; border:none; cursor:pointer; color:var(--muted); font-size:10.5px; }
nav.bottom button .ic { display:block; font-size:20px; margin-bottom:2px; }
nav.bottom button.on { color:var(--accent); font-weight:700; }

.banner { background:var(--banner); border:1px solid var(--bannerBorder); border-radius:10px; padding:11px 13px; font-size:13px; line-height:1.45; color:var(--bannerInk); margin-bottom:14px; }
.privateWrap { border:1.5px dashed var(--bannerBorder); border-radius:12px; padding:4px 14px 8px; margin-top:12px; background:var(--surface); }
.privateWrap .qBlock { border-color:var(--bannerBorder); }

/* weekly goals */
.pctBig { font-family:'Koulen',sans-serif; font-size:27px; color:var(--accent); white-space:nowrap; }
.pctSm { font-family:'Koulen',sans-serif; font-size:18px; color:var(--accent); white-space:nowrap; }
.bar { height:8px; background:var(--surface2); border-radius:99px; overflow:hidden; margin:2px 0 12px; }
.barFill { height:100%; background:var(--accent); border-radius:99px; transition:width .25s ease; }
.barFill.done { background:var(--amber); }
.goalRow { display:flex; align-items:flex-start; gap:11px; padding:11px 0; border-bottom:1px solid var(--line); }
.goalRow:last-of-type { border-bottom:none; }
.goalText { font-size:14.5px; line-height:1.35; padding-top:3px; }
/* ---- a goal's progress is a percentage ----
   The ring itself now lives in the shared theme block, because the dashboard uses
   it too. What stays here is the slider: the ring is the read, the slider is the
   write — drag it and it saves on release. */
.goalBody { flex:1 1 auto; min-width:0; }
.gSlide { -webkit-appearance:none; appearance:none; width:100%; height:26px; background:transparent;
  margin:7px 0 0; display:block; cursor:pointer;
  /* Horizontal is the slider's, vertical is the page's — same split as the
     health sliders, said out loud so nobody sets this to `none` again. */
  touch-action:pan-y; }
.gSlide::-webkit-slider-runnable-track { height:10px; border-radius:99px;
  background:linear-gradient(90deg, var(--gc) var(--p1), var(--surface2) var(--p1)); }
.gSlide::-moz-range-track { height:10px; border-radius:99px;
  background:linear-gradient(90deg, var(--gc) var(--p1), var(--surface2) var(--p1)); }
.gSlide::-webkit-slider-thumb { -webkit-appearance:none; appearance:none; width:24px; height:24px;
  border-radius:50%; background:var(--surface); border:3px solid var(--gc); margin-top:-7px;
  box-shadow:0 2px 8px rgba(23,21,15,.22); transition:transform .12s ease; }
.gSlide::-moz-range-thumb { width:24px; height:24px; border-radius:50%; background:var(--surface);
  border:3px solid var(--gc); box-shadow:0 2px 8px rgba(23,21,15,.22); }
.gSlide:active::-webkit-slider-thumb { transform:scale(1.18); }
.gSlide:focus-visible { outline:2px solid var(--accent); outline-offset:3px; border-radius:99px; }
.gWord { font-size:11.5px; letter-spacing:.4px; text-transform:uppercase; font-weight:700;
  color:var(--gc); margin-top:4px; }
.barFill { background:linear-gradient(90deg,var(--accent),var(--accent2)); }
.barFill.done { background:linear-gradient(90deg,var(--amber),var(--amberDeep)); }
@media (prefers-reduced-motion: reduce){ .gRing, .gSlide::-webkit-slider-thumb { transition:none } }
.kpiIn { width:88px !important; text-align:right; }

/* team directory grouped by department then ministry */
.campusSeg { display:inline-flex; background:var(--surface2); border-radius:12px; padding:3px; gap:3px; margin-bottom:14px; max-width:280px; }

.mmGrid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:12px; }

.teamPickRow { display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap; }

.teamHead { display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
.teamStats { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
.teamStat { font-size:12px; color:var(--muted); background:var(--surface2); border:1px solid var(--border); border-radius:999px; padding:3px 9px; }
.teamStat b { color:var(--ink); }
.teamGrid2 { display:grid; grid-template-columns:1fr 1fr; gap:0 10px; }
.teamGrid3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:0 10px; }

.adminMenu { display:grid; gap:10px; margin-top:6px; }
.adminMenuCard { display:flex; align-items:center; gap:12px; width:100%; text-align:left; font:inherit; color:var(--ink); cursor:pointer; padding:14px; }

.adminRowText { flex:1; min-width:0; display:flex; flex-direction:column; gap:1px; }

.adminPersonHead { display:flex; gap:12px; align-items:center; }

.leaveActions { display:flex; gap:8px; margin-top:8px; }

.adminMentorHead { display:flex; align-items:center; gap:10px; width:100%; background:none; border:0; padding:6px 0 8px; font:inherit; text-align:left; color:var(--ink); cursor:pointer; }
.mmTile.hot { border-color:var(--accent); }
.mmTile.hot .mmTileNum { color:var(--accent); }
.hrChip { flex:0 0 auto; font-size:11.5px; font-weight:700; border-radius:999px; padding:3px 9px; border:1px solid var(--border); background:var(--surface2); color:var(--muted); max-width:42%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.hrChip.active { color:var(--good); border-color:var(--good); }
.hrChip.due { color:var(--amber); border-color:var(--amber); }

.hrBanner { margin-top:12px; padding:10px 12px; border-radius:10px; background:var(--surface2); border:1px solid var(--border); font-size:14px; }
.hrBanner.active { border-color:var(--good); }
.hrBanner.due { border-color:var(--amber); }
.hrBanner.expired { border-color:var(--bad); }
.hrToggle { display:flex; align-items:center; gap:8px; font-size:13px; color:var(--muted); margin:0 0 8px; }
.hrFiles { margin-top:8px; }
.hrFile { display:flex; align-items:center; gap:10px; padding:6px 0; border-top:1px solid var(--line); font-size:13px; }
.hrFileName { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.hrAttach { display:block; text-align:center; margin-top:8px; cursor:pointer; }
.candSteps { display:flex; flex-wrap:wrap; gap:6px; }
.candStep { border:1.5px solid var(--border2); background:var(--bg); border-radius:999px; padding:7px 12px; font-size:12.5px; cursor:pointer; color:var(--muted); font-family:inherit; }
.candStep.done { border-color:var(--good); color:var(--good); }
.candStep.on { background:var(--accent); border-color:var(--accent); color:var(--accentInk); font-weight:700; }

.wkStrip { display:flex; gap:6px; margin:12px 0 6px; flex-wrap:wrap; }
.wkDot { width:34px; height:34px; border-radius:50%; border:1px solid var(--border); background:var(--surface2); color:var(--muted);
  font:inherit; font-size:12px; font-weight:700; cursor:pointer; padding:0; -webkit-tap-highlight-color:transparent; }
.wkDot.on { background:var(--accent); border-color:var(--accent); color:var(--accentInk); }

/* ---- the drill-down sheet (rollup.js renders it; these are its clothes) ----
   Same sheet the dashboard uses, so "where did this number come from" looks the
   same wherever you tap a figure. */
/* A figure that opens has to LOOK like it opens. This was cursor:pointer only,
   which is nothing at all on a phone — so which numbers were tappable was pure
   guesswork, and the ones that are deliberately closed (a count of ministries, a
   figure derived by a formula) looked identical to a broken one. The dotted rule
   under the number is the affordance; ▸ marks the tile-shaped ones. */
.drillable { cursor:pointer; -webkit-tap-highlight-color:transparent; }
.drillable .statNum, .drillable .rowVal, .drillable.rowVal {
  text-decoration:underline dotted var(--accent); text-underline-offset:4px;
  text-decoration-thickness:1.5px; }
.stat.drillable { position:relative; }
.stat.drillable::after { content:'▸'; position:absolute; top:8px; right:9px;
  font-size:11px; line-height:1; color:var(--accent); opacity:.65; }
.drillable:active { opacity:.62; }
@media (prefers-reduced-motion: reduce){ .drillable:active { opacity:1 } }

@keyframes ddUp { 0%{transform:translateY(24px);opacity:0} 100%{transform:translateY(0);opacity:1} }
@media (prefers-reduced-motion: reduce){ .ddModal { animation:none } }

.ddRowHead { display:flex; justify-content:space-between; gap:10px; font-size:14px; }
.ddRowVal { font-family:'Koulen',sans-serif; color:var(--accent); white-space:nowrap; }

/* ---- Base health → Export as slides ----
   A full-screen deck of the base's health figures: the app's own type
   (Koulen numbers, Kantumruy labels) and colours, one figure family per
   slide, 16:9 so a saved PNG or printed page is the same picture as the
   screen. .hxOn on <body> stops the page behind it scrolling. */
.portalRow { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.portalWho { display:flex; align-items:center; gap:10px; flex:1 1 200px; min-width:0; background:none; border:0; padding:0; text-align:left; font-family:inherit; color:var(--ink); cursor:pointer; }
.portalTick { display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--muted); white-space:nowrap; }
.portalTick input { width:18px; height:18px; accent-color:var(--accent); }
.hxOpenBtn { display:inline-flex; align-items:center; gap:6px; margin:0 0 10px; padding:8px 14px; border-radius:999px;
  border:1.5px solid var(--accent); background:transparent; color:var(--accent); font-family:'Koulen',sans-serif;
  font-size:14px; letter-spacing:.8px; cursor:pointer; }
.hxOpenBtn:active { opacity:.7; }
body.hxOn { overflow:hidden; }
.hxOverlay { position:fixed; inset:0; z-index:60; background:var(--ink); display:flex; flex-direction:column; color:var(--bg); }
.hxBar { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:10px 14px; font-size:12.5px; opacity:.9; }
.hxCount { font-family:'Koulen',sans-serif; letter-spacing:1px; font-size:14px; }
.hxTools { display:flex; gap:6px; align-items:center; }
.hxTool { border:1px solid rgba(255,255,255,.35); background:transparent; color:inherit; border-radius:999px; padding:6px 11px; font-size:12px; font-family:inherit; cursor:pointer; }
.hxClose { background:transparent; border:none; color:inherit; font-size:20px; padding:4px 6px 4px 10px; cursor:pointer; line-height:1; }
.hxStage { flex:1; display:flex; align-items:center; justify-content:center; padding:0 10px; min-height:0; }
.hxFrame { display:none; width:100%; max-width:min(100%, calc((100vh - 130px) * 16 / 9)); aspect-ratio:16/9; }
.hxFrame.on { display:block; }
.hxSlide { position:relative; width:100%; height:100%; box-sizing:border-box; background:var(--bg); color:var(--ink); border-radius:14px; overflow:hidden;
  padding:5.5% 5.6% 4.5%; display:flex; flex-direction:column; container-type:inline-size; }
.hxSlide::before { content:''; position:absolute; left:0; right:0; top:0; height:1.4cqw; background:var(--accent); }
.hxSlide::after { content:''; position:absolute; left:0; right:0; top:1.4cqw; height:.35cqw; background:var(--amber); }
.hxLogo { position:absolute; right:5.6%; top:8%; width:9cqw; height:9cqw; border-radius:50%; background:var(--ink); padding:.6cqw; box-sizing:border-box; }
.hxKicker { font-size:1.6cqw; letter-spacing:.25em; text-transform:uppercase; color:var(--faint); font-weight:700; }
.hxTitle { font-family:'Koulen',sans-serif; font-size:5.4cqw; line-height:1.05; letter-spacing:.02em; margin-top:.6cqw; }
.hxTitle.big { font-size:9.5cqw; }
.hxWhen { font-size:2.2cqw; color:var(--muted); margin-top:.5cqw; }
.hxHead { border-bottom:2px solid var(--border); padding-bottom:1.6cqw; }
.hxGrid { flex:1; display:grid; gap:2cqw 3cqw; align-content:center; padding-top:1.5cqw; }
.hxGrid.n1 { grid-template-columns:1fr; }
.hxGrid.n2 { grid-template-columns:1fr 1fr; }
.hxGrid.n3 { grid-template-columns:repeat(3,1fr); }
.hxGrid.n4 { grid-template-columns:1fr 1fr; }
.hxItem { min-width:0; }
.hxNum { font-family:'Koulen',sans-serif; font-size:9.5cqw; line-height:.95; color:var(--accent); white-space:nowrap; }
.hxGrid.n3 .hxNum { font-size:11cqw; }
.hxUnit { font-size:.42em; margin-left:.12em; }
.hxLbl { font-size:2.1cqw; font-weight:500; margin-top:.9cqw; line-height:1.25; }
.hxSub { font-size:1.6cqw; color:var(--muted); margin-top:.3cqw; }
.hxCover .hxItem.hxHero { margin-top:auto; }
.hxCover .hxHero .hxNum { font-size:19cqw; }
.hxCover .hxHero .hxLbl { font-size:2.6cqw; }
.hxTrend { font-size:2.4cqw; font-weight:700; margin-top:1cqw; }
.hxTrend.good { color:var(--good); } .hxTrend.bad { color:var(--bad); }
.hxEnd .hxTitle { margin-top:auto; font-size:6cqw; }
.hxFoot { margin-top:auto; font-size:1.7cqw; color:var(--faint); }
.hxNav { display:flex; align-items:center; justify-content:center; gap:14px; padding:10px 14px 16px; }
.hxArrow { width:44px; height:44px; border-radius:50%; border:1px solid rgba(255,255,255,.35); background:transparent; color:inherit; font-size:24px; cursor:pointer; line-height:1; }
.hxArrow:disabled { opacity:.3; }
.hxDots { display:flex; gap:7px; }
.hxDot { width:8px; height:8px; border-radius:50%; border:none; padding:0; background:rgba(255,255,255,.35); cursor:pointer; }
.hxDot.on { background:var(--amber); }
/* A phone held upright: 16:9 would leave the deck a thin strip in a sea of
   dark, so the slide stands taller and every size steps up — the PNG and
   the print still come out 16:9 from the same figures. */
@media (max-width:699px) and (orientation:portrait) {
  .hxFrame { aspect-ratio:3/4; max-width:min(100%, calc((100vh - 130px) * 3 / 4)); }
  .hxGrid.n3 { grid-template-columns:1fr; }
  .hxGrid { gap:3.5cqw 4cqw; }
  .hxNum, .hxGrid.n3 .hxNum { font-size:15cqw; }
  .hxLbl { font-size:3.6cqw; margin-top:1.2cqw; } .hxSub { font-size:2.9cqw; }
  .hxKicker { font-size:2.5cqw; } .hxTitle { font-size:8cqw; } .hxTitle.big { font-size:13cqw; } .hxWhen { font-size:3.4cqw; }
  .hxLogo { width:14cqw; height:14cqw; }
  .hxCover .hxHero .hxNum { font-size:28cqw; } .hxCover .hxHero .hxLbl { font-size:4.2cqw; } .hxTrend { font-size:3.8cqw; }
  .hxEnd .hxTitle { font-size:8.5cqw; } .hxFoot { font-size:3cqw; }
}
@media print {
  @page { size:landscape; margin:0; }
  body.hxOn > *:not(#hxRoot) { display:none !important; }
  body.hxOn { overflow:visible; }
  .hxOverlay { position:static; display:block; background:transparent; }
  .hxBar, .hxNav { display:none !important; }
  .hxStage { display:block; padding:0; }
  .hxFrame { display:block !important; max-width:none; width:100vw; height:100vh; aspect-ratio:auto; page-break-after:always; break-after:page; }
  .hxSlide { border-radius:0; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
}
/* ---- Base health, quarter by quarter ---- */
.hqCols { width:100%; height:auto; display:block; overflow:visible; }

.hxChart { flex:1; display:flex; align-items:center; padding:1.5cqw 2cqw 0; }
.hxChart .hqCols { max-height:100%; }
.hxChart .hqVal { font-size:13px; } .hxChart .hqQ { font-size:9px; } .hxChart .hqDelta { font-size:8.5px; }

<!-- ==================== SPLASH ====================
     THIS BLOCK IS DUPLICATED VERBATIM IN index.html AND teams.html.
     tests/test-splash.mjs asserts the two copies are byte-identical — edit one,
     edit both. It is inlined rather than pulled from a file because it has to
     paint on the very first frame: an external stylesheet is another round trip,
     and a round trip is the whole problem this solves.

     Why it exists: the PWA's start_url is index.html, so every launch loads the
     dashboard and then navigates to the staff page. That second navigation is a
     real network fetch, so for as long as it takes you saw the dashboard. Script
     timing cannot fix that — the splash is in the markup from the first byte and
     covers the viewport, so there is nothing to see underneath at any point.

     background is the manifest's background_color, so the iOS launch screen and
     this are the same colour and the hand-off has no flash of white or paper.

     The ring spins immediately, from CSS alone, because logo.js is 77KB and must
     not block the head. The real GP mark fades into the middle the moment it
     lands — normally within a few tens of ms, and instantly once cached. -->
<style>
#splash { position:fixed; inset:0; z-index:9999; background:var(--headerBg);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px;
  opacity:1; transition:opacity .34s ease; }
#splash.gone { opacity:0; pointer-events:none; }
.spCoin { width:104px; height:104px; border-radius:50%; position:relative;
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 0 0 4px rgba(31,68,255,.16), 0 14px 40px rgba(31,68,255,.34); }
/* The comet ring: visible from frame one, no image needed. Masked to a 3px band
   so it reads as a ring rather than a filled disc. */
.spCoin::before { content:''; position:absolute; inset:-9px; border-radius:50%;
  background:conic-gradient(from 0deg, rgba(31,68,255,0) 0deg, rgba(31,68,255,.15) 200deg, var(--accent) 340deg, var(--accent2) 360deg);
  -webkit-mask:radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px));
  mask:radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px));
  animation:spSpin 1s linear infinite; }
/* The mark is white, drawn for the black header, so it reads on this background
   with no coin behind it. Hidden until it has a src, so it is never a blank gap. */
.spCoin img { width:74px; height:auto; opacity:0; transition:opacity .3s ease;
  animation:spSpin 1.4s linear infinite; }
.spCoin img[src] { opacity:1; }
.spWord { font-family:'Koulen',system-ui,sans-serif; font-size:20px; letter-spacing:2.5px;
  color:var(--onDark); text-transform:uppercase; }
.spWord::after { content:''; animation:spDots 1.4s steps(1,end) infinite; }
@keyframes spSpin { to { transform:rotate(360deg) } }
@keyframes spDots { 0%{content:''} 25%{content:'.'} 50%{content:'..'} 75%,100%{content:'...'} }
@media (prefers-reduced-motion: reduce){
  .spCoin::before, .spCoin img { animation:none }
  .spWord::after { content:'...' }
}
</style>
<div id="splash"><div class="spCoin"><img id="splashLogo" alt=""></div><div class="spWord">Impact Loading</div></div>
<script>
/* Two calls, so nothing else needs to know how the splash is built:
   gpSplashLogo(src) drops the real mark in once logo.js has landed, and
   gpSplashDone() takes the splash down when there is finally something behind it
   worth looking at. Both are safe to call more than once, and safe to call before
   the element exists.

   The timeout is the important part: if any path forgets to call gpSplashDone —
   an error boundary, a branch added later — the splash would sit there covering a
   working app forever. Better to reveal a half-drawn page than to trap it. */
(function(){
  var TIMEOUT = 8000;
  window.gpSplashLogo = function(src){
    var i = document.getElementById('splashLogo');
    if(i && typeof src === 'string' && src && !i.getAttribute('src')) i.src = src;
  };
  window.gpSplashDone = function(){
    var s = document.getElementById('splash');
    if(!s || s.className.indexOf('gone') > -1) return;
    s.className = 'gone';
    setTimeout(function(){ if(s.parentNode) s.parentNode.removeChild(s); }, 420);
  };
  setTimeout(function(){ window.gpSplashDone(); }, TIMEOUT);
})();
</script>
<!-- ================== END SPLASH ================== -->

<script>
/*  Error boundary — must come first, before any other script.

    This page is the app's front door for signed-in staff, so a failure here
    used to be inescapable: index.html redirects here, and a blank screen gave
    no way back to the dashboard. The fallback always offers that way out. */
(function(){
  var shown = false;
  function fallback(what){
    if(shown) return; shown = true;
    // Latch it so a later render() can't paint over the message.
    window.gpDead = true;
    // And lift the splash, or the message sits behind it and the app looks hung.
    if(window.gpSplashDone) window.gpSplashDone();
    var html =
      '<div style="max-width:420px;margin:12vh auto;padding:0 22px;text-align:center;'+
      'font-family:system-ui,sans-serif;color:var(--ink)">'+
      '<div style="font-size:40px;line-height:1">✦</div>'+
      '<h2 style="font-size:19px;margin:14px 0 8px">This didn’t load properly</h2>'+
      '<p style="font-size:14.5px;line-height:1.5;color:var(--muted);margin:0 0 18px">'+
      'Usually a connection hiccup. Nothing you’ve logged was lost.</p>'+
      '<button id="gpReload" style="width:100%;padding:14px;border:0;border-radius:12px;'+
      'background:var(--accent);color:var(--accentInk);font-size:16px;font-weight:700;cursor:pointer">Try again</button>'+
      '<button id="gpDash" style="width:100%;padding:13px;margin-top:9px;border:1.5px solid var(--border2);'+
      'border-radius:12px;background:transparent;color:var(--ink);font-size:15px;cursor:pointer">Open the dashboard</button>'+
      '<div style="font-size:11px;color:var(--faint);margin-top:20px">'+String(what||'').slice(0,140)+'</div>'+
      '</div>';
    function paint(){
      var host = document.getElementById('main') || document.body;
      if(!host) return;
      host.innerHTML = html;
      var nav = document.getElementById('bottomNav');
      if(nav) nav.classList.add('hidden');
      var r = document.getElementById('gpReload');
      if(r) r.onclick = function(){ location.reload(); };
      var d = document.getElementById('gpDash');
      if(d) d.onclick = function(){
        // Break the auto-redirect so the dashboard is actually reachable.
        try { sessionStorage.setItem('gp-skip-teams','1'); } catch(e){}
        location.href = 'index.html';
      };
    }
    if(document.body) paint();
    else document.addEventListener('DOMContentLoaded', paint);
  }
  window.addEventListener('error', function(e){
  /* A failed <script src> fires an error event on the element itself.

     Only some scripts are load-bearing. logo.js and km.js are marked
     data-optional because the page works without them — a missing logo is a
     missing image, and a missing dictionary just leaves the text in English.
     Killing the whole app for either is far worse than the thing it prevents,
     and on the patchy phone connections this is built for, a third request is a
     third chance to fail. taxonomy.js has no fallback and stays fatal. */
    if(e && e.target && e.target.tagName === 'SCRIPT'){
      if(e.target.hasAttribute('data-optional')) return;
      fallback('could not load ' + (e.target.src || 'a script'));
      return;
    }
    if(e && e.message) fallback(e.message);
  }, true);
  window.addEventListener('unhandledrejection', function(e){
    fallback((e && e.reason && e.reason.message) || 'unexpected error');
  });
  window.gpBootFailed = fallback;
})();
</script>

<script>
/* Paint the header mark and build the boot coin as soon as logo.js is in.

   The coin is written here rather than sitting in the body markup, because as
   markup it was an <img> with no src until this script ran: on a slow connection
   you watched an empty black ring spin with a hole in the middle. The dashboard
   never had that problem — it builds its loading box in render(), after the
   scripts are in — so this now matches it. An empty <main> for the few ms before
   logo.js lands looks like nothing; a hollow coin looks broken. */
(function(){
  var b=document.getElementById('brandLogo');
  if(b && typeof GP_LOGO_WIDE==='string') b.src=GP_LOGO_WIDE;
  if(typeof GP_LOGO!=='string') return;
  window.gpSplashLogo(GP_LOGO);
  var p=document.getElementById('ptrLogo'); if(p) p.src=GP_LOGO;
  var m=document.getElementById('main');
  if(m && !m.firstChild){
    m.innerHTML='<div class="loadingBox"><div class="loadCoin">'+
      '<img class="loadLogo" src="'+GP_LOGO+'" alt=""></div>'+
      '<div class="loadText">Impact Loading<span class="ldots"></span></div></div>';
  }
})();
</script>

/* CAMPUSES, getDepartments(), modeOf() and the metric lists come from
   taxonomy.js — the same file the dashboard uses, so a staff member's KPI
   card always matches what leadership sees. */
function deptsFor(campusId){ return Object.keys(getDepartments(campusId||'poipet')); }
function ministriesFor(campusId, dept){
  var d = getDepartments(campusId||'poipet')[dept];
  return d ? Object.keys(d) : [];
}

/* Mirrors MIN_WEEK_DAYS in the API: below this many logged days the week isn't
   scored or reported. Kept in step by hand — if you change one, change both. */
var MIN_WEEK_DAYS = 3;
function isoWeekOf(d){
  var y=d.getFullYear();
  var jan1=new Date(y,0,1);
  var monW1=new Date(y,0,1-((jan1.getDay()+6)%7));
  return Math.max(1, Math.min(52, Math.floor((d-monW1)/(7*86400000))+1));
}
function thisWeek(){ return isoWeekOf(new Date()); }
/* A monthly/quarterly-cadence metric still lives in the weekly-keyed
   `entries` store — it's just always read and written under the ONE week
   that contains the period's first day, so repeated saves within the same
   month/quarter land on the same cell instead of spreading across several
   (which would double-count on any sum roll-up). No back-navigation to a
   past period yet — this is "log it whenever this month/quarter", not a
   full picker. */
function monthAnchorWeek_(){
  var d=new Date();
  return isoWeekOf(new Date(d.getFullYear(), d.getMonth(), 1));
}
function quarterAnchorWeek_(){
  var d=new Date();
  return isoWeekOf(new Date(d.getFullYear(), Math.floor(d.getMonth()/3)*3, 1));
}

   in taxonomy.js. Returns that department name, or null for everyone else. */

   a teammate's own OKR view can also add the department they lead, not just
   S.me's. */

/* Same Monday-anchored math as isoWeekOf, run backwards: a week NUMBER back
   to the calendar date its Monday actually falls on, so the Weekly Goals
   header can say "Aug 17 – Aug 23" instead of a bare week number. */
var MONTH_ABBR=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function mondayOfWeek_(week){
  var y=new Date().getFullYear();
  var jan1=new Date(y,0,1);
  var monW1=new Date(y,0,1-((jan1.getDay()+6)%7));
  var d=new Date(monW1);
  d.setDate(d.getDate()+(Number(week)-1)*7);
  return d;
}
function weekRange_(week){
  var mon=mondayOfWeek_(week);
  var sun=new Date(mon); sun.setDate(sun.getDate()+6);
  var a=MONTH_ABBR[mon.getMonth()]+' '+mon.getDate();
  var b=sun.getMonth()===mon.getMonth() ? String(sun.getDate()) : MONTH_ABBR[sun.getMonth()]+' '+sun.getDate();
  return { short:a+' – '+b, year:sun.getFullYear() };
}
function weekRangeLabel_(week){
  var r=weekRange_(week);
  return gpT('Week of {range}, {year}',{range:r.short, year:r.year});
}
/* A compact "Aug 17 – 23" for secondary labels (the ministry KPI card),
   where the full "Week of …, 2026" sentence would be too long. */
function weekRangeShort_(week){ return weekRange_(week).short; }
function isoDateOf_(d){ return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
/* The Monday and Sunday of a given week, as YYYY-MM-DD — used to pick which
   date a backfilled ministry number should land on when you're not looking
   at the current week. */
function weekBounds_(week){
  var mon=mondayOfWeek_(week), sun=new Date(mon); sun.setDate(sun.getDate()+6);
  return { from:isoDateOf_(mon), to:isoDateOf_(sun) };
}
function kpiEntryDate_(week){

}

/* A request that never answers used to leave S.busy true forever, which killed
   every save button on the page until somebody thought to reload. fetch() has no
   timeout of its own, so this gives it one. */
var REQUEST_TIMEOUT_MS = 20000;

/* onErr is optional. Without it a failure does what it always did — say so and
   release the lock. With it, the caller owns the failure (the habit tiles use
   this to put back a toggle the server never accepted). */
function run(fn, args, onOk, onErr){
  var ctl = (typeof AbortController === 'function') ? new AbortController() : null;
  var settled = false;
  var timer = setTimeout(function(){ if(!settled && ctl) ctl.abort(); }, REQUEST_TIMEOUT_MS);
  function done(){ settled = true; clearTimeout(timer); }
  fetch('/.netlify/functions/api', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ fn: fn, args: args }),
    signal: ctl ? ctl.signal : undefined
  }).then(function(res){
    if(!res.ok){
      /* The function answers a crash with {ok:false, error:"…"} and a 500.
         Carry that text along: "Connection problem" on its own hides what
         actually went wrong, and the message is what lets it be fixed. */
      return res.text().then(function(txt){
        var msg='HTTP '+res.status;
        try { var j=JSON.parse(txt); if(j && j.error) msg+=' — '+j.error; } catch(e2){}
        throw new Error(msg);
      });
    }
    return res.json();
  }).then(function(d){ done(); return onOk ? onOk(d) : d; })
    .catch(function(e){
      done();
      if(onErr){ onErr(e); return; }
      showMsg(t('Connection problem — try again.')+(e && e.message && /HTTP/.test(e.message) ? ' ('+e.message+')' : '')); S.busy=false; render();
    });
}

/* ---- offline queue: a save on a bad connection is not lost ----
   Weekly Goals and the weekly health check-in both write a full snapshot
   for one week, not an incremental change, so "queue the latest attempt"
   is always correct — a second offline edit to the same week simply
   replaces the first, never stacks. That's what `key` buys: one pending
   write per key, last one wins.

   Deliberately narrow to these two for now — every other save in the app
   still just fails on a bad connection like it always did. Widening this
   to more of them is a question of picking the next one, not rebuilding
   the mechanism. */
var GP_QUEUE_KEY = 'gp-offline-queue';
function gpQueueList_(){
  try { return JSON.parse(localStorage.getItem(GP_QUEUE_KEY) || '[]'); } catch(e){ return []; }
}
function gpQueueSave_(list){
  try { localStorage.setItem(GP_QUEUE_KEY, JSON.stringify(list)); } catch(e){}
}
function gpQueueCount(){ return gpQueueList_().length; }
function gpQueuePut_(key, fn, args){
  var list = gpQueueList_().filter(function(x){ return x.key!==key; });
  list.push({ key:key, fn:fn, args:args, ts:Date.now() });
  gpQueueSave_(list);
  render();
}
function gpQueueRemove_(key){
  gpQueueSave_(gpQueueList_().filter(function(x){ return x.key!==key; }));
  render();
}
/* Real network status only, never a guess: does the browser itself think
   it has a connection right now. */
function gpOnline_(){ return typeof navigator==='undefined' || navigator.onLine!==false; }

/* Replays whatever's queued, oldest first, one at a time — stops trying
   (leaving the rest queued for next time) the moment one fails, so a
   still-bad connection doesn't burn through the whole list at once. */
var _gpQueueFlushing = false;
function gpQueueFlush(){
  if(_gpQueueFlushing || !gpOnline_()) return;
  var list = gpQueueList_();
  if(!list.length) return;
  _gpQueueFlushing = true;
  var i = 0;
  function next(){
    if(i>=list.length){ _gpQueueFlushing=false; return; }
    var item = list[i];
    run(item.fn, item.args, function(d){
      gpQueueRemove_(item.key);
      if(item.fn==='saveGoals' && d && d.goals) S.goals=d.goals;
      if(item.fn==='saveMyWeek' && d && d.checkins) S.checkins=d.checkins;
      i++; next();
    }, function(){ _gpQueueFlushing=false; });
  }
  next();
}
window.addEventListener('online', gpQueueFlush);
document.addEventListener('visibilitychange', function(){ if(!document.hidden) gpQueueFlush(); });

/* Every Weekly Goals action — add, remove, mark complete, drag the slider,

/* consecutive-day streak ending today or yesterday */
function streak(pred){
  var have={}; S.logs.forEach(function(l){ if(pred(l)) have[l.date]=1; });
  var d=new Date(); var n=0;
  // allow streak to still count if today not logged yet
  if(!have[fmtD(d)]) d.setDate(d.getDate()-1);
  while(have[fmtD(d)]){ n++; d.setDate(d.getDate()-1); }
  return n;
}

/* Forgiving streak: one missed day doesn't wipe the run, it spends the single
   grace day. Punitive streaks are why habit trackers get deleted in February. */
function graceStreak(pred){
  var have={}; S.logs.forEach(function(l){ if(pred(l)) have[l.date]=1; });
  var d=new Date();
  if(!have[fmtD(d)]) d.setDate(d.getDate()-1);   // today's not due yet
  var n=0, grace=1;
  while(true){
    if(have[fmtD(d)]){ n++; }
    else if(grace>0 && n>0){ grace--; }          // never start on a grace day
    else break;
    d.setDate(d.getDate()-1);
  }
  return n;
}
function bestStreak(pred){
  var days=S.logs.filter(pred).map(function(l){return l.date;}).sort();
  var best=0, run=0, prev=null;
  days.forEach(function(ds){
    if(prev){
      var gap=Math.round((new Date(ds+'T00:00:00')-new Date(prev+'T00:00:00'))/86400000);
      run = gap===1 ? run+1 : 1;
    } else run=1;
    if(run>best) best=run;
    prev=ds;
  });
  return best;
}
/* Habit results live in l.habits, but the original fixed columns (bible,
   workout, quietTime…) hold the history from before habits were configurable —
   fall back to them so nobody's streak resets to zero on this change. */
function didHabit(l, id){
  if(l.habits && l.habits[id]!==undefined) return !!l.habits[id];
  return !!l[id];
}
function habitPred(id){ return function(l){ return didHabit(l,id); }; }
function logForDate(ds){
  for(var i=0;i<S.logs.length;i++) if(S.logs[i].date===ds) return S.logs[i];
  return null;
}
function fmtD(d){ return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
function thisWeekLogs(){
  // Monday-based week matching the backend
  var d=new Date(); var day=(d.getDay()+6)%7; var mon=new Date(d); mon.setDate(d.getDate()-day); mon.setHours(0,0,0,0);
  var ms=fmtD(mon);
  return S.logs.filter(function(l){ return l.date>=ms; });
}
function sum(rows, f){ var acc=0; rows.forEach(function(r){ acc+=Number(f(r))||0; }); return acc; }
function count(rows, f){ var n=0; rows.forEach(function(r){ if(f(r)) n++; }); return n; }

/* ---------- boot ---------- */
function boot(){
  /* The dashboard's front door links straight here: ?reg=1 opens the create
     form rather than making someone find the "New here?" link first. */
  try { if(String(location.search||'').indexOf('reg=1')>-1) S.regMode = true; } catch(e){}
  var saved = null;
  try { saved = JSON.parse(lsGet('gp-staff')||'null'); } catch(e){}
  if(saved && saved.user && saved.pin){
    /* A remembered session goes straight to getMyBoot: it verifies the PIN and
       returns the staff record, so the separate staffLogin round-trip that used
       to come first is not needed. Logging in by hand still uses staffLogin,
       because there the answer to "is this PIN right" is the whole point. */
    S.auth = saved;
    run('getMyBoot', [saved.user, saved.pin], function(d){
      if(d && d.ok){
        S.me = d.staff; S.profile = d.profile;
        applyBoot(d);
        return;
      }
      /* Only forget the session when the server actually says the credentials are
         wrong. Anything else — a 500, a bad gateway, a truncated response — is the
         request failing, and making somebody retype their PIN because the server
         hiccuped is the wrong answer. run() already reports a dropped connection;
         this covers a server that answered but not with a page. */
      if(d && d.err === 'auth'){
        lsDel('gp-staff');
        S.me = null; S.auth = { user:'', pin:'' };
        showMsg(t('Your PIN didn’t work — please log in again.'));
      } else {
        showMsg(t('Couldn’t load your page — pull down to try again.'));
      }
      render();
    });
  } else { render(); }
}

  /* ONE request for everything this page needs. It used to be nine on top of the
     login — each verifying the same PIN, each re-rendering when it landed, so the
     page rebuilt itself nine times while it loaded. Sections that fail come back
     null and simply stay empty; the rest of the page still works. */
  run('getMyBoot', [S.auth.user, S.auth.pin], function(d){
    if(!d || !d.ok){ showMsg(t('Couldn’t load your page — pull down to try again.')); render(); return; }
    if(d.staff) S.me = d.staff;
    if(d.profile) S.profile = Object.assign(S.profile||{}, d.profile);
    applyBoot(d);
  });
  render();
}

/* Everything a boot payload carries, in one place, because two entry points use
   it: a remembered session and a fresh login. */
function applyBoot(d){
  S.roster = d.roster || [];
  S.logs = d.logs || [];
  adoptHabits(d.habits);
  S.mentees = d.mentees || [];
  S.mentorRequests = d.mentorRequests || [];
  S.goals = d.goals || [];
  S.checkins = d.checkins || [];
  if(d.trips) S.trips = d.trips;
  S.tripRequests = d.tripRequests || [];
  if(d.ministry) S.ministry = d.ministry;
  S.personal = d.personal || null;
  S.hrDue = (d.hrDue===undefined) ? null : d.hrDue;
  S.hrFollowUps = (d.hrFollowUps===undefined) ? null : d.hrFollowUps;
  if(d.teamTrips && d.teamTrips.ok) S.teamTrips[d.teamTrips.campus] = { trips: d.teamTrips.trips || [], canEdit: !!d.teamTrips.canEdit };
  S.smartGoals = d.smartGoals || [];
  S.oneOnOnes = d.oneOnOnes || [];
  S.broadcasts = d.broadcasts || [];
  if(d.base && d.base.entries) S.base = d.base;
  /* A boot payload is always the server's view, which for a week still
     queued offline is the OLD view — reapply the same overlay queueing
     used, or the screen would flash back to before the edit for a moment
     on every fresh boot until the flush below catches up. */
  gpQueueList_().forEach(function(item){
    if(item.fn==='saveGoals'){
      var gwk=item.args[2], gwritten=item.args[3];
      S.goals = (S.goals||[]).filter(function(g){ return Number(g.week)!==Number(gwk); })
        .concat([{week:gwk, pct:gpGoalsWeekPct_(gwritten), updated:'', items:gwritten}]);
    } else if(item.fn==='saveMyWeek'){
      var wwk=item.args[2], wpayload=item.args[3];
      S.checkins = (S.checkins||[]).filter(function(c){ return Number(c.week)!==Number(wwk); })
        .concat([Object.assign({week:wwk, source:'weekly', days:7}, wpayload)]);
    }
  });
  render();
  gpQueueFlush();
}

/* One buzz and one pop the first time a streak crosses 7 or 30, per browser
   session. Streaks are the one number here that is purely for the person holding
   the phone, so it is worth marking — but a celebration that fires on every render
   stops being one. Used to target a standalone streak chip under the hero; that
   chip was dropped as a duplicate of the hero's own number, so this now marks
   the hero's number directly (only present, and only worth marking, on My
   Database's own hero — not Base's, which uses .heroNum for a different figure). */
function celebrateStreak(){
  var el = document.querySelector('.hero.myHero .heroNum');
  if(!el) return;
  var st = graceStreak(function(){ return true; });
  if(st < 7) return;
  var band = st >= 30 ? '30' : '7';
  try {
    if(sessionStorage.getItem('gp-streak-cheer') === band) return;
    sessionStorage.setItem('gp-streak-cheer', band);
  } catch(e){ return; }   // no storage: skip rather than repeat it forever
  el.classList.add('cheer');
  gpTap(18);
}

function greeting(){
  var h=new Date().getHours();
  return h<12 ? 'Good morning' : (h<18 ? 'Good afternoon' : 'Good evening');

/* ---------- base: the first thing you see after logging in ----------
   The dashboard's figures, for the base this person actually works at. Nothing
   is computed here — rollup.js does the arithmetic, so these are the same
   numbers leadership reads, not a second opinion.

   getData() is the dashboard's own endpoint. It needs no leader code: the two
   money metrics leadership can see are stripped server-side for everyone else,
   so what lands here is what an ordinary staff member is allowed to read. */
var _baseRoll = null;
function baseR(){
  var d = S.base || {};
  if(!_baseRoll || _baseRoll.e!==d.entries || _baseRoll.s!==d.survey || _baseRoll.r!==S.roster){
    _baseRoll = { e:d.entries, s:d.survey, r:S.roster,
      api: gpRollup({ entries:d.entries, survey:d.survey, roster:S.roster, week:thisWeek() }) };
  }
  return _baseRoll.api;
}

/* A year other than the one getMyBoot already loaded (S.base). Health's year
   view needs to browse those without a second boot round-trip for every field
   on the page, so it fetches just that year's getData and caches it — the
   same anonymous, no-leader-code call S.base itself came from. */
function baseRFor(year){
  if(S.base && Number(S.base.year)===Number(year)) return baseR();
  var d = S.baseByYear[year];
  if(!d) return null;
  return gpRollup({ entries:d.entries, survey:d.survey, roster:S.roster, week:thisWeek() });
}
function ensureBaseYear(year, cb){
  if((S.base && Number(S.base.year)===Number(year)) || S.baseByYear[year]){ cb(); return; }
  run('getData', ['', year], function(dd){
    if(dd && dd.entries) S.baseByYear[year] = dd;
    cb();
  });
}

/* One tile. `metric` only decides formatting ($ / 1-10 / plain); a trend is
   passed in already rendered because only the caller knows what to compare; and
   `drill` carries the attributes that make the figure open its own breakdown.

   Every figure that came from logged entries gets a drill. A few can't have one
   — a school count is derived from several metrics at once, and the health score
   comes from check-ins rather than entries — and those stay plain rather than
   opening an empty sheet. */
function bstat(label, value, metric, trend, drill){
  return '<div class="stat'+(drill?' drillable':'')+'"'+(drill||'')+'>'+
    '<div class="statNum">'+fmt(value, metric)+'</div>'+
    '<div class="statLabel">'+esc(t(label))+(trend||'')+'</div></div>';
}

/* Q1-Q4 chips under a heading, so "per quarter" is answerable without leaving
   the page. Each chip drills into that quarter alone. */
function bquarters(label, valFn, drillFn){
  var h = '<div class="qRow"><span class="qRowLabel">'+esc(t(label))+'</span>';
  for(var q=0;q<4;q++){
    var d = drillFn ? drillFn(q) : '';
    h += '<span'+(d?' class="drillable"'+d:'')+'>Q'+(q+1)+' <b>'+fmt(valFn(q))+'</b></span>';
  }
  return h+'</div>';
}

var ACC_CHEVRON = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>';
function accRowHtml(bucketName, id, title, summaryClosed, bodyFn){
