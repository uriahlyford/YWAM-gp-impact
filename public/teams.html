  if(!S.leaveDraft) S.leaveDraft={from:'',to:'',type:'',reason:'',coverage:'',ack:false};
  var draft=S.leaveDraft;
  var draftWorkDays = (draft.from && draft.to && draft.to>=draft.from) ? leaveWorkDays_(draft.from,draft.to) : 0;
  var projectedPersonal = yt.personal + (draft.type==='personal'?draftWorkDays:0);
  var barPct = Math.min(100, Math.round(yt.personal/cap*100));

  h+='<div class="allowCard">'+
    '<div class="allowTitle">'+esc(t('Personal Time Off'))+'</div>'+
    '<div class="allowNote">'+esc(t('UofN Cambodia allocates a maximum of 6 weeks (30 work days) off per year for vacation, furlough, support raising and home visits.'))+'</div>'+
    '<div class="allowNum"><b>'+yt.personal+'</b> '+esc(gpT('/ {cap} days used',{cap:cap}))+'</div>'+
    '<div class="allowBar"><div class="allowBarFill" style="width:'+barPct+'%"></div></div>'+
    '<div class="allowMini">'+
      '<span>'+esc(t('Working Outside Siem Reap'))+' <b>'+yt.outside+'d</b></span>'+
      '<span>'+esc(t('Special Condition'))+' <b>'+yt.special+'d</b></span>'+
    '</div></div>';

  var approvals=(S.tripRequests||[]);
  if(approvals.length){
    h+='<h3>'+esc(t('Awaiting Your Approval'))+'</h3><div class="card">';
    approvals.forEach(function(r){
      h+='<div class="histRow" style="border-top:0;padding-top:0">'+
        '<div class="histTop"><span class="histType">'+esc(r.name)+' · '+esc(t(leaveTypeLabel_(r.type)))+'</span>'+
        '<span class="pill pending">'+esc(t('Pending'))+'</span></div>'+
        '<div class="histDates">'+esc(r.from)+(r.to!==r.from?' → '+esc(r.to):'')+' · '+esc(gpT('{n} work days',{n:r.workDays}))+'</div>'+
        '<div class="approveRow">'+
          '<button class="approveBtn yes" data-trok="'+esc(r.id)+'">'+esc(t('Approve'))+'</button>'+
          '<button class="approveBtn no" data-trno="'+esc(r.id)+'">'+esc(t('Deny'))+'</button>'+
        '</div></div>';
    });
    h+='</div>';
  }

  h+='<h3>'+esc(t('New Request'))+'</h3><div class="card">';
  h+='<div class="field"><label class="fieldLabel">'+esc(t('Leave Dates'))+'</label>'+
     '<div class="dateRow"><input type="date" id="lv_from" value="'+esc(draft.from||'')+'">'+
     '<input type="date" id="lv_to" value="'+esc(draft.to||'')+'"></div></div>';
  h+='<div class="workDaysLine"><b>'+draftWorkDays+'</b> '+esc(t('work days requested (Mon–Fri)'))+'</div>';

  h+='<div class="field"><label class="fieldLabel">'+esc(t('Leave Type'))+'</label><div class="typeChips">';
  [['outside','Working Outside Siem Reap','Not capped, tracked separately'],
   ['special','Special Condition','Not capped, tracked separately'],
   ['personal','Personal Time Off',"Counts against your 30-day allowance"]
  ].forEach(function(row){
    h+='<button type="button" class="typeChip'+(draft.type===row[0]?' on':'')+'" data-leavetype="'+row[0]+'">'+
       '<span class="typeDot"></span><span><div class="typeLabel">'+esc(t(row[1]))+'</div>'+
       '<div class="typeSub">'+esc(t(row[2]))+'</div></span></button>';
  });
  h+='</div></div>';

  if(draft.type==='personal' && projectedPersonal>cap){
    h+='<div class="noticeNote" style="background:var(--badSoft);color:var(--bad)">'+
       esc(t('This request would put you over your 30-day Personal Time Off allowance for the year.'))+'</div>';
  }

  h+='<div class="field"><label class="fieldLabel">'+esc(t('Reason'))+'</label>'+
     '<textarea id="lv_reason" maxlength="500" placeholder="'+esc(t('Why are you requesting this leave?'))+'">'+esc(draft.reason||'')+'</textarea></div>';
  h+='<div class="field"><label class="fieldLabel">'+esc(t('Ministry Coverage'))+'</label>'+
     '<textarea id="lv_coverage" maxlength="500" placeholder="'+esc(t('Who will cover your ministries while you’re away?'))+'">'+esc(draft.coverage||'')+'</textarea></div>';

  h+='<div class="noticeNote">'+esc(t('In-country leave needs at least 1 week notice · out-of-country leave needs at least 1 month notice.'))+'</div>';

  h+='<div class="ackRow"><button type="button" class="ackBox'+(draft.ack?' on':'')+'" id="lv_ack">'+
     '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></button>'+
     '<span>'+esc(t('I understand the 6-week (30-day) allowance for personal time off.'))+'</span></div>';

  var mentor = (S.me.mentorId && S.me.mentorStatus==='approved') ? personOf(S.me.mentorId) : null;
  var submitLabel = mentor ? gpT('Send to {name} for Approval',{name:mentor.name}) : t('Save this request');
  var canSubmit = draft.from && draft.to && draft.to>=draft.from && draft.type && draft.ack;
  h+='<button class="btn" id="saveLeave"'+(canSubmit?'':' disabled')+'>'+esc(submitLabel)+'</button>';
  if(!mentor) h+='<div class="hint">'+esc(t('Pick a mentor on your profile and these go to them for a quick yes.'))+'</div>';
  h+='</div>';

  h+='<h3>'+esc(t('My Requests'))+'</h3><div class="card">';
  if(d.trips.length){
    d.trips.slice(0,10).forEach(function(r){
      var pillCls = r.status==='declined'?'denied':(r.status==='approved'||r.status==='noted')?'approved':'pending';
      var pillLabel = r.status==='declined'?t('Denied'):r.status==='approved'?t('Approved'):r.status==='noted'?t('Noted'):t('Pending');
      h+='<div class="histRow"><div class="histTop"><span class="histType">'+esc(t(leaveTypeLabel_(r.type)))+'</span>'+
        '<span class="pill '+pillCls+'">'+esc(pillLabel)+'</span></div>'+
        '<div class="histDates">'+esc(r.from)+(r.to!==r.from?' → '+esc(r.to):'')+' · '+esc(gpT('{n} work days',{n:r.workDays}))+'</div></div>';
    });
  } else {
    h+='<p class="sub" style="margin:4px 0">'+esc(t('No requests yet.'))+'</p>';
  }
  h+='</div>';

  h+='<p class="hint" style="margin-top:10px">🔒 '+
     esc(t('Your team can see how many WORK days you’re away. Reason and coverage stay between you and your mentor.'))+'</p>';
  return h;
}

/* ---------- team directory ---------- */
function teamHtml(){
  if(S.person) return personHtml();

  /* One campus at a time, via the toggle, matching the mockup — the directory
     used to stack both campuses stacked at once, which read as one long list
     rather than "which base am I looking at right now". Defaults to your own
     campus, since that's whose team you open this tab to see. */
  var campus = S.teamCampus || (S.me && S.me.campus) || CAMPUSES[0].id;
  var cInfo = CAMPUSES.filter(function(c){ return c.id===campus; })[0];
  var here = S.roster.filter(function(p){ return p.campus===campus; });

  var h='<h2>'+esc(t('Team'))+' <small>· '+S.roster.length+' '+esc(t('staff'))+'</small></h2>'+
    mentorEntryHtml()+
    '<p class="sub">'+esc(t('Tap anyone to see their ministry and this week’s goals.'))+'</p>';

  h+='<div class="campusSeg">'+CAMPUSES.map(function(c){
    return '<button class="campusBtn'+(campus===c.id?' on':'')+'" data-teamcampus="'+esc(c.id)+'">'+esc(t(c.name))+'</button>';
  }).join('')+'</div>';

  h+='<h3>'+esc(t(cInfo?cInfo.name:campus))+' <small>· '+here.length+'</small></h3>';

  if(here.length){
    // group by department, then ministry inside it
    var byDept={};
    here.forEach(function(p){ (byDept[p.dept||'—']=byDept[p.dept||'—']||[]).push(p); });
    Object.keys(byDept).sort().forEach(function(dept){
      var people=byDept[dept];
      h+='<div class="deptBlock"><div class="deptHead">'+(MIN_EMOJI[dept]||'')+' '+esc(t(dept))+
         '<span class="deptN">'+people.length+'</span></div>';
      var byMin={};
      people.forEach(function(p){ (byMin[p.ministry||'']=byMin[p.ministry||'']||[]).push(p); });
      // named ministries first, "not set yet" last
      Object.keys(byMin).sort(function(a,b){ return a===''?1:(b===''?-1:(a<b?-1:1)); }).forEach(function(min){
        h+='<div class="minLabel">'+(min? (MIN_EMOJI[min]||'')+' '+esc(t(min)) : esc(t('Ministry not set yet')))+'</div>'+
           '<div class="dir">';
        byMin[min].forEach(function(p){
          h+='<div class="dircard" data-person="'+esc(p.id)+'">'+avatarHtml(p)+
             '<div class="pname">'+esc(p.name)+'</div>'+
             (p.role?'<div class="pmeta">'+esc(t(p.role))+'</div>':'')+'</div>';
        });
        h+='</div>';
      });
      h+='</div>';
    });
  } else {
    h+='<p class="sub">'+esc(t('No profiles yet.'))+'</p>';
  }
  return h;
}

/* --- one teammate, public view ---
   Deliberately thin: who they are, what they're working on this week, and how
   consistently they show up. Nothing the app treats as private appears here —
   the server sends an allowlist, so this page can't render what it never gets. */
function personHtml(){
  var d=S.person, p=d.staff;
  var h='<button class="linkbtn" id="personBack" style="text-align:left;text-decoration:none">← '+esc(t('Team'))+'</button>';
  h+='<div class="card"><div class="pcard">'+avatarHtml(p,'lg')+
    '<div><div class="pname">'+esc(p.name)+'</div>'+
    (p.role?'<div class="pmeta">'+esc(t(p.role))+'</div>':'')+
    '<div class="pmeta">'+esc(t(p.dept))+(p.ministry?' · '+esc(t(p.ministry)):'')+'</div>'+
    '<div class="pmeta">'+esc(t(campusName(p.campus)))+'</div></div></div>';
  var a=d.activity||{};
  if(a.daysLogged){
    h+='<div class="chips" style="margin-top:12px">'+
       '<span class="chip blue">'+a.weeksTracked+' '+esc(t('weeks tracked'))+'</span>'+
       (a.lastLogged?'<span class="chip blue">'+esc(t('last logged'))+' '+esc(a.lastLogged)+'</span>':'')+
       '</div>';
  }
  h+='</div>';

  var withGoals=(d.goals||[]).filter(function(g){ return g.items.some(function(i){return i.text;}); });
  h+='<h3>🗒️ '+esc(t('Weekly goals'))+'</h3>';
  if(!withGoals.length){
    h+='<div class="card"><p class="sub" style="margin:6px 0">'+
       esc(t('No goals written yet.'))+'</p></div>';
  } else {
    withGoals.forEach(function(g){
      h+='<div class="card"><div class="row" style="border:0;padding-top:0">'+
        '<span class="rowName">'+esc(t('Week'))+' '+g.week+'</span>'+
        '<span class="pctSm">'+(g.pct===null?'—':g.pct+'%')+'</span></div>';
      g.items.filter(function(i){return i.text;}).forEach(function(i){
        var ip=goalItemPct(i);
        h+='<div class="goalRow'+(ip>=100?' done':'')+'">'+ringHtml(ip)+
          '<div class="goalBody"><span class="goalText">'+esc(i.text)+'</span>'+
          (i.metricKey?'<div class="goalLink">📊 '+esc(t('moves'))+' '+esc(t(i.metricKey.split('|')[2]||''))+'</div>':'')+
          '</div></div>';
      });
      h+='</div>';
    });
  }
  /* Their objectives too — tapping a teammate should answer "what is this person
     working toward", not just "did they tick their boxes". Department-level, so
     nothing here is private to them. */
  h+=okrSectionHtml(p, false);

  h+='<p class="hint">🔒 '+esc(t('Daily check-ins, health answers and anything private stay between this person and their mentor.'))+'</p>';
  return h;
}

/* Mentor entry point lives at the top of Team rather than as its own tab. */
function mentorEntryHtml(){
  var reqN=(S.mentorRequests?S.mentorRequests.length:0)+(S.tripRequests?S.tripRequests.length:0);
  if(!S.mentees.length && !reqN) return '';
  var label = reqN
    ? reqN+' mentor request'+(reqN===1?'':'s')+' waiting'
    : gpT('{n} mentees',{n:S.mentees.length});
  return '<button class="btn'+(reqN?'':' ghost')+'" id="goMentor">🤝 '+esc(label)+'</button>';
}

/* ---------- mentor ---------- */
function mentorHtml(){
  if(S.mentee){
    var m=S.mentee, wl=S.menteeLogs;
    var h='<button class="linkbtn" id="menteeBack" style="text-align:left;text-decoration:none">← All mentees</button>';
    h+='<div class="card"><div class="pcard">'+avatarHtml(m,'lg')+'<div><div class="pname">'+esc(m.name)+'</div><div class="pmeta">'+esc(m.dept)+(m.role?' · '+esc(m.role):'')+'</div></div></div></div>';
    h+='<div class="banner">🔒 Shared with you as '+esc(m.name.split(' ')[0])+'\u2019s mentor. Hold it with care and prayer — this is trust, not surveillance.</div>';
    if(S.menteeProfile && S.menteeProfile.debt) h+='<div class="banner">💰 Currently carrying staff debt.</div>';

    /* Their weekly check-ins, by name. This is the one place a survey answer is
       attached to a person: the base average pools tokens and never sees a name,
       and choosing a mentor is what opens this view to that one person. Newest
       first, with the direction of travel — a mentor needs the trend more than
       any single week. */
    var mc=(S.menteeCheckins||[]).slice().sort(function(a,b){ return b.week-a.week; });
    h+='<h3>💚 '+esc(t('Their weekly check-ins'))+'</h3>';
    if(!mc.length){
      h+='<div class="card"><p class="sub" style="margin:6px 0">'+
         esc(t('No check-ins yet.'))+'</p></div>';
    } else {
      var latest=mc[0], prior=mc[1]||null;
      var lsc=compositeOf(latest), psc=prior?compositeOf(prior):null;
      h+='<div class="card"><div class="row" style="border:0;padding-top:0">'+
         '<span class="rowName"><strong>'+esc(t('Week'))+' '+latest.week+'</strong>'+
         '<div class="pmeta">'+esc(t(latest.source==='weekly'?'weekly check-in':'from daily logs'))+'</div></span>'+
         '<span class="pctBig">'+lsc.toFixed(1)+
           (psc!==null?trendBadge(pctChange(psc,lsc), true):'')+'</span></div>'+
         '<div class="bar"><div class="barFill'+(lsc>=8?' done':'')+'" style="width:'+Math.round(lsc*10)+'%"></div></div>';
      var yn=function(v){ return v?esc(t('Yes')):esc(t('No')); };
      var mt=function(id, hb, asPct){
        if(!prior) return '';
        var a=Number(prior[id]), b=Number(latest[id]);
        if(isNaN(a)||isNaN(b)) return '';
        if(asPct) return a===b ? trendBadge(0,hb) : trendBadge(b>a?100:-100, hb);
        return trendBadge(pctChange(a,b), hb);
      };
      [['lonely','Loneliness (avg)',false,'/10'],['clarity','Clarity (avg)',true,'/10'],
       ['growth','Growth (avg)',true,'/10'],['langHours','Language hours',true,''],
       ['minHours','Ministry hours',true,'']].forEach(function(q){
        var v=latest[q[0]];
        h+='<div class="row"><span class="rowName">'+esc(t(q[1]))+'</span><span class="rowVal">'+
           ((v===null||v===undefined)?'—':v+q[3])+mt(q[0],q[2],false)+'</span></div>';
      });
      [['porn','Looked at porn',false],['oneOnOne','Had a one-on-one',true],
       ['exercise','Exercised 3+ days',true],['quietTime','Regular quiet time',true],
       ['sharedFaith','Shared my faith',true],['sabbath','Sabbath / rest',true],
       ['debt','Have staff debt',false]].forEach(function(q){
        h+='<div class="row"><span class="rowName">'+esc(t(q[1]))+'</span><span class="rowVal">'+
           yn(latest[q[0]])+mt(q[0],q[2],true)+'</span></div>';
      });
      h+='</div>';
      if(mc.length>1){
        h+='<div class="card">';
        mc.forEach(function(c,i){
          var sc=compositeOf(c), older=mc[i+1]?compositeOf(mc[i+1]):null;
          h+='<div class="row"><span class="rowName">'+esc(t('Week'))+' '+c.week+'</span>'+
             '<span class="pctSm">'+sc.toFixed(1)+
               (older!==null?trendBadge(pctChange(older,sc), true):'')+'</span></div>';
        });
        h+='</div>';
      }
    }

    // Trajectory beats a compliance grid: last 7 days against the 7 before, so
    // you see direction rather than policing individual days.
    var menteeHabits=S.menteeHabits||[];
    if(menteeHabits.length){
      var recent=wl.slice(0,7), prior=wl.slice(7,14);
      var cnt=function(rows,id){ var n=0; rows.forEach(function(l){ if(l.habits&&l.habits[id]) n++; }); return n; };
      h+='<h3>'+esc(gpT('{name}’s habits',{name:m.name.split(' ')[0]}))+'</h3><div class="card">';
      menteeHabits.forEach(function(hb){
        var meta=habitMeta(hb.id);
        var a=cnt(recent,hb.id), b=cnt(prior,hb.id);
        var arrow = !prior.length ? '' :
          (a>b?' <span class="trend up">▲</span>':(a<b?' <span class="trend down">▼</span>':' <span class="trend flat">–</span>'));
        h+='<div class="row"><span class="rowName">'+meta.icon+' '+esc(t(meta.label))+
          '<div class="pmeta">'+(prior.length?esc(t('previous 7 days'))+': '+b:esc(t('first week of data')))+'</div></span>'+
          '<span class="pctSm">'+a+'/7'+arrow+'</span></div>';
      });
      h+='</div>';
    }

    // weekly goals + how they're tracking against them
    var mg=(S.menteeGoals||[]).filter(function(g){ return g.items.some(function(i){return i.text;}); });
    h+='<h3>🎯 Weekly goals</h3>';
    if(!mg.length){
      h+='<div class="card"><p class="sub" style="margin:6px 0">No goals written yet.</p></div>';
    } else {
      var scored=mg.filter(function(g){ return g.pct!==null; });
      var avg=scored.length ? Math.round(scored.reduce(function(a,g){return a+g.pct;},0)/scored.length) : null;
      h+='<div class="card"><div class="row" style="border:0;padding-top:0"><span class="rowName">Goals completed'+
        '<div class="pmeta">across '+mg.length+' week'+(mg.length===1?'':'s')+'</div></span>'+
        '<span class="pctBig">'+(avg===null?'—':avg+'%')+'</span></div>';
      h+='<div class="bar"><div class="barFill'+(avg>=100?' done':'')+'" style="width:'+(avg||0)+'%"></div></div></div>';
      mg.slice(0,4).forEach(function(g){
        h+='<div class="card"><div class="row" style="border:0;padding-top:0"><span class="rowName">Week '+g.week+'</span>'+
          '<span class="pctSm">'+(g.pct===null?'—':g.pct+'%')+'</span></div>';
        g.items.filter(function(i){return i.text;}).forEach(function(i){
          var mp=goalItemPct(i);
          h+='<div class="goalRow'+(mp>=100?' done':'')+'">'+ringHtml(mp)+
            '<div class="goalBody"><span class="goalText">'+esc(i.text)+'</span></div></div>';
        });
        h+='</div>';
      });
    }

    h+='<h3>Recent check-ins</h3><div class="card">';
    if(!wl.length) h+='<p class="sub" style="margin:6px 0">No entries yet.</p>';
    wl.slice(0,14).forEach(function(l){
      var flags=[];
      if(l.lonely!=null) flags.push('lonely '+l.lonely+'/10');
      if(l.porn) flags.push('⚠ porn');
      if(l.quietTime) flags.push('quiet time');
      if(l.workout) flags.push('workout');
      h+='<div class="row"><span class="rowName">'+esc(l.date)+'<div class="pmeta">'+(flags.join(' · ')||'—')+'</div></span></div>';
    });
    h+='</div>';

    /* A mentor relationship is consent to see everything below too — the
       ministry numbers they log, their annual goals, and their leave
       history — read-only, since none of this is the mentor's to edit. */
    var mmin=S.menteeMinistry;
    if(mmin && mmin.ministry){
      var mMetrics=metricsFor(mmin.campus, mmin.dept, mmin.ministry);
      if(mMetrics.length){
        h+='<h3>📊 '+esc(t(mmin.ministry))+'</h3><div class="card">';
        mMetrics.forEach(function(metric){
          var mode=modeOf(metric);
          var wks=mmin.entries[metric]||{};
          var agg=aggregate(wks, mode);
          h+='<div class="row"><span class="rowName">'+esc(t(metric))+'</span>'+
            '<span class="pctSm">'+fmt(agg, metric)+'</span></div>';
        });
        h+='</div>';
      }
    }

    var msmart=(S.menteeSmart||[]).filter(function(g){ return Number(g.year)===new Date().getFullYear(); });
    if(msmart.length){
      h+='<h3>'+esc(t('Annual Goals · SMART'))+'</h3><div class="card">';
      msmart.forEach(function(g){
        h+='<div class="smartGoal"><div class="smartTitle">'+esc(g.title)+'</div>'+
          (g.meta?'<div class="smartMeta">'+esc(g.meta)+'</div>':'')+
          '<div class="bar"><div class="barFill'+(g.pct>=100?' done':'')+'" style="width:'+g.pct+'%"></div></div>'+
          '<div class="smartActions"><span class="smartPct">'+g.pct+'%</span></div></div>';
      });
      h+='</div>';
    }

    var mtrips=S.menteeTrips;
    if(mtrips && mtrips.trips && mtrips.trips.length){
      h+='<h3>'+esc(t('Leave Request'))+'</h3><div class="card">';
      mtrips.trips.slice(0,10).forEach(function(r){
        var pillCls = r.status==='declined'?'denied':(r.status==='approved'||r.status==='noted')?'approved':'pending';
        var pillLabel = r.status==='declined'?t('Denied'):r.status==='approved'?t('Approved'):r.status==='noted'?t('Noted'):t('Pending');
        h+='<div class="histRow"><div class="histTop"><span class="histType">'+esc(t(leaveTypeLabel_(r.type)))+'</span>'+
          '<span class="pill '+pillCls+'">'+esc(pillLabel)+'</span></div>'+
          '<div class="histDates">'+esc(r.from)+(r.to!==r.from?' → '+esc(r.to):'')+' · '+esc(gpT('{n} work days',{n:r.workDays}))+'</div></div>';
      });
      h+='</div>';
    }
    return h;
  }
  var h='';

  /* Trips waiting on you as mentor. Sits above mentee requests because it's
     time-sensitive — someone is asking about days that are coming up. */
  if(S.tripRequests && S.tripRequests.length){
    h+='<h2>'+esc(t('Away requests'))+' <small>· '+S.tripRequests.length+'</small></h2>'+
       '<p class="sub">'+esc(t('People you mentor letting you know they’ll be off campus.'))+'</p>';
    S.tripRequests.forEach(function(r){

/* '' means auto — no attribute on <html>, so the CSS media query decides. The
   same key is read in <head> on all three pages before anything paints. */
function savedTheme(){
  var v = lsGet('gp-theme');
  return (v === 'light' || v === 'dark') ? v : '';
}
function applyTheme(v){
  if(v === 'light' || v === 'dark'){
    document.documentElement.setAttribute('data-theme', v);
    lsSet('gp-theme', v);
  } else {
    document.documentElement.removeAttribute('data-theme');
    lsDel('gp-theme');
  }
}

/* ---------- photo resize + upload ---------- */
function handlePhoto(file){
  var reader=new FileReader();
  reader.onload=function(e){
    var img=new Image();
    img.onload=function(){
      var max=300, w=img.width, h=img.height;
      if(w>h && w>max){ h=Math.round(h*max/w); w=max; } else if(h>max){ w=Math.round(w*max/h); h=max; }
      var cv=document.createElement('canvas'); cv.width=w; cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      var data=cv.toDataURL('image/jpeg',0.7).split(',')[1];
      showMsg('Uploading photo…');
      run('uploadPhoto',[S.auth.user,S.auth.pin,data,'image/jpeg'],function(d){
        if(d.ok){ S.me.photo=d.photo; saveStaffCard(); showMsg('Photo updated'); render(); }
        else showMsg(d && d.err==='bad_type' ? 'That image type isn\u2019t supported' : (d && d.err==='too_large' ? 'Photo too large \u2014 try a smaller one' : 'Upload failed'));
      });
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}

/* Same resize-then-upload shape as handlePhoto, just a wider frame since this
   sits behind a whole card rather than a small avatar circle. */
function handleDashboardBg(file){
  var reader=new FileReader();
  reader.onload=function(e){
    var img=new Image();
    img.onload=function(){
      var max=800, w=img.width, h=img.height;
      if(w>h && w>max){ h=Math.round(h*max/w); w=max; } else if(h>max){ w=Math.round(w*max/h); h=max; }
      var cv=document.createElement('canvas'); cv.width=w; cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      var data=cv.toDataURL('image/jpeg',0.6).split(',')[1];
      showMsg(t('Uploading image…'));
      run('uploadDashboardBg',[S.auth.user,S.auth.pin,data,'image/jpeg'],function(d){
        if(d.ok){ S.profile=S.profile||{}; S.profile.dashboardBg=d.dashboardBg; showMsg(t('Dashboard updated')); render(); }
        else showMsg(d && d.err==='bad_type' ? t('That image type isn’t supported') : (d && d.err==='too_large' ? t('Image too large — try a smaller one') : t('Upload failed')));
      });
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}

/* Persist the habit set (and Bible-plan position) without blocking the UI. */
function pushHabits(){
  run('saveMyHabits',[S.auth.user,S.auth.pin,myHabits()],function(d){
    if(d && d.ok){ S.habits=d.habits; }
    render();
  });
}
/* Write today's habit ticks through the existing daily-log endpoint, merged
   with whatever else today already holds so the full check-in isn't clobbered.

   The tap has to read as instant — waiting on a round trip before the button
   fills in is exactly what "not smooth" looks like — so the local copy of
   today's log is updated and rendered right away, and the save happens
   underneath that. The server's own answer still wins once it lands, the
   same way the goal slider and KPI running totals already work. */
function saveTodayHabits(map){
  var today=todayStr();
  var log=logForDate(today);
  if(!log){
    log={date:today, week:thisWeek(), langHours:0, minHours:0,
      workout:false, bible:false, quietTime:false, oneOnOne:false, sharedFaith:false, sabbath:false,
      clarity:null, growth:null, lonely:null, porn:false, habits:{}};
    S.logs=[log].concat(S.logs);
  }
  var payload={
    langHours:log.langHours||0, minHours:log.minHours||0,
    workout:log.workout, bible:log.bible, quietTime:log.quietTime,
    oneOnOne:log.oneOnOne, sharedFaith:log.sharedFaith, sabbath:log.sabbath,
    clarity:log.clarity, growth:log.growth, lonely:log.lonely, porn:log.porn,
    habits:map
  };
  // Keep the legacy columns in step for habits that have one, so streaks and
  // the mentor view stay consistent with pre-habits history.
  ['workout','bible','quietTime','oneOnOne','sharedFaith','sabbath'].forEach(function(k){
    if(map[k]!==undefined) payload[k]=map[k];
  });
  log.habits=map;
  ['workout','bible','quietTime','oneOnOne','sharedFaith','sabbath'].forEach(function(k){
    if(map[k]!==undefined) log[k]=map[k];
  });
  render();
  run('saveDaily',[S.auth.user,S.auth.pin,today,payload],function(d){
    S.busy=false;
    if(d.ok){
      S.logs=d.logs;
      if(d.habits) S.habits=d.habits;
    }
    render();
  });
}
/* Keep the locally-held derived week row in step with what the server just
   recomputed, so the summary updates without another round trip. */
function upsertCheckin(week){
  if(!week) return;
  S.checkins=(S.checkins||[]).filter(function(c){ return Number(c.week)!==Number(week.week); });
  S.checkins.unshift(week);
}
function todayHabitMap(){
  var log=logForDate(todayStr());
  var map={};
  myHabits().forEach(function(hb){ map[hb.id]= !!(log && didHabit(log,hb.id)); });
  return map;
}

function bindAway(){
  var lb=document.getElementById('leaveBack');
  if(lb) lb.onclick=function(){ S.view='week'; render(); };
  var gl=document.getElementById('goLeaveFromMe');
  if(gl) gl.onclick=function(){ S.view='leave'; render(); };
  var mb=document.getElementById('ministryBack');
  if(mb) mb.onclick=function(){ S.view='week'; render(); };
  var gm=document.getElementById('goMinistryFromMe');
  if(gm) gm.onclick=function(){ S.view='ministry'; render(); };

  // Ministries an overseer logs for load lazily, one request each, the first
  // time this page is open — cached in S.oversee after that until logout.
  if(S.view==='ministry'){
    var oDept=myOversightDept_();
    if(oDept){
      var oDeps=getDepartments(S.me.campus);
      Object.keys(oDeps[oDept]||{}).forEach(function(min){

        S.ovLoading[min]=true;

          S.ovLoading[min]=false;
          if(d && d.ok) S.oversee[min]=d;
          render();
        });
      });
    }
  }

  if(!S.leaveDraft) S.leaveDraft={from:'',to:'',type:'',reason:'',coverage:'',ack:false};
  ['lv_from','lv_to'].forEach(function(id){
    var el=document.getElementById(id);
    if(el) el.onchange=function(){ S.leaveDraft[id==='lv_from'?'from':'to']=el.value; render(); };
  });
  var lr=document.getElementById('lv_reason');
  if(lr) lr.oninput=function(){ S.leaveDraft.reason=lr.value; };
  var lc=document.getElementById('lv_coverage');
  if(lc) lc.oninput=function(){ S.leaveDraft.coverage=lc.value; };
  document.querySelectorAll('[data-leavetype]').forEach(function(b){
    b.onclick=function(){ gpTap(); S.leaveDraft.type=b.getAttribute('data-leavetype'); render(); };
  });
  var la=document.getElementById('lv_ack');
  if(la) la.onclick=function(){ S.leaveDraft.ack=!S.leaveDraft.ack; render(); };

  var sl=document.getElementById('saveLeave');
  if(sl) sl.onclick=function(){
    if(S.busy) return;
    var f=S.leaveDraft||{};
    if(!f.from || !f.to){ showMsg(t('Pick both dates')); return; }
    if(f.to<f.from){ showMsg(t('The last day can’t be before the first')); return; }
    if(!f.type){ showMsg(t('Pick a leave type')); return; }
    if(!f.ack){ showMsg(t('Please confirm you understand the allowance.')); return; }
    S.busy=true; sl.disabled=true; sl.textContent='…';
    run('saveTrip',[S.auth.user,S.auth.pin,{from:f.from,to:f.to,type:f.type,reason:f.reason,coverage:f.coverage}],function(d){
      S.busy=false;
      if(d && d.ok){
        S.trips=d; S.leaveDraft={from:'',to:'',type:'',reason:'',coverage:'',ack:false};
        showMsg(d.hasMentor ? t('Sent to your mentor') : t('Saved'));
      } else showMsg(t('Could not save'));
      render();
    });
  };

  // mentor decisions on someone's leave request
  [['trok',true],['trno',false]].forEach(function(pair){
    document.querySelectorAll('[data-'+pair[0]+']').forEach(function(b){
      b.onclick=function(){
        if(S.busy) return;
        S.busy=true; b.disabled=true;
        run('respondToTrip',[S.auth.user,S.auth.pin,b.getAttribute('data-'+pair[0]),pair[1]],function(d){
          S.busy=false;
          if(d && d.ok) S.tripRequests=d.requests||[];
          render();
        });
      };
    });
  });
}

function bindHome(){
  var gp=document.getElementById('goProfile');

  if(wt) wt.onclick=function(){ S.weekOpen=!S.weekOpen; render(); };

  document.querySelectorAll('[data-jump]').forEach(function(b){
    b.onclick=function(){

  });
  var ja=document.getElementById('jumpAccount');

  /* Personal dashboard customize panel, hidden behind the gear icon. The
     color wheel saves on change (one control, no separate Save button);

     as the profile photo. */
  var dcb=document.getElementById('dashCustomizeBtn');
  if(dcb) dcb.onclick=function(){ S.dbCustomize=!S.dbCustomize; render(); };
  var dci=document.getElementById('dashColorInput');
  if(dci) dci.onchange=function(){

    });
  };
  var dcr=document.getElementById('dashColorReset');
  if(dcr) dcr.onclick=function(){
    S.profile=S.profile||{}; S.profile.dashboardColor=''; render();
    run('updateProfile',[S.auth.user,S.auth.pin,{dashboardColor:''}],function(d){
      if(d.ok){ S.me=d.staff; S.profile=d.profile; render(); }
    });
  };
  var dbb=document.getElementById('dashBgBtn'), dbi=document.getElementById('dashBgInput');
  if(dbb&&dbi){ dbb.onclick=function(){ dbi.click(); }; dbi.onchange=function(){ if(dbi.files&&dbi.files[0]) handleDashboardBg(dbi.files[0]); }; }
  var dbc=document.getElementById('dashBgClearBtn');
  if(dbc) dbc.onclick=function(){
    run('clearDashboardBg',[S.auth.user,S.auth.pin],function(d){
      if(d.ok){ S.profile=S.profile||{}; S.profile.dashboardBg=''; render(); }
    });
  };

  /* Mentorship card's "open" arrow — same fetch the mentor screen's own
     mentee list uses, but from My Database this also has to switch to that
     screen to land on the detail view. */
  document.querySelectorAll('[data-openmentee]').forEach(function(b){
    b.onclick=function(){
      var id=b.getAttribute('data-openmentee');
      run('getMenteeLogs',[S.auth.user,S.auth.pin,id],function(d){
        if(d.ok){
          S.view='mentor'; S.mentee=d.mentee; S.menteeLogs=d.logs; S.menteeGoals=d.goals||[];
          S.menteeProfile=d.profile; S.menteeCheckins=d.checkins||[];
          S.menteeHabits=d.habits||[]; S.menteeMinistry=d.ministry||null; S.menteeTrips=d.trips||null; S.menteeSmart=d.smartGoals||[];
          render();
        }
        else showMsg('Not available');
      });
    };
  });

  // hours / mood / private — same daily record as the habit tiles.
  // Keep typed hours in the draft as they're typed: tapping a mood scale
  // re-renders the card and would otherwise blank a half-entered number.
  ['langHours','minHours'].forEach(function(k){
    var el=document.getElementById('n_'+k);
    if(el) el.oninput=function(){ S.todayDraft[k] = el.value===''? undefined : Number(el.value); };
  });
  document.querySelectorAll('[data-scale]').forEach(function(b){
    b.onclick=function(){ var p=b.getAttribute('data-scale').split('|'); S.todayDraft[p[0]]=Number(p[1]); render(); };
  });
  document.querySelectorAll('[data-yn]').forEach(function(b){
    b.onclick=function(){ var p=b.getAttribute('data-yn').split('|'); S.todayDraft[p[0]]=Number(p[1])===1; render(); };
  });
  var sdb=document.getElementById('saveDayBtn');
  if(sdb) sdb.onclick=function(){
    if(S.busy) return;
    var d=S.todayDraft;
    var lh=document.getElementById('n_langHours'), mh=document.getElementById('n_minHours');
    if(lh) d.langHours = lh.value===''? 0 : Number(lh.value);
    if(mh) d.minHours  = mh.value===''? 0 : Number(mh.value);
    S.busy=true; sdb.disabled=true; sdb.textContent='…';
    var map=todayHabitMap();
    var log=logForDate(todayStr())||{};
    var payload={
      langHours:d.langHours||0, minHours:d.minHours||0,
      workout:log.workout, bible:log.bible, quietTime:log.quietTime,
      oneOnOne:log.oneOnOne, sharedFaith:log.sharedFaith, sabbath:log.sabbath,
      clarity:d.clarity, growth:d.growth, lonely:d.lonely, porn:d.porn,
      habits:map
    };
    ['workout','bible','quietTime','oneOnOne','sharedFaith','sabbath'].forEach(function(k){
      if(map[k]!==undefined) payload[k]=map[k];
    });
    run('saveDaily',[S.auth.user,S.auth.pin,todayStr(),payload],function(r){
      S.busy=false;
      if(r.ok){
        S.logs=r.logs;
        if(r.habits) S.habits=r.habits;
        // The week's health row is recomputed server-side from the days.
        if(r.week) upsertCheckin(r.week);
        S.todayDraft={}; showMsg('Saved');
      } else showMsg('Could not save');
      render();
    });
  };

  // --- daily habits ---
  /* No S.busy gate here on purpose: saveTodayHabits() already updates the
     local log and re-renders before its network call goes out, so tapping a
     second habit while the first save is still in flight should feel just
     as instant, not get silently swallowed until the first request returns.
     S.busy is for one-shot "Save" buttons elsewhere that must not double-
     submit — this tap-to-toggle grid isn't that. */
  document.querySelectorAll('[data-habit]').forEach(function(b){
    b.onclick=function(){
      var id=b.getAttribute('data-habit');
      var map=todayHabitMap();
      map[id]=!map[id];
      gpTap();   // one definition, and it respects prefers-reduced-motion
      saveTodayHabits(map);
    };
  });
  var eh=document.getElementById('editHabits');
  if(eh) eh.onclick=function(){ S.habitEdit=true; render(); };
  var hlm=document.getElementById('habitLoadMore');
  if(hlm) hlm.onclick=function(){ S.habitMore=!S.habitMore; render(); };
  var sh=document.getElementById('saveHabits');
  if(sh) sh.onclick=function(){ S.habitEdit=false; pushHabits(); };
  document.querySelectorAll('[data-hpick]').forEach(function(b){
    b.onclick=function(){
      var id=b.getAttribute('data-hpick');
      var list=myHabits().slice();
      var at=-1;
      list.forEach(function(hb,i){ if(hb.id===id) at=i; });
      if(at>-1){ if(list.length<=1){ showMsg('Keep at least one habit'); return; } list.splice(at,1); }
      else {
        if(list.length>=MAX_HABITS){ showMsg('That’s the max — drop one first'); return; }
        list.push({id:id, mentorVisible:true});
      }
      S.habits=list; render();
    };
  });
  // --- goals ---
  var gpw=document.getElementById('goalsPrevWeek');
  if(gpw) gpw.onclick=function(){ if(goalsViewWeek()<=1) return; gpTap(); S.goalsWeek=goalsViewWeek()-1; render(); };
  var gnw=document.getElementById('goalsNextWeek');
  if(gnw) gnw.onclick=function(){ if(goalsViewWeek()>=52) return; gpTap(); S.goalsWeek=goalsViewWeek()+1; render(); };
  var gjc=document.getElementById('goalsJumpCurrent');
  if(gjc) gjc.onclick=function(){ gpTap(); S.goalsWeek=null; render(); };
  document.querySelectorAll('[data-theme-set]').forEach(function(b){
    b.onclick=function(){ gpTap(); applyTheme(b.getAttribute('data-theme-set')); render(); };
  });
  var sw=document.getElementById('shareWeek');
  if(sw) sw.onclick=function(){
    var wk=goalsViewWeek();
    var rec=goalsForWeek(wk);
    if(!rec || rec.pct===null) return;
    gpTap();
    sw.disabled=true;
    gpShareCard({
      pct: rec.pct,
      label: t('WEEK')+' '+wk,
      sub: rec.items.filter(function(i){return i.text;}).length+' '+t('goals'),
      file: 'gp-week-'+wk
    }).then(function(how){
      sw.disabled=false;
      /* Say what happened rather than claiming success: a dismissed share sheet
         and a blocked pop-up look identical from here otherwise. */
      if(how==='blocked') showMsg(t('Allow pop-ups to save the card.'));
      else if(how==='unsupported') showMsg(t('This browser cannot make the card.'));
      else if(how==='opened') showMsg(t('Card opened — press and hold to save it.'));
    });
  };
  var agb=document.getElementById('addGoalBtn');
  if(agb) agb.onclick=function(){
    if(S.busy) return;
    var inp=document.getElementById('newGoalText');
    var text=(inp&&inp.value||'').trim();
    if(!text) return;
    var wk=goalsViewWeek();
    var rec=goalsForWeek(wk);
    var written=(rec&&rec.items)?rec.items.filter(function(i){return i.text;}).slice():[];
    if(written.length>=3) return;
    written.push({text:text, pct:0, metricKey:''});
    S.busy=true; agb.disabled=true;
    run('saveGoals',[S.auth.user,S.auth.pin,wk,written],function(d){
      S.busy=false;
      if(d.ok) S.goals=d.goals||[]; else showMsg(t('That didn’t save — try again.'));
      render();
    });
  };
  document.querySelectorAll('[data-goalcomplete]').forEach(function(b){
    b.onclick=function(){
      if(S.busy) return;
      gpTap();
      var wk=goalsViewWeek();
      var rec=goalsForWeek(wk);
      if(!rec) return;
      var i=Number(b.getAttribute('data-goalcomplete'));
      var written=rec.items.filter(function(x){ return x.text; });
      if(!written[i]) return;
      written[i].pct=100;
      S.busy=true;
      run('saveGoals',[S.auth.user,S.auth.pin,wk,written],function(d){
        S.busy=false;
        if(d.ok) S.goals=d.goals||[]; else showMsg(t('That didn’t save — try again.'));
        render();
      });
    };
  });
  document.querySelectorAll('[data-goalremove]').forEach(function(b){
    b.onclick=function(){
      if(S.busy) return;
      gpTap();
      var wk=goalsViewWeek();
      var rec=goalsForWeek(wk);
      if(!rec) return;
      var i=Number(b.getAttribute('data-goalremove'));
      var written=rec.items.filter(function(x){ return x.text; });
      if(!written[i]) return;
      written.splice(i,1);
      S.busy=true;
      run('saveGoals',[S.auth.user,S.auth.pin,wk,written],function(d){
        S.busy=false;
        if(d.ok) S.goals=d.goals||[]; else showMsg(t('That didn’t save — try again.'));
        render();
      });
    };
  });
  /* Dragging repaints the track and the label straight away — waiting on a
     round trip to see your own thumb move feels broken. The save fires once
     on release, and only render() after it lands, so a re-render never yanks
     the slider out from under a thumb that is still down. */
  document.querySelectorAll('[data-goalpct]').forEach(function(sl){
    var row=sl.closest('.wgRow');
    var ring=row&&row.querySelector('.gRing');
    var pctLabel=row&&row.querySelector('.wgPct');
    function paint(){
      var v=Number(sl.value)||0;
      sl.setAttribute('style', ringVars(v));
      if(ring){ ring.setAttribute('style', ringVars(v)); var sp=ring.querySelector('span'); if(sp) sp.textContent=v; }
      if(pctLabel){ pctLabel.style.color=pctColor(v); pctLabel.textContent=v+'% · '+pctWord(v); }
      if(row) row.classList.toggle('done', v>=100);
    }
    /* Same as the health sliders, and here it reached the server: scrolling the
       page with a finger that landed on this slider moved the percentage and
       saved it on release. */
    var guard = gpSlideGuard(sl, null, function(){ paint(); });
    sl.oninput=function(){ if(guard.scrolling()) return; paint(); gpTap(4); };
    sl.onchange=function(){
      if(guard.scrolling()) return;
      paint();
      var wk=goalsViewWeek();
      var rec=goalsForWeek(wk);
      if(!rec) return;
      var i=Number(sl.getAttribute('data-goalpct'));
      var written=rec.items.filter(function(x){ return x.text; });
      if(!written[i]) return;
      written[i].pct=Number(sl.value)||0;
      run('saveGoals',[S.auth.user,S.auth.pin,wk,written],function(d){
        if(d.ok) S.goals=d.goals||[]; else showMsg(t('That didn’t save — try again.'));
        render();
      });
    };
  });

  // --- ministry KPIs ---
  document.querySelectorAll('[data-kpi]').forEach(function(inp){
    inp.oninput=function(){ S.kpiDraft[inp.getAttribute('data-kpi')]=inp.value; };
  });
  /* Held in state for the same reason as the daily boxes: a render triggered by
     anything else would otherwise throw away a number someone had just typed. */
  document.querySelectorAll('[data-kpiweek]').forEach(function(inp){
    inp.oninput=function(){ S.kpiWeekDraft[inp.getAttribute('data-kpiweek')]=inp.value; };
  });
  // "+5" on top of 286 reads as 291 before it is saved (shared with the dashboard).
  // Whole document, not just kpiDayCard — an oversight card's day inputs use
  // the same data-mode="sum" data-run pattern and need the same "+5 on top of
  // 286 reads as 291" running total before it saves.
  gpBindRunningTotals();
  // --- which KPIs show on the daily card ---
  var ksa=document.getElementById('kpiShowAll');
  if(ksa) ksa.onclick=function(){ S.kpiAll=true; render(); };
  var ksl=document.getElementById('kpiShowLess');
  if(ksl) ksl.onclick=function(){ S.kpiAll=false; render(); };
  var pk=document.getElementById('pickKpis');
  if(pk) pk.onclick=function(){ S.kpiPick=true; render(); };
  document.querySelectorAll('[data-kpipin]').forEach(function(b){
    b.onclick=function(){
      var m=b.getAttribute('data-kpipin');
      var pins=((S.ministry&&S.ministry.pins)||[]).slice();
      var at=pins.indexOf(m);
      if(at>-1) pins.splice(at,1);
      else {
        if(pins.length>=8){ showMsg('Eight is the max — unstar one first'); return; }
        pins.push(m);
      }
      S.ministry=Object.assign({}, S.ministry, {pins:pins});
      render();
    };
  });
  // --- ministry KPI week nav --- switching weeks drops any unsaved draft, so
  // a number typed for one week can't be mistakenly submitted under another.
  var kpw=document.getElementById('kpiPrevWeek');
  if(kpw) kpw.onclick=function(){ if(kpiViewWeek()<=1) return; gpTap(); S.kpiWeek=kpiViewWeek()-1; S.kpiDraft={}; S.kpiWeekDraft={}; render(); };
  var knw=document.getElementById('kpiNextWeek');
  if(knw) knw.onclick=function(){ if(kpiViewWeek()>=52) return; gpTap(); S.kpiWeek=kpiViewWeek()+1; S.kpiDraft={}; S.kpiWeekDraft={}; render(); };
  var kjc=document.getElementById('kpiJumpCurrent');
  if(kjc) kjc.onclick=function(){ gpTap(); S.kpiWeek=null; S.kpiDraft={}; S.kpiWeekDraft={}; render(); };
  var skp=document.getElementById('saveKpiPins');
  if(skp) skp.onclick=function(){
    if(S.busy) return;
    S.busy=true; skp.disabled=true; skp.textContent='…';
    run('saveMyKpiPins',[S.auth.user,S.auth.pin,(S.ministry&&S.ministry.pins)||[]],function(d){
      S.busy=false;
      if(d.ok){ S.ministry=d; S.kpiPick=false; S.kpiAll=false; showMsg('Saved'); }
      else showMsg('Could not save');
      render();
    });
  };

  var skb=document.getElementById('saveKpiBtn');
  if(skb) skb.onclick=function(){
    if(S.busy) return;
    var updates=[];
    document.querySelectorAll('[data-kpi]').forEach(function(inp){
      updates.push({
        metric:inp.getAttribute('data-kpi'),
        mode:inp.getAttribute('data-kpimode')||'sum',
        value: inp.value==='' ? null : Number(inp.value)
      });
    });
    S.busy=true; skb.disabled=true; skb.textContent='…';
    // Saves the DAY; the server rolls the week up from the days it holds.
    // Not the current week → the entry lands on that week's own last day.
    run('saveMyKpiDay',[S.auth.user,S.auth.pin,kpiEntryDate_(kpiViewWeek()),updates],function(d){
      S.busy=false;
      if(d.ok){ S.ministry=d; S.kpiDraft={}; showMsg('Saved — week total updated'); }
      else showMsg('Could not save');
      render();
    });
  };

  /* Levels and scores are the week's own figure, so they are written straight to
     the week — including the ones sitting there carried forward, which is how a
     headcount that did not change still ends up recorded for this week. */
  var skw=document.getElementById('saveKpiWeekBtn');
  if(skw) skw.onclick=function(){
    if(S.busy) return;
    var wk=kpiViewWeek(), updates=[];
    document.querySelectorAll('[data-kpiweek]').forEach(function(inp){
      updates.push({ metric:inp.getAttribute('data-kpiweek'),
        value: inp.value==='' ? null : Number(inp.value) });
    });
    S.busy=true; skw.disabled=true; skw.textContent=t('Saving…');
    run('saveMyMinistry',[S.auth.user,S.auth.pin,wk,updates],function(d){
      S.busy=false;
      if(d && d.ok){ S.ministry=d; S.kpiWeekDraft={}; showMsg('Saved — week '+wk+' updated'); }
      else showMsg('Could not save');
      render();
    });
  };

  // --- ministries you oversee: weekly only, keyed by ministry name so
  // several of these cards can sit on the page at once.
  document.querySelectorAll('[data-ovweek]').forEach(function(inp){
    var min=inp.getAttribute('data-ovweek'), metric=inp.getAttribute('data-ovmetric');
    inp.oninput=function(){ (S.ovWeekDraft[min]||(S.ovWeekDraft[min]={}))[metric]=inp.value; };
  });
  document.querySelectorAll('[data-ovprev]').forEach(function(btn){
    btn.onclick=function(){
      var min=btn.getAttribute('data-ovprev');
      if(ovWeekFor_(min)<=1) return;
      gpTap(); S.ovWeek[min]=ovWeekFor_(min)-1; S.ovWeekDraft[min]={}; render();
    };
  });
  document.querySelectorAll('[data-ovnext]').forEach(function(btn){
    btn.onclick=function(){
      var min=btn.getAttribute('data-ovnext');
      if(ovWeekFor_(min)>=52) return;
      gpTap(); S.ovWeek[min]=ovWeekFor_(min)+1; S.ovWeekDraft[min]={}; render();
    };
  });
  document.querySelectorAll('[data-ovjump]').forEach(function(btn){
    btn.onclick=function(){
      var min=btn.getAttribute('data-ovjump');
      gpTap(); S.ovWeek[min]=null; S.ovWeekDraft[min]={}; render();
    };
  });
  document.querySelectorAll('[data-ovsaveweek]').forEach(function(btn){
    btn.onclick=function(){
      if(S.busy) return;
      var min=btn.getAttribute('data-ovsaveweek'), dept=myOversightDept_();
      if(!dept) return;
      var wk=ovWeekFor_(min), updates=[];
      document.querySelectorAll('[data-ovweek]').forEach(function(inp){
        if(inp.getAttribute('data-ovweek')!==min) return;
        updates.push({ metric:inp.getAttribute('data-ovmetric'),
          value: inp.value==='' ? null : Number(inp.value) });
      });
      S.busy=true; btn.disabled=true; btn.textContent=t('Saving…');
      run('saveMinistryFor',[S.auth.user,S.auth.pin,dept,min,wk,updates],function(d){
        S.busy=false;
        if(d && d.ok){ S.oversee[min]=d; S.ovWeekDraft[min]={}; showMsg(gpT('Saved — week {wk} updated',{wk:wk})); }
        else showMsg(t('Could not save'));
        render();
      });
    };
  });
}

function bind(){
  var lb=document.getElementById('langBtn');
  if(lb) lb.onclick=toggleLang;
  var back=document.getElementById('backBtn');
  if(back) back.onclick=function(){ gpGo('index'); };
  var menuBtn=document.getElementById('menuBtn');
  if(menuBtn) menuBtn.onclick=function(){ S.menuOpen=true; renderMenu(); };
  renderMenu();

  document.querySelectorAll('[data-tab]').forEach(function(b){
    b.onclick=function(){ gpTap(); S.view=b.getAttribute('data-tab'); S.mentee=null; S.person=null; render(); };
  });

  /* Every figure on Base opens its own breakdown, from the same sheet the
     dashboard uses. Only bound when the base's numbers are actually on screen. */
  if(S.base) gpBindDrill(baseR());
  if(S.base && S.me) gpBindStaffMix(baseR().staffBreakdown([S.me.campus]));
  gpAnimateCounts();
  celebrateStreak();
  var bds=document.getElementById('baseDeptSel');
  if(bds) bds.onchange=function(){ S.baseDept=bds.value; render(); };
  document.querySelectorAll('[data-acc]').forEach(function(btn){
    btn.onclick=function(){
      var id=btn.getAttribute('data-acc'), bucket=S[btn.getAttribute('data-accbucket')];
      bucket[id]=!bucket[id]; render();
    };
  });
  document.querySelectorAll('[data-baseHealthPeriod]').forEach(function(btn){
    btn.onclick=function(){ S.baseHealthPeriod=btn.getAttribute('data-baseHealthPeriod'); render(); };
  });
  // A different week means a different set of answers, same as switching a
  // Goals or Ministry week drops whatever was drafted for the last one.
  var hpw=document.getElementById('healthPrevWeek');
  if(hpw) hpw.onclick=function(){
    var wk=Number(S.healthWeek||thisWeek());
    if(wk<=1) return;
    gpTap(); S.healthWeek=wk-1; S.weekDraft=null; S.weekDraftFor=null; S.weekForm=null; render();
  };
  var hnw=document.getElementById('healthNextWeek');
  if(hnw) hnw.onclick=function(){
    var wk=Number(S.healthWeek||thisWeek());
    if(wk>=52) return;
    gpTap(); S.healthWeek=wk+1; S.weekDraft=null; S.weekDraftFor=null; S.weekForm=null; render();
  };
  var hjc=document.getElementById('healthJumpCurrent');
  if(hjc) hjc.onclick=function(){
    gpTap(); S.healthWeek=null; S.weekDraft=null; S.weekDraftFor=null; S.weekForm=null; render();
  };
  var hSc=document.getElementById('healthScopeSel');
  if(hSc) hSc.onchange=function(){ S.healthScope=hSc.value; render(); };
  var hQs=document.getElementById('healthQSel');
  if(hQs) hQs.onchange=function(){ S.healthQuarter=Number(hQs.value); render(); };
  var hYs=document.getElementById('healthYSel');
  if(hYs) hYs.onchange=function(){
    var y=Number(hYs.value);
    ensureBaseYear(y, function(){ S.healthYear=y; render(); });
  };

  /* --- the weekly check-in form --- */
  document.querySelectorAll('[data-wslide]').forEach(function(sl){
    var block=sl.closest('.qBlock');
    var readout=block&&block.querySelector('.qReadout');
    var id=sl.getAttribute('data-wslide');
    function paint(){
      var v=Number(sl.value)||1;
      sl.style.setProperty('--fillpct', Math.round(((v-1)/9)*100)+'%');
      if(readout) readout.textContent=v+'/10';
      return v;
    }
    /* A swipe that starts on one of these is usually somebody scrolling past the
       question rather than answering it. If it turns out to be a scroll, the
       answer goes back exactly as it was — including back to unanswered, which
       is the whole point: an untouched slider reads 5 and must not count as a 5
       in the base average. */
    var guard = gpSlideGuard(sl, function(){
      var dr = weekDraftFor(S.healthWeek||thisWeek());
      return { had: dr[id]!==undefined, v: dr[id] };
    }, function(snap){
      var dr = weekDraftFor(S.healthWeek||thisWeek());
      if(snap.had) dr[id] = snap.v; else delete dr[id];
      paint();
    });
    sl.oninput=function(){
      if(guard.scrolling()) return;
      weekDraftFor(S.healthWeek||thisWeek())[id]=paint();
    };
  });
  document.querySelectorAll('[data-wyn]').forEach(function(b){
    b.onclick=function(){
      var p=b.getAttribute('data-wyn').split('|');
      weekDraftFor(S.healthWeek||thisWeek())[p[0]]=Number(p[1]);
      render();
    };
  });
  document.querySelectorAll('[data-wnum]').forEach(function(inp){
    inp.onchange=function(){
      var d=weekDraftFor(S.healthWeek||thisWeek());
      d[inp.getAttribute('data-wnum')] = inp.value===''?undefined:Number(inp.value);
    };
  });
  var tht=document.getElementById('toHealthTab');
  if(tht) tht.onclick=function(){ S.view='health'; render(); };
  var wsb=document.getElementById('weekSubmit');
  if(wsb) wsb.onclick=function(){ weekSubmit(wsb); };
  var wed=document.getElementById('weekEdit');
  if(wed) wed.onclick=function(){
    var wk=Number(S.healthWeek||thisWeek());
    S.weekForm = (S.weekForm===wk) ? null : wk;
    render();
  };
  var wcl=document.getElementById('weekClear');
  if(wcl) wcl.onclick=function(){
    if(!confirm(t('Clear this week’s check-in?'))) return;
    weekClear();
  };

  /* --- OKR editing, on Me only --- */
  document.querySelectorAll('[data-kr-toggle]').forEach(function(b){
    b.onclick=function(){ var id=b.getAttribute('data-kr-toggle'); S.krOpen[id]=!S.krOpen[id]; render(); };
  });
  var okp=document.getElementById('okrPrev');
  if(okp) okp.onclick=function(){ gpTap(); S.okrIdx=Math.max(0,(S.okrIdx||0)-1); render(); };
  var okn=document.getElementById('okrNext');
  if(okn) okn.onclick=function(){ gpTap(); S.okrIdx=(S.okrIdx||0)+1; render(); };
  var onb=document.getElementById('okrNewBtn');
  if(onb) onb.onclick=function(){ S.okrForm=true; S.okrEditId=null; render(); };
  var ocb=document.getElementById('okrCancelBtn');
  if(ocb) ocb.onclick=function(){ S.okrForm=false; S.okrEditId=null; render(); };
  var osb=document.getElementById('okrSaveBtn');
  if(osb) osb.onclick=function(){ okrSave(osb); };
  for(var kw=0;kw<3;kw++)(function(k){
    var sel=document.getElementById('okrKrMetric'+k), tin=document.getElementById('okrKrTarget'+k);
    if(!sel || !tin) return;
    sel.addEventListener('change', function(){ okrTargetCheck(k); });
    tin.addEventListener('input', function(){ okrTargetCheck(k); });
    okrTargetCheck(k);
  })(kw);
  document.querySelectorAll('[data-okr-edit]').forEach(function(b){
    b.onclick=function(){ S.okrEditId=b.getAttribute('data-okr-edit'); S.okrForm=true; render(); };
  });
  document.querySelectorAll('[data-okr-del]').forEach(function(b){
    b.onclick=function(){
      if(!confirm(t('Delete this objective?'))) return;
      okrDelete(b.getAttribute('data-okr-del'));
    };
  });
  document.querySelectorAll('[data-okr-manual]').forEach(function(inp){
    inp.onchange=function(){
      var parts=inp.getAttribute('data-okr-manual').split('|');
      okrSetManual(parts[0], Number(parts[1]), inp.value);
    };
  });

  /* --- Annual Goals (SMART) --- */
  var spy=document.getElementById('smartPrevYear');
  if(spy) spy.onclick=function(){ S.smartYear=smartYear_()-1; render(); };
  var sny=document.getElementById('smartNextYear');
  if(sny) sny.onclick=function(){ S.smartYear=smartYear_()+1; render(); };
  document.querySelectorAll('[data-smartcat]').forEach(function(b){
    b.onclick=function(){ gpTap(); S.smartCategory=b.getAttribute('data-smartcat'); S.smartDraft=null; render(); };
  });
  var snb=document.getElementById('smartNewBtn');
  if(snb) snb.onclick=function(){ S.smartDraft={ id:null, title:'', meta:'', pct:0 }; render(); };
  document.querySelectorAll('[data-smartedit]').forEach(function(b){
    b.onclick=function(){
      var id=b.getAttribute('data-smartedit');
      var g=S.smartGoals.filter(function(x){ return x.id===id; })[0];
      if(g) S.smartDraft={ id:g.id, title:g.title, meta:g.meta, pct:g.pct };
      render();
    };
  });
  var scb=document.getElementById('smartCancelBtn');
  if(scb) scb.onclick=function(){ S.smartDraft=null; render(); };
  var sgt=document.getElementById('sg_title');
  if(sgt) sgt.oninput=function(){ if(S.smartDraft) S.smartDraft.title=sgt.value; };
  var sgm=document.getElementById('sg_meta');
  if(sgm) sgm.oninput=function(){ if(S.smartDraft) S.smartDraft.meta=sgm.value; };
  var sgp=document.getElementById('sg_pct');
  if(sgp) sgp.oninput=function(){ if(S.smartDraft) S.smartDraft.pct=sgp.value; };
  var ssb=document.getElementById('smartSaveBtn');
  if(ssb) ssb.onclick=function(){
    if(S.busy) return;
    var d=S.smartDraft;
    var title=(document.getElementById('sg_title').value||'').trim();
    if(!title){ showMsg(t('Give the goal a title first.')); return; }
    var payload={ id:d.id, year:smartYear_(), category:S.smartCategory, title:title,
      meta:(document.getElementById('sg_meta').value||'').trim(),
      pct:Number(document.getElementById('sg_pct').value)||0 };
    S.busy=true; ssb.disabled=true;
    run('saveSmartGoal',[S.auth.user,S.auth.pin,payload],function(r){
      S.busy=false;
      if(r && r.ok){ S.smartGoals=r.smartGoals||[]; S.smartDraft=null; showMsg(t('Saved')); }
      else showMsg(t('That didn’t save — try again.'));
      render();
    });
  };
  document.querySelectorAll('[data-smartdel]').forEach(function(b){
    b.onclick=function(){
      if(S.busy) return;
      if(!confirm(t('Delete this goal?'))) return;
      S.busy=true;
      run('deleteSmartGoal',[S.auth.user,S.auth.pin,b.getAttribute('data-smartdel')],function(r){
        S.busy=false;
        if(r && r.ok) S.smartGoals=r.smartGoals||[];
        render();
      });
    };
  });

  bindHome();
  bindMinistrySelects();
  bindCountryOther();

  bindAway();

  var gpm=document.getElementById('goProfileFromMe');
  if(gpm) gpm.onclick=function(){ S.view='profile'; render(); };
  var gmx=document.getElementById('goProfileMix');
  if(gmx) gmx.onclick=function(){ S.view='profile'; render(); };
  var gmn=document.getElementById('goMentor');
  if(gmn) gmn.onclick=function(){ S.view='mentor'; S.mentee=null; render(); };

  // login
  var lb=document.getElementById('loginBtn');
  if(lb) lb.onclick=function(){
    var u=document.getElementById('li_user').value.trim();
    var pin=document.getElementById('li_pin').value.trim();
    if(!u||!/^\d{4}$/.test(pin)){ showMsg('Enter username + 4-digit PIN'); return; }
    lb.disabled=true; lb.textContent='…';
    run('staffLogin',[u,pin],function(d){
      if(d.ok){ S.auth={user:u,pin:pin}; S.me=d.staff; S.profile=d.profile; afterLogin(); }
      else { lb.disabled=false; lb.textContent='Log in'; showMsg('Wrong username or PIN'); }
    });
  };
  var toReg=document.getElementById('toReg'); if(toReg) toReg.onclick=function(){ S.regMode=true; if(!S.roster.length){ run('teamRoster',[],function(r){S.roster=Array.isArray(r)?r:[];render();}); } else render(); };
  var toLogin=document.getElementById('toLogin'); if(toLogin) toLogin.onclick=function(){ S.regMode=false; render(); };

  // register
  var rb=document.getElementById('regBtn');
  if(rb) rb.onclick=function(){
    var payload={
      name:document.getElementById('r_name').value.trim(),
      username:document.getElementById('r_user').value.trim(),
      pin:document.getElementById('r_pin').value.trim(),
      campus:document.getElementById('r_campus').value,
      dept:document.getElementById('r_dept').value,
      ministry:(document.getElementById('r_ministry')||{}).value||'',
      role:document.getElementById('r_role').value.trim(),
      staffType:document.getElementById('r_type').value,
      country:countryValue('r_country'),
      mentorId:document.getElementById('r_mentor').value,
      phone:document.getElementById('r_phone').value.trim(),
      joined:document.getElementById('r_joined').value.trim()
    };
    if(!payload.name){ showMsg('Add your name'); return; }
    if(!/^[a-z0-9._-]{2,20}$/.test(payload.username.toLowerCase())){ showMsg('Username: lowercase letters/numbers, 2–20'); return; }
    if(!/^\d{4}$/.test(payload.pin)){ showMsg('PIN must be 4 digits'); return; }
    rb.disabled=true; rb.textContent='…';
    run('staffRegister',[payload],function(d){
      if(d.ok){ S.auth={user:payload.username.toLowerCase(),pin:payload.pin}; S.me=d.staff; S.profile=d.profile; S.regMode=false; afterLogin(); showMsg('Profile created — add a photo!'); S.view='profile'; render(); }
      else { rb.disabled=false; rb.textContent='Create profile'; showMsg(d.err==='taken'?'That username is taken':'Check your details'); }
    });
  };

  // team + mentor cards
  document.querySelectorAll('[data-teamcampus]').forEach(function(b){
    b.onclick=function(){ S.teamCampus=b.getAttribute('data-teamcampus'); render(); };
  });
  // tapping a teammate in the directory opens their public profile
  document.querySelectorAll('[data-person]').forEach(function(c){
    c.onclick=function(){
      var id=c.getAttribute('data-person');
      run('staffProfile',[S.auth.user,S.auth.pin,id],function(d){
        if(d && d.ok){ S.person=d; render(); }
        else showMsg('Not available');
      });
    };
  });
  var pb=document.getElementById('personBack');
  if(pb) pb.onclick=function(){ S.person=null; render(); };

  document.querySelectorAll('[data-mentee]').forEach(function(c){
    c.onclick=function(){
      var id=c.getAttribute('data-mentee');
      run('getMenteeLogs',[S.auth.user,S.auth.pin,id],function(d){
        if(d.ok){
          S.mentee=d.mentee; S.menteeLogs=d.logs; S.menteeGoals=d.goals||[];
          S.menteeProfile=d.profile; S.menteeCheckins=d.checkins||[];
          S.menteeHabits=d.habits||[]; S.menteeMinistry=d.ministry||null; S.menteeTrips=d.trips||null; S.menteeSmart=d.smartGoals||[];
          render();
        }
        else showMsg('Not available');
      });
    };
  });
  var mBack=document.getElementById('menteeBack'); if(mBack) mBack.onclick=function(){ S.mentee=null; render(); };
  document.querySelectorAll('[data-accept]').forEach(function(b){
    b.onclick=function(){
      var id=b.getAttribute('data-accept');
      run('respondToMentorRequest',[S.auth.user,S.auth.pin,id,true],function(d){
        if(d.ok) S.mentorRequests=d.requests;
        run('getMyMentees',[S.auth.user,S.auth.pin],function(r){ if(r.ok) S.mentees=r.mentees; render(); });
      });
    };
  });
  document.querySelectorAll('[data-decline]').forEach(function(b){
    b.onclick=function(){
      var id=b.getAttribute('data-decline');
      run('respondToMentorRequest',[S.auth.user,S.auth.pin,id,false],function(d){
        if(d.ok) S.mentorRequests=d.requests;
        render();
      });
    };
  });

  /* 1-on-1 requests, either direction of a mentor/mentee pair. */
  document.querySelectorAll('[data-request121]').forEach(function(b){
    b.onclick=function(){
      var id=b.getAttribute('data-request121');
      run('requestOneOnOne',[S.auth.user,S.auth.pin,id,''],function(d){
        if(d.ok){ S.oneOnOnes=d.oneOnOnes; showMsg(t('Request sent')); render(); }
        else showMsg(t('Could not save'));
      });
    };
  });
  document.querySelectorAll('[data-121accept]').forEach(function(b){
    b.onclick=function(){
      var id=b.getAttribute('data-121accept');
      run('respondToOneOnOne',[S.auth.user,S.auth.pin,id,true],function(d){
        if(d.ok){ S.oneOnOnes=d.oneOnOnes; render(); }
      });
    };
  });
  document.querySelectorAll('[data-121decline]').forEach(function(b){
    b.onclick=function(){
      var id=b.getAttribute('data-121decline');
      run('respondToOneOnOne',[S.auth.user,S.auth.pin,id,false],function(d){
        if(d.ok){ S.oneOnOnes=d.oneOnOnes; render(); }
      });
    };
  });

  // profile
  var pb=document.getElementById('photoBtn'), pi=document.getElementById('photoInput');
  if(pb&&pi){ pb.onclick=function(){ pi.click(); }; pi.onchange=function(){ if(pi.files&&pi.files[0]) handlePhoto(pi.files[0]); }; }
  var dY=document.getElementById('debtY'), dN=document.getElementById('debtN');
  if(dY&&dN){ dY.onclick=function(){ S.profile=S.profile||{}; S.profile.debt=true; render(); }; dN.onclick=function(){ S.profile=S.profile||{}; S.profile.debt=false; render(); }; }
  var sp=document.getElementById('saveProfBtn');
  if(sp) sp.onclick=function(){
    var payload={
      name:document.getElementById('p_name').value.trim(),
      campus:document.getElementById('p_campus').value,
      dept:document.getElementById('p_dept').value,
      ministry:(document.getElementById('p_ministry')||{}).value||'',
      role:document.getElementById('p_role').value.trim(),
      staffType:document.getElementById('p_type').value,
      country:countryValue('p_country'),
      mentorId:document.getElementById('p_mentor').value,
      phone:document.getElementById('p_phone').value.trim(),
      joined:document.getElementById('p_joined').value.trim(),
      debt:S.profile&&S.profile.debt?true:false
    };
    sp.disabled=true; sp.textContent='Saving…';
    run('updateProfile',[S.auth.user,S.auth.pin,payload],function(d){
      if(d.ok){
        S.me=d.staff; S.profile=d.profile; saveStaffCard(); showMsg('Profile saved');
        // Ministry may have changed, so re-pull the KPI set for the new one.
        run('getMyMinistry',[S.auth.user,S.auth.pin],function(mn){ if(mn.ok) S.ministry=mn; render(); });
        run('teamRoster',[],function(r){S.roster=Array.isArray(r)?r:[];render();});
      }
      else { sp.disabled=false; sp.textContent='Save profile'; showMsg('Could not save'); }
    });
  };
  var pinBtn=document.getElementById('pinBtn');
  if(pinBtn) pinBtn.onclick=function(){
    var np=document.getElementById('p_newpin').value.trim();
    if(!/^\d{4}$/.test(np)){ showMsg('PIN must be 4 digits'); return; }
    run('changePin',[S.auth.user,S.auth.pin,np],function(d){
      if(d.ok){ S.auth.pin=np; lsSet('gp-staff',JSON.stringify(S.auth)); showMsg('PIN updated'); }
      else showMsg('Could not update PIN');
    });
  };
  var lo=document.getElementById('logoutBtn'); if(lo) lo.onclick=logout;
}

function gpGo(p){
  // Asking for the dashboard means asking not to be redirected back here for
  // the rest of this browser session (see the guard at the top of index.html).
  if(p!=='teams'){ try { sessionStorage.setItem('gp-skip-teams','1'); } catch(e){} }
  window.location.href = p==='teams' ? 'teams.html' : 'index.html';
}

/* Promise flavour of run() for the refresh gesture. Always resolves, even on a
   failed request — otherwise a dropped connection would leave the spinner
   turning forever. */
function runP(fn, args){
  return fetch('/.netlify/functions/api', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ fn:fn, args:args })
  }).then(function(r){ return r.ok ? r.json() : null; }).catch(function(){ return null; });
}

function refreshAll(){
  if(!S.me) return Promise.resolve();
  var u=S.auth.user, k=S.auth.pin;
  return Promise.all([
    runP('teamRoster',[]).then(function(r){ if(Array.isArray(r)) S.roster=r; }),
    runP('getMyLogs',[u,k]).then(function(d){
      if(d&&d.ok){ S.logs=d.logs; if(d.habits) S.habits=d.habits; if(d.profile) S.profile=Object.assign(S.profile||{}, d.profile); }
    }),
    runP('getMyWeekly',[u,k]).then(function(d){ if(d&&d.ok){ S.goals=d.goals||[]; S.checkins=d.checkins||[]; } }),
    runP('getMyMinistry',[u,k]).then(function(d){ if(d&&d.ok) S.ministry=d; }),
    runP('getMyMentees',[u,k]).then(function(d){ if(d&&d.ok) S.mentees=d.mentees; }),
    runP('getMyMentorRequests',[u,k]).then(function(d){ if(d&&d.ok) S.mentorRequests=d.requests; }),
    runP('getMyTrips',[u,k]).then(function(d){ if(d&&d.ok) S.trips=d; }),
    runP('getTripRequests',[u,k]).then(function(d){ if(d&&d.ok) S.tripRequests=d.requests||[]; }),
    runP('getData',['']).then(function(d){ if(d&&d.entries) S.base=d; })
  ]).then(function(){ render(); });
}

/* Shared with the dashboard — see gpPullToRefresh in rollup.js. The staff page
   also sits out the gesture while nobody is logged in. */
gpPullToRefresh(function(){ return refreshAll(); }, { blocked: function(){ return !S.me; } });
gpInstallPrompt();

boot();
</script>
