<!-- The header is dark in both themes, so the status bar matches it either way. -->
<meta name="theme-color" content="#17150F" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C0B09" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='47' fill='%231F44FF'/%3E%3Ctext x='50' y='64' font-family='Arial' font-weight='bold' font-size='40' fill='%23FAF6F0' text-anchor='middle'%3EGP%3C/text%3E%3Cpath d='M76 12 L78.6 19.4 L86 22 L78.6 24.6 L76 32 L73.4 24.6 L66 22 L73.4 19.4 Z' fill='%23FFB323'/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.json">
<!-- Fonts load OUT of the render path, on purpose.

     As an @import inside <style> this was render-blocking, and a pending
     stylesheet also blocks script execution — so on a slow or unreachable font
     CDN the app's JavaScript did not run until the request resolved or timed
     out. Measured at 8.1 seconds of dead app on a hanging font request, which
     is exactly the connection this thing is built for.

     media="print" makes the browser fetch it without blocking; onload promotes
     it to all. Text renders immediately in the fallback face and swaps when the
     webfont lands (the URL already carries display=swap). The <noscript> copy
     keeps fonts working if scripts are off. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Koulen&family=Kantumruy+Pro:wght@400;500;700&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Koulen&family=Kantumruy+Pro:wght@400;500;700&display=swap"></noscript>
<script>
/* Apply a saved theme BEFORE anything paints. Same class of problem as the splash:
   read it late and the reader watches the app flash the wrong colours on every
   open. No attribute means "follow the system", which is the default. */
(function(){
  try {
    var t = localStorage.getItem('gp-theme');
    if(t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  } catch(e){}
})();
</script>
<style>
/* ==================== THEME TOKENS ====================
   THIS BLOCK IS DUPLICATED VERBATIM IN index.html, teams.html AND help.html.
   tests/test-theme.mjs asserts the copies are byte-identical — edit one, edit all.

   Three states, which is what a phone actually has:
     no attribute  -> follow the system (prefers-color-scheme)
     data-theme="light" / "dark" -> the reader chose, and their choice wins both ways
   That is why the media query is guarded with :not([data-theme="light"]) — without
   it, a reader who picks light on a dark phone gets ignored.

   Two pairs must never be collapsed into one token, because they diverge between
   themes and a blind find-and-replace inverts them:
     --ink (body text) vs --headerBg (the black header, hero and coin, which stay
       dark in BOTH themes — this is the brand, not the background)
     --surface (cards) vs --onDark (text sitting on that black header)
   The brand marks in logo.js are white and drawn for the black header, so anything
   showing them needs --headerBg behind it in either theme or they vanish. */
:root {
  --bg:#FAF6F0;            /* page */
  --surface:#fff;          /* cards */
  --surface2:#F0EADF;      /* tracks, subtle fills */
  --ink:#17150F;           /* body text */
  --muted:#6B6557;         /* secondary text */
  --faint:#6F6A5A;         /* tertiary text */
  --line:#F0EADF;          /* hairlines */
  --border:#E4DDD0;        /* card borders */
  --border2:#C9C3B6;       /* input borders */
  --accent:#1F44FF;        /* cobalt */
  --accent2:#5B7BFF;       /* gradient partner */
  --accentInk:#fff;        /* text on cobalt */
  --accentSoft:#E8ECFF;    /* cobalt tint fill */
  --accentSoftBorder:#B9C4FF;
  --amber:#FFB323;
  --amberInk:#17150F;      /* text on amber */
  --amberDeep:#96650A;     /* amber as TEXT, so darker than --amber */
  --good:#0A7D3C;
  --goodInk:#fff;          /* text on a solid --good fill */
  --goodSoft:#E3F6EA;
  --bad:#B3261E;
  --badSoft:#FBE6E6;
  --warm:#A84E1C;       /* 'just started' on the goal rings */
  --banner:#FFF1D6;
  --bannerBorder:#FFD98A;
  --bannerInk:#5C4A1E;
  --headerBg:#17150F;      /* header, hero, black cards, loading coin */
  --onDark:#FAF6F0;        /* text on --headerBg */
  --onDarkFaint:#9A9384;   /* tertiary text on --headerBg, which is dark in BOTH themes */
  --onDarkBorder:#4A463D;  /* outlined buttons in the header */
  --shadow:rgba(31,68,255,.28);
  --shadowSoft:rgba(31,68,255,.12);
  --scrim:rgba(23,21,15,.45);
  color-scheme:light;
}
/* Dark: warm greys rather than pure black, so the paper-and-ink feel survives.
   Cobalt is lifted to #6C86FF — #1F44FF on a dark ground fails contrast — and the
   text that sits on cobalt goes dark to match. */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:#121110;
    --surface:#1C1A17;
    --surface2:#26231D;
    --ink:#F2EDE4;
    --muted:#A8A192;
    --faint:#8A8474;
    --line:#2A261F;
    --border:#332E26;
    --border2:#463F34;
    --accent:#6C86FF;
    --accent2:#8EA0FF;
    --accentInk:#0B0A08;
    --accentSoft:#1B2145;
    --accentSoftBorder:#2F3872;
    --amber:#FFC352;
    --amberInk:#17150F;
    --amberDeep:#E9AE3A;
    --good:#4CC98A;
    --goodInk:#0B0A08;
    --goodSoft:#12301F;
    --bad:#FF7A6B;
    --badSoft:#38191A;
    --warm:#FF9E6B;
    --banner:#2A2313;
    --bannerBorder:#4C3D18;
    --bannerInk:#F0DFB4;
    --headerBg:#0C0B09;
    --onDark:#F2EDE4;
    --onDarkFaint:#9A9384;
    --onDarkBorder:#3A352B;
    --shadow:rgba(108,134,255,.30);
    --shadowSoft:rgba(108,134,255,.14);
    --scrim:rgba(0,0,0,.62);
    color-scheme:dark;
  }
}
:root[data-theme="dark"] {
  --bg:#121110;
  --surface:#1C1A17;
  --surface2:#26231D;
  --ink:#F2EDE4;
  --muted:#A8A192;
  --faint:#8A8474;
  --line:#2A261F;
  --border:#332E26;
  --border2:#463F34;
  --accent:#6C86FF;
  --accent2:#8EA0FF;
  --accentInk:#0B0A08;
  --accentSoft:#1B2145;
  --accentSoftBorder:#2F3872;
  --amber:#FFC352;
  --amberInk:#17150F;
  --amberDeep:#E9AE3A;
  --good:#4CC98A;
  --goodInk:#0B0A08;
  --goodSoft:#12301F;
  --bad:#FF7A6B;
  --badSoft:#38191A;
  --warm:#FF9E6B;
  --banner:#2A2313;
  --bannerBorder:#4C3D18;
  --bannerInk:#F0DFB4;
  --headerBg:#0C0B09;
  --onDark:#F2EDE4;
  --onDarkFaint:#9A9384;
  --onDarkBorder:#3A352B;
  --shadow:rgba(108,134,255,.30);
  --shadowSoft:rgba(108,134,255,.14);
  --scrim:rgba(0,0,0,.62);
  color-scheme:dark;
}
/* Motion: one spring, used everywhere something appears or grows. The overshoot
   is what separates "an app" from "a web page"; honoured only when the reader has
   not asked for less motion. */
:root { --spring:cubic-bezier(.34,1.56,.64,1); --ease:cubic-bezier(.4,0,.2,1);
        --r:18px; --rSm:12px; --rLg:22px; }
@media (prefers-reduced-motion: reduce) { :root { --spring:linear; --ease:linear; } }

/* ---- progress rings, shared ----
   Driven by gpRingHtml()/gpRingVars() in rollup.js. One element, no SVG: the
   conic-gradient is the sweep and the ::after punches the middle out, so the ring
   inherits whatever background it is sitting on. */
.gRing { flex:0 0 auto; width:42px; height:42px; border-radius:50%; position:relative;
  background:conic-gradient(var(--gc) calc(var(--p) * 1%), var(--surface2) 0);
  display:grid; place-items:center; transition:background .3s var(--ease); }
.gRing::after { content:''; position:absolute; inset:4px; border-radius:50%; background:var(--surface); }
.gRing span { position:relative; z-index:1; font-family:'Koulen',sans-serif; font-size:12.5px;
  color:var(--gc); letter-spacing:-.2px; }
.gRing.sm { width:34px; height:34px; }
.gRing.sm span { font-size:10.5px; }
.gRing.sm::after { inset:3px; }
.gRing.lg { width:58px; height:58px; }
.gRing.lg span { font-size:16px; }
.gRing.lg::after { inset:5px; }
/* On the black hero the punched-out middle has to match the hero, not a card. */
.hero .gRing::after, .focusCard .gRing::after { background:var(--headerBg); }
.hero .gRing, .focusCard .gRing { background:conic-gradient(var(--gc) calc(var(--p) * 1%), var(--onDarkBorder) 0); }
/* ...and the digits go to plain light text there. The paper-mode versions of those
   colours are chosen to be readable ON PAPER, so they are far too dark to sit on
   the hero; the sweep still carries the colour, which is where it reads anyway. */
.hero .gRing span, .focusCard .gRing span { color:var(--onDark); }

/* ---- a number that has just landed ----
   Pairs with gpAnimateCounts(): the value climbs and the element settles into
   place, so a figure reads as arriving rather than simply being there. */
@keyframes gpPop { 0%{transform:scale(.88);opacity:.55} 100%{transform:scale(1);opacity:1} }
[data-count] { display:inline-block; animation:gpPop .42s var(--spring) both; }
@media (prefers-reduced-motion: reduce) { [data-count] { animation:none } }
</style>
<style>
* { box-sizing:border-box; margin:0; }
/* ---- locked to the edges of the phone ----
   The page asks for viewport-fit=cover and a black-translucent status bar, which
   together hand it the whole screen INCLUDING the notch and the home-indicator
   strip. Nothing then padded for them, so the header sat under the notch and the
   tab bar under the indicator — and because iOS reports those insets late and
   re-reports them on rotation, on keyboard open/close and when the URL bar
   collapses, the content shifted each time. That is the wiggle. Pad by the insets
   and the chrome stops moving.
   overflow-x is on html as well as body on purpose: on iOS, body alone still lets
   the document itself rubber-band sideways. */
html { overscroll-behavior:none; overflow-x:hidden; }
body { background:var(--bg); color:var(--ink); font-family:'Kantumruy Pro',system-ui,sans-serif;
  padding-bottom:calc(76px + env(safe-area-inset-bottom));
  padding-left:env(safe-area-inset-left); padding-right:env(safe-area-inset-right);
  overscroll-behavior:none; overflow-x:hidden; -webkit-text-size-adjust:100%; }
button, select, input { font-family:inherit; }
input:focus, select:focus, button:focus-visible { outline:3px solid var(--accent); outline-offset:1px; }

header { background:var(--headerBg); color:var(--onDark); display:flex; justify-content:space-between; align-items:center;
  padding:calc(16px + env(safe-area-inset-top)) 16px 16px; }
.brandRow { display:flex; align-items:center; gap:10px; min-width:0; }
.logoImg { height:30px; width:auto; flex-shrink:0; display:block; }
.brand { display:flex; flex-direction:column; padding-left:10px; border-left:1px solid var(--onDarkBorder); }
.brandKh { font-family:'Koulen',sans-serif; font-size:22px; letter-spacing:1px; line-height:1; }
.brandEn { font-size:9px; letter-spacing:3px; color:var(--amber); font-weight:700; }
.hbtns { display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
.hbtn { border:1px solid var(--onDarkBorder); background:transparent; color:var(--onDark); border-radius:999px; padding:6px 12px; font-size:13px; cursor:pointer; }
.hbtn.icon { padding:6px; display:flex; align-items:center; justify-content:center; }

/* ---- hamburger menu drawer ---- */
.scrim { position:fixed; inset:0; background:var(--scrim); z-index:40; }
.drawer { position:fixed; top:0; right:0; bottom:0; width:280px; max-width:82vw; background:var(--surface); z-index:41;
  box-shadow:-8px 0 24px rgba(23,21,15,.18); display:flex; flex-direction:column;
  padding:calc(20px + env(safe-area-inset-top)) 16px 16px; padding-right:calc(16px + env(safe-area-inset-right)); overflow-y:auto; }
.drawerHead { display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; }
.drawerTitle { font-family:'Koulen',sans-serif; font-size:18px; color:var(--ink); }
.drawerItem { display:flex; align-items:center; gap:12px; padding:13px 8px; border-radius:12px; background:none; border:0;
  cursor:pointer; text-align:left; font-family:inherit; color:var(--ink); width:100%; }
.drawerItem:active { background:var(--surface2); }
.drawerIcon { flex:0 0 auto; color:var(--accent); display:flex; }
.drawerLabel { font-size:14.5px; font-weight:600; flex:1; }

main { padding:18px 16px; max-width:640px; margin:0 auto; }
h2 { font-family:'Koulen',sans-serif; font-size:24px; letter-spacing:.5px; margin:0 0 4px; }
h2 small { font-family:'Kantumruy Pro',sans-serif; font-size:14px; color:var(--muted); font-weight:400; }
h3 { font-family:'Koulen',sans-serif; font-size:16px; letter-spacing:.5px; margin:22px 0 8px; }
.sub { font-size:13px; color:var(--muted); margin-bottom:16px; line-height:1.5; }

.card { background:var(--surface); border:1px solid var(--border); border-radius:var(--r); padding:14px; margin-bottom:12px; }
label.f { display:block; font-size:11px; letter-spacing:1.5px; font-weight:700; color:var(--muted); text-transform:uppercase; margin:12px 0 4px; }
label.f:first-child { margin-top:0; }
input[type=text], input[type=tel], input[type=number], input[type=password], select {
  /* 16px is the iOS Safari threshold — anything smaller zooms the whole page in on focus. */
  width:100%; font-size:16px; padding:11px; border-radius:10px; border:1.5px solid var(--ink); background:var(--surface); color:var(--ink); }
.hint { font-size:11.5px; color:var(--faint); margin-top:4px; }
.lock { color:var(--amberDeep); font-size:11px; font-weight:700; }

.btn { width:100%; margin-top:16px; padding:13px; font-family:'Koulen',sans-serif; font-size:18px; letter-spacing:1px;
  background:var(--accent); color:var(--accentInk); border:none; border-radius:12px; cursor:pointer; transition:transform .08s ease; }
.btn:active { transform:scale(.97); }
.btn:disabled { opacity:.6; }
.btn.ghost { background:transparent; color:var(--ink); border:1.5px solid var(--ink); font-size:14px; font-family:'Kantumruy Pro',sans-serif; }
.linkbtn { background:none; border:none; color:var(--accent); font-size:14px; cursor:pointer; text-decoration:underline; padding:8px; width:100%; margin-top:8px; }
.danger { background:none; border:none; color:var(--bad); font-size:13px; cursor:pointer; padding:8px; }

.row { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--line); }
.row:last-child { border-bottom:none; }
.rowName { font-size:14.5px; line-height:1.3; }
.rowVal { font-family:'Koulen',sans-serif; font-size:18px; color:var(--accent); white-space:nowrap; }
.qBlock { padding:12px 0; border-bottom:1px solid var(--line); }
.qBlock:last-of-type { border-bottom:none; }
.qText { font-size:14.5px; margin-bottom:8px; line-height:1.35; }
.seg { display:flex; gap:8px; }
.seg button { flex:1; padding:10px; border-radius:10px; border:1.5px solid var(--border2); background:var(--bg); font-size:15px; cursor:pointer; }
.seg button.on { background:var(--accent); border-color:var(--accent); color:var(--accentInk); font-weight:700; }
.seg button.on.bad { background:var(--bad); border-color:var(--bad); }
.scale { display:flex; gap:4px; flex-wrap:wrap; }
.scale button { width:36px; height:36px; border-radius:9px; border:1.5px solid var(--border2); background:var(--bg); font-size:13px; cursor:pointer; }
.scale button.on { background:var(--accent); border-color:var(--accent); color:var(--accentInk); font-weight:700; }

/* Weekly Health's 1-10 questions, from the mockup — a slider with low/high
   captions and a live readout, instead of a row of ten buttons. Scoped to
   .sliderWrap rather than a bare input[type=range] rule so it can't touch
   the goal ring's own .gSlide styling elsewhere on the page — but the thumb
   and track below are deliberately the SAME shape as .gSlide (hollow
   thumb with a colored ring, 10px track, a scale-up on active) so a drag
   feels like the same control everywhere in the app. Health doesn't get
   .gSlide's per-value color band (higher isn't always "better" here — 10
   on "how lonely" is bad, 10 on "clarity" is good), so the ring color
   stays the fixed accent rather than --gc.

   The input box itself is a full 32px tall even though the visible track is
   a thin 10px line drawn by the track pseudo-element; a slider whose hit box
   is exactly as thin as its track is hard to grab and drag smoothly with a
   finger, which read as "unresponsive".

   That 32px band is also why touch-action matters here. It was `none`, meaning
   no gesture starting anywhere in it could pan — and with several of these
   stacked down the Health tab, most of the page's height became somewhere you
   could not scroll from. `pan-y` is the right half: the slider still claims the
   horizontal axis, so a drag on the thumb starts without the browser spending
   frames deciding, and a vertical swipe still scrolls the page. The value the
   browser sets on touch-down is put back by gpSlideGuard() when the gesture
   turns out to have been a scroll. The fill color is a CSS variable set
   from JS (--fillpct) rather than a `background` on the input, because the
   two-tone track lives on the ::-webkit-slider-runnable-track /
   ::-moz-range-track pseudo-elements, which inline styles on the input
   itself cannot reach. */
.qCaps { display:flex; justify-content:space-between; font-size:10.5px; color:var(--faint); margin-top:2px; }
.qReadout { font-family:'Koulen',sans-serif; font-size:15px; color:var(--accent); }
.sliderWrap { padding:10px 2px 2px; }
.sliderWrap input[type=range] { -webkit-appearance:none; appearance:none; width:100%; height:32px; border-radius:99px;
  outline:none; margin:0; background:transparent; cursor:pointer; touch-action:pan-y; }
.sliderWrap input[type=range]::-webkit-slider-runnable-track { height:10px; border-radius:99px;
  background:linear-gradient(to right, var(--accent) var(--fillpct,50%), var(--surface2) var(--fillpct,50%)); }
.sliderWrap input[type=range]::-moz-range-track { height:10px; border-radius:99px;
  background:linear-gradient(to right, var(--accent) var(--fillpct,50%), var(--surface2) var(--fillpct,50%)); }
.sliderWrap input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:24px; height:24px; border-radius:50%;
  background:var(--surface); border:3px solid var(--accent); box-shadow:0 2px 8px rgba(23,21,15,.22); cursor:pointer;
  transition:transform .12s ease; }
.sliderWrap input[type=range]::-moz-range-thumb { width:24px; height:24px; border-radius:50%; background:var(--surface);
  border:3px solid var(--accent); box-shadow:0 2px 8px rgba(23,21,15,.22); cursor:pointer; }
.sliderWrap input[type=range]:active::-webkit-slider-thumb { transform:scale(1.18); }
.sliderWrap input[type=range]:focus-visible { outline:2px solid var(--accent); outline-offset:3px; border-radius:99px; }
@media (prefers-reduced-motion: reduce){ .sliderWrap input[type=range]::-webkit-slider-thumb { transition:none } }
.numIn { display:flex; align-items:center; gap:10px; }
.numIn input { width:110px; text-align:right; border:1.5px solid var(--border2); background:var(--bg); }

.pcard { display:flex; align-items:center; gap:14px; }
.avatar { width:64px; height:64px; border-radius:50%; object-fit:cover; border:2px solid var(--border); background:var(--surface2); flex-shrink:0; }
.avatar.lg { width:96px; height:96px; }
.avatar.sm { width:40px; height:40px; }
.avatar.ph { display:flex; align-items:center; justify-content:center; font-family:'Koulen',sans-serif; font-size:26px; color:var(--faint); }
.avatar.sm.ph { font-size:14px; }

/* ---- inline entry cards: Mentorship, Leave, Account, from the mockup ---- */
.leaveEntry { display:flex; align-items:center; gap:13px; width:100%; text-align:left; cursor:pointer; font-family:inherit; background:none; border:0; color:inherit; }
.leaveEntryIcon { flex:0 0 auto; width:38px; height:38px; border-radius:10px; background:var(--accentSoft); color:var(--accent); display:flex; align-items:center; justify-content:center; }
.mentorLabel { font-size:11px; letter-spacing:1.5px; text-transform:uppercase; color:var(--faint); font-weight:700; margin-bottom:6px; }
.mentorBlock { display:flex; align-items:center; gap:12px; padding:4px 0 14px; }
.mentorName { font-size:14px; font-weight:700; }
.mentorMeta { font-size:12px; color:var(--muted); margin-top:1px; }
.mentorDivider { border-top:1px solid var(--border); margin:2px 0 14px; }
.openBtn { flex:0 0 auto; border:1.5px solid var(--border2); background:var(--bg); border-radius:9px; width:32px; height:32px; display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--ink); }
.emptyLine { font-size:13px; color:var(--muted); font-style:italic; padding:6px 0 14px; }
.pname { font-family:'Koulen',sans-serif; font-size:22px; letter-spacing:.5px; }
.pmeta { font-size:13px; color:var(--muted); margin-top:2px; }

.chips { display:flex; gap:8px; flex-wrap:wrap; margin:6px 0 4px; }
.chip { background:var(--banner); border:1px solid var(--bannerBorder); color:var(--ink); border-radius:999px; padding:5px 12px; font-size:13px; font-weight:700; }
.chip.blue { background:var(--accentSoft); border-color:var(--accentSoftBorder); }

/* Quick-jump bar at the top of My Database — one tap to any section folded in
   from the old My week / Me tabs, instead of scrolling past all of them. A
   single scrolling row rather than wrapping onto several, so it reads as one
   strip of chips instead of pushing everything else down the page. */
.quickBar { display:flex; gap:8px; flex-wrap:nowrap; overflow-x:auto; margin:0 0 14px; padding-bottom:2px;
  scrollbar-width:none; -ms-overflow-style:none;
  /* Both axes, named explicitly. `pan-x` alone reads as "this element permits
     horizontal panning and nothing else", so a vertical swipe starting on the
     strip was not allowed to scroll the page at all — the strip is full width

/* ---- the drill-down sheet (rollup.js renders it; these are its clothes) ----
   Same sheet the dashboard uses, so "where did this number come from" looks the
   same wherever you tap a figure. */
/* A figure that opens has to LOOK like it opens. This was cursor:pointer only,
   which is nothing at all on a phone — so which numbers were tappable was pure
   guesswork, and the ones that are deliberately closed (a count of ministries, a
   figure derived by a formula) looked identical to a broken one. The dotted rule

.drillable { cursor:pointer; -webkit-tap-highlight-color:transparent; }

<!-- ==================== SPLASH ====================
     THIS BLOCK IS DUPLICATED VERBATIM IN index.html AND teams.html.
     tests/test-splash.mjs asserts the two copies are byte-identical — edit one,
     edit both. It is inlined rather than pulled from a file because it has to
     paint on the very first frame: an external stylesheet is another round trip,
     and a round trip is the whole problem this solves.

     Why it exists: the PWA's start_url is index.html, so every launch loads the
     dashboard and then navigates to the staff page. That second navigation is a
     real network fetch, so for as long as it takes you saw the dashboard. Script
     timing cannot fix that — the splash is in the markup from the first byte and
     covers the viewport, so there is nothing to see underneath at any point.

     background is the manifest's background_color, so the iOS launch screen and
     this are the same colour and the hand-off has no flash of white or paper.

     The ring spins immediately, from CSS alone, because logo.js is 77KB and must
     not block the head. The real GP mark fades into the middle the moment it
     lands — normally within a few tens of ms, and instantly once cached. -->
<style>
#splash { position:fixed; inset:0; z-index:9999; background:var(--headerBg);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px;
  opacity:1; transition:opacity .34s ease; }
#splash.gone { opacity:0; pointer-events:none; }
.spCoin { width:104px; height:104px; border-radius:50%; position:relative;
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 0 0 4px rgba(31,68,255,.16), 0 14px 40px rgba(31,68,255,.34); }
/* The comet ring: visible from frame one, no image needed. Masked to a 3px band
   so it reads as a ring rather than a filled disc. */
.spCoin::before { content:''; position:absolute; inset:-9px; border-radius:50%;
  background:conic-gradient(from 0deg, rgba(31,68,255,0) 0deg, rgba(31,68,255,.15) 200deg, var(--accent) 340deg, var(--accent2) 360deg);
  -webkit-mask:radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px));
  mask:radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px));
  animation:spSpin 1s linear infinite; }
/* The mark is white, drawn for the black header, so it reads on this background
   with no coin behind it. Hidden until it has a src, so it is never a blank gap. */
.spCoin img { width:74px; height:auto; opacity:0; transition:opacity .3s ease;
  animation:spSpin 1.4s linear infinite; }
.spCoin img[src] { opacity:1; }
.spWord { font-family:'Koulen',system-ui,sans-serif; font-size:20px; letter-spacing:2.5px;
  color:var(--onDark); text-transform:uppercase; }
.spWord::after { content:''; animation:spDots 1.4s steps(1,end) infinite; }
@keyframes spSpin { to { transform:rotate(360deg) } }
@keyframes spDots { 0%{content:''} 25%{content:'.'} 50%{content:'..'} 75%,100%{content:'...'} }
@media (prefers-reduced-motion: reduce){
  .spCoin::before, .spCoin img { animation:none }
  .spWord::after { content:'...' }
}
</style>
<div id="splash"><div class="spCoin"><img id="splashLogo" alt=""></div><div class="spWord">Impact Loading</div></div>
<script>
/* Two calls, so nothing else needs to know how the splash is built:
   gpSplashLogo(src) drops the real mark in once logo.js has landed, and
   gpSplashDone() takes the splash down when there is finally something behind it
   worth looking at. Both are safe to call more than once, and safe to call before
   the element exists.

   The timeout is the important part: if any path forgets to call gpSplashDone —
   an error boundary, a branch added later — the splash would sit there covering a
   working app forever. Better to reveal a half-drawn page than to trap it. */
(function(){
  var TIMEOUT = 8000;
  window.gpSplashLogo = function(src){
    var i = document.getElementById('splashLogo');
    if(i && typeof src === 'string' && src && !i.getAttribute('src')) i.src = src;
  };
  window.gpSplashDone = function(){
    var s = document.getElementById('splash');
    if(!s || s.className.indexOf('gone') > -1) return;
    s.className = 'gone';
    setTimeout(function(){ if(s.parentNode) s.parentNode.removeChild(s); }, 420);
  };
  setTimeout(function(){ window.gpSplashDone(); }, TIMEOUT);
})();
</script>
<!-- ================== END SPLASH ================== -->

<script>
/*  Error boundary — must come first, before any other script.

    This page is the app's front door for signed-in staff, so a failure here
    used to be inescapable: index.html redirects here, and a blank screen gave
    no way back to the dashboard. The fallback always offers that way out. */
(function(){
  var shown = false;
  function fallback(what){
    if(shown) return; shown = true;
    // Latch it so a later render() can't paint over the message.
    window.gpDead = true;
    // And lift the splash, or the message sits behind it and the app looks hung.
    if(window.gpSplashDone) window.gpSplashDone();
    var html =
      '<div style="max-width:420px;margin:12vh auto;padding:0 22px;text-align:center;'+
      'font-family:system-ui,sans-serif;color:var(--ink)">'+
      '<div style="font-size:40px;line-height:1">✦</div>'+
      '<h2 style="font-size:19px;margin:14px 0 8px">This didn’t load properly</h2>'+
      '<p style="font-size:14.5px;line-height:1.5;color:var(--muted);margin:0 0 18px">'+
      'Usually a connection hiccup. Nothing you’ve logged was lost.</p>'+
      '<button id="gpReload" style="width:100%;padding:14px;border:0;border-radius:12px;'+
      'background:var(--accent);color:var(--accentInk);font-size:16px;font-weight:700;cursor:pointer">Try again</button>'+
      '<button id="gpDash" style="width:100%;padding:13px;margin-top:9px;border:1.5px solid var(--border2);'+
      'border-radius:12px;background:transparent;color:var(--ink);font-size:15px;cursor:pointer">Open the dashboard</button>'+
      '<div style="font-size:11px;color:var(--faint);margin-top:20px">'+String(what||'').slice(0,140)+'</div>'+
      '</div>';
    function paint(){
      var host = document.getElementById('main') || document.body;
      if(!host) return;
      host.innerHTML = html;
      var nav = document.getElementById('bottomNav');
      if(nav) nav.classList.add('hidden');
      var r = document.getElementById('gpReload');
      if(r) r.onclick = function(){ location.reload(); };
      var d = document.getElementById('gpDash');
      if(d) d.onclick = function(){
        // Break the auto-redirect so the dashboard is actually reachable.
        try { sessionStorage.setItem('gp-skip-teams','1'); } catch(e){}
        location.href = 'index.html';
      };
    }
    if(document.body) paint();
    else document.addEventListener('DOMContentLoaded', paint);
  }
  window.addEventListener('error', function(e){
  /* A failed <script src> fires an error event on the element itself.

     Only some scripts are load-bearing. logo.js and km.js are marked
     data-optional because the page works without them — a missing logo is a
     missing image, and a missing dictionary just leaves the text in English.
     Killing the whole app for either is far worse than the thing it prevents,
     and on the patchy phone connections this is built for, a third request is a
     third chance to fail. taxonomy.js has no fallback and stays fatal. */
    if(e && e.target && e.target.tagName === 'SCRIPT'){
      if(e.target.hasAttribute('data-optional')) return;
      fallback('could not load ' + (e.target.src || 'a script'));
      return;
    }
    if(e && e.message) fallback(e.message);
  }, true);
  window.addEventListener('unhandledrejection', function(e){
    fallback((e && e.reason && e.reason.message) || 'unexpected error');
  });
  window.gpBootFailed = fallback;
})();
</script>

   never had that problem — it builds its loading box in render(), after the

/* ---------- week helpers (must match isoWeek_ in netlify/functions/api.js) ---------- */
/* Mirrors MIN_WEEK_DAYS in the API: below this many logged days the week isn't
   scored or reported. Kept in step by hand — if you change one, change both. */
var MIN_WEEK_DAYS = 3;
function isoWeekOf(d){
  var y=d.getFullYear();
  var jan1=new Date(y,0,1);
  var monW1=new Date(y,0,1-((jan1.getDay()+6)%7));
  return Math.max(1, Math.min(52, Math.floor((d-monW1)/(7*86400000))+1));
}
function thisWeek(){ return isoWeekOf(new Date()); }
function goalsViewWeek(){ return S.goalsWeek==null ? thisWeek() : S.goalsWeek; }
function kpiViewWeek(){ return S.kpiWeek==null ? thisWeek() : S.kpiWeek; }
/* Same idea as kpiViewWeek, but one week pointer per oversee-ministry — so
   backfilling Cafe's week 30 doesn't move what Outreach Teams' card is showing. */
function ovWeekFor_(min){ return (S.ovWeek[min]==null) ? thisWeek() : S.ovWeek[min]; }
/* A "Base Leadership" profile whose ministry is itself a real department name
   means that person oversees every ministry under it — see getDepartments()
   in taxonomy.js. Returns that department name, or null for everyone else. */
function myOversightDept_(){ return oversightDeptOf_(S.me); }
/* Same check as myOversightDept_, generalized to any staff record — used so
   a teammate's own OKR view can also add the department they lead, not just
   S.me's. */
function oversightDeptOf_(person){
  if(!person || person.dept!=='Base Leadership') return null;
  var deps=getDepartments(person.campus);
  return deps[person.ministry] ? person.ministry : null;
}

/* Same Monday-anchored math as isoWeekOf, run backwards: a week NUMBER back
   to the calendar date its Monday actually falls on, so the Weekly Goals
   header can say "Aug 17 – Aug 23" instead of a bare week number. */
var MONTH_ABBR=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function mondayOfWeek_(week){
  var y=new Date().getFullYear();
  var jan1=new Date(y,0,1);
  var monW1=new Date(y,0,1-((jan1.getDay()+6)%7));
  var d=new Date(monW1);
  d.setDate(d.getDate()+(Number(week)-1)*7);
  return d;
}
function weekRange_(week){
  var mon=mondayOfWeek_(week);
  var sun=new Date(mon); sun.setDate(sun.getDate()+6);
  var a=MONTH_ABBR[mon.getMonth()]+' '+mon.getDate();
  var b=sun.getMonth()===mon.getMonth() ? String(sun.getDate()) : MONTH_ABBR[sun.getMonth()]+' '+sun.getDate();
  return { short:a+' – '+b, year:sun.getFullYear() };
}
function weekRangeLabel_(week){
  var r=weekRange_(week);
  return gpT('Week of {range}, {year}',{range:r.short, year:r.year});
}
/* A compact "Aug 17 – 23" for secondary labels (the ministry KPI card),
   where the full "Week of …, 2026" sentence would be too long. */
function weekRangeShort_(week){ return weekRange_(week).short; }
function isoDateOf_(d){ return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
/* The Monday and Sunday of a given week, as YYYY-MM-DD — used to pick which
   date a backfilled ministry number should land on when you're not looking
   at the current week. */
function weekBounds_(week){
  var mon=mondayOfWeek_(week), sun=new Date(mon); sun.setDate(sun.getDate()+6);
  return { from:isoDateOf_(mon), to:isoDateOf_(sun) };
}
function kpiEntryDate_(week){
  return Number(week)===Number(thisWeek()) ? todayStr() : weekBounds_(week).to;
}
function goalsForWeek(week){
  for(var i=0;i<S.goals.length;i++) if(Number(S.goals[i].week)===Number(week)) return S.goals[i];
  return null;
}
function checkinForWeek(week){
  for(var i=0;i<S.checkins.length;i++) if(Number(S.checkins[i].week)===Number(week)) return S.checkins[i];
  return null;
}

function run(fn, args, onOk){

    method: 'POST',

/* consecutive-day streak ending today or yesterday */
function streak(pred){
  var have={}; S.logs.forEach(function(l){ if(pred(l)) have[l.date]=1; });
  var d=new Date(); var n=0;
  // allow streak to still count if today not logged yet
  if(!have[fmtD(d)]) d.setDate(d.getDate()-1);
  while(have[fmtD(d)]){ n++; d.setDate(d.getDate()-1); }
  return n;
}

/* Forgiving streak: one missed day doesn't wipe the run, it spends the single
   grace day. Punitive streaks are why habit trackers get deleted in February. */
function graceStreak(pred){
  var have={}; S.logs.forEach(function(l){ if(pred(l)) have[l.date]=1; });
  var d=new Date();
  if(!have[fmtD(d)]) d.setDate(d.getDate()-1);   // today's not due yet
  var n=0, grace=1;
  while(true){
    if(have[fmtD(d)]){ n++; }
    else if(grace>0 && n>0){ grace--; }          // never start on a grace day
    else break;
    d.setDate(d.getDate()-1);
  }
  return n;
}
function bestStreak(pred){
  var days=S.logs.filter(pred).map(function(l){return l.date;}).sort();
  var best=0, run=0, prev=null;
  days.forEach(function(ds){
    if(prev){
      var gap=Math.round((new Date(ds+'T00:00:00')-new Date(prev+'T00:00:00'))/86400000);
      run = gap===1 ? run+1 : 1;
    } else run=1;
    if(run>best) best=run;
    prev=ds;
  });
  return best;
}
/* Habit results live in l.habits, but the original fixed columns (bible,
   workout, quietTime…) hold the history from before habits were configurable —
   fall back to them so nobody's streak resets to zero on this change. */
function didHabit(l, id){
  if(l.habits && l.habits[id]!==undefined) return !!l.habits[id];
  return !!l[id];
}
function habitPred(id){ return function(l){ return didHabit(l,id); }; }
function logForDate(ds){
  for(var i=0;i<S.logs.length;i++) if(S.logs[i].date===ds) return S.logs[i];
  return null;
}
function fmtD(d){ return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
function thisWeekLogs(){
  // Monday-based week matching the backend
  var d=new Date(); var day=(d.getDay()+6)%7; var mon=new Date(d); mon.setDate(d.getDate()-day); mon.setHours(0,0,0,0);
  var ms=fmtD(mon);
  return S.logs.filter(function(l){ return l.date>=ms; });
}
function sum(rows, f){ var acc=0; rows.forEach(function(r){ acc+=Number(f(r))||0; }); return acc; }
function count(rows, f){ var n=0; rows.forEach(function(r){ if(f(r)) n++; }); return n; }

/* ---------- boot ---------- */
function boot(){
  /* The dashboard's front door links straight here: ?reg=1 opens the create
     form rather than making someone find the "New here?" link first. */
  try { if(String(location.search||'').indexOf('reg=1')>-1) S.regMode = true; } catch(e){}
  var saved = null;
  try { saved = JSON.parse(lsGet('gp-staff')||'null'); } catch(e){}
  if(saved && saved.user && saved.pin){
    /* A remembered session goes straight to getMyBoot: it verifies the PIN and
       returns the staff record, so the separate staffLogin round-trip that used
       to come first is not needed. Logging in by hand still uses staffLogin,
       because there the answer to "is this PIN right" is the whole point. */
    S.auth = saved;
    run('getMyBoot', [saved.user, saved.pin], function(d){
      if(d && d.ok){
        S.me = d.staff; S.profile = d.profile;
        applyBoot(d);
        return;
      }
      /* Only forget the session when the server actually says the credentials are
         wrong. Anything else — a 500, a bad gateway, a truncated response — is the
         request failing, and making somebody retype their PIN because the server
         hiccuped is the wrong answer. run() already reports a dropped connection;
         this covers a server that answered but not with a page. */
      if(d && d.err === 'auth'){
        lsDel('gp-staff');
        S.me = null; S.auth = { user:'', pin:'' };
        showMsg(t('Your PIN didn’t work — please log in again.'));
      } else {
        showMsg(t('Couldn’t load your page — pull down to try again.'));
      }
      render();
    });
  } else { render(); }
}
/* Small public snapshot so the dashboard's top-right chip can show your face
   and name without needing your PIN. Nothing private goes in here. */
function saveStaffCard(){
  lsSet('gp-staff-card', JSON.stringify({
    name: S.me.name, photo: S.me.photo || '', ministry: S.me.ministry || '',
    // Campus so the dashboard can open on your own base instead of Poipet.
    campus: S.me.campus || ''
  }));
}

function afterLogin(){
  lsSet('gp-staff', JSON.stringify(S.auth));
  saveStaffCard();
  S.view='base';
  /* ONE request for everything this page needs. It used to be nine on top of the
     login — each verifying the same PIN, each re-rendering when it landed, so the
     page rebuilt itself nine times while it loaded. Sections that fail come back
     null and simply stay empty; the rest of the page still works. */
  run('getMyBoot', [S.auth.user, S.auth.pin], function(d){
    if(!d || !d.ok){ showMsg(t('Couldn’t load your page — pull down to try again.')); render(); return; }
    if(d.staff) S.me = d.staff;
    if(d.profile) S.profile = Object.assign(S.profile||{}, d.profile);
    applyBoot(d);
  });
  render();
}

/* Everything a boot payload carries, in one place, because two entry points use
   it: a remembered session and a fresh login. */
function applyBoot(d){
  S.roster = d.roster || [];
  S.logs = d.logs || [];
  if(d.habits) S.habits = d.habits;
  S.mentees = d.mentees || [];
  S.mentorRequests = d.mentorRequests || [];

  if(d.ministry) S.ministry = d.ministry;
  S.smartGoals = d.smartGoals || [];
  S.oneOnOnes = d.oneOnOnes || [];
  if(d.base && d.base.entries) S.base = d.base;
  if(!S.view) S.view = 'base';
  render();
}

function logout(){

/* One collapsible row of the Base accordion. `bodyHtml` is only asked for —
   and only lands in the DOM — while the row is open, matching the mockup's
   sc-if; a closed row costs nothing but its own head line. */
var ACC_CHEVRON = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>';
function accRowHtml(bucketName, id, title, summaryClosed, bodyFn){
  var open = !!S[bucketName][id];
  return '<div class="accRow">'+
    '<button class="accHead" data-acc="'+id+'" data-accbucket="'+bucketName+'">'+
      '<span><div class="accTitle">'+title+'</div><div class="accSummary">'+
        (open?esc(t('Tap to collapse')):summaryClosed)+'</div></span>'+
      '<span class="accChevron" style="transform:rotate('+(open?'180deg':'0deg')+')">'+ACC_CHEVRON+'</span>'+
    '</button>'+
    (open ? '<div class="accBody">'+bodyFn()+'</div>' : '')+
  '</div>';
}

/* The same Base Health figures the Health tab shows (loneliness, clarity,
   habits…), reachable from Base too, on its own period — This Week, a
   quarter, or the whole year — independent of whatever the Health tab's own
   picker is set to. */
var BASE_HEALTH_PERIODS = ['week','q1','q2','q3','q4','year'];
function baseHealthPeriodLabel(id){
  return id==='week' ? t('This Week') : id==='year' ? t('Year (YTD)') : 'Q'+id.slice(1);
}
function baseHealthAccHtml(){
  var period = S.baseHealthPeriod || 'week';
  var R = baseR(); // Year (YTD) is a chip on the year already loaded — no year picker here, unlike the Health tab's
  var ids = [S.me.campus];
  var wk = thisWeek();
  /* Its own block, same as the mockup, so every row can carry a real ▲/▼ —
     against last week, or the previous quarter. Q1 and Year have nothing
     before them to compare to, same as the mockup's own period chips. */
  var rows, score, prevRows;
  if(period==='year'){
    rows = R.surveyRows(ids); score = R.healthScore(ids); prevRows = null;
  } else if(period==='week'){
    rows = R.surveyRows(ids, wk); score = R.healthScore(ids, wk);
    prevRows = R.surveyRows(ids, wk-1);
  } else {
    var q = Number(period.slice(1))-1;
    rows = R.surveyRows(ids, undefined, q); score = R.healthScore(ids, undefined, q);
    prevRows = q>0 ? R.surveyRows(ids, undefined, q-1) : null;
  }
  var cr = (period==='week') ? R.checkinRate(ids, wk) : null;
  var summary = score===null ? t('No check-ins yet.') :
    (cr && cr.total) ? gpT('Score {n}/10 · {pct}% checked in', {n:score.toFixed(1), pct:gpCheckinPct(cr.n,cr.total)})
      : gpT('Score {n}/10', {n:score.toFixed(1)});
  return accRowHtml('baseAcc', 'health', '🏠 '+esc(t('Base Health')), summary, function(){
    var b = '<div class="deptChips">'+BASE_HEALTH_PERIODS.map(function(id){
      return '<button class="deptChip'+(period===id?' on':'')+'" data-baseHealthPeriod="'+id+'">'+esc(baseHealthPeriodLabel(id))+'</button>';
    }).join('')+'</div>';
    [['lonely','Loneliness (avg, lower is better)', false],
     ['clarity','Clarity (avg)', true],
     ['growth','Personal growth (avg)', true],
     ['langHours','Language study (avg hrs)', true],
     ['minHours','Community ministry (avg hrs)', true]
    ].forEach(function(q2){
      var v = rows.length ? R.avg(rows, q2[0]) : null;
      var pv = (prevRows && prevRows.length) ? R.avg(prevRows, q2[0]) : null;
      var tr = (v!==null && pv!==null) ? trendBadge(pctChange(pv,v), q2[2]) : '';
      var suffix = (q2[0]==='langHours'||q2[0]==='minHours') ? '' : '/10';
      b+='<div class="row"><span class="rowName">'+esc(t(q2[1]))+'</span>'+
        '<span class="rowVal">'+(v===null?'—':v.toFixed(1)+suffix)+tr+'</span></div>';
    });
    [['sharedFaith','Shared their faith', true],['sabbath','Took a sabbath', true],
     ['porn','Looked at porn', false],['oneOnOne','Had a one-on-one', true],
     ['exercise','Exercised 3+ days', true],['quietTime','Regular quiet time', true],
     ['debt','Have staff debt', false]
    ].forEach(function(q2){
      var p = rows.length ? R.pct(rows, q2[0]) : null;
      var pp = (prevRows && prevRows.length) ? R.pct(prevRows, q2[0]) : null;
      var tr = (p!==null && pp!==null) ? trendBadge(pctChange(pp,p), q2[2]) : '';
      b+='<div class="row"><span class="rowName">'+esc(t(q2[1]))+'</span>'+
        '<span class="rowVal">'+(p===null?'—':p+'%')+tr+'</span></div>';
    });
    return b+'<p class="hint">🔒 '+esc(t('Base figures are totals only — no names, and nobody sees an individual answer.'))+'</p>';
  });
}

/* One card per ministry under a department, every metric it tracks with its
   current figure and trend — the same raw ledger the Base tab's Department
   Explorer shows for any department, reusable here for a department leader's
   own page (My Ministry) so they don't have to leave it to check on the
   ministries they oversee. Read-only either way: nothing here is typed, it's
   all rolled up from what each ministry already logged. */
function deptMinistriesHtml_(dept, R, ids){
  var deps=getDepartments(S.me.campus);
  if(!deps[dept]) return '';
  var entries=(S.base && S.base.entries || {})[S.me.campus]||{};
  var b='';
  Object.keys(deps[dept]).forEach(function(min){
    b+='<div class="card"><div class="row" style="border-bottom:2px solid var(--ink)">'+
       '<span class="rowName" style="font-weight:700">'+(MIN_EMOJI[min]?MIN_EMOJI[min]+' ':'')+esc(t(min))+'</span><span></span></div>';
    deps[dept][min].forEach(function(metric){
      var mode=modeOf(metric);
      var mkey=dept+'|'+min+'|'+metric;
      var v=aggregate(entries[mkey], mode);
      var lbl=mode==='latest'?'now':(mode==='avg'?'avg':'YTD');
      var tr=R.trendFor(function(w){
        var en=entries[mkey];
        return (en && en[w]!==undefined && en[w]!==null && !isNaN(Number(en[w]))) ? Number(en[w]) : null;
      }, metric);
      b+='<div class="row drillable"'+gpDrillAttrs(metric, ids, dept, min)+'>'+
         '<span class="rowName">'+esc(t(metric))+' <span style="color:var(--faint);font-size:11px">'+lbl+'</span></span>'+
         '<span class="rowVal">'+fmt(v,metric)+tr+'</span></div>';
    });
    b+='</div>';
  });
  return b;
}

/* ---------- OKRs: the objectives that belong to somebody's job ----------
   Objectives are stored per campus, quarter and department, so a person's
   objectives are their department's — that is the only handle the data gives on
   "whose objective is this", and it is the right one: a department's objectives
   are what someone in it is working toward.

   Rendered for two readers: yourself, on Me, and a teammate, when you tap them in
   the Team directory. Both get the same thing — the job first, then what that job
   is aiming at this quarter — because an objective means little without the job it
   belongs to. Nobody's page shows the rest of the base's objectives; this is about
   one person's work.

   Read-only. Writing an objective is a leadership act and stays on the dashboard
   behind the leader code; this is for the people carrying them. */
function okrCardHtml(o, R, editable){
  var p = R.objProgress(o);
  var krs = o.krs||[];
  var open = !!S.krOpen[o.id];
  var h = '<div class="okrCard">'+
    '<div class="okrHead"><div><div class="okrObj">'+esc(o.objective)+'</div>'+
    '<div class="okrDept">'+(MIN_EMOJI[o.dept]?MIN_EMOJI[o.dept]+' ':'')+esc(t(o.dept))+'</div></div>'+
    '<div class="okrPct'+(p>=100?' done':'')+'">'+p+'%</div></div>'+

       target, so it is obvious the number came from what the ministry logged —

    var meta, right = kp.pct+'%';

      '<button class="linkbtn inline" data-okr-edit="'+esc(o.id)+'">'+esc(t('Edit'))+'</button></div>';
  }

}

/* One person's objectives, with the job they belong to on top. `who` is any
   staff record — yourself or a teammate. `mine` turns on the wording addressed
   to you, and the editing controls: you may write your own department's
   objectives, never another department's, which the server enforces too.

   A department overseer (dept: Base Leadership, ministry: e.g. Community
   Service) sees their OWN department's objectives (Base Leadership's) plus
   the objectives of the department they lead — two sets, same as the
   "Ministries You Oversee" section on My Ministry. When there's more than
   one objective to show, they're paged one at a time instead of stacked, so
   the section stays short; each card still says which department it
   belongs to. */
function okrSectionHtml(who, mine){
  var wk = thisWeek();
  var qNow = Math.min(4, Math.floor((wk-1)/13)+1);
  var dept = who.dept==='Base Director' ? 'Base Leadership' : who.dept;
  var depts = [dept];
  var oversees = oversightDeptOf_(who);
  if(oversees && depts.indexOf(oversees)===-1) depts.push(oversees);
  var h = '<h3'+(mine?' id="sec-okr"':'')+'>🎯 Q'+qNow+' '+esc(t('OKRs'))+'</h3>';

  var focus = (typeof jobFocus==='function') ? jobFocus(dept, who.ministry) : null;
  if(focus){
    h += '<div class="focusCard"><div class="fLabel">'+
      esc(t(mine ? 'Your focus' : 'Their focus'))+'</div>'+
      '<div class="fMin">'+esc(t(who.ministry || dept))+'</div>'+
      '<p>'+esc(focus)+'</p></div>';
  }

  if(!S.base){
    return h+'<div class="card"><p class="sub" style="margin:0">'+esc(t('Loading your base…'))+'</p></div>';
  }
  var R = baseR();
  var theirs = (S.base.okrs||[]).filter(function(o){
    return o.campus===who.campus && Number(o.quarter)===qNow && depts.indexOf(o.dept)>-1;
  });

  if(!theirs.length && !(mine && S.okrForm)){
    h += '<div class="card"><p class="sub" style="margin:0">'+
      esc(t(mine ? 'No objectives set for your department this quarter.'
                 : 'No objectives set for their department this quarter.'))+'</p></div>';
  }
  if(theirs.length){
    if(theirs.length>1){
      S.okrIdx = Math.max(0, Math.min(S.okrIdx||0, theirs.length-1));
      h += '<div class="weekNavRow" style="margin-bottom:8px">'+
        '<button class="weekArrow" id="okrPrev" aria-label="'+esc(t('Previous'))+'"'+(S.okrIdx<=0?' disabled':'')+'>‹</button>'+
        '<div class="weekPill">'+esc(gpT('{n} of {total}',{n:S.okrIdx+1,total:theirs.length}))+'</div>'+
        '<button class="weekArrow" id="okrNext" aria-label="'+esc(t('Next'))+'"'+(S.okrIdx>=theirs.length-1?' disabled':'')+'>›</button>'+
      '</div>';
    }
    var shown = theirs.length>1 ? theirs[S.okrIdx] : theirs[0];
    /* Edit/delete only on your OWN department's objective — the server
       refuses a write against a department you merely oversee, same as
       writing its ministries' KPIs numbers goes through a different,
       explicitly-authorized path (saveMinistryFor), not this one. */
    h += okrCardHtml(shown, R, mine && shown.dept===dept);
  }

  if(mine){
    if(S.okrForm){
      var editing = null;
      if(S.okrEditId) theirs.forEach(function(o){ if(o.id===S.okrEditId) editing=o; });
      h += okrFormHtml(editing);
    } else {
      h += '<button class="btn ghost" id="okrNewBtn">+ '+esc(t('New objective'))+'</button>';
    }
  }

  if(theirs.length){
    h += '<p class="hint">'+esc(t('Progress comes from what your ministry logs each week, not from ticking a box here.'))+'</p>';
  }
  return h;
}

/* Writing an objective. The server re-checks everything: it takes the campus and
   department from the staff record rather than from this payload, and refuses an
   id that belongs to another department. So the worst a bad request here can do
   is fail. */
function okrSave(btn){
  var text = (document.getElementById('okrObjText').value||'').trim();
  if(!text){ showMsg(t('Give the objective a name first.')); return; }
  var krs = [];
  for(var k=0;k<3;k++){
    var tx = (document.getElementById('okrKrText'+k).value||'').trim();
    if(!tx) continue;
    krs.push({ text:tx,
      metricKey: document.getElementById('okrKrMetric'+k).value,
      target: Number(document.getElementById('okrKrTarget'+k).value)||0,
      manual: 0 });
  }
  if(!krs.length){ showMsg(t('Add at least one key result.')); return; }

  /* Keep the hand-tracked percentages already entered: the form does not show
     them, so re-saving an objective must not silently reset them to zero. */
  if(S.okrEditId){
    (S.base.okrs||[]).forEach(function(o){
      if(o.id!==S.okrEditId) return;
      krs.forEach(function(nk){
        if(nk.metricKey) return;
        (o.krs||[]).forEach(function(ok){
          if(ok.text===nk.text && !ok.metricKey) nk.manual = Number(ok.manual)||0;
        });
      });
    });
  }

  var myDept = S.me.dept==='Base Director' ? 'Base Leadership' : S.me.dept;
  var obj = {
    id: S.okrEditId || ('o'+Date.now()),
    campus: S.me.campus,
    quarter: Math.min(4, Math.floor((thisWeek()-1)/13)+1),
    dept: myDept,
    objective: text,
    krs: krs
  };
  btn.disabled = true; btn.textContent = t('Saving…');
  run('saveObjective', [obj, '', S.auth.user, S.auth.pin], function(d){
    // saveObjective answers with the whole getData payload; if it didn't, the
    // write was refused, so say so rather than blanking the page.
    if(d && d.entries){ S.base = d; S.okrForm = false; S.okrEditId = null; showMsg(t('Saved')); }
    else { btn.disabled = false; btn.textContent = t('Save changes'); showMsg(t('That didn’t save — try again.')); }
    render();
  });
}

function okrDelete(id){
  run('deleteObjective', [id, '', S.auth.user, S.auth.pin], function(d){
    if(d && d.entries){ S.base = d; S.okrForm = false; S.okrEditId = null; }
    else showMsg(t('That didn’t save — try again.'));
    render();
  });
}

/* A hand-tracked key result is the one number a person moves themselves, so it
   saves on change rather than making them open the form for it. */
function okrSetManual(id, index, pct){
  var target = null;
  (S.base.okrs||[]).forEach(function(o){ if(o.id===id) target=o; });
  if(!target || !target.krs || !target.krs[index]) return;
  var copy = {
    id: target.id, campus: target.campus, quarter: target.quarter,
    dept: target.dept, objective: target.objective,
    krs: target.krs.map(function(kr, i){
      return { text:kr.text, metricKey:kr.metricKey||'',
        target:Number(kr.target)||0,
        manual: i===index ? Math.max(0, Math.min(100, Number(pct)||0)) : (Number(kr.manual)||0) };
    })
  };
  run('saveObjective', [copy, '', S.auth.user, S.auth.pin], function(d){
    if(d && d.entries){ S.base = d; showMsg(t('Saved')); }
    else showMsg(t('That didn’t save — try again.'));
    render();
  });
}

/* The app knows what day it is. Monday you're setting goals, midweek you're
   keeping habits, Friday you're closing the week out — so the card that matters
   today sits at the top instead of the same fixed wall every day. */
function weekPhase(){
  var dow=new Date().getDay();               // 0 Sun … 6 Sat
  if(dow===1||dow===2) return 'plan';
  if(dow===5||dow===6||dow===0) return 'review';
  return 'work';
}
function phaseBanner(phase, wk){
  var rec=goalsForWeek(wk);
  var hasGoals=!!(rec && rec.items.some(function(i){return i.text;}));

    return '<div class="banner big">🎯 <strong>Start of the week.</strong> Pick the three things that matter for week '+wk+'.'+
      ' <button class="linkbtn inline" id="jumpGoals">Set them now</button></div>';
  if(phase==='review'){
    var avgPct=hasGoals && rec.pct!==null ? rec.pct : 0;

  return '';
}

   stored — there's no separate "seen/unseen" tracking, just what's recent. */
function notifActionBtnsHtml_(okAttr, okId, noAttr, noId, okLabel, noLabel){
  return '<span class="chips" style="margin:0">'+
    '<button class="linkbtn" style="width:auto;margin:0;padding:6px 10px" data-'+okAttr+'="'+esc(okId)+'">'+esc(okLabel)+'</button>'+
    '<button class="linkbtn" style="width:auto;margin:0;padding:6px 10px;color:var(--faint)" data-'+noAttr+'="'+esc(noId)+'">'+esc(noLabel)+'</button>'+
  '</span>';
}
/* A little inbox, not a wall of cards: things waiting on you (a mentee's
   leave request, an incoming 1-on-1) get inline Approve/Deny or Accept/
   Decline right here — same handlers the full Leave Request page and the
   Mentorship card already use — so acting on one doesn't require leaving
   the dashboard. Everything else here is just FYI, no action needed. */
function notificationsHtml(){
  var items=[];
  (S.tripRequests||[]).forEach(function(r){
    var range=r.from+(r.to!==r.from?' → '+r.to:'');
    items.push({ when:r.from, text: gpT('{name} requested leave {range}', {name:r.name, range:range}),
      actions: notifActionBtnsHtml_('trok', r.id, 'trno', r.id, t('Approve'), t('Deny')) });
  });
  (S.oneOnOnes||[]).forEach(function(o){
    if(!o.mine && o.status==='pending'){
      items.push({ when:o.created, text: gpT('{name} requested a 1-on-1', {name:o.otherName}),
        actions: notifActionBtnsHtml_('121accept', o.id, '121decline', o.id, t('Accept'), t('Decline')) });
    } else if(o.mine && o.status==='accepted'){
      items.push({ when:o.decidedAt||o.created, text: gpT('{name} accepted your 1-on-1 request', {name:o.otherName}) });
    } else if(o.mine && o.status==='declined'){
      items.push({ when:o.decidedAt||o.created, text: gpT('{name} declined your 1-on-1 request', {name:o.otherName}) });
    }
  });
  (S.trips && S.trips.trips || []).forEach(function(r){
    var range=r.from+(r.to!==r.from?' → '+r.to:'');
    if(r.status==='approved'){
      items.push({ when: r.decidedAt||r.from, text: gpT('Your {range} leave request was approved', {range:range}) });
    } else if(r.status==='declined'){
      items.push({ when: r.decidedAt||r.from, text: gpT('Your {range} leave request was declined', {range:range}) });
    }
  });
  if(!items.length) return '';
  items.sort(function(a,b){ return (b.when||'')<(a.when||'')?-1:1; });
  var h='<div class="card"><div class="goalCardTitle" style="margin-bottom:8px">🔔 '+esc(t('Updates'))+'</div>';
  items.slice(0,5).forEach(function(it){
    h+='<div class="row"><span class="rowName">'+esc(it.text)+'</span>'+(it.actions||'')+'</div>';
  });
  return h+'</div>';
}

/* --- three weekly goals --- */
/* ---- goal progress: percentage, not a tick ----
   goalItemPct reads either shape, because rows written before this stored `done`.
   The colour walks amber → blue → green as the number climbs, so a row's state is
   legible before you read the digits; the word underneath says the same thing for
   anyone who cannot pick those colours apart. */
function goalItemPct(g){
  if(!g) return 0;
  var n = Number(g.pct);
  if(g.pct!==undefined && g.pct!==null && g.pct!=='' && isFinite(n)) return Math.max(0, Math.min(100, Math.round(n)));
  return g.done ? 100 : 0;
}

          '<input type="range" class="gSlide" min="0" max="100" step="5" value="'+gp+'" data-goalpct="'+i+'"'+

       esc(t('No goals set for this week yet. Three is the whole point — pick the three that matter.'))+'</p>';

  if(written.length && rec && rec.pct!==null){
    h+='<button class="linkbtn" id="shareWeek">'+esc(t('Share my week'))+'</button>';

    h+='<div class="addGoalRow">'+
      '<input type="text" class="addGoalInput" id="newGoalText" maxlength="200" placeholder="'+esc(t('Add a goal for this week…'))+'">'+

    '</div>';
  }

  h+='</div>';
  return h;
}

/* --- your ministry's KPIs, editable without leaving this page --- */
/*  Everything the dashboard's log form asks of this ministry, on the person's
    own page — and split the way the numbers actually behave, because one box
    cannot serve both kinds:

      · counts (sum mode) — something that happened today. Typed per day; the
        server rolls the days into the week, so the weekly figure is never typed
        twice. The box is today's addition, and it says what the week becomes.
      · levels and scores (latest / avg) — a headcount or a 1-10 judgement about
        the whole week. Typed once for the week, and carried forward already
        filled in from the last week that has one, exactly as the dashboard does
        it, so nobody retypes 280 students every Monday.

    A level must never be written as a daily row: a headcount is not something you
    add up, and the daily roll-up owns any metric it touches (see CLAUDE.md), so
    the two would fight over the same weekly cell.

    Formats come from fmt() and modeOf() — the same two functions the dashboard
    uses — so a dollar figure, a 1-10 score and a percentage read the same in both
    places. */
function kpiCardHtml(wk){
  if(!S.me.ministry){
    return '<div class="card"><p class="sub" style="margin:4px 0 10px">'+
      'Set your ministry on the Profile tab and your team’s KPIs will show up here, ready to log.</p>'+
      '<button class="btn ghost" id="goProfile">Choose my ministry</button></div>';
  }
  var metrics=metricsFor(S.me.campus, S.me.dept, S.me.ministry);
  if(!metrics.length){
    return '<div class="card"><p class="sub" style="margin:4px 0">'+
      'No KPIs are defined for '+esc(S.me.ministry)+' yet.</p></div>';
  }
  var entries=(S.ministry&&S.ministry.entries)||{};
  var daily=(S.ministry&&S.ministry.daily)||{};
  var pins=(S.ministry&&S.ministry.pins)||[];
  var today=todayStr();
  var isCurWk=Number(wk)===Number(thisWeek());
  /* Backfilling a past week doesn't have a "today" — daily sum-type numbers
     for that week land on its last day, same as the week's own total is one
     figure rather than a day-by-day breakdown in the section below. */
  var entryDate = kpiEntryDate_(wk);

  var counts=metrics.filter(function(m){ return modeOf(m)==='sum'; });
  var levels=metrics.filter(function(m){ return modeOf(m)!=='sum'; });

  /* Pins are about the daily list only — how many boxes you face every day. A
     level carries itself forward, so hiding one saves nobody any typing. */
  var pinnedCounts=pins.filter(function(m){ return counts.indexOf(m)>-1; });
  var showing = (pinnedCounts.length && !S.kpiAll)
    ? counts.filter(function(m){ return pinnedCounts.indexOf(m)>-1; })
    : counts;
  var hiddenN = counts.length - showing.length;

  var h='';

  if(S.kpiPick){
    h+='<div class="card">';
    h+='<p class="sub" style="margin:2px 0 8px">Star the ones you log most days — '+
       'the rest stay one tap away under “show all”.</p>';
    counts.forEach(function(metric){
      var on=pins.indexOf(metric)>-1;
      h+='<div class="habitPick">'+
        '<button class="hpBox'+(on?' on':'')+'" data-kpipin="'+esc(metric)+'">'+(on?'★':'')+'</button>'+
        '<span class="hpLabel">'+esc(t(metric))+'</span></div>';
    });
    return h+'<button class="btn" id="saveKpiPins" style="margin-top:12px">Done</button></div>';
  }

  /* ---- what happened today / what is true of the whole week ----
     Collapsed by default: these boxes are useful when you have numbers to
     log, but sitting open on every visit to My Database pushes everything
     else below the fold. */
  h += '<div class="card">'+
    '<div class="weekNavLabel">'+esc(t('Week'))+'</div>'+
    '<div class="weekNavRow">'+
      '<button class="weekArrow" id="kpiPrevWeek" aria-label="'+esc(t('Previous week'))+'"'+(wk<=1?' disabled':'')+'>‹</button>'+
      '<div class="weekPill">'+esc(weekRangeLabel_(wk))+
        '<span class="currentTag'+(isCurWk?' on':'')+'">'+esc(t('Current Week'))+'</span></div>'+
      '<button class="weekArrow" id="kpiNextWeek" aria-label="'+esc(t('Next week'))+'"'+(wk>=52?' disabled':'')+'>›</button>'+
    '</div>'+
    (isCurWk?'':'<button class="linkbtn" style="padding:6px 0 0" id="kpiJumpCurrent">'+esc(t('Jump back to this week'))+'</button>')+
  '</div>';
  h += '<div class="accCard">';

  if(counts.length){
    var dayTitle = isCurWk ? t('Today') : entryDate;
    var daySummary = isCurWk ? gpT('{n} to log today', {n: showing.length})
      : gpT('{n} to log for {range}', {n: showing.length, range: weekRangeShort_(wk)});
    h += accRowHtml('dbAcc', 'kpiDay', esc(dayTitle), daySummary, function(){
      var b = '<div id="kpiDayCard">';
      b += '<p class="sub" style="margin:4px 0 10px">'+
        (isCurWk
          ? esc(gpT('Log today’s numbers — week {wk} adds up on its own.',{wk:wk}))
          : esc(gpT('Backfilling week {wk} — this lands on {date}.',{wk:wk, date:entryDate})))+
        '</p>';
      showing.forEach(function(metric){
        var days=daily[metric]||{};
        var savedToday = days[entryDate];
        var cur = S.kpiDraft[metric]!==undefined ? S.kpiDraft[metric]
          : (savedToday!==undefined ? savedToday : '');
        var weekVal=(entries[metric]||{})[String(wk)];
        /* What the week is without today, so the running total below the box adds
           up to the week's real figure rather than counting today twice. */
        var base = (weekVal===undefined?0:Number(weekVal)) - (savedToday===undefined?0:Number(savedToday));
        /* Last week next to this one, because "is the cafe up or down" is the
           question anyone typing the number is really asking. */
        b+='<div class="row"><div><div class="rowName">'+esc(t(metric))+'</div>'+
          '<div class="rowSub">'+esc(t('week total'))+' '+fmt(weekVal===undefined?null:Number(weekVal), metric)+
          gpVsLastWeek(entries[metric], wk, metric, weekVal)+
          '<span class="newTot"></span></div></div>'+
          '<input type="number" inputmode="decimal" class="kpiIn" placeholder="+0" data-kpi="'+esc(metric)+
          '" data-metric="'+esc(metric)+'" data-mode="sum" data-run="'+base+
          '" data-kpimode="sum" value="'+esc(String(cur))+'"></div>';
      });
      b+='<button class="btn" id="saveKpiBtn">'+esc(t('Save today'))+'</button>';
      if(hiddenN>0) b+='<button class="linkbtn" id="kpiShowAll">'+esc(gpT('Show all {total} ({hidden} hidden)',{total:counts.length,hidden:hiddenN}))+'</button>';
      else if(pinnedCounts.length && S.kpiAll) b+='<button class="linkbtn" id="kpiShowLess">Show just my '+pinnedCounts.length+'</button>';
      b+='<button class="linkbtn" id="pickKpis">'+esc(t(pinnedCounts.length?'Change which I log daily':'Pick the ones I log daily'))+'</button>';
      return b+'</div>';
    });
  }

  if(levels.length){
    var weekSummary = gpT('{n} for {range}', {n: levels.length, range: weekRangeShort_(wk)});
    h += accRowHtml('dbAcc', 'kpiWeek', esc(t('This week')), weekSummary, function(){
      var b = '<div id="kpiWeekCard">';
      b += '<p class="sub" style="margin:4px 0 10px">'+
        esc(t('Headcounts and scores for the week. The ones that rarely change are already filled in from last time — only change what changed.'))+'</p>';
      levels.forEach(function(metric){
        var mode=modeOf(metric);
        var wks=entries[metric]||{};
        var agg=aggregate(wks, mode);
        var cur = wks[String(wk)]!==undefined ? wks[String(wk)] : '';
        var carried=false;
        var sub='', extra='';
        if(mode==='latest'){
          var prev=lastBefore(wks, wk);
          carried = (cur==='' && prev!==null);
          if(carried){ cur=prev.value; extra=' data-carried="1"'; }
          sub = esc(t('now'))+' '+fmt(agg, metric);
          if(prev!==null){
            sub += ' · ' + (carried
              ? esc(t('carried from week'))+' '+prev.week
              : esc(t('week'))+' '+prev.week+': '+fmt(prev.value, metric));
            var typed = S.kpiWeekDraft[metric]!==undefined ? Number(S.kpiWeekDraft[metric]) : Number(cur);
            var d = typed - prev.value;
            if(d && !isNaN(d)) sub += '<span class="trend '+(d>0?'up':'down')+'">'+(d>0?'▲':'▼')+' '+fmt(Math.abs(d), metric)+'</span>';
          }
        } else {
          // A year-to-date average hides which way this week went, so say that too.
          var thisWk = wks[String(wk)];
          sub = esc(t('avg'))+' '+fmt(agg, metric)+
            gpVsLastWeek(wks, wk, metric, S.kpiWeekDraft[metric]!==undefined ? S.kpiWeekDraft[metric] : thisWk);
        }
        if(S.kpiWeekDraft[metric]!==undefined) cur=S.kpiWeekDraft[metric];
        b+='<div class="row"><div><div class="rowName">'+esc(t(metric))+'</div>'+
          '<div class="rowSub">'+sub+'</div></div>'+
          '<input type="number" inputmode="decimal" class="kpiIn"'+kpiInputAttrs_(metric)+
          ' data-kpiweek="'+esc(metric)+'" value="'+esc(String(cur))+'"'+extra+'></div>';
      });
      b+='<button class="btn" id="saveKpiWeekBtn">'+esc(t('Save Week'))+' '+wk+'</button>';
      return b+'</div>';
    });
  }

  h += '</div>';
  return h;
}

/* A ministry you oversee but don't work in day-to-day — so unlike your own
   ministry (kpiCardHtml, which keeps the daily Today log), there's no daily
   entry here at all: everything is one number a week, addressed by an
   explicit dept+ministry and keyed by ministry name in every piece of state
   and every data-* attribute so a department overseer can have several of
   these open on one page (one per ministry they oversee) without one's
   draft or week pointer clobbering another's.

   A count metric (Salvations, Teams Hosted…) is normally built up from the
   ministry's own daily logging (see kpiCardHtml/saveMyKpiDay) — this box
   is a direct overwrite of that week's total instead, for a week nobody on
   the team logged day by day. If the team later does log days for that same
   week, their daily rollup takes the week back over, the same way a
   hand-typed weekly Health check-in only holds until fresher daily logs
   roll a week up on their own.

   Saves go through saveMinistryFor, the same authorization the server
   enforces everywhere else (own ministry, or a department you lead). No
   pin-picking here: hiding a count saves nobody's time when you are not the
   one filling it in most days. */
function oversightKpiCardHtml_(dept, ministry, data){
  var wk = ovWeekFor_(ministry);
  var metrics = metricsFor(S.me.campus, dept, ministry);
  if(!metrics.length){
    return '<div class="card"><p class="sub" style="margin:4px 0">'+
      esc(gpT('No KPIs are defined for {ministry} yet.',{ministry:t(ministry)}))+'</p></div>';
  }
  var entries=(data&&data.entries)||{};
  var isCurWk=Number(wk)===Number(thisWeek());
  var weekDraft = S.ovWeekDraft[ministry] || (S.ovWeekDraft[ministry]={});

  var h='<div class="card">'+
    '<div class="weekNavLabel">'+esc(t('Week'))+'</div>'+
    '<div class="weekNavRow">'+
      '<button class="weekArrow" data-ovprev="'+esc(ministry)+'" aria-label="'+esc(t('Previous week'))+'"'+(wk<=1?' disabled':'')+'>‹</button>'+
      '<div class="weekPill">'+esc(weekRangeLabel_(wk))+
        '<span class="currentTag'+(isCurWk?' on':'')+'">'+esc(t('Current Week'))+'</span></div>'+
      '<button class="weekArrow" data-ovnext="'+esc(ministry)+'" aria-label="'+esc(t('Next week'))+'"'+(wk>=52?' disabled':'')+'>›</button>'+
    '</div>'+
    (isCurWk?'':'<button class="linkbtn" style="padding:6px 0 0" data-ovjump="'+esc(ministry)+'">'+esc(t('Jump back to this week'))+'</button>')+
  '</div>';
  h += '<div class="accCard">';

  var weekSummary = gpT('{n} for {range}', {n: metrics.length, range: weekRangeShort_(wk)});
  h += accRowHtml('ovAcc', ministry+'|week', esc(t('This week')), weekSummary, function(){
    var b = '<div>';
    b += '<p class="sub" style="margin:4px 0 10px">'+
      esc(t('Logged weekly only — day by day belongs to the ministry’s own team on their My Ministry page. The ones that rarely change are already filled in from last time.'))+'</p>';
    metrics.forEach(function(metric){
      var mode=modeOf(metric);
      var wks=entries[metric]||{};
      var cur = wks[String(wk)]!==undefined ? wks[String(wk)] : '';
      var carried=false;
      var sub='', extra='';
      if(mode==='latest'){
        var agg=aggregate(wks, mode);
        var prev=lastBefore(wks, wk);
        carried = (cur==='' && prev!==null);
        if(carried){ cur=prev.value; extra=' data-carried="1"'; }
        sub = esc(t('now'))+' '+fmt(agg, metric);
        if(prev!==null){
          sub += ' · ' + (carried
            ? esc(t('carried from week'))+' '+prev.week
            : esc(t('week'))+' '+prev.week+': '+fmt(prev.value, metric));
          var typed = weekDraft[metric]!==undefined ? Number(weekDraft[metric]) : Number(cur);
          var d = typed - prev.value;
          if(d && !isNaN(d)) sub += '<span class="trend '+(d>0?'up':'down')+'">'+(d>0?'▲':'▼')+' '+fmt(Math.abs(d), metric)+'</span>';
        }
      } else if(mode==='sum'){
        // A count is this week's own figure here, not a running daily total.
        sub = esc(t('week total'))+' '+fmt(cur===''?null:Number(cur), metric)+
          gpVsLastWeek(wks, wk, metric, weekDraft[metric]!==undefined ? weekDraft[metric] : cur);
      } else {
        var agg2=aggregate(wks, mode);
        sub = esc(t('avg'))+' '+fmt(agg2, metric)+
          gpVsLastWeek(wks, wk, metric, weekDraft[metric]!==undefined ? weekDraft[metric] : cur);
      }
      if(weekDraft[metric]!==undefined) cur=weekDraft[metric];
      b+='<div class="row"><div><div class="rowName">'+esc(t(metric))+'</div>'+
        '<div class="rowSub">'+sub+'</div></div>'+
        '<input type="number" inputmode="decimal" class="kpiIn"'+kpiInputAttrs_(metric)+
        ' data-ovweek="'+esc(ministry)+'" data-ovmetric="'+esc(metric)+'" value="'+esc(String(cur))+'"'+extra+'></div>';
    });
    b+='<button class="btn" data-ovsaveweek="'+esc(ministry)+'">'+esc(t('Save Week'))+' '+wk+'</button>';
    return b+'</div>';
  });

  h += '</div>';
  return h;
}

/* A 1-10 score and a percentage have edges; a phone keypad should know about
   them. Same rules the metric names already carry, read the same way fmt() reads
   them, so nothing new has to be kept in step. */
function kpiInputAttrs_(metric){
  if(metric.indexOf('(1-10)')>-1) return ' min="1" max="10" step="1"';
  if(metric.indexOf('(%)')>-1) return ' min="0" max="100"';
  return '';
}

/*  Two facts the base counts people by: what kind of staff you are, and where you

function countryFieldHtml(id, current){

/* ---------- me ---------- */
/* Me is the looking-back page: streaks, this week's totals, recent days,
   settings. Home already greets you and carries today's actions, so the
   identity card isn't repeated here — only the per-habit streaks Home
   doesn't show. */
/* ---------- Health: my weekly check-in, my history, the base average ----------
   The eleven weekly questions, filled in by hand. Daily logging turned out not to
   be sustainable, so this is the primary way a week gets answered; the daily
   roll-up still works for anyone who does log days, and a week answered here
   wins over one inferred from days (see saveMyWeek in api.js).

   Either way it is ONE row per person per week, keyed by their survey token — so
   the two paths cannot double-count anybody.

   Who sees what, which is the whole point of the token:
     - the base average pools rows that carry a token and never a name, so
       anything base-wide is anonymous by construction;
     - only the person's own record maps that token back to them, which is how
       their ONE approved mentor — and nobody else — sees these answers by name.
   Leadership reads the base total. It does not read this. */
var WEEK_SCALE_QS = [
  { id:'lonely',  text:'How lonely do I feel this week?', higherBetter:false, lowLabel:'1 · Very connected', highLabel:'10 · Very lonely' },
  { id:'clarity', text:'How clear am I on what to work on this week?', higherBetter:true, lowLabel:'1 · Unclear', highLabel:'10 · Very clear' },
  { id:'growth',  text:'How would I rate my personal growth this week?', higherBetter:true, lowLabel:'1 · Stagnant', highLabel:'10 · Thriving' }
];
var WEEK_YESNO_QS = [
  { id:'porn',        text:'Did I look at porn this week?', higherBetter:false },
  { id:'oneOnOne',    text:'Did I have a one-on-one this week?', higherBetter:true },
  { id:'exercise',    text:'Did I exercise at least 3 days this week?', higherBetter:true },
  { id:'quietTime',   text:'Did I have regular quiet times this week?', higherBetter:true },
  { id:'debt',        text:'Do I have staff debt?', higherBetter:false },
  { id:'sharedFaith', text:'Did I share my faith with someone this week?', higherBetter:true },
  { id:'sabbath',     text:'Did I take a sabbath this week?', higherBetter:true }
];
var WEEK_NUM_QS = [
  { id:'langHours', text:'Hours spent on language study this week' },
  { id:'minHours',  text:'Hours doing ministry in the local community this week' }
];

function myWeekRow(wk){
  for(var i=0;i<(S.checkins||[]).length;i++){
    if(Number(S.checkins[i].week)===Number(wk)) return S.checkins[i];
  }
  return null;
}

/* The draft starts from whatever is already answered for that week, so opening a
   filled-in week shows your answers rather than a blank form. */
function weekDraftFor(wk){
  if(S.weekDraftFor===Number(wk) && S.weekDraft) return S.weekDraft;
  var row = myWeekRow(wk), d = {};
  if(row){
    WEEK_SCALE_QS.concat(WEEK_NUM_QS).forEach(function(q){
      if(row[q.id]!==null && row[q.id]!==undefined) d[q.id]=Number(row[q.id]);
    });
    WEEK_YESNO_QS.forEach(function(q){
      if(row[q.id]!==null && row[q.id]!==undefined) d[q.id]=row[q.id]?1:0;
    });
  }
  S.weekDraftFor = Number(wk); S.weekDraft = d;
  return d;
}

/* ▲/▼ against the week before, per question — the progress-or-regress the old
   dashboard showed, but about your own answers rather than the base's. */
function myTrend(wk, id, higherBetter, asPct){
  var now = myWeekRow(wk), prev = myWeekRow(Number(wk)-1);
  if(!now || !prev) return '';
  var a = Number(prev[id]), b = Number(now[id]);
  if(isNaN(a) || isNaN(b)) return '';
  if(asPct){
    if(a===b) return trendBadge(0, higherBetter);
    return trendBadge(b>a?100:-100, higherBetter);
  }
  return trendBadge(pctChange(a,b), higherBetter);
}

/* Sending the week. Every 1-10 question has to be answered — a composite built
   on gaps would be worse than no score at all. The server checks the same thing. */
function weekSubmit(btn){
  var wk = Number(S.healthWeek || thisWeek());
  var d = weekDraftFor(wk);
  var missing = WEEK_SCALE_QS.filter(function(q){ return d[q.id]===undefined; });
  if(missing.length){
    showMsg(t('Answer the 1-10 questions first.'));
    return;
  }
  var payload = {};
  WEEK_SCALE_QS.forEach(function(q){ payload[q.id] = Number(d[q.id]); });
  WEEK_NUM_QS.forEach(function(q){ payload[q.id] = Number(d[q.id])||0; });
  WEEK_YESNO_QS.forEach(function(q){ payload[q.id] = d[q.id]===1; });

  btn.disabled = true; btn.textContent = t('Saving…');
  run('saveMyWeek', [S.auth.user, S.auth.pin, wk, payload], function(res){
    if(res && res.ok){
      S.checkins = res.checkins || [];
      S.weekForm = null; S.weekDraft = null; S.weekDraftFor = null;
      showMsg(t('Saved'));
      /* The base total includes this now, so pull it fresh rather than showing a
         stale average next to a figure that just changed. */
      run('getData', [''], function(dd){ if(dd && dd.entries) S.base = dd; render(); });
    } else {
      btn.disabled = false; btn.textContent = t('Submit my check-in');
      showMsg(t('That didn’t save — try again.'));
      render();
    }
  });
}

function weekClear(){
  var wk = Number(S.healthWeek || thisWeek());
  run('deleteMyWeek', [S.auth.user, S.auth.pin, wk], function(res){
    if(res && res.ok){
      S.checkins = res.checkins || [];
      S.weekDraft = null; S.weekDraftFor = null;
      run('getData', [''], function(dd){ if(dd && dd.entries) S.base = dd; render(); });
    } else { showMsg(t('That didn’t save — try again.')); render(); }
  });
}

function leaveTypeLabel_(type){
  return type==='special' ? 'Special Condition' : type==='outside' ? 'Working Outside Siem Reap' : 'Personal Time Off';
}
function leaveWorkDays_(from,to){
  var a=new Date(from+'T00:00:00Z'), b=new Date(to+'T00:00:00Z');
  var n=0;
  for(var d=new Date(a); d<=b; d.setUTCDate(d.getUTCDate()+1)){
    var dow=d.getUTCDay();
    if(dow!==0 && dow!==6) n++;
  }
  return n;
}
