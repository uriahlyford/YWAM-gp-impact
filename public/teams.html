<style>
@import url('https://fonts.googleapis.com/css2?family=Koulen&family=Kantumruy+Pro:wght@400;500;700&display=swap');
* { box-sizing:border-box; margin:0; }
html { overscroll-behavior:none; }
body { background:#FAF6F0; color:#17150F; font-family:'Kantumruy Pro',system-ui,sans-serif; padding-bottom:76px; overscroll-behavior:none; overflow-x:hidden; -webkit-text-size-adjust:100%; }
button, select, input { font-family:inherit; }
input:focus, select:focus, button:focus-visible { outline:3px solid #1F44FF; outline-offset:1px; }

header { background:#17150F; color:#FAF6F0; padding:16px; display:flex; justify-content:space-between; align-items:center; }
.brand { display:flex; align-items:center; gap:10px; }
.brandKh { font-family:'Koulen',sans-serif; font-size:22px; letter-spacing:1px; line-height:1; }
.brandEn { font-size:9px; letter-spacing:3px; color:#FFB323; font-weight:700; }
.hbtns { display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
.hbtn { border:1px solid #4a463d; background:transparent; color:#FAF6F0; border-radius:999px; padding:6px 12px; font-size:13px; cursor:pointer; }

main { padding:18px 16px; max-width:640px; margin:0 auto; }
h2 { font-family:'Koulen',sans-serif; font-size:24px; letter-spacing:.5px; margin:0 0 4px; }
h2 small { font-family:'Kantumruy Pro',sans-serif; font-size:14px; color:#6b6557; font-weight:400; }
h3 { font-family:'Koulen',sans-serif; font-size:16px; letter-spacing:.5px; margin:22px 0 8px; }
.sub { font-size:13px; color:#6b6557; margin-bottom:16px; line-height:1.5; }

.card { background:#fff; border:1px solid #e4ddd0; border-radius:12px; padding:14px; margin-bottom:12px; }
label.f { display:block; font-size:11px; letter-spacing:1.5px; font-weight:700; color:#6b6557; text-transform:uppercase; margin:12px 0 4px; }
label.f:first-child { margin-top:0; }
input[type=text], input[type=tel], input[type=number], input[type=password], select {
  width:100%; font-size:15px; padding:11px; border-radius:10px; border:1.5px solid #17150F; background:#fff; color:#17150F; }
.hint { font-size:11.5px; color:#a39c8d; margin-top:4px; }
.lock { color:#c98700; font-size:11px; font-weight:700; }

.btn { width:100%; margin-top:16px; padding:13px; font-family:'Koulen',sans-serif; font-size:18px; letter-spacing:1px;
  background:#1F44FF; color:#fff; border:none; border-radius:12px; cursor:pointer; transition:transform .08s ease; }
.btn:active { transform:scale(.97); }
.btn:disabled { opacity:.6; }
.btn.ghost { background:transparent; color:#17150F; border:1.5px solid #17150F; font-size:14px; font-family:'Kantumruy Pro',sans-serif; }
.linkbtn { background:none; border:none; color:#1F44FF; font-size:14px; cursor:pointer; text-decoration:underline; padding:8px; width:100%; margin-top:8px; }
.danger { background:none; border:none; color:#a33; font-size:13px; cursor:pointer; padding:8px; }

.row { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid #f0eadf; }
.row:last-child { border-bottom:none; }
.rowName { font-size:14.5px; line-height:1.3; }
.rowVal { font-family:'Koulen',sans-serif; font-size:18px; color:#1F44FF; white-space:nowrap; }
.qBlock { padding:12px 0; border-bottom:1px solid #f0eadf; }
.qBlock:last-of-type { border-bottom:none; }
.qText { font-size:14.5px; margin-bottom:8px; line-height:1.35; }
.seg { display:flex; gap:8px; }
.seg button { flex:1; padding:10px; border-radius:10px; border:1.5px solid #c9c3b6; background:#FAF6F0; font-size:15px; cursor:pointer; }
.seg button.on { background:#1F44FF; border-color:#1F44FF; color:#fff; font-weight:700; }
.seg button.on.bad { background:#a33; border-color:#a33; }
.scale { display:flex; gap:4px; flex-wrap:wrap; }
.scale button { width:36px; height:36px; border-radius:9px; border:1.5px solid #c9c3b6; background:#FAF6F0; font-size:13px; cursor:pointer; }
.scale button.on { background:#1F44FF; border-color:#1F44FF; color:#fff; font-weight:700; }
.numIn { display:flex; align-items:center; gap:10px; }
.numIn input { width:110px; text-align:right; border:1.5px solid #c9c3b6; background:#FAF6F0; }

.pcard { display:flex; align-items:center; gap:14px; }

.avatar.lg { width:96px; height:96px; }

.pmeta { font-size:13px; color:#6b6557; margin-top:2px; }

.chips { display:flex; gap:8px; flex-wrap:wrap; margin:6px 0 4px; }
.chip { background:#FFF1D6; border:1px solid #ffd98a; color:#17150F; border-radius:999px; padding:5px 12px; font-size:13px; font-weight:700; }
.chip.blue { background:#e8ecff; border-color:#b9c4ff; }

.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:10px; }
.stat { background:#fff; border:1px solid #e4ddd0; border-radius:12px; padding:12px; }
.statNum { font-family:'Koulen',sans-serif; font-size:26px; color:#1F44FF; line-height:1.1; }
.statLabel { font-size:11.5px; color:#6b6557; margin-top:2px; line-height:1.3; }

/* the base hero — same black card and amber figures as the dashboard, because

.heroLabel { font-size:11px; letter-spacing:2.6px; color:#FFB323; font-weight:700; }
.heroNum { font-family:'Koulen',sans-serif; font-size:50px; line-height:1.05; color:#FFB323; }
.heroTrend { margin-top:5px; font-size:13px; color:#c9c3b6; }
.heroFig { font-family:'Koulen',sans-serif; font-weight:400; color:#FAF6F0; font-size:16px; }
.heroSub { border-top:1px solid #3a352b; margin-top:13px; padding-top:10px; }
.heroSubRow { display:flex; align-items:baseline; gap:8px; }
.heroSubLabel { font-size:11px; letter-spacing:2.2px; color:#FFB323; font-weight:700; }
.heroSubNum { font-family:'Koulen',sans-serif; font-size:29px; line-height:1; color:#FAF6F0; margin-left:auto; }
.heroQ { display:flex; gap:13px; flex-wrap:wrap; margin-top:6px; font-size:13px; color:#c9c3b6; }
.heroQ b { color:#FAF6F0; font-family:'Koulen',sans-serif; font-weight:400; }
.mine { border-color:#1F44FF !important; box-shadow:0 0 0 1px #1F44FF inset; }

.dir { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; }
.dircard { background:#fff; border:1px solid #e4ddd0; border-radius:12px; padding:14px; text-align:center; cursor:pointer; }
.dircard .avatar { margin:0 auto 8px; }
.dircard .pname { font-size:16px; }

nav.bottom { position:fixed; bottom:0; left:0; right:0; background:#fff; border-top:1px solid #e4ddd0;

nav.bottom button { flex:1; padding:10px 2px 8px; background:none; border:none; cursor:pointer; color:#6b6557; font-size:10.5px; }

nav.bottom button.on { color:#1F44FF; font-weight:700; }

.banner { background:#FFF1D6; border:1px solid #ffd98a; border-radius:10px; padding:11px 13px; font-size:13px; line-height:1.45; color:#5c4a1e; margin-bottom:14px; }

.privateWrap .qBlock { border-color:#f4e7c8; }

/* weekly goals */
.pctBig { font-family:'Koulen',sans-serif; font-size:27px; color:#1F44FF; white-space:nowrap; }
.pctSm { font-family:'Koulen',sans-serif; font-size:18px; color:#1F44FF; white-space:nowrap; }
.bar { height:8px; background:#f0eadf; border-radius:99px; overflow:hidden; margin:2px 0 12px; }
.barFill { height:100%; background:#1F44FF; border-radius:99px; transition:width .25s ease; }
.barFill.done { background:#FFB323; }
.goalRow { display:flex; align-items:flex-start; gap:11px; padding:11px 0; border-bottom:1px solid #f0eadf; }
.goalRow:last-of-type { border-bottom:none; }
.goalText { font-size:14.5px; line-height:1.35; padding-top:3px; }
.goalRow.done .goalText { color:#6b6557; text-decoration:line-through; }
.tick { flex:0 0 auto; width:28px; height:28px; border-radius:8px; border:1.5px solid #c9c3b6;
  background:#FAF6F0; font-size:15px; font-weight:700; color:#fff; cursor:pointer; line-height:1; }
.tick.on { background:#0a7d3c; border-color:#0a7d3c; }
.kpiIn { width:88px !important; text-align:right; }

/* team directory grouped by department then ministry */
.deptBlock { border:1px solid #e4ddd0; border-radius:12px; background:#fff; padding:12px 13px; margin-bottom:12px; }
.deptHead { display:flex; align-items:center; gap:7px; font-size:15px; font-weight:700; }
.deptHead .deptN { margin-left:auto; font-family:'Koulen',sans-serif; font-size:17px; color:#1F44FF; }
.minLabel { font-size:11px; letter-spacing:1.4px; text-transform:uppercase; color:#6b6557;
  font-weight:700; margin:14px 0 7px; }

/* days away from campus */
.awaySplit { display:flex; gap:10px; margin:10px 0 4px; }
.awayHalf { flex:1; border:1px solid #b9c4ff; background:#e8ecff; border-radius:12px; padding:11px 8px; text-align:center; }
.awayHalf.personal { border-color:#ffd98a; background:#FFF1D6; }
.awayHalf .awayN { font-family:'Koulen',sans-serif; font-size:25px; line-height:1.1; color:#17150F; }
.awayHalf .awayL { font-size:11px; letter-spacing:.6px; text-transform:uppercase; color:#6b6557; font-weight:700; }
.tripDel { border:0; background:none; color:#b3261e; font-size:14px; cursor:pointer; padding:2px 0 2px 8px; }
.goalLink { font-size:12px; color:#1F44FF; margin-top:5px; }

/* today's habits */
.habitGrid { display:grid; grid-template-columns:repeat(auto-fit,minmax(96px,1fr)); gap:9px; margin:4px 0 10px; }
.habitBtn { display:flex; flex-direction:column; align-items:center; gap:3px; padding:12px 6px 9px;
  border-radius:12px; border:1.5px solid #c9c3b6; background:#FAF6F0; cursor:pointer; font-family:inherit; }
.habitBtn.on { background:#eaf6ee; border-color:#0a7d3c; }
.habitBtn .hIcon { font-size:21px; line-height:1; }
.habitBtn .hLabel { font-size:11.5px; line-height:1.25; text-align:center; color:#17150F; }
.habitBtn.on .hLabel { font-weight:700; }
.habitBtn .hRun { font-size:10.5px; color:#6b6557; min-height:13px; }
.habitPick { display:flex; align-items:center; gap:10px; padding:11px 0; border-bottom:1px solid #f0eadf; }
.habitPick:last-of-type { border-bottom:none; }
.habitPick .hpLabel { flex:1; font-size:14.5px; }
.habitPick .hpBox { width:26px; height:26px; border-radius:7px; border:1.5px solid #c9c3b6;
  background:#FAF6F0; color:#fff; font-weight:700; font-size:14px; cursor:pointer; line-height:1; flex:0 0 auto; }
.habitPick .hpBox.on { background:#1F44FF; border-color:#1F44FF; }
.habitPick .hpEye { font-size:11px; color:#6b6557; background:none; border:0; cursor:pointer;
  font-family:inherit; padding:4px 6px; white-space:nowrap; }
.habitPick .hpEye.shared { color:#0a7d3c; font-weight:700; }

/* bible reading */
.reading { font-family:'Koulen',sans-serif; font-size:21px; letter-spacing:.5px; color:#17150F;
  background:#FFF1D6; border:1px solid #ffd98a; border-radius:10px; padding:11px 13px; margin:2px 0 10px; }
.banner.big { font-size:14px; padding:13px 15px; }
.trend { display:inline-block; font-size:12px; font-weight:700; padding:1px 6px; border-radius:6px; margin-left:4px; }
.trend.up { color:#0a7d3c; background:#e3f6ea; }
.trend.down { color:#b3261e; background:#fbe6e6; }
.trend.flat { color:#6b6557; background:#efeae0; }

/* pull-to-refresh — same gesture, same spinning logo coin as the dashboard. */
.ptr { position:fixed; top:0; left:0; right:0; z-index:60; display:flex; justify-content:center;
  pointer-events:none; opacity:0; transform:translateY(-60px);
  transition:transform .22s ease, opacity .22s ease; }
.ptr.dragging { transition:none; }
.ptrCoin { width:40px; height:40px; border-radius:50%; margin-top:10px; background:#17150F;
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 6px 18px rgba(31,68,255,.3), 0 0 0 3px rgba(31,68,255,.12); }
.ptrCoin img { width:27px; height:auto; }
.ptr.spinning .ptrCoin img { animation:spin 1s linear infinite; transform:none !important; }
@keyframes spin { to { transform:rotate(360deg) } }
@media (prefers-reduced-motion: reduce){ .ptr.spinning .ptrCoin img { animation:none } }

/* "Impact Loading" — the same spinning-coin wait the dashboard uses, so the two
   pages feel like one app while they are still two files. */
.loadingBox { text-align:center; padding:52px 0 40px; }
.loadCoin { width:92px; height:92px; border-radius:50%; margin:0 auto; background:#17150F;
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 12px 30px rgba(31,68,255,.28), 0 0 0 4px rgba(31,68,255,.1); }
.loadLogo { width:66px; height:auto; animation:spin 1.4s linear infinite; }
.loadText { font-family:'Koulen',sans-serif; font-size:22px; letter-spacing:1px; color:#17150F; margin-top:18px; }
.ldots::after { content:''; animation:ldots 1.4s steps(1,end) infinite; }
@keyframes ldots { 0%{content:''} 25%{content:'.'} 50%{content:'..'} 75%,100%{content:'...'} }
@media (prefers-reduced-motion: reduce){ .loadLogo{ animation:none } .ldots::after{ content:'...' } }
/* collapsed sections — keep the front page short */
.discloseBtn { display:flex; width:100%; align-items:center; justify-content:space-between; gap:12px;
  background:transparent; border:0; border-top:1px solid #f0eadf; padding:13px 0 4px; margin-top:6px;
  font-family:inherit; font-size:14.5px; text-align:left; color:#17150F; cursor:pointer; }
.card.slim .discloseBtn { border-top:0; padding-top:2px; margin-top:0; }
.discloseBtn .chev { color:#6b6557; font-size:13px; }
.card.slim { padding:12px 14px; }
.linkbtn.inline { display:inline; width:auto; padding:0; text-decoration:underline; }
.msg { position:fixed; left:50%; bottom:86px; transform:translateX(-50%); background:#17150F; color:#FAF6F0;
  padding:10px 18px; border-radius:999px; font-size:14px; z-index:20; opacity:0; transition:opacity .2s; pointer-events:none; max-width:90%; }
.msg.show { opacity:1; }
footer { text-align:center; font-size:12px; color:#6b6557; margin-top:26px; }
</style>
</head>

<div class="ptr" id="ptr" aria-hidden="true"><div class="ptrCoin"><img id="ptrLogo" alt=""></div></div>

<header>
  <div class="brand">
    <img id="brandLogo" alt="YWAM GP — Gon Preah" style="height:44px;width:auto;display:block">
    <div><div class="brandKh">កូនព្រះ</div><div class="brandEn">MY GP</div></div>
  </div>
  <div class="hbtns" id="hbtns"></div>
</header>

<main id="main"><div class="loadingBox"><div class="loadCoin"><img class="loadLogo" id="bootLogo" alt=""></div><div class="loadText">Impact Loading<span class="ldots"></span></div></div></main>
<nav class="bottom hidden" id="bottomNav"></nav>
<div class="msg" id="msg"></div>

<script>
/*  Error boundary — must come first, before any other script.

    This page is the app's front door for signed-in staff, so a failure here
    used to be inescapable: index.html redirects here, and a blank screen gave
    no way back to the dashboard. The fallback always offers that way out. */
(function(){
  var shown = false;
  function fallback(what){
    if(shown) return; shown = true;
    // Latch it so a later render() can't paint over the message.
    window.gpDead = true;
    var html =
      '<div style="max-width:420px;margin:12vh auto;padding:0 22px;text-align:center;'+
      'font-family:system-ui,sans-serif;color:#17150F">'+
      '<div style="font-size:40px;line-height:1">✦</div>'+
      '<h2 style="font-size:19px;margin:14px 0 8px">This didn’t load properly</h2>'+
      '<p style="font-size:14.5px;line-height:1.5;color:#6b6557;margin:0 0 18px">'+
      'Usually a connection hiccup. Nothing you’ve logged was lost.</p>'+
      '<button id="gpReload" style="width:100%;padding:14px;border:0;border-radius:12px;'+
      'background:#1F44FF;color:#fff;font-size:16px;font-weight:700;cursor:pointer">Try again</button>'+
      '<button id="gpDash" style="width:100%;padding:13px;margin-top:9px;border:1.5px solid #c9c3b6;'+
      'border-radius:12px;background:transparent;color:#17150F;font-size:15px;cursor:pointer">Open the dashboard</button>'+
      '<div style="font-size:11px;color:#a09a8c;margin-top:20px">'+String(what||'').slice(0,140)+'</div>'+
      '</div>';
    function paint(){
      var host = document.getElementById('main') || document.body;
      if(!host) return;
      host.innerHTML = html;
      var nav = document.getElementById('bottomNav');
      if(nav) nav.classList.add('hidden');
      var r = document.getElementById('gpReload');
      if(r) r.onclick = function(){ location.reload(); };
      var d = document.getElementById('gpDash');
      if(d) d.onclick = function(){
        // Break the auto-redirect so the dashboard is actually reachable.
        try { sessionStorage.setItem('gp-skip-teams','1'); } catch(e){}
        location.href = 'index.html';
      };
    }
    if(document.body) paint();
    else document.addEventListener('DOMContentLoaded', paint);
  }
  window.addEventListener('error', function(e){
  /* A failed <script src> fires an error event on the element itself.

     Only some scripts are load-bearing. logo.js and km.js are marked
     data-optional because the page works without them — a missing logo is a
     missing image, and a missing dictionary just leaves the text in English.
     Killing the whole app for either is far worse than the thing it prevents,
     and on the patchy phone connections this is built for, a third request is a
     third chance to fail. taxonomy.js has no fallback and stays fatal. */
    if(e && e.target && e.target.tagName === 'SCRIPT'){
      if(e.target.hasAttribute('data-optional')) return;
      fallback('could not load ' + (e.target.src || 'a script'));
      return;
    }
    if(e && e.message) fallback(e.message);
  }, true);
  window.addEventListener('unhandledrejection', function(e){
    fallback((e && e.reason && e.reason.message) || 'unexpected error');
  });
  window.gpBootFailed = fallback;
})();
</script>
<script src="logo.js" data-optional></script>
<script>
/* Paint the header mark and the boot coin as soon as logo.js is in — the first
   thing you see is the real logo, not a bare header. */
(function(){ if(typeof GP_LOGO_WIDE!=='string') return;
  var b=document.getElementById('brandLogo'); if(b) b.src=GP_LOGO_WIDE;
  var l=document.getElementById('bootLogo'); if(l) l.src=GP_LOGO;
  var p=document.getElementById('ptrLogo'); if(p) p.src=GP_LOGO; })();
</script>
<script src="km.js" data-optional></script>
<script src="taxonomy.js"></script>
<script src="rollup.js"></script>
<script>
if(typeof getDepartments !== 'function' || typeof CAMPUSES === 'undefined'){
  window.gpBootFailed('taxonomy.js did not load');
  // Throwing stops the rest of this script, so nothing paints over the message.
  throw new Error('taxonomy.js missing');
}
if(typeof gpRollup !== 'function'){
  window.gpBootFailed('rollup.js did not load');
  throw new Error('rollup.js missing');
}
/* CAMPUSES, getDepartments(), modeOf() and the metric lists come from
   taxonomy.js — the same file the dashboard uses, so a staff member's KPI
   card always matches what leadership sees. */
function deptsFor(campusId){ return Object.keys(getDepartments(campusId||'poipet')); }
function ministriesFor(campusId, dept){
  var d = getDepartments(campusId||'poipet')[dept];
  return d ? Object.keys(d) : [];
}
function metricsFor(campusId, dept, ministry){
  var d = getDepartments(campusId||'poipet')[dept];
  var list = (d && d[ministry]) ? d[ministry] : [];
  // Staff never see or edit the leadership-only financial metrics; the server
  // enforces this too, this just keeps them off the screen.
  return list.filter(function(m){ return SENSITIVE.indexOf(m) === -1; });
}

/* The yes/no dailies are habit tiles now (see HABIT_LIBRARY) — one tap each
   instead of a list of questions. Only the 1-10 scales still need asking, and
   they sit in the collapsed part of the Today card. */
var MOODS = [
  {id:'clarity', text:'How clear am I on what to do today?'},
  {id:'growth',  text:'How would I rate my growth today?'}
];

var S = {
  auth:{user:'', pin:''}, me:null, profile:null,

/* ---------- week helpers (must match isoWeek_ in netlify/functions/api.js) ---------- */
/* Mirrors MIN_WEEK_DAYS in the API: below this many logged days the week isn't
   scored or reported. Kept in step by hand — if you change one, change both. */
var MIN_WEEK_DAYS = 3;
function isoWeekOf(d){
  var y=d.getFullYear();
  var jan1=new Date(y,0,1);
  var monW1=new Date(y,0,1-((jan1.getDay()+6)%7));
  return Math.max(1, Math.min(52, Math.floor((d-monW1)/(7*86400000))+1));
}
function thisWeek(){ return isoWeekOf(new Date()); }
function goalsForWeek(week){
  for(var i=0;i<S.goals.length;i++) if(Number(S.goals[i].week)===Number(week)) return S.goals[i];
  return null;
}
function checkinForWeek(week){
  for(var i=0;i<S.checkins.length;i++) if(Number(S.checkins[i].week)===Number(week)) return S.checkins[i];
  return null;
}

/* ---------- language ----------
   Same contract as the dashboard: t() looks the English up in the reviewed
   Khmer dictionary and falls back to the English when there's no entry, so a
   missing translation degrades to English rather than breaking a page.
   Khmer is the first language of most people using this page every day, so a
   string added here without a dictionary entry is a gap, not a finished job. */
var LANG = (function(){ try { return localStorage.getItem('gp-lang')||'en'; } catch(e){ return 'en'; } })();
function t(s){ return LANG==='km' ? (BUILTIN_KM[s] || s) : s; }
function toggleLang(){
  LANG = LANG==='km' ? 'en' : 'km';
  try { localStorage.setItem('gp-lang', LANG); } catch(e){}
  render();
}

function run(fn, args, onOk){
  fetch('/.netlify/functions/api', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ fn: fn, args: args })
  }).then(function(res){
    if(!res.ok) throw new Error('HTTP '+res.status);
    return res.json();
  }).then(onOk).catch(function(){ showMsg("Connection problem — try again."); S.busy=false; render(); });
}

/* consecutive-day streak ending today or yesterday */
function streak(pred){
  var have={}; S.logs.forEach(function(l){ if(pred(l)) have[l.date]=1; });
  var d=new Date(); var n=0;
  // allow streak to still count if today not logged yet
  if(!have[fmtD(d)]) d.setDate(d.getDate()-1);
  while(have[fmtD(d)]){ n++; d.setDate(d.getDate()-1); }
  return n;
}

/* Forgiving streak: one missed day doesn't wipe the run, it spends the single
   grace day. Punitive streaks are why habit trackers get deleted in February. */
function graceStreak(pred){
  var have={}; S.logs.forEach(function(l){ if(pred(l)) have[l.date]=1; });
  var d=new Date();
  if(!have[fmtD(d)]) d.setDate(d.getDate()-1);   // today's not due yet
  var n=0, grace=1;
  while(true){
    if(have[fmtD(d)]){ n++; }
    else if(grace>0 && n>0){ grace--; }          // never start on a grace day
    else break;
    d.setDate(d.getDate()-1);
  }
  return n;
}
function bestStreak(pred){
  var days=S.logs.filter(pred).map(function(l){return l.date;}).sort();
  var best=0, run=0, prev=null;
  days.forEach(function(ds){
    if(prev){
      var gap=Math.round((new Date(ds+'T00:00:00')-new Date(prev+'T00:00:00'))/86400000);
      run = gap===1 ? run+1 : 1;
    } else run=1;
    if(run>best) best=run;
    prev=ds;
  });
  return best;
}
/* Habit results live in l.habits, but the original fixed columns (bible,
   workout, quietTime…) hold the history from before habits were configurable —
   fall back to them so nobody's streak resets to zero on this change. */
function didHabit(l, id){
  if(l.habits && l.habits[id]!==undefined) return !!l.habits[id];
  return !!l[id];
}
function habitPred(id){ return function(l){ return didHabit(l,id); }; }
function logForDate(ds){
  for(var i=0;i<S.logs.length;i++) if(S.logs[i].date===ds) return S.logs[i];
  return null;
}
function fmtD(d){ return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
function thisWeekLogs(){
  // Monday-based week matching the backend
  var d=new Date(); var day=(d.getDay()+6)%7; var mon=new Date(d); mon.setDate(d.getDate()-day); mon.setHours(0,0,0,0);
  var ms=fmtD(mon);
  return S.logs.filter(function(l){ return l.date>=ms; });
}
function sum(rows, f){ var acc=0; rows.forEach(function(r){ acc+=Number(f(r))||0; }); return acc; }
function count(rows, f){ var n=0; rows.forEach(function(r){ if(f(r)) n++; }); return n; }

/* ---------- boot ---------- */
function boot(){
  /* The dashboard's front door links straight here: ?reg=1 opens the create
     form rather than making someone find the "New here?" link first. */
  try { if(String(location.search||'').indexOf('reg=1')>-1) S.regMode = true; } catch(e){}
  var saved = null;
  try { saved = JSON.parse(localStorage.getItem('gp-staff')||'null'); } catch(e){}
  if(saved && saved.user && saved.pin){
    S.auth = saved;
    run('staffLogin', [saved.user, saved.pin], function(d){
      if(d.ok){ S.me=d.staff; S.profile=d.profile; afterLogin(); }
      else { localStorage.removeItem('gp-staff'); render(); }
    });
  } else { render(); }
}
/* Small public snapshot so the dashboard's top-right chip can show your face
   and name without needing your PIN. Nothing private goes in here. */
function saveStaffCard(){
  try {
    localStorage.setItem('gp-staff-card', JSON.stringify({
      name: S.me.name, photo: S.me.photo || '', ministry: S.me.ministry || '',
      // Campus so the dashboard can open on your own base instead of Poipet.
      campus: S.me.campus || ''
    }));
  } catch(e){}
}

function afterLogin(){
  localStorage.setItem('gp-staff', JSON.stringify(S.auth));
  saveStaffCard();
  run('teamRoster', [], function(r){ S.roster = Array.isArray(r)?r:[]; render(); });
  run('getMyLogs', [S.auth.user, S.auth.pin], function(d){
    if(d.ok){
      S.logs=d.logs;
      if(d.habits) S.habits=d.habits;
      if(d.profile) S.profile=Object.assign(S.profile||{}, d.profile);
    }
    render();
  });
  run('getMyMentees', [S.auth.user, S.auth.pin], function(d){ if(d.ok){ S.mentees=d.mentees; } render(); });
  run('getMyMentorRequests', [S.auth.user, S.auth.pin], function(d){ if(d.ok){ S.mentorRequests=d.requests; } render(); });
  run('getMyWeekly', [S.auth.user, S.auth.pin], function(d){ if(d.ok){ S.goals=d.goals||[]; S.checkins=d.checkins||[]; } render(); });
  run('getMyTrips', [S.auth.user, S.auth.pin], function(d){ if(d.ok) S.trips=d; render(); });
  run('getTripRequests', [S.auth.user, S.auth.pin], function(d){ if(d.ok) S.tripRequests=d.requests||[]; render(); });
  run('getMyMinistry', [S.auth.user, S.auth.pin], function(d){ if(d.ok){ S.ministry=d; } render(); });
  /* The base's own figures — the dashboard endpoint, no leader code, so the two
     money metrics leadership can see never reach this page. */
  run('getData', [''], function(d){ if(d && d.entries) S.base=d; render(); });
  S.view='base'; render();
}
function logout(){
  localStorage.removeItem('gp-staff');
  localStorage.removeItem('gp-staff-card');
  S.me=null; S.auth={user:'',pin:''}; S.logs=[]; S.mentees=[];
  S.goals=[]; S.checkins=[]; S.ministry=null; S.goalDraft=null; S.weekDraft={}; S.kpiDraft={};
  render();
}

/* ---------- render root ---------- */
function render(){
  if(window.gpDead) return;   // an error message is on screen; leave it there
  var hb=document.getElementById('hbtns');
  var nav=document.getElementById('bottomNav');
  if(!S.me){
    hb.innerHTML = '<button class="hbtn" id="langBtn">'+(LANG==='km'?'EN':'ខ្មែរ')+'</button>'+'<button class="hbtn" id="backBtn">'+esc(t('Dashboard'))+'</button>';
    nav.classList.add('hidden');
    document.getElementById('main').innerHTML = S.regMode ? registerHtml() : loginHtml();
    bind();
    return;
  }
  hb.innerHTML = '<button class="hbtn" id="langBtn">'+(LANG==='km'?'EN':'ខ្មែរ')+'</button>'+'<button class="hbtn" id="backBtn">'+esc(t('Dashboard'))+'</button>';
  /* Base leads: signing in should show how the base is doing, not a to-do list.
     Your own week is one tap away, Profile is folded into Me, and Mentor is
     reached from Team. */
  var reqN=S.mentorRequests?S.mentorRequests.length:0;
  var tabs=[['base','Base','🏠'],['week','My week','✅'],['team','Team'+(reqN?' ('+reqN+')':''),'👥'],['me','Me','💚']];
  nav.classList.remove('hidden');
  nav.innerHTML = tabs.map(function(tab){
    return '<button class="'+(S.view===tab[0]?'on':'')+'" data-tab="'+tab[0]+'"><span class="ic">'+tab[2]+'</span>'+t(tab[1])+'</button>';
  }).join('');
  var m=document.getElementById('main');
  if(S.view==='base') m.innerHTML=baseHtml();
  else if(S.view==='week') m.innerHTML=homeHtml();
  else if(S.view==='me') m.innerHTML=meHtml();
  else if(S.view==='team') m.innerHTML=teamHtml();
  else if(S.view==='mentor') m.innerHTML=mentorHtml();
  else m.innerHTML=profileHtml();
  bind();
}

function greeting(){
  var h=new Date().getHours();
  return h<12 ? 'Good morning' : (h<18 ? 'Good afternoon' : 'Good evening');
}

/* ---------- base: the first thing you see after logging in ----------
   The dashboard's figures, for the base this person actually works at. Nothing
   is computed here — rollup.js does the arithmetic, so these are the same
   numbers leadership reads, not a second opinion.

   getData() is the dashboard's own endpoint. It needs no leader code: the two
   money metrics leadership can see are stripped server-side for everyone else,
   so what lands here is what an ordinary staff member is allowed to read. */
var _baseRoll = null;
function baseR(){
  var d = S.base || {};
  if(!_baseRoll || _baseRoll.e!==d.entries || _baseRoll.s!==d.survey || _baseRoll.r!==S.roster){
    _baseRoll = { e:d.entries, s:d.survey, r:S.roster,
      api: gpRollup({ entries:d.entries, survey:d.survey, roster:S.roster, week:thisWeek() }) };
  }
  return _baseRoll.api;
}

/* One tile. `metric` only decides formatting ($ / 1-10 / plain), and a trend is
   passed in already rendered because only the caller knows what to compare. */
function bstat(label, value, metric, trend){
  return '<div class="stat"><div class="statNum">'+fmt(value, metric)+'</div>'+
    '<div class="statLabel">'+esc(t(label))+(trend||'')+'</div></div>';
}

/* ---------- my week: the personal page ---------- */

/* The app knows what day it is. Monday you're setting goals, midweek you're
   keeping habits, Friday you're closing the week out — so the card that matters
   today sits at the top instead of the same fixed wall every day. */
function weekPhase(){
  var dow=new Date().getDay();               // 0 Sun … 6 Sat
  if(dow===1||dow===2) return 'plan';
  if(dow===5||dow===6||dow===0) return 'review';
  return 'work';
}
function phaseBanner(phase, wk){
  var rec=goalsForWeek(wk);
  var hasGoals=!!(rec && rec.items.some(function(i){return i.text;}));
  if(phase==='plan' && !hasGoals)
    return '<div class="banner big">🎯 <strong>Start of the week.</strong> Pick the three things that matter for week '+wk+'.'+
      ' <button class="linkbtn inline" id="jumpGoals">Set them now</button></div>';
  if(phase==='review'){
    var done=hasGoals ? rec.items.filter(function(i){return i.text&&i.done;}).length : 0;
    var tot=hasGoals ? rec.items.filter(function(i){return i.text;}).length : 0;
    if(hasGoals && done<tot)
      return '<div class="banner big">✅ <strong>End of the week.</strong> You’ve marked '+done+' of '+tot+
        ' goals done. <button class="linkbtn inline" id="jumpGoals">Close out week '+wk+'</button></div>';
    if(!thisWeekLogs().length)
      return '<div class="banner big">💚 <strong>End of the week.</strong> No days logged yet — '+
        'your week’s health figures come straight from these.'+
        ' <button class="linkbtn inline" id="jumpToday">Log today</button></div>';
  }
  return '';
}

function homeHtml(){
  var wk=thisWeek();
  var wl=thisWeekLogs();
  var phase=weekPhase();

  /* No name-and-face card here: Base already greeted you by name and Me holds
     your profile. This page opens on the week itself. */
  var st=graceStreak(function(){return true;});
  var h='<h3 style="margin-top:8px">'+esc(t('My week'))+' '+wk+'</h3>'+
    '<div class="chips" style="margin:0 0 12px">'+
    (st>0?'<span class="chip">🔥 '+st+'-day streak</span>'
        : '<span class="chip blue">'+wl.length+' of 7 days logged</span>')+
    '</div>';

  h+=phaseBanner(phase, wk);

  /* Today's habits come first on ordinary days; on planning and review days
     the weekly cards lead instead. */
  var daily = habitsCardHtml();
  var weekly = goalsCardHtml(wk);
  h += (phase==='work') ? (daily + weekly) : (weekly + daily);
  h += kpiCardHtml(wk);
  h += weekSummaryHtml(wk);
  return h;
}

/* One line, not a form. The week's health figures are computed from the daily
   check-ins — the old weekly survey asked the same eleven questions over
   again, so it's gone. Tap to see what the base will actually receive. */
function weekSummaryHtml(wk){
  var c=checkinForWeek(wk);
  var wl=thisWeekLogs();
  if(!c && !wl.length) return '';
  var open=S.weekOpen;
  // Your own weekly score, using exactly the maths the base dashboard uses on
  // the pooled data — so the chain daily → your week → base health is visible
  // rather than something that happens off-screen.
  var score = c ? compositeOf(c) : null;
  // No score until there's enough of a week to mean anything — showing a low
  // number built from one day would just be wrong, and it isn't sent to the
  // base either. Say how many more days instead.
  var short = MIN_WEEK_DAYS - wl.length;
  var sub = score!==null ? wl.length+' of 7 days logged'
    : (wl.length===0 ? 'log a day and this starts filling in'
                     : wl.length+' day'+(wl.length===1?'':'s')+' logged · '+short+' more for your score');
  var h='<div class="card slim"><button class="discloseBtn" id="weekToggle">'+
    '<span><strong>💚 '+esc(t('My health'))+' · '+esc(t('week'))+' '+wk+'</strong>'+
    '<div class="pmeta">'+esc(sub)+'</div></span>'+
    '<span class="'+(score===null?'chev':'pctBig')+'">'+
      (score===null ? (open?'▴':'▾') : score.toFixed(1))+'</span></button>';
  if(score!==null){
    h+='<div class="bar" style="margin-top:8px"><div class="barFill'+(score>=8?' done':'')+
       '" style="width:'+Math.round(score*10)+'%"></div></div>'+
       '<div class="pmeta">Health score out of 10, from the '+wl.length+' day'+(wl.length===1?'':'s')+
       ' you logged · feeds the base total for '+esc(campusName(S.me.campus))+'</div>';
  }
  if(open && c){
    var yn=function(v){ return v? 'yes':'no'; };
    var rows=[
      ['Loneliness (avg)', c.lonely||'—'],
      ['Clarity (avg)', c.clarity||'—'],
      ['Growth (avg)', c.growth||'—'],
      ['Exercised 3+ days', yn(c.exercise)],
      ['Regular quiet time', yn(c.quietTime)],
      ['One-on-one', yn(c.oneOnOne)],
      ['Shared faith', yn(c.sharedFaith)],
      ['Sabbath', yn(c.sabbath)],
      ['Language hours', c.langHours||0],
      ['Ministry hours', c.minHours||0]
    ];
    h+='<div style="margin-top:10px">';
    rows.forEach(function(r){
      h+='<div class="row"><span class="rowName">'+esc(r[0])+'</span><span class="pctSm">'+esc(String(r[1]))+'</span></div>';
    });
    h+='<p class="hint" style="margin-top:8px">Leaders only ever see these pooled with everyone else’s — never your name.</p></div>';
  } else if(open){
    h+='<p class="sub" style="margin:10px 0 0">Nothing yet for this week. It appears once you log a day.</p>';
  }
  return h+'</div>';
}

/* --- today's habits: the daily tool --- */

      if(d[k]===undefined && log[k]!==undefined && log[k]!==null) d[k]=log[k];
    });

  h+='<button class="discloseBtn" id="moreToday"><span><strong>Hours, mood &amp; private</strong>'+
     '<div class="pmeta">'+todaySummaryLine(log)+'</div></span>'+

    h+='<div class="qBlock"><div class="qText">Language study today</div><div class="numIn">'+
       '<input type="number" inputmode="decimal" min="0" step="0.5" id="n_langHours" value="'+(d.langHours!=null?d.langHours:'')+'"> hours</div></div>'+
       '<div class="qBlock"><div class="qText">Community ministry today</div><div class="numIn">'+

    MOODS.forEach(function(q){
      h+='<div class="qBlock"><div class="qText">'+esc(q.text)+'</div><div class="scale">';
      for(var i=1;i<=10;i++) h+='<button data-scale="'+q.id+'|'+i+'" class="'+(Number(d[q.id])===i?'on':'')+'">'+i+'</button>';
      h+='</div></div>';
    });
    h+='<div class="privateWrap"><p class="hint" style="margin:0 0 6px">🔒 Only you'+
       (S.me.mentorId?' and '+esc(nameOf(S.me.mentorId)):'')+'. Leaders see anonymous totals only.</p>'+
       '<div class="qBlock"><div class="qText">How lonely do I feel today? <span class="hint">(1 = not at all, 10 = very)</span></div><div class="scale">';
    for(var j=1;j<=10;j++) h+='<button data-scale="lonely|'+j+'" class="'+(Number(d.lonely)===j?'on':'')+'">'+j+'</button>';
    h+='</div></div><div class="qBlock"><div class="qText">Did I look at porn today?</div><div class="seg">'+
       '<button data-yn="porn|1" class="'+(d.porn===true||d.porn===1?'on bad':'')+'">Yes</button>'+
       '<button data-yn="porn|0" class="'+(d.porn===false||d.porn===0?'on':'')+'">No</button></div></div></div>';
    h+='<button class="btn" id="saveDayBtn">Save today</button>';
  }
  h+='<button class="linkbtn" id="editHabits" style="margin-top:8px">Choose my habits</button>';
  return h+'</div>';
}

function todaySummaryLine(log){
  if(!log) return 'Not logged yet';
  var bits=[];
  if(log.langHours) bits.push(log.langHours+'h language');
  if(log.minHours) bits.push(log.minHours+'h ministry');
  if(log.clarity!=null) bits.push('clarity '+log.clarity);
  if(log.growth!=null) bits.push('growth '+log.growth);
  return bits.length ? bits.join(' · ') : 'Nothing added yet';
}


/* --- three weekly goals --- */
function goalsCardHtml(wk){
  var rec=goalsForWeek(wk);
  var editing = S.goalDraft !== null;
  var items = editing ? S.goalDraft
    : (rec && rec.items && rec.items.length ? rec.items : []);
  var written = items.filter(function(i){ return i && i.text; });

  var h='<h3>🎯 My 3 goals · week '+wk+'</h3>';

  if(!written.length && !editing){
    h+='<div class="card"><p class="sub" style="margin:4px 0 10px">No goals set for this week yet. Three is the whole point — pick the three that matter.</p>'+
      '<button class="btn" id="editGoals">Set this week’s goals</button></div>';
    h+=pastGoalsHtml(wk);
    return h;
  }

  h+='<div class="card">';
  if(editing){
    /* Said plainly at the point of writing, not buried in settings. Goals are
       free text and the whole team can open them from the directory — that
       should be a known norm, never a surprise. */
    h+='<p class="hint" style="margin:2px 0 10px">👀 '+
       esc(t('Your team can see these on your profile. Anything personal belongs in the private check-in instead.'))+'</p>';
    var mOpts=S.me.ministry ? metricsFor(S.me.campus,S.me.dept,S.me.ministry) : [];

      var gtext=(items[i]&&items[i].text)||'';
      var mk=(items[i]&&items[i].metricKey)||'';
      h+='<label class="f">Goal '+(i+1)+'</label>'+
        '<input type="text" maxlength="200" data-goaltext="'+i+'" value="'+esc(gtext)+'" placeholder="'+(i===0?'e.g. Disciple two students':'')+'">';
      // Linking a goal to one of your ministry's KPIs is what ties personal
      // follow-through to the numbers the base actually reports.
      if(mOpts.length){
        h+='<select data-goalmetric="'+i+'" class="goalSel"><option value="">— not tied to a KPI —</option>'+
          mOpts.map(function(mm){
            var key=S.me.dept+'|'+S.me.ministry+'|'+mm;
            return '<option value="'+esc(key)+'"'+(mk===key?' selected':'')+'>'+esc(t('moves'))+': '+esc(t(mm))+'</option>';
          }).join('')+'</select>';
      }
    }
    h+='<button class="btn" id="saveGoals">Save goals</button>'+
       '<button class="linkbtn" id="cancelGoals">Cancel</button>';
  } else {
    var pct=rec?rec.pct:null;
    h+='<div class="row" style="border:0;padding-top:0"><span class="rowName">End of week — did you get them done?</span>'+
       '<span class="pctBig">'+(pct===null?'—':pct+'%')+'</span></div>';
    h+='<div class="bar"><div class="barFill'+(pct>=100?' done':'')+'" style="width:'+(pct||0)+'%"></div></div>';
    written.forEach(function(g,i){
      var mm=g.metricKey?g.metricKey.split('|')[2]:'';
      h+='<div class="goalRow'+(g.done?' done':'')+'">'+
        '<button class="tick'+(g.done?' on':'')+'" data-goaltick="'+i+'" aria-label="Toggle goal '+(i+1)+'">'+(g.done?'✓':'')+'</button>'+
        '<span><span class="goalText">'+esc(g.text)+'</span>'+
        (mm?'<div class="goalLink">📊 moves '+esc(mm)+'</div>':'')+'</span></div>';
    });
    h+='<button class="btn ghost" id="editGoals" style="margin-top:12px">Edit goals</button>';
  }
  h+='</div>';
  h+=pastGoalsHtml(wk);
  return h;
}

function pastGoalsHtml(wk){
  var past=S.goals.filter(function(g){ return Number(g.week)!==Number(wk) && g.items.some(function(i){return i.text;}); });
  if(!past.length) return '';
  var hit=past.filter(function(g){ return g.pct!==null; });
  var avg=hit.length ? Math.round(hit.reduce(function(a,g){return a+g.pct;},0)/hit.length) : null;
  var h='<div class="card"><div class="row" style="border:0;padding-top:0"><span class="rowName">Previous weeks'+
    '<div class="pmeta">'+past.length+' week'+(past.length===1?'':'s')+' tracked</div></span>'+
    '<span class="pctBig">'+(avg===null?'—':avg+'%')+'</span></div>';
  past.slice(0,6).forEach(function(g){
    var done=g.items.filter(function(i){return i.text&&i.done;}).length;
    var tot=g.items.filter(function(i){return i.text;}).length;
    h+='<div class="row"><span class="rowName">Week '+g.week+'<div class="pmeta">'+done+' of '+tot+' done</div></span>'+
      '<span class="pctSm">'+(g.pct===null?'—':g.pct+'%')+'</span></div>';
  });
  return h+'</div>';
}

/* --- your ministry's KPIs, editable without leaving this page --- */
function kpiCardHtml(wk){
  if(!S.me.ministry){
    return '<h3>📊 My ministry KPIs</h3><div class="card"><p class="sub" style="margin:4px 0 10px">'+
      'Set your ministry on the Profile tab and your team’s KPIs will show up here, ready to log.</p>'+
      '<button class="btn ghost" id="goProfile">Choose my ministry</button></div>';
  }
  var metrics=metricsFor(S.me.campus, S.me.dept, S.me.ministry);
  if(!metrics.length){
    return '<h3>📊 My ministry KPIs</h3><div class="card"><p class="sub" style="margin:4px 0">'+
      'No KPIs are defined for '+esc(S.me.ministry)+' yet.</p></div>';
  }
  /* Enter today; the week's figure is derived from the days on the server, so
     there's no separate weekly number to keep in step. */
  var entries=(S.ministry&&S.ministry.entries)||{};
  var daily=(S.ministry&&S.ministry.daily)||{};
  var pins=(S.ministry&&S.ministry.pins)||[];
  var today=todayStr();

  /* Only show what this person logs day to day. GP Media carries 29 metrics,
     and a 29-row daily form gets filled in never. No pins chosen yet means
     show everything, so nothing is hidden from someone who hasn't picked. */
  var showing = (pins.length && !S.kpiAll)
    ? metrics.filter(function(m){ return pins.indexOf(m)>-1; })
    : metrics;
  var hiddenN = metrics.length - showing.length;

  var h='<h3>📊 '+esc(t(S.me.ministry))+' <small>· today</small></h3><div class="card">';

  if(S.kpiPick){
    h+='<p class="sub" style="margin:2px 0 8px">Star the ones you log most days — '+
       'the rest stay one tap away under “show all”.</p>';
    metrics.forEach(function(metric){
      var on=pins.indexOf(metric)>-1;
      h+='<div class="habitPick">'+
        '<button class="hpBox'+(on?' on':'')+'" data-kpipin="'+esc(metric)+'">'+(on?'★':'')+'</button>'+
        '<span class="hpLabel">'+esc(t(metric))+'</span></div>';
    });
    return h+'<button class="btn" id="saveKpiPins" style="margin-top:12px">Done</button></div>';
  }

  h+='<p class="sub" style="margin:4px 0 10px">Log today’s numbers — week '+wk+
    ' adds up on its own.</p>';
  showing.forEach(function(metric){
    var mode=modeOf(metric);
    var days=daily[metric]||{};
    var cur = S.kpiDraft[metric]!==undefined ? S.kpiDraft[metric]
      : (days[today]!==undefined ? days[today] : '');
    var weekVal=(entries[metric]||{})[String(wk)];
    var label = mode==='latest' ? 'now' : (mode==='avg' ? 'week avg' : 'week total');
    h+='<div class="row"><span class="rowName">'+esc(t(metric))+
      '<div class="pmeta">'+label+' '+(weekVal===undefined?'—':weekVal)+'</div></span>'+
      '<input type="number" inputmode="decimal" class="kpiIn" data-kpi="'+esc(metric)+
      '" data-kpimode="'+mode+'" value="'+esc(String(cur))+'"></div>';
  });
  h+='<button class="btn" id="saveKpiBtn">Save today</button>';
  if(hiddenN>0) h+='<button class="linkbtn" id="kpiShowAll">Show all '+metrics.length+' ('+hiddenN+' hidden)</button>';
  else if(pins.length && S.kpiAll) h+='<button class="linkbtn" id="kpiShowLess">Show just my '+pins.length+'</button>';
  h+='<button class="linkbtn" id="pickKpis">'+(pins.length?'Change which I log daily':'Pick the ones I log daily')+'</button>';
  return h+'</div>';
}

    [count(wl,function(r){return r.workout;}),'Workout days'],

    [count(wl,function(r){return r.oneOnOne;}),'One-on-ones'],

  h+='</div>';

  h+='<h3>🗓️ Recent days</h3><div class="card">';

  S.logs.slice(0,7).forEach(function(l){

    if(l.langHours) bits.push(l.langHours+'h lang');

/* ---------- photo resize + upload ---------- */
function handlePhoto(file){
  var reader=new FileReader();
  reader.onload=function(e){
    var img=new Image();
    img.onload=function(){
      var max=300, w=img.width, h=img.height;
      if(w>h && w>max){ h=Math.round(h*max/w); w=max; } else if(h>max){ w=Math.round(w*max/h); h=max; }
      var cv=document.createElement('canvas'); cv.width=w; cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      var data=cv.toDataURL('image/jpeg',0.7).split(',')[1];
      showMsg('Uploading photo…');
      run('uploadPhoto',[S.auth.user,S.auth.pin,data,'image/jpeg'],function(d){
        if(d.ok){ S.me.photo=d.photo; saveStaffCard(); showMsg('Photo updated'); render(); }
        else showMsg(d && d.err==='bad_type' ? 'That image type isn\u2019t supported' : (d && d.err==='too_large' ? 'Photo too large \u2014 try a smaller one' : 'Upload failed'));
      });
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}

/* Persist the habit set (and Bible-plan position) without blocking the UI. */
function pushHabits(){
  run('saveMyHabits',[S.auth.user,S.auth.pin,myHabits()],function(d){

    render();
  });
}
/* Write today's habit ticks through the existing daily-log endpoint, merged
   with whatever else today already holds so the full check-in isn't clobbered. */
function saveTodayHabits(map){
  var today=todayStr();
  var log=logForDate(today)||{};
  var payload={
    langHours:log.langHours||0, minHours:log.minHours||0,
    workout:log.workout, bible:log.bible, quietTime:log.quietTime,
    oneOnOne:log.oneOnOne, sharedFaith:log.sharedFaith, sabbath:log.sabbath,
    clarity:log.clarity, growth:log.growth, lonely:log.lonely, porn:log.porn,
    habits:map
  };
  // Keep the legacy columns in step for habits that have one, so streaks and
  // the mentor view stay consistent with pre-habits history.
  ['workout','bible','quietTime','oneOnOne','sharedFaith','sabbath'].forEach(function(k){
    if(map[k]!==undefined) payload[k]=map[k];
  });
  run('saveDaily',[S.auth.user,S.auth.pin,today,payload],function(d){
    S.busy=false;
    if(d.ok){
      S.logs=d.logs;
      if(d.habits) S.habits=d.habits;
    }
    render();
  });
}
/* Keep the locally-held derived week row in step with what the server just
   recomputed, so the summary updates without another round trip. */
function upsertCheckin(week){
  if(!week) return;
  S.checkins=(S.checkins||[]).filter(function(c){ return Number(c.week)!==Number(week.week); });
  S.checkins.unshift(week);
}
function todayHabitMap(){
  var log=logForDate(todayStr());
  var map={};
  myHabits().forEach(function(hb){ map[hb.id]= !!(log && didHabit(log,hb.id)); });
  return map;
}

/* Hold the trip form's fields in the draft as they change, so the re-render
   caused by switching work/personal doesn't discard half-typed input. */
function captureTrip(){
  if(!S.tripDraft) return;
  var g=function(id){ var e=document.getElementById(id); return e? e.value : undefined; };
  ['from','to','where','note'].forEach(function(k){
    var v=g('tr_'+k); if(v!==undefined) S.tripDraft[k]=v;
  });
  var r=g('tr_reason'); if(r!==undefined) S.tripDraft.reason=r;
}

function bindAway(){
  var nt=document.getElementById('newTrip');
  if(nt) nt.onclick=function(){
    var today=todayStr();
    S.tripDraft={ from:today, to:today, kind:'work',
      reason:(S.trips&&S.trips.reasons)?S.trips.reasons.work[0]:'', where:'', note:'' };
    S.tripForm=true; render();
  };
  var ct=document.getElementById('cancelTrip');
  if(ct) ct.onclick=function(){ S.tripForm=false; S.tripDraft=null; render(); };

  document.querySelectorAll('[data-trkind]').forEach(function(b){
    b.onclick=function(){
      if(!S.tripDraft) return;
      captureTrip();
      var k=b.getAttribute('data-trkind');
      S.tripDraft.kind=k;
      // the two kinds have different reason lists, so reset to the first one
      S.tripDraft.reason=(S.trips&&S.trips.reasons)?S.trips.reasons[k][0]:'';
      render();
    };
  });
  ['tr_from','tr_to','tr_where','tr_note','tr_reason'].forEach(function(id){
    var el=document.getElementById(id);
    if(el){ el.oninput=captureTrip; el.onchange=captureTrip; }
  });

  var st=document.getElementById('saveTrip');
  if(st) st.onclick=function(){
    if(S.busy) return;
    captureTrip();
    var f=S.tripDraft||{};
    if(!f.from || !f.to){ showMsg('Pick both dates'); return; }
    if(f.to<f.from){ showMsg('The last day can’t be before the first'); return; }
    S.busy=true; st.disabled=true; st.textContent='…';
    run('saveTrip',[S.auth.user,S.auth.pin,f],function(d){
      S.busy=false;
      if(d && d.ok){
        S.trips=d; S.tripForm=false; S.tripDraft=null;
        showMsg(d.hasMentor ? 'Sent to your mentor' : 'Saved');
      } else showMsg('Could not save');
      render();
    });
  };

  document.querySelectorAll('[data-trdel]').forEach(function(b){
    b.onclick=function(){
      if(S.busy) return;
      if(!confirm('Remove these days?')) return;
      S.busy=true;
      run('deleteTrip',[S.auth.user,S.auth.pin,b.getAttribute('data-trdel')],function(d){
        S.busy=false;
        if(d && d.ok) S.trips=d;
        render();
      });
    };
  });

  // mentor decisions on someone's days away
  [['trok',true],['trno',false]].forEach(function(pair){
    document.querySelectorAll('[data-'+pair[0]+']').forEach(function(b){
      b.onclick=function(){
        if(S.busy) return;
        S.busy=true; b.disabled=true;
        run('respondToTrip',[S.auth.user,S.auth.pin,b.getAttribute('data-'+pair[0]),pair[1]],function(d){
          S.busy=false;
          if(d && d.ok) S.tripRequests=d.requests||[];
          render();
        });
      };
    });
  });
}

function bindHome(){
  var gp=document.getElementById('goProfile');
  if(gp) gp.onclick=function(){ S.view='profile'; render(); };
  var jg=document.getElementById('jumpGoals');
  if(jg) jg.onclick=function(){ S.view='week'; render(); };
  var jt=document.getElementById('jumpToday');
  if(jt) jt.onclick=function(){ S.view='week'; S.todayOpen=true; render(); };
  var fd=document.getElementById('goFullDash');
  if(fd) fd.onclick=function(){ gpGo('index'); };
  var mt=document.getElementById('moreToday');
  if(mt) mt.onclick=function(){ S.todayOpen=!S.todayOpen; render(); };
  var wt=document.getElementById('weekToggle');
  if(wt) wt.onclick=function(){ S.weekOpen=!S.weekOpen; render(); };

  // hours / mood / private — same daily record as the habit tiles.
  // Keep typed hours in the draft as they're typed: tapping a mood scale
  // re-renders the card and would otherwise blank a half-entered number.
  ['langHours','minHours'].forEach(function(k){
    var el=document.getElementById('n_'+k);
    if(el) el.oninput=function(){ S.todayDraft[k] = el.value===''? undefined : Number(el.value); };
  });
  document.querySelectorAll('[data-scale]').forEach(function(b){
    b.onclick=function(){ var p=b.getAttribute('data-scale').split('|'); S.todayDraft[p[0]]=Number(p[1]); render(); };
  });
  document.querySelectorAll('[data-yn]').forEach(function(b){
    b.onclick=function(){ var p=b.getAttribute('data-yn').split('|'); S.todayDraft[p[0]]=Number(p[1])===1; render(); };
  });
  var sdb=document.getElementById('saveDayBtn');
  if(sdb) sdb.onclick=function(){
    if(S.busy) return;
    var d=S.todayDraft;
    var lh=document.getElementById('n_langHours'), mh=document.getElementById('n_minHours');
    if(lh) d.langHours = lh.value===''? 0 : Number(lh.value);
    if(mh) d.minHours  = mh.value===''? 0 : Number(mh.value);
    S.busy=true; sdb.disabled=true; sdb.textContent='…';
    var map=todayHabitMap();
    var log=logForDate(todayStr())||{};
    var payload={
      langHours:d.langHours||0, minHours:d.minHours||0,
      workout:log.workout, bible:log.bible, quietTime:log.quietTime,
      oneOnOne:log.oneOnOne, sharedFaith:log.sharedFaith, sabbath:log.sabbath,
      clarity:d.clarity, growth:d.growth, lonely:d.lonely, porn:d.porn,
      habits:map
    };
    ['workout','bible','quietTime','oneOnOne','sharedFaith','sabbath'].forEach(function(k){
      if(map[k]!==undefined) payload[k]=map[k];
    });
    run('saveDaily',[S.auth.user,S.auth.pin,todayStr(),payload],function(r){
      S.busy=false;
      if(r.ok){
        S.logs=r.logs;
        if(r.habits) S.habits=r.habits;
        // The week's health row is recomputed server-side from the days.
        if(r.week) upsertCheckin(r.week);
        S.todayDraft={}; showMsg('Saved');
      } else showMsg('Could not save');
      render();
    });
  };

  // --- daily habits ---
  document.querySelectorAll('[data-habit]').forEach(function(b){
    b.onclick=function(){
      if(S.busy) return;
      var id=b.getAttribute('data-habit');
      var map=todayHabitMap();
      map[id]=!map[id];
      S.busy=true;
      if(navigator.vibrate){ try{ navigator.vibrate(8); }catch(e){} }
      saveTodayHabits(map);
    };
  });
  var eh=document.getElementById('editHabits');
  if(eh) eh.onclick=function(){ S.habitEdit=true; render(); };
  var sh=document.getElementById('saveHabits');
  if(sh) sh.onclick=function(){ S.habitEdit=false; pushHabits(); };
  document.querySelectorAll('[data-hpick]').forEach(function(b){
    b.onclick=function(){
      var id=b.getAttribute('data-hpick');
      var list=myHabits().slice();
      var at=-1;
      list.forEach(function(hb,i){ if(hb.id===id) at=i; });
      if(at>-1){ if(list.length<=1){ showMsg('Keep at least one habit'); return; } list.splice(at,1); }
      else {
        if(list.length>=MAX_HABITS){ showMsg('That’s the max — drop one first'); return; }
        list.push({id:id, mentorVisible:true});
      }
      S.habits=list; render();
    };
  });
  document.querySelectorAll('[data-hpeye]').forEach(function(b){
    b.onclick=function(){
      var id=b.getAttribute('data-hpeye');
      S.habits=myHabits().map(function(hb){
        return hb.id===id ? {id:hb.id, mentorVisible:!hb.mentorVisible} : hb;
      });
      render();
    };
  });

  // --- goals ---
  var eg=document.getElementById('editGoals');
  if(eg) eg.onclick=function(){
    var rec=goalsForWeek(thisWeek());
    var items=(rec&&rec.items)?rec.items.slice():[];
    while(items.length<3) items.push({text:'',done:false});
    S.goalDraft=items; render();
  };
  var cg=document.getElementById('cancelGoals');
  if(cg) cg.onclick=function(){ S.goalDraft=null; render(); };
  document.querySelectorAll('[data-goaltext]').forEach(function(inp){
    inp.oninput=function(){
      var i=Number(inp.getAttribute('data-goaltext'));
      if(!S.goalDraft) return;
      S.goalDraft[i]=S.goalDraft[i]||{text:'',done:false};
      S.goalDraft[i].text=inp.value;
    };
  });
  document.querySelectorAll('[data-goalmetric]').forEach(function(sel){
    sel.onchange=function(){
      var i=Number(sel.getAttribute('data-goalmetric'));
      if(!S.goalDraft) return;
      S.goalDraft[i]=S.goalDraft[i]||{text:'',done:false};
      S.goalDraft[i].metricKey=sel.value;
    };
  });
  var sg=document.getElementById('saveGoals');
  if(sg) sg.onclick=function(){
    if(S.busy) return;
    var items=(S.goalDraft||[]).map(function(g){
      return {text:(g.text||'').trim(), done:!!g.done, metricKey:g.metricKey||''};
    });
    if(!items.some(function(g){return g.text;})){ showMsg('Write at least one goal'); return; }
    S.busy=true; sg.disabled=true; sg.textContent='…';
    run('saveGoals',[S.auth.user,S.auth.pin,thisWeek(),items],function(d){
      S.busy=false;
      if(d.ok){ S.goals=d.goals||[]; S.goalDraft=null; showMsg('Goals saved'); }
      else showMsg('Could not save goals');
      render();
    });
  };
  document.querySelectorAll('[data-goaltick]').forEach(function(b){
    b.onclick=function(){
      if(S.busy) return;
      var rec=goalsForWeek(thisWeek());
      if(!rec) return;
      var i=Number(b.getAttribute('data-goaltick'));
      var written=rec.items.filter(function(x){ return x.text; });
      if(!written[i]) return;
      written[i].done=!written[i].done;
      S.busy=true;
      run('saveGoals',[S.auth.user,S.auth.pin,thisWeek(),written],function(d){
        S.busy=false;
        if(d.ok) S.goals=d.goals||[];
        render();
      });
    };
  });

  // --- ministry KPIs ---
  document.querySelectorAll('[data-kpi]').forEach(function(inp){
    inp.oninput=function(){ S.kpiDraft[inp.getAttribute('data-kpi')]=inp.value; };
  });
  // --- which KPIs show on the daily card ---
  var ksa=document.getElementById('kpiShowAll');
  if(ksa) ksa.onclick=function(){ S.kpiAll=true; render(); };
  var ksl=document.getElementById('kpiShowLess');
  if(ksl) ksl.onclick=function(){ S.kpiAll=false; render(); };
  var pk=document.getElementById('pickKpis');
  if(pk) pk.onclick=function(){ S.kpiPick=true; render(); };
  document.querySelectorAll('[data-kpipin]').forEach(function(b){
    b.onclick=function(){
      var m=b.getAttribute('data-kpipin');
      var pins=((S.ministry&&S.ministry.pins)||[]).slice();
      var at=pins.indexOf(m);
      if(at>-1) pins.splice(at,1);
      else {
        if(pins.length>=8){ showMsg('Eight is the max — unstar one first'); return; }
        pins.push(m);
      }
      S.ministry=Object.assign({}, S.ministry, {pins:pins});
      render();
    };
  });
  var skp=document.getElementById('saveKpiPins');
  if(skp) skp.onclick=function(){
    if(S.busy) return;
    S.busy=true; skp.disabled=true; skp.textContent='…';
    run('saveMyKpiPins',[S.auth.user,S.auth.pin,(S.ministry&&S.ministry.pins)||[]],function(d){
      S.busy=false;
      if(d.ok){ S.ministry=d; S.kpiPick=false; S.kpiAll=false; showMsg('Saved'); }
      else showMsg('Could not save');
      render();
    });
  };

  var skb=document.getElementById('saveKpiBtn');
  if(skb) skb.onclick=function(){
    if(S.busy) return;
    var updates=[];
    document.querySelectorAll('[data-kpi]').forEach(function(inp){
      updates.push({
        metric:inp.getAttribute('data-kpi'),
        mode:inp.getAttribute('data-kpimode')||'sum',
        value: inp.value==='' ? null : Number(inp.value)
      });

    S.busy=true; skb.disabled=true; skb.textContent='…';
    // Saves the DAY; the server rolls the week up from the days it holds.
    run('saveMyKpiDay',[S.auth.user,S.auth.pin,todayStr(),updates],function(d){
      S.busy=false;
      if(d.ok){ S.ministry=d; S.kpiDraft={}; showMsg('Saved — week total updated'); }
      else showMsg('Could not save');
      render();
    });
  };

function gpGo(p){
  // Asking for the dashboard means asking not to be redirected back here for
  // the rest of this browser session (see the guard at the top of index.html).
  if(p!=='teams'){ try { sessionStorage.setItem('gp-skip-teams','1'); } catch(e){} }
  window.location.href = p==='teams' ? 'teams.html' : 'index.html';
}

/* Promise flavour of run() for the refresh gesture. Always resolves, even on a
   failed request — otherwise a dropped connection would leave the spinner
   turning forever. */
function runP(fn, args){
  return fetch('/.netlify/functions/api', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ fn:fn, args:args })
  }).then(function(r){ return r.ok ? r.json() : null; }).catch(function(){ return null; });
}

function refreshAll(){
  if(!S.me) return Promise.resolve();
  var u=S.auth.user, k=S.auth.pin;
  return Promise.all([
    runP('teamRoster',[]).then(function(r){ if(Array.isArray(r)) S.roster=r; }),
    runP('getMyLogs',[u,k]).then(function(d){
      if(d&&d.ok){ S.logs=d.logs; if(d.habits) S.habits=d.habits; if(d.profile) S.profile=Object.assign(S.profile||{}, d.profile); }
    }),
    runP('getMyWeekly',[u,k]).then(function(d){ if(d&&d.ok){ S.goals=d.goals||[]; S.checkins=d.checkins||[]; } }),
    runP('getMyMinistry',[u,k]).then(function(d){ if(d&&d.ok) S.ministry=d; }),
    runP('getMyMentees',[u,k]).then(function(d){ if(d&&d.ok) S.mentees=d.mentees; }),
    runP('getMyMentorRequests',[u,k]).then(function(d){ if(d&&d.ok) S.mentorRequests=d.requests; }),
    runP('getMyTrips',[u,k]).then(function(d){ if(d&&d.ok) S.trips=d; }),
    runP('getTripRequests',[u,k]).then(function(d){ if(d&&d.ok) S.tripRequests=d.requests||[]; }),
    runP('getData',['']).then(function(d){ if(d&&d.entries) S.base=d; })
  ]).then(function(){ render(); });
}

/* ---------- pull to refresh ----------
   Mirrors the dashboard: engages only at the top of the page, takes over from
   the native rubber-band, and never fires while a form is mid-edit. Haptics go
   through navigator.vibrate — Android feels them, iOS Safari doesn't implement
   the API. */
(function(){
  var ptr=document.getElementById('ptr');
  if(!ptr || !('ontouchstart' in window)) return;
  var THRESHOLD=68, MAX=108, RESIST=0.55;
  var startY=null, pull=0, armed=false, busy=false;

  function buzz(p){ if(navigator.vibrate){ try{ navigator.vibrate(p); }catch(e){} } }
  function setPull(px){
    pull=px;
    ptr.style.transform='translateY('+(Math.min(px,MAX)-60)+'px)';
    ptr.style.opacity=Math.min(1, px/THRESHOLD);
  }
  function reset(){
    ptr.classList.remove('dragging');
    ptr.style.transform=''; ptr.style.opacity='';
    startY=null; pull=0; armed=false;
  }

  document.addEventListener('touchstart', function(e){
    if(busy || e.touches.length!==1 || window.scrollY>0) return;
    // Don't hijack the gesture while someone is typing or picking things.
    var a=document.activeElement;
    if(a && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) return;
    startY=e.touches[0].clientY;
    ptr.classList.add('dragging');
  }, { passive:true });

  document.addEventListener('touchmove', function(e){
    if(startY===null || busy) return;
    var dy=e.touches[0].clientY-startY;
    if(dy<=0 || window.scrollY>0){ if(pull) reset(); return; }
    e.preventDefault();
    setPull(dy*RESIST);
    if(!armed && pull>=THRESHOLD){ armed=true; buzz(12); }
    else if(armed && pull<THRESHOLD){ armed=false; }
  }, { passive:false });

  document.addEventListener('touchend', function(){
    if(startY===null || busy) return;
    if(pull<THRESHOLD){ reset(); return; }
    busy=true; startY=null;
    ptr.classList.remove('dragging');
    ptr.classList.add('spinning');
    ptr.style.transform='translateY(14px)';
    ptr.style.opacity='1';
    buzz([8,40,12]);
    refreshAll().then(function(){
      ptr.classList.remove('spinning');
      busy=false; reset();
    });
  }, { passive:true });

  document.addEventListener('touchcancel', function(){ if(!busy) reset(); }, { passive:true });
})();

boot();
</script>
