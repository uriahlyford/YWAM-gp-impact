<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>GonPreah — Teams</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="YWAM GP">
<meta name="theme-color" content="#17150F">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='47' fill='%231F44FF'/%3E%3Ctext x='50' y='64' font-family='Arial' font-weight='bold' font-size='40' fill='%23FAF6F0' text-anchor='middle'%3EGP%3C/text%3E%3Cpath d='M76 12 L78.6 19.4 L86 22 L78.6 24.6 L76 32 L73.4 24.6 L66 22 L73.4 19.4 Z' fill='%23FFB323'/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.json">
<style>
@import url('https://fonts.googleapis.com/css2?family=Koulen&family=Kantumruy+Pro:wght@400;500;700&display=swap');
* { box-sizing:border-box; margin:0; }
html { overscroll-behavior:none; }
body { background:#FAF6F0; color:#17150F; font-family:'Kantumruy Pro',system-ui,sans-serif; padding-bottom:76px; overscroll-behavior:none; overflow-x:hidden; -webkit-text-size-adjust:100%; }
button, select, input { font-family:inherit; }
input:focus, select:focus, button:focus-visible { outline:3px solid #1F44FF; outline-offset:1px; }

header { background:#17150F; color:#FAF6F0; padding:16px; display:flex; justify-content:space-between; align-items:center; }
.brand { display:flex; align-items:center; gap:10px; }
.mark { width:38px; height:38px; border-radius:50%; background:#1F44FF; color:#FAF6F0; font-family:'Koulen',sans-serif;
  font-size:20px; display:flex; align-items:center; justify-content:center; position:relative; }
.mark::after { content:'✦'; position:absolute; top:-4px; right:-4px; color:#FFB323; font-size:14px; }
.brandKh { font-family:'Koulen',sans-serif; font-size:22px; letter-spacing:1px; line-height:1; }
.brandEn { font-size:9px; letter-spacing:3px; color:#FFB323; font-weight:700; }
.hbtns { display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
.hbtn { border:1px solid #4a463d; background:transparent; color:#FAF6F0; border-radius:999px; padding:6px 12px; font-size:13px; cursor:pointer; }

main { padding:18px 16px; max-width:640px; margin:0 auto; }
h2 { font-family:'Koulen',sans-serif; font-size:24px; letter-spacing:.5px; margin:0 0 4px; }
h2 small { font-family:'Kantumruy Pro',sans-serif; font-size:14px; color:#6b6557; font-weight:400; }
h3 { font-family:'Koulen',sans-serif; font-size:16px; letter-spacing:.5px; margin:22px 0 8px; }
.sub { font-size:13px; color:#6b6557; margin-bottom:16px; line-height:1.5; }

.card { background:#fff; border:1px solid #e4ddd0; border-radius:12px; padding:14px; margin-bottom:12px; }
label.f { display:block; font-size:11px; letter-spacing:1.5px; font-weight:700; color:#6b6557; text-transform:uppercase; margin:12px 0 4px; }
label.f:first-child { margin-top:0; }
input[type=text], input[type=tel], input[type=number], input[type=password], select {
  width:100%; font-size:15px; padding:11px; border-radius:10px; border:1.5px solid #17150F; background:#fff; color:#17150F; }
.hint { font-size:11.5px; color:#a39c8d; margin-top:4px; }
.lock { color:#c98700; font-size:11px; font-weight:700; }

.btn { width:100%; margin-top:16px; padding:13px; font-family:'Koulen',sans-serif; font-size:18px; letter-spacing:1px;
  background:#1F44FF; color:#fff; border:none; border-radius:12px; cursor:pointer; transition:transform .08s ease; }
.btn:active { transform:scale(.97); }
.btn:disabled { opacity:.6; }
.btn.ghost { background:transparent; color:#17150F; border:1.5px solid #17150F; font-size:14px; font-family:'Kantumruy Pro',sans-serif; }
.linkbtn { background:none; border:none; color:#1F44FF; font-size:14px; cursor:pointer; text-decoration:underline; padding:8px; width:100%; margin-top:8px; }
.danger { background:none; border:none; color:#a33; font-size:13px; cursor:pointer; padding:8px; }

.row { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid #f0eadf; }
.row:last-child { border-bottom:none; }
.rowName { font-size:14.5px; line-height:1.3; }
.rowVal { font-family:'Koulen',sans-serif; font-size:18px; color:#1F44FF; white-space:nowrap; }
.qBlock { padding:12px 0; border-bottom:1px solid #f0eadf; }
.qBlock:last-of-type { border-bottom:none; }
.qText { font-size:14.5px; margin-bottom:8px; line-height:1.35; }
.seg { display:flex; gap:8px; }
.seg button { flex:1; padding:10px; border-radius:10px; border:1.5px solid #c9c3b6; background:#FAF6F0; font-size:15px; cursor:pointer; }
.seg button.on { background:#1F44FF; border-color:#1F44FF; color:#fff; font-weight:700; }
.seg button.on.bad { background:#a33; border-color:#a33; }
.scale { display:flex; gap:4px; flex-wrap:wrap; }
.scale button { width:36px; height:36px; border-radius:9px; border:1.5px solid #c9c3b6; background:#FAF6F0; font-size:13px; cursor:pointer; }
.scale button.on { background:#1F44FF; border-color:#1F44FF; color:#fff; font-weight:700; }
.numIn { display:flex; align-items:center; gap:10px; }
.numIn input { width:110px; text-align:right; border:1.5px solid #c9c3b6; background:#FAF6F0; }

.pcard { display:flex; align-items:center; gap:14px; }
.avatar { width:64px; height:64px; border-radius:50%; object-fit:cover; border:2px solid #e4ddd0; background:#f0eadf; flex-shrink:0; }
.avatar.lg { width:96px; height:96px; }
.avatar.ph { display:flex; align-items:center; justify-content:center; font-family:'Koulen',sans-serif; font-size:26px; color:#a39c8d; }
.pname { font-family:'Koulen',sans-serif; font-size:22px; letter-spacing:.5px; }
.pmeta { font-size:13px; color:#6b6557; margin-top:2px; }

.chips { display:flex; gap:8px; flex-wrap:wrap; margin:6px 0 4px; }
.chip { background:#FFF1D6; border:1px solid #ffd98a; color:#17150F; border-radius:999px; padding:5px 12px; font-size:13px; font-weight:700; }
.chip.blue { background:#e8ecff; border-color:#b9c4ff; }

.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:10px; }
.stat { background:#fff; border:1px solid #e4ddd0; border-radius:12px; padding:12px; }
.statNum { font-family:'Koulen',sans-serif; font-size:26px; color:#1F44FF; line-height:1.1; }
.statLabel { font-size:11.5px; color:#6b6557; margin-top:2px; line-height:1.3; }

.dir { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; }
.dircard { background:#fff; border:1px solid #e4ddd0; border-radius:12px; padding:14px; text-align:center; cursor:pointer; }
.dircard .avatar { margin:0 auto 8px; }
.dircard .pname { font-size:16px; }

nav.bottom { position:fixed; bottom:0; left:0; right:0; background:#fff; border-top:1px solid #e4ddd0;
  display:flex; z-index:10; }
nav.bottom button { flex:1; padding:10px 2px 8px; background:none; border:none; cursor:pointer; color:#6b6557; font-size:10.5px; }
nav.bottom button .ic { display:block; font-size:20px; margin-bottom:2px; }
nav.bottom button.on { color:#1F44FF; font-weight:700; }

.banner { background:#FFF1D6; border:1px solid #ffd98a; border-radius:10px; padding:11px 13px; font-size:13px; line-height:1.45; color:#5c4a1e; margin-bottom:14px; }
.privateWrap { border:1.5px dashed #ffd98a; border-radius:12px; padding:4px 14px 8px; margin-top:12px; background:#fffdf8; }
.privateWrap .qBlock { border-color:#f4e7c8; }
.msg { position:fixed; left:50%; bottom:86px; transform:translateX(-50%); background:#17150F; color:#FAF6F0;
  padding:10px 18px; border-radius:999px; font-size:14px; z-index:20; opacity:0; transition:opacity .2s; pointer-events:none; max-width:90%; }
.msg.show { opacity:1; }
.loading { padding:50px; text-align:center; color:#6b6557; }
footer { text-align:center; font-size:12px; color:#6b6557; margin-top:26px; }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="mark">GP</div>
    <div><div class="brandKh">កូនព្រះ · Teams</div><div class="brandEn">MY PROGRESS</div></div>
  </div>
  <div class="hbtns" id="hbtns"></div>
</header>

<main id="main"><div class="loading">…</div></main>
<nav class="bottom hidden" id="bottomNav"></nav>
<div class="msg" id="msg"></div>

<script>
var CAMPUSES = [{id:'poipet',name:'YWAM Poipet',short:'Poipet'},{id:'siemreap',name:'YWAM Siem Reap',short:'Siem Reap'}];
var DEPTS = ['Community Service','Youth Education','Leadership Development','Skills Training','Base Leadership'];

var TOGGLES = [
  {id:'workout',    text:'Did I work out today?'},
  {id:'bible',      text:'Did I read my Bible today?'},
  {id:'quietTime',  text:'Did I have a quiet time / prayer today?'},
  {id:'oneOnOne',   text:'Did I have a one-on-one today?'},
  {id:'sharedFaith',text:'Did I share my faith today?'},
  {id:'sabbath',    text:'Is today a sabbath / rest day?'}
];
var MOODS = [
  {id:'clarity', text:'How clear am I on what to do today?'},
  {id:'growth',  text:'How would I rate my growth today?'}
];

var S = {
  auth:{user:'', pin:''}, me:null, profile:null,
  logs:[], roster:[], mentees:[], mentorRequests:[], view:'today',
  todayDraft:{}, regMode:false, mentee:null, menteeLogs:[], busy:false
};

/* ---------- helpers ---------- */
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;'); }
function todayStr(){ var d=new Date(); return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
function initials(name){ return String(name||'?').trim().split(/\s+/).map(function(w){return w[0];}).slice(0,2).join('').toUpperCase(); }
function deptOfMe(){ return S.me ? S.me.dept : ''; }
function campusName(id){ for(var i=0;i<CAMPUSES.length;i++) if(CAMPUSES[i].id===id) return CAMPUSES[i].name; return id; }
function nameOf(id){ for(var i=0;i<S.roster.length;i++) if(S.roster[i].id===id) return S.roster[i].name; return '—'; }

function avatarHtml(person, cls){
  cls = cls||'';
  if(person && person.photo) return '<img class="avatar '+cls+'" src="'+esc(person.photo)+'" alt="" onerror="this.outerHTML=\'<div class=\\\'avatar '+cls+' ph\\\'>'+esc(initials(person.name))+'</div>\'">';
  return '<div class="avatar '+cls+' ph">'+esc(initials(person?person.name:'')) +'</div>';
}

function showMsg(t){
  var m=document.getElementById('msg'); m.textContent=t; m.classList.add('show');
  clearTimeout(m._t); m._t=setTimeout(function(){ m.classList.remove('show'); }, 2200);
}

function run(fn, args, onOk){
  fetch('/.netlify/functions/api', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ fn: fn, args: args })
  }).then(function(res){
    if(!res.ok) throw new Error('HTTP '+res.status);
    return res.json();
  }).then(onOk).catch(function(){ showMsg("Connection problem — try again."); S.busy=false; render(); });
}

/* consecutive-day streak ending today or yesterday */
function streak(pred){
  var have={}; S.logs.forEach(function(l){ if(pred(l)) have[l.date]=1; });
  var d=new Date(); var n=0;
  // allow streak to still count if today not logged yet
  if(!have[fmtD(d)]) d.setDate(d.getDate()-1);
  while(have[fmtD(d)]){ n++; d.setDate(d.getDate()-1); }
  return n;
}
function fmtD(d){ return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
function thisWeekLogs(){
  // Monday-based week matching the backend
  var d=new Date(); var day=(d.getDay()+6)%7; var mon=new Date(d); mon.setDate(d.getDate()-day); mon.setHours(0,0,0,0);
  var ms=fmtD(mon);
  return S.logs.filter(function(l){ return l.date>=ms; });
}
function sum(rows, f){ var t=0; rows.forEach(function(r){ t+=Number(f(r))||0; }); return t; }
function count(rows, f){ var n=0; rows.forEach(function(r){ if(f(r)) n++; }); return n; }

/* ---------- boot ---------- */
function boot(){
  var saved = null;
  try { saved = JSON.parse(localStorage.getItem('gp-staff')||'null'); } catch(e){}
  if(saved && saved.user && saved.pin){
    S.auth = saved;
    run('staffLogin', [saved.user, saved.pin], function(d){
      if(d.ok){ S.me=d.staff; S.profile=d.profile; afterLogin(); }
      else { localStorage.removeItem('gp-staff'); render(); }
    });
  } else { render(); }
}
function afterLogin(){
  localStorage.setItem('gp-staff', JSON.stringify(S.auth));
  run('teamRoster', [], function(r){ S.roster = Array.isArray(r)?r:[]; render(); });
  run('getMyLogs', [S.auth.user, S.auth.pin], function(d){ if(d.ok){ S.logs=d.logs; if(d.profile) S.profile=Object.assign(S.profile||{}, d.profile); } render(); });
  run('getMyMentees', [S.auth.user, S.auth.pin], function(d){ if(d.ok){ S.mentees=d.mentees; } render(); });
  run('getMyMentorRequests', [S.auth.user, S.auth.pin], function(d){ if(d.ok){ S.mentorRequests=d.requests; } render(); });
  S.view='today'; render();
}
function logout(){ localStorage.removeItem('gp-staff'); S.me=null; S.auth={user:'',pin:''}; S.logs=[]; S.mentees=[]; render(); }

/* ---------- render root ---------- */
function render(){
  var hb=document.getElementById('hbtns');
  var nav=document.getElementById('bottomNav');
  if(!S.me){
    hb.innerHTML = '<button class="hbtn" id="backBtn">← Dashboard</button>';
    nav.classList.add('hidden');
    document.getElementById('main').innerHTML = S.regMode ? registerHtml() : loginHtml();
    bind();
    return;
  }
  hb.innerHTML = '<button class="hbtn" id="backBtn">← Dashboard</button>';
  var tabs=[['today','Today','✍️'],['me','Me','💚'],['team','Team','👥'],['profile','Profile','⚙️']];
  var reqN=S.mentorRequests?S.mentorRequests.length:0;
  if(S.mentees.length || reqN) tabs.splice(3,0,['mentor','Mentor'+(reqN?' ('+reqN+')':''),'🤝']);
  nav.classList.remove('hidden');
  nav.innerHTML = tabs.map(function(t){
    return '<button class="'+(S.view===t[0]?'on':'')+'" data-tab="'+t[0]+'"><span class="ic">'+t[2]+'</span>'+t[1]+'</button>';
  }).join('');
  var m=document.getElementById('main');
  if(S.view==='today') m.innerHTML=todayHtml();
  else if(S.view==='me') m.innerHTML=meHtml();
  else if(S.view==='team') m.innerHTML=teamHtml();
  else if(S.view==='mentor') m.innerHTML=mentorHtml();
  else m.innerHTML=profileHtml();
  bind();
}

/* ---------- login / register ---------- */
function loginHtml(){
  return '<h2>Welcome back</h2><p class="sub">Log in with your username and 4-digit PIN.</p>'+
    '<div class="card">'+
    '<label class="f">Username</label><input type="text" id="li_user" autocapitalize="none" placeholder="e.g. sokha">'+
    '<label class="f">PIN</label><input type="password" id="li_pin" inputmode="numeric" maxlength="4" placeholder="••••">'+
    '<button class="btn" id="loginBtn">Log in</button>'+
    '<button class="linkbtn" id="toReg">New here? Create my profile</button></div>';
}
function registerHtml(){
  var opts = S.roster.map(function(p){ return '<option value="'+esc(p.id)+'">'+esc(p.name)+' · '+esc(p.dept)+'</option>'; }).join('');
  return '<h2>Create my profile</h2><p class="sub">Pick a username and a 4-digit PIN you\u2019ll remember. You can add a photo right after.</p>'+
    '<div class="card">'+
    '<label class="f">Full name</label><input type="text" id="r_name" placeholder="Your name">'+
    '<label class="f">Username</label><input type="text" id="r_user" autocapitalize="none" placeholder="lowercase, no spaces"><div class="hint">Letters, numbers, . _ - (2\u201320 chars)</div>'+
    '<label class="f">PIN (4 digits)</label><input type="password" id="r_pin" inputmode="numeric" maxlength="4" placeholder="••••">'+
    '<label class="f">Campus</label><select id="r_campus">'+CAMPUSES.map(function(c){return '<option value="'+c.id+'">'+c.name+'</option>';}).join('')+'</select>'+
    '<label class="f">Department</label><select id="r_dept">'+DEPTS.map(function(d){return '<option>'+d+'</option>';}).join('')+'</select>'+
    '<label class="f">Role / team</label><input type="text" id="r_role" placeholder="e.g. Cafe barista, DTS staff">'+
    '<label class="f">My mentor <span class="lock">🔒 sees my private check-ins</span></label><select id="r_mentor"><option value="">— choose later —</option>'+opts+'</select>'+
    '<label class="f">Phone (optional)</label><input type="tel" id="r_phone" placeholder="">'+
    '<label class="f">Year I joined (optional)</label><input type="number" id="r_joined" placeholder="2024">'+
    '<button class="btn" id="regBtn">Create profile</button>'+
    '<button class="linkbtn" id="toLogin">I already have a profile</button></div>';
}

/* ---------- today ---------- */
function todayHtml(){
  var d=S.todayDraft;
  var existing=null; S.logs.forEach(function(l){ if(l.date===todayStr()) existing=l; });
  if(existing && !d._loaded){ Object.keys(existing).forEach(function(k){ if(k!=='date'&&k!=='week') d[k]=existing[k]; }); d._loaded=true; }
  var h='<h2>Today <small>· '+esc(todayStr())+'</small></h2><p class="sub">A quick daily check-in. Your hours and habits build your streaks.</p>';

  h+='<div class="card"><div class="qBlock"><div class="qText">Language study today</div><div class="numIn"><input type="number" inputmode="decimal" min="0" step="0.5" id="n_langHours" value="'+(d.langHours!=null?d.langHours:'')+'"> hours</div></div>'+
     '<div class="qBlock"><div class="qText">Community ministry today</div><div class="numIn"><input type="number" inputmode="decimal" min="0" step="0.5" id="n_minHours" value="'+(d.minHours!=null?d.minHours:'')+'"> hours</div></div></div>';

  h+='<div class="card">';
  TOGGLES.forEach(function(q){
    h+='<div class="qBlock"><div class="qText">'+esc(q.text)+'</div><div class="seg">'+
      '<button data-yn="'+q.id+'|1" class="'+(d[q.id]===true||d[q.id]===1?'on':'')+'">Yes</button>'+
      '<button data-yn="'+q.id+'|0" class="'+(d[q.id]===false||d[q.id]===0?'on':'')+'">No</button></div></div>';
  });
  MOODS.forEach(function(q){
    h+='<div class="qBlock"><div class="qText">'+esc(q.text)+'</div><div class="scale">';
    for(var i=1;i<=10;i++) h+='<button data-scale="'+q.id+'|'+i+'" class="'+(Number(d[q.id])===i?'on':'')+'">'+i+'</button>';
    h+='</div></div>';
  });
  h+='</div>';

  // private block
  h+='<div class="privateWrap"><h3 style="margin:10px 0 2px">🔒 Private</h3>'+
     '<p class="hint" style="margin-bottom:4px">Only you'+(S.me.mentorId?' and '+esc(nameOf(S.me.mentorId)):'')+' can see these. Leaders only ever see anonymous totals.</p>';
  h+='<div class="qBlock"><div class="qText">How lonely do I feel today? <span class="hint">(1 = not at all, 10 = very)</span></div><div class="scale">';
  for(var j=1;j<=10;j++) h+='<button data-scale="lonely|'+j+'" class="'+(Number(d.lonely)===j?'on':'')+'">'+j+'</button>';
  h+='</div></div>';
  h+='<div class="qBlock"><div class="qText">Did I look at porn today?</div><div class="seg">'+
     '<button data-yn="porn|1" class="'+(d.porn===true||d.porn===1?'on bad':'')+'">Yes</button>'+
     '<button data-yn="porn|0" class="'+(d.porn===false||d.porn===0?'on':'')+'">No</button></div></div></div>';

  h+='<button class="btn" id="saveDayBtn">'+(existing?'Update today':'Save today')+'</button>';
  return h;
}

/* ---------- me ---------- */
function meHtml(){
  var wl=thisWeekLogs();
  var logStreak=streak(function(){return true;});
  var h='<div class="card"><div class="pcard">'+avatarHtml(S.me,'lg')+
    '<div><div class="pname">'+esc(S.me.name)+'</div><div class="pmeta">'+esc(S.me.dept)+(S.me.role?' · '+esc(S.me.role):'')+'</div>'+
    '<div class="pmeta">'+esc(campusName(S.me.campus))+'</div></div></div>'+
    '<div class="chips" style="margin-top:12px">'+
    (logStreak>0?'<span class="chip">🔥 '+logStreak+'-day streak</span>':'')+
    '<span class="chip blue">quiet time '+streak(function(l){return l.quietTime;})+'d</span>'+
    '<span class="chip blue">workout '+streak(function(l){return l.workout;})+'d</span>'+
    '<span class="chip blue">Bible '+streak(function(l){return l.bible;})+'d</span>'+
    '</div></div>';

  h+='<h3>📅 This week</h3><div class="grid">';
  var cells=[
    [sum(wl,function(r){return r.langHours;}).toFixed(1),'Language hrs'],
    [sum(wl,function(r){return r.minHours;}).toFixed(1),'Ministry hrs'],
    [count(wl,function(r){return r.workout;}),'Workout days'],
    [count(wl,function(r){return r.quietTime;}),'Quiet-time days'],
    [count(wl,function(r){return r.bible;}),'Bible days'],
    [count(wl,function(r){return r.oneOnOne;}),'One-on-ones'],
    [count(wl,function(r){return r.sharedFaith;}),'Shared faith'],
    [count(wl,function(r){return r.sabbath;}),'Sabbaths']
  ];
  cells.forEach(function(c){ h+='<div class="stat"><div class="statNum">'+c[0]+'</div><div class="statLabel">'+c[1]+'</div></div>'; });
  h+='</div>';

  h+='<h3>🗓️ Recent days</h3><div class="card">';
  if(!S.logs.length) h+='<p class="sub" style="margin:6px 0">No entries yet — log your first day on the Today tab.</p>';
  S.logs.slice(0,7).forEach(function(l){
    var bits=[];
    if(l.langHours) bits.push(l.langHours+'h lang');
    if(l.minHours) bits.push(l.minHours+'h min');
    if(l.workout) bits.push('workout');
    if(l.quietTime) bits.push('quiet time');
    if(l.bible) bits.push('Bible');
    h+='<div class="row"><span class="rowName">'+esc(l.date)+'<div class="pmeta">'+(bits.join(' · ')||'—')+'</div></span></div>';
  });
  h+='</div>';
  return h;
}

/* ---------- team directory ---------- */
function teamHtml(){
  var byCampus={};
  S.roster.forEach(function(p){ (byCampus[p.campus]=byCampus[p.campus]||[]).push(p); });
  var h='<h2>Team <small>· '+S.roster.length+' staff</small></h2>'+
    '<p class="sub">Everyone with a profile. This is also where "Total Staff" comes from now — no separate counting.</p>';
  CAMPUSES.forEach(function(c){
    var list=byCampus[c.id]||[];
    if(!list.length) return;
    h+='<h3>'+esc(c.name)+' · '+list.length+'</h3><div class="dir">';
    list.forEach(function(p){
      h+='<div class="dircard" data-person="'+esc(p.id)+'">'+avatarHtml(p)+'<div class="pname">'+esc(p.name)+'</div><div class="pmeta">'+esc(p.dept)+'</div>'+(p.role?'<div class="pmeta">'+esc(p.role)+'</div>':'')+'</div>';
    });
    h+='</div>';
  });
  if(!S.roster.length) h+='<p class="sub">No profiles yet.</p>';
  return h;
}

/* ---------- mentor ---------- */
function mentorHtml(){
  if(S.mentee){
    var m=S.mentee, wl=S.menteeLogs;
    var h='<button class="linkbtn" id="menteeBack" style="text-align:left;text-decoration:none">← All mentees</button>';
    h+='<div class="card"><div class="pcard">'+avatarHtml(m,'lg')+'<div><div class="pname">'+esc(m.name)+'</div><div class="pmeta">'+esc(m.dept)+(m.role?' · '+esc(m.role):'')+'</div></div></div></div>';
    h+='<div class="banner">🔒 Shared with you as '+esc(m.name.split(' ')[0])+'\u2019s mentor. Hold it with care and prayer — this is trust, not surveillance.</div>';
    if(S.menteeProfile && S.menteeProfile.debt) h+='<div class="banner">💰 Currently carrying staff debt.</div>';
    h+='<h3>Recent check-ins</h3><div class="card">';
    if(!wl.length) h+='<p class="sub" style="margin:6px 0">No entries yet.</p>';
    wl.slice(0,14).forEach(function(l){
      var flags=[];
      if(l.lonely!=null) flags.push('lonely '+l.lonely+'/10');
      if(l.porn) flags.push('⚠ porn');
      if(l.quietTime) flags.push('quiet time');
      if(l.workout) flags.push('workout');
      h+='<div class="row"><span class="rowName">'+esc(l.date)+'<div class="pmeta">'+(flags.join(' · ')||'—')+'</div></span></div>';
    });
    h+='</div>';
    return h;
  }
  var h='';
  if(S.mentorRequests && S.mentorRequests.length){
    h+='<h2>Mentor requests <small>· '+S.mentorRequests.length+'</small></h2>'+
      '<p class="sub">These people chose you as their mentor. Accepting gives you access to their private check-ins — decline if that’s not a fit.</p><div class="dir">';
    S.mentorRequests.forEach(function(p){
      h+='<div class="dircard" style="cursor:default">'+avatarHtml(p)+'<div class="pname">'+esc(p.name)+'</div><div class="pmeta">'+esc(p.dept)+'</div>'+
        '<div style="display:flex;gap:6px;margin-top:10px"><button class="btn" style="margin:0;padding:8px 4px;font-size:13px" data-accept="'+esc(p.id)+'">Accept</button>'+
        '<button class="btn ghost" style="margin:0;padding:8px 4px;font-size:13px" data-decline="'+esc(p.id)+'">Decline</button></div></div>';
    });
    h+='</div>';
  }
  h+='<h2>My mentees <small>· '+S.mentees.length+'</small></h2>'+
    '<p class="sub">People who chose you as their mentor and you’ve accepted. You can see their private check-ins.</p><div class="dir">';
  S.mentees.forEach(function(p){
    h+='<div class="dircard" data-mentee="'+esc(p.id)+'">'+avatarHtml(p)+'<div class="pname">'+esc(p.name)+'</div><div class="pmeta">'+esc(p.dept)+'</div></div>';
  });
  h+='</div>';
  return h;
}

/* ---------- profile ---------- */
function profileHtml(){
  var p=S.profile||{};
  var opts=S.roster.filter(function(x){return x.id!==S.me.id;}).map(function(x){
    return '<option value="'+esc(x.id)+'"'+(S.me.mentorId===x.id?' selected':'')+'>'+esc(x.name)+' · '+esc(x.dept)+'</option>';
  }).join('');
  var h='<h2>My profile</h2>';
  h+='<div class="card"><div class="pcard">'+avatarHtml(S.me,'lg')+
     '<div><button class="btn ghost" id="photoBtn" style="width:auto;margin:0;padding:9px 14px">'+(S.me.photo?'Change photo':'Add photo')+'</button>'+
     '<input type="file" accept="image/*" id="photoInput" style="display:none"></div></div></div>';
  h+='<div class="card">'+
    '<label class="f">Full name</label><input type="text" id="p_name" value="'+esc(S.me.name)+'">'+
    '<label class="f">Campus</label><select id="p_campus">'+CAMPUSES.map(function(c){return '<option value="'+c.id+'"'+(S.me.campus===c.id?' selected':'')+'>'+c.name+'</option>';}).join('')+'</select>'+
    '<label class="f">Department</label><select id="p_dept">'+DEPTS.map(function(d){return '<option'+(S.me.dept===d?' selected':'')+'>'+d+'</option>';}).join('')+'</select>'+
    '<label class="f">Role / team</label><input type="text" id="p_role" value="'+esc(S.me.role)+'">'+
    '<label class="f">My mentor <span class="lock">🔒 sees my private check-ins</span></label><select id="p_mentor"><option value="">— none —</option>'+opts+'</select>'+
    (p.mentorStatus==='pending' ? '<div class="hint">⏳ Waiting for them to accept</div>' : p.mentorStatus==='approved' ? '<div class="hint">✓ Accepted — they can see your private check-ins</div>' : '')+
    '<label class="f">Phone</label><input type="tel" id="p_phone" value="'+esc(p.phone||'')+'">'+
    '<label class="f">Year joined</label><input type="number" id="p_joined" value="'+esc(p.joined||'')+'">'+
    '<label class="f">Staff debt <span class="lock">🔒 private</span></label><div class="seg" style="max-width:220px">'+
      '<button id="debtY" class="'+(p.debt?'on bad':'')+'">Yes</button><button id="debtN" class="'+(!p.debt?'on':'')+'">No</button></div>'+
    '<button class="btn" id="saveProfBtn">Save profile</button></div>';
  h+='<div class="card"><label class="f">Change PIN</label><input type="password" id="p_newpin" inputmode="numeric" maxlength="4" placeholder="new 4-digit PIN">'+
     '<button class="btn ghost" id="pinBtn">Update PIN</button></div>';
  h+='<button class="danger" id="logoutBtn" style="width:100%">Log out</button>';
  h+='<footer>✦ Every number is a person.</footer>';
  return h;
}

/* ---------- photo resize + upload ---------- */
function handlePhoto(file){
  var reader=new FileReader();
  reader.onload=function(e){
    var img=new Image();
    img.onload=function(){
      var max=300, w=img.width, h=img.height;
      if(w>h && w>max){ h=Math.round(h*max/w); w=max; } else if(h>max){ w=Math.round(w*max/h); h=max; }
      var cv=document.createElement('canvas'); cv.width=w; cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      var data=cv.toDataURL('image/jpeg',0.7).split(',')[1];
      showMsg('Uploading photo…');
      run('uploadPhoto',[S.auth.user,S.auth.pin,data,'image/jpeg'],function(d){
        if(d.ok){ S.me.photo=d.photo; showMsg('Photo updated'); render(); } else showMsg(d && d.err==='too_large' ? 'Photo too large \u2014 try a smaller one' : 'Upload failed');
      });
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}

/* ---------- bind ---------- */
function bind(){
  var back=document.getElementById('backBtn');
  if(back) back.onclick=function(){ gpGo('index'); };

  document.querySelectorAll('[data-tab]').forEach(function(b){
    b.onclick=function(){ S.view=b.getAttribute('data-tab'); S.mentee=null; render(); };
  });

  // login
  var lb=document.getElementById('loginBtn');
  if(lb) lb.onclick=function(){
    var u=document.getElementById('li_user').value.trim();
    var pin=document.getElementById('li_pin').value.trim();
    if(!u||!/^\d{4}$/.test(pin)){ showMsg('Enter username + 4-digit PIN'); return; }
    lb.disabled=true; lb.textContent='…';
    run('staffLogin',[u,pin],function(d){
      if(d.ok){ S.auth={user:u,pin:pin}; S.me=d.staff; S.profile=d.profile; afterLogin(); }
      else { lb.disabled=false; lb.textContent='Log in'; showMsg('Wrong username or PIN'); }
    });
  };
  var toReg=document.getElementById('toReg'); if(toReg) toReg.onclick=function(){ S.regMode=true; if(!S.roster.length){ run('teamRoster',[],function(r){S.roster=Array.isArray(r)?r:[];render();}); } else render(); };
  var toLogin=document.getElementById('toLogin'); if(toLogin) toLogin.onclick=function(){ S.regMode=false; render(); };

  // register
  var rb=document.getElementById('regBtn');
  if(rb) rb.onclick=function(){
    var payload={
      name:document.getElementById('r_name').value.trim(),
      username:document.getElementById('r_user').value.trim(),
      pin:document.getElementById('r_pin').value.trim(),
      campus:document.getElementById('r_campus').value,
      dept:document.getElementById('r_dept').value,
      role:document.getElementById('r_role').value.trim(),
      mentorId:document.getElementById('r_mentor').value,
      phone:document.getElementById('r_phone').value.trim(),
      joined:document.getElementById('r_joined').value.trim()
    };
    if(!payload.name){ showMsg('Add your name'); return; }
    if(!/^[a-z0-9._-]{2,20}$/.test(payload.username.toLowerCase())){ showMsg('Username: lowercase letters/numbers, 2–20'); return; }
    if(!/^\d{4}$/.test(payload.pin)){ showMsg('PIN must be 4 digits'); return; }
    rb.disabled=true; rb.textContent='…';
    run('staffRegister',[payload],function(d){
      if(d.ok){ S.auth={user:payload.username.toLowerCase(),pin:payload.pin}; S.me=d.staff; S.profile=d.profile; S.regMode=false; afterLogin(); showMsg('Profile created — add a photo!'); S.view='profile'; render(); }
      else { rb.disabled=false; rb.textContent='Create profile'; showMsg(d.err==='taken'?'That username is taken':'Check your details'); }
    });
  };

  // today toggles/scales/nums
  document.querySelectorAll('[data-yn]').forEach(function(b){ b.onclick=function(){ var p=b.getAttribute('data-yn').split('|'); S.todayDraft[p[0]]=Number(p[1])===1; render(); }; });
  document.querySelectorAll('[data-scale]').forEach(function(b){ b.onclick=function(){ var p=b.getAttribute('data-scale').split('|'); S.todayDraft[p[0]]=Number(p[1]); render(); }; });
  var nl=document.getElementById('n_langHours'); if(nl) nl.onchange=function(){ S.todayDraft.langHours=nl.value===''?null:Number(nl.value); };
  var nm=document.getElementById('n_minHours'); if(nm) nm.onchange=function(){ S.todayDraft.minHours=nm.value===''?null:Number(nm.value); };
  var sd=document.getElementById('saveDayBtn');
  if(sd) sd.onclick=function(){
    var d=S.todayDraft;
    // capture any unblurred number inputs
    if(nl) d.langHours=nl.value===''?null:Number(nl.value);
    if(nm) d.minHours=nm.value===''?null:Number(nm.value);
    sd.disabled=true; sd.textContent='Saving…';
    run('saveDaily',[S.auth.user,S.auth.pin,todayStr(),d],function(res){
      if(res.ok){ S.logs=res.logs; showMsg('✦ Saved for today'); S.view='me'; render(); }
      else { sd.disabled=false; sd.textContent='Save today'; showMsg('Could not save'); }
    });
  };

  // team + mentor cards
  document.querySelectorAll('[data-mentee]').forEach(function(c){
    c.onclick=function(){
      var id=c.getAttribute('data-mentee');
      run('getMenteeLogs',[S.auth.user,S.auth.pin,id],function(d){
        if(d.ok){ S.mentee=d.mentee; S.menteeLogs=d.logs; S.menteeProfile=d.profile; render(); }
        else showMsg('Not available');
      });
    };
  });
  var mBack=document.getElementById('menteeBack'); if(mBack) mBack.onclick=function(){ S.mentee=null; render(); };
  document.querySelectorAll('[data-accept]').forEach(function(b){
    b.onclick=function(){
      var id=b.getAttribute('data-accept');
      run('respondToMentorRequest',[S.auth.user,S.auth.pin,id,true],function(d){
        if(d.ok) S.mentorRequests=d.requests;
        run('getMyMentees',[S.auth.user,S.auth.pin],function(r){ if(r.ok) S.mentees=r.mentees; render(); });
      });
    };
  });
  document.querySelectorAll('[data-decline]').forEach(function(b){
    b.onclick=function(){
      var id=b.getAttribute('data-decline');
      run('respondToMentorRequest',[S.auth.user,S.auth.pin,id,false],function(d){
        if(d.ok) S.mentorRequests=d.requests;
        render();
      });
    };
  });

  // profile
  var pb=document.getElementById('photoBtn'), pi=document.getElementById('photoInput');
  if(pb&&pi){ pb.onclick=function(){ pi.click(); }; pi.onchange=function(){ if(pi.files&&pi.files[0]) handlePhoto(pi.files[0]); }; }
  var dY=document.getElementById('debtY'), dN=document.getElementById('debtN');
  if(dY&&dN){ dY.onclick=function(){ S.profile=S.profile||{}; S.profile.debt=true; render(); }; dN.onclick=function(){ S.profile=S.profile||{}; S.profile.debt=false; render(); }; }
  var sp=document.getElementById('saveProfBtn');
  if(sp) sp.onclick=function(){
    var payload={
      name:document.getElementById('p_name').value.trim(),
      campus:document.getElementById('p_campus').value,
      dept:document.getElementById('p_dept').value,
      role:document.getElementById('p_role').value.trim(),
      mentorId:document.getElementById('p_mentor').value,
      phone:document.getElementById('p_phone').value.trim(),
      joined:document.getElementById('p_joined').value.trim(),
      debt:S.profile&&S.profile.debt?true:false
    };
    sp.disabled=true; sp.textContent='Saving…';
    run('updateProfile',[S.auth.user,S.auth.pin,payload],function(d){
      if(d.ok){ S.me=d.staff; S.profile=d.profile; showMsg('Profile saved'); run('teamRoster',[],function(r){S.roster=Array.isArray(r)?r:[];render();}); }
      else { sp.disabled=false; sp.textContent='Save profile'; showMsg('Could not save'); }
    });
  };
  var pinBtn=document.getElementById('pinBtn');
  if(pinBtn) pinBtn.onclick=function(){
    var np=document.getElementById('p_newpin').value.trim();
    if(!/^\d{4}$/.test(np)){ showMsg('PIN must be 4 digits'); return; }
    run('changePin',[S.auth.user,S.auth.pin,np],function(d){
      if(d.ok){ S.auth.pin=np; localStorage.setItem('gp-staff',JSON.stringify(S.auth)); showMsg('PIN updated'); }
      else showMsg('Could not update PIN');
    });
  };
  var lo=document.getElementById('logoutBtn'); if(lo) lo.onclick=logout;
}

function gpGo(p){
  window.location.href = p==='teams' ? 'teams.html' : 'index.html';
}

boot();
</script>
