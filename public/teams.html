<style>
@import url('https://fonts.googleapis.com/css2?family=Koulen&family=Kantumruy+Pro:wght@400;500;700&display=swap');
* { box-sizing:border-box; margin:0; }
html { overscroll-behavior:none; }
body { background:#FAF6F0; color:#17150F; font-family:'Kantumruy Pro',system-ui,sans-serif; padding-bottom:76px; overscroll-behavior:none; overflow-x:hidden; -webkit-text-size-adjust:100%; }
button, select, input { font-family:inherit; }
input:focus, select:focus, button:focus-visible { outline:3px solid #1F44FF; outline-offset:1px; }

header { background:#17150F; color:#FAF6F0; padding:16px; display:flex; justify-content:space-between; align-items:center; }
.brand { display:flex; align-items:center; gap:10px; }
.mark { width:38px; height:38px; border-radius:50%; background:#1F44FF; color:#FAF6F0; font-family:'Koulen',sans-serif;

.hbtns { display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; }

main { padding:18px 16px; max-width:640px; margin:0 auto; }
h2 { font-family:'Koulen',sans-serif; font-size:24px; letter-spacing:.5px; margin:0 0 4px; }

input[type=text], input[type=tel], input[type=number], input[type=password], select {

/* today's habits */
.habitGrid { display:grid; grid-template-columns:repeat(auto-fit,minmax(96px,1fr)); gap:9px; margin:4px 0 10px; }
.habitBtn { display:flex; flex-direction:column; align-items:center; gap:3px; padding:12px 6px 9px;

.habitBtn .hIcon { font-size:21px; line-height:1; }

.habitPick .hpBox { width:26px; height:26px; border-radius:7px; border:1.5px solid #c9c3b6;
  background:#FAF6F0; color:#fff; font-weight:700; font-size:14px; cursor:pointer; line-height:1; flex:0 0 auto; }
.habitPick .hpBox.on { background:#1F44FF; border-color:#1F44FF; }
.habitPick .hpEye { font-size:11px; color:#6b6557; background:none; border:0; cursor:pointer;
  font-family:inherit; padding:4px 6px; white-space:nowrap; }

/* bible reading */
.reading { font-family:'Koulen',sans-serif; font-size:21px; letter-spacing:.5px; color:#17150F;
  background:#FFF1D6; border:1px solid #ffd98a; border-radius:10px; padding:11px 13px; margin:2px 0 10px; }
.banner.big { font-size:14px; padding:13px 15px; }
.trend { display:inline-block; font-size:12px; font-weight:700; padding:1px 6px; border-radius:6px; margin-left:4px; }
.trend.up { color:#0a7d3c; background:#e3f6ea; }
.trend.down { color:#b3261e; background:#fbe6e6; }
.trend.flat { color:#6b6557; background:#efeae0; }

/* pull-to-refresh — same gesture as the dashboard. This page has the text "GP"
   mark rather than the embedded logo, so the coin spins that instead. */
.ptr { position:fixed; top:0; left:0; right:0; z-index:60; display:flex; justify-content:center;
  pointer-events:none; opacity:0; transform:translateY(-60px);

.ptr.dragging { transition:none; }
.ptrCoin { width:40px; height:40px; border-radius:50%; margin-top:10px; background:#1F44FF;
  color:#FAF6F0; font-family:'Koulen',sans-serif; font-size:16px; letter-spacing:.5px;
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 6px 18px rgba(31,68,255,.32), 0 0 0 3px rgba(31,68,255,.12); }
.ptr.spinning .ptrCoin { animation:spin 1s linear infinite; }
@keyframes spin { to { transform:rotate(360deg) } }
@media (prefers-reduced-motion: reduce){ .ptr.spinning .ptrCoin { animation:none } }
/* collapsed sections — keep the front page short */
.discloseBtn { display:flex; width:100%; align-items:center; justify-content:space-between; gap:12px;
  background:transparent; border:0; border-top:1px solid #f0eadf; padding:13px 0 4px; margin-top:6px;
  font-family:inherit; font-size:14.5px; text-align:left; color:#17150F; cursor:pointer; }
.card.slim .discloseBtn { border-top:0; padding-top:2px; margin-top:0; }
.discloseBtn .chev { color:#6b6557; font-size:13px; }
.card.slim { padding:12px 14px; }
.linkbtn.inline { display:inline; width:auto; padding:0; text-decoration:underline; }
.msg { position:fixed; left:50%; bottom:86px; transform:translateX(-50%); background:#17150F; color:#FAF6F0;
  padding:10px 18px; border-radius:999px; font-size:14px; z-index:20; opacity:0; transition:opacity .2s; pointer-events:none; max-width:90%; }
.msg.show { opacity:1; }
.loading { padding:50px; text-align:center; color:#6b6557; }
footer { text-align:center; font-size:12px; color:#6b6557; margin-top:26px; }

<header>
  <div class="brand">
    <div class="mark">GP</div>

  </div>

</header>

<main id="main"><div class="loading">…</div></main>

<script>
/*  Error boundary — must come first, before any other script.

    This page is the app's front door for signed-in staff, so a failure here
    used to be inescapable: index.html redirects here, and a blank screen gave
    no way back to the dashboard. The fallback always offers that way out. */
(function(){
  var shown = false;
  function fallback(what){
    if(shown) return; shown = true;
    // Latch it so a later render() can't paint over the message.
    window.gpDead = true;
    var html =
      '<div style="max-width:420px;margin:12vh auto;padding:0 22px;text-align:center;'+
      'font-family:system-ui,sans-serif;color:#17150F">'+
      '<div style="font-size:40px;line-height:1">✦</div>'+
      '<h2 style="font-size:19px;margin:14px 0 8px">This didn’t load properly</h2>'+
      '<p style="font-size:14.5px;line-height:1.5;color:#6b6557;margin:0 0 18px">'+
      'Usually a connection hiccup. Nothing you’ve logged was lost.</p>'+
      '<button id="gpReload" style="width:100%;padding:14px;border:0;border-radius:12px;'+
      'background:#1F44FF;color:#fff;font-size:16px;font-weight:700;cursor:pointer">Try again</button>'+
      '<button id="gpDash" style="width:100%;padding:13px;margin-top:9px;border:1.5px solid #c9c3b6;'+
      'border-radius:12px;background:transparent;color:#17150F;font-size:15px;cursor:pointer">Open the dashboard</button>'+
      '<div style="font-size:11px;color:#a09a8c;margin-top:20px">'+String(what||'').slice(0,140)+'</div>'+
      '</div>';
    function paint(){
      var host = document.getElementById('main') || document.body;
      if(!host) return;
      host.innerHTML = html;
      var nav = document.getElementById('bottomNav');
      if(nav) nav.classList.add('hidden');
      var r = document.getElementById('gpReload');
      if(r) r.onclick = function(){ location.reload(); };
      var d = document.getElementById('gpDash');
      if(d) d.onclick = function(){
        // Break the auto-redirect so the dashboard is actually reachable.
        try { sessionStorage.setItem('gp-skip-teams','1'); } catch(e){}
        location.href = 'index.html';
      };
    }
    if(document.body) paint();
    else document.addEventListener('DOMContentLoaded', paint);
  }
  window.addEventListener('error', function(e){
    if(e && e.target && e.target.tagName === 'SCRIPT'){
      fallback('could not load ' + (e.target.src || 'a script'));
      return;
    }
    if(e && e.message) fallback(e.message);
  }, true);
  window.addEventListener('unhandledrejection', function(e){
    fallback((e && e.reason && e.reason.message) || 'unexpected error');
  });
  window.gpBootFailed = fallback;
})();
</script>
<script src="km.js"></script>
<script src="taxonomy.js"></script>
<script>
if(typeof getDepartments !== 'function' || typeof CAMPUSES === 'undefined'){
  window.gpBootFailed('taxonomy.js did not load');
  // Throwing stops the rest of this script, so nothing paints over the message.
  throw new Error('taxonomy.js missing');
}
/* CAMPUSES, getDepartments(), modeOf() and the metric lists come from
   taxonomy.js — the same file the dashboard uses, so a staff member's KPI
   card always matches what leadership sees. */
function deptsFor(campusId){ return Object.keys(getDepartments(campusId||'poipet')); }
function ministriesFor(campusId, dept){
  var d = getDepartments(campusId||'poipet')[dept];
  return d ? Object.keys(d) : [];
}
function metricsFor(campusId, dept, ministry){
  var d = getDepartments(campusId||'poipet')[dept];
  var list = (d && d[ministry]) ? d[ministry] : [];
  // Staff never see or edit the leadership-only financial metrics; the server
  // enforces this too, this just keeps them off the screen.
  return list.filter(function(m){ return SENSITIVE.indexOf(m) === -1; });
}

/* The yes/no dailies are habit tiles now (see HABIT_LIBRARY) — one tap each
   instead of a list of questions. Only the 1-10 scales still need asking, and
   they sit in the collapsed part of the Today card. */
var MOODS = [
  {id:'clarity', text:'How clear am I on what to do today?'},
  {id:'growth',  text:'How would I rate my growth today?'}
];

var S = {
  auth:{user:'', pin:''}, me:null, profile:null,
  logs:[], roster:[], mentees:[], mentorRequests:[], view:'home',
  todayDraft:{}, regMode:false, mentee:null, menteeLogs:[], menteeGoals:[], busy:false,
  goals:[], checkins:[], goalDraft:null, ministry:null, kpiDraft:{}, weekDraft:{},
  habits:null, habitEdit:false, sharedHabits:[],
  todayOpen:false, weekOpen:false, kpiAll:false, kpiPick:false, person:null
};

var HABIT_LIBRARY = [
  {id:'bible',       label:'Bible reading',   icon:'📖'},
  {id:'quietTime',   label:'Quiet time / prayer', icon:'🙏'},
  {id:'workout',     label:'Workout',         icon:'💪'},
  {id:'ateWell',     label:'Ate well',        icon:'🥗'},
  {id:'sleptWell',   label:'Slept well',      icon:'😴'},
  {id:'language',    label:'Language study',  icon:'🗣️'},
  {id:'gratitude',   label:'Gratitude',       icon:'✨'},
  {id:'oneOnOne',    label:'One-on-one',      icon:'☕'},
  {id:'sharedFaith', label:'Shared my faith', icon:'💬'},
  {id:'sabbath',     label:'Sabbath / rest',  icon:'🌿'}
];
var MAX_HABITS=6;
function habitMeta(id){
  for(var i=0;i<HABIT_LIBRARY.length;i++) if(HABIT_LIBRARY[i].id===id) return HABIT_LIBRARY[i];
  return {id:id,label:id,icon:'•'};
}
function myHabits(){
  return (S.habits && S.habits.length) ? S.habits
    : [{id:'bible',mentorVisible:true},{id:'quietTime',mentorVisible:true},{id:'workout',mentorVisible:true}];
}

/* ---------- week helpers (must match isoWeek_ in netlify/functions/api.js) ---------- */
/* Mirrors MIN_WEEK_DAYS in the API: below this many logged days the week isn't
   scored or reported. Kept in step by hand — if you change one, change both. */
var MIN_WEEK_DAYS = 3;
function isoWeekOf(d){
  var y=d.getFullYear();
  var jan1=new Date(y,0,1);
  var monW1=new Date(y,0,1-((jan1.getDay()+6)%7));
  return Math.max(1, Math.min(52, Math.floor((d-monW1)/(7*86400000))+1));
}
function thisWeek(){ return isoWeekOf(new Date()); }
function goalsForWeek(week){
  for(var i=0;i<S.goals.length;i++) if(Number(S.goals[i].week)===Number(week)) return S.goals[i];
  return null;
}
function checkinForWeek(week){
  for(var i=0;i<S.checkins.length;i++) if(Number(S.checkins[i].week)===Number(week)) return S.checkins[i];
  return null;
}

/* ---------- language ----------
   Same contract as the dashboard: t() looks the English up in the reviewed
   Khmer dictionary and falls back to the English when there's no entry, so a
   missing translation degrades to English rather than breaking a page.
   Khmer is the first language of most people using this page every day, so a
   string added here without a dictionary entry is a gap, not a finished job. */
var LANG = (function(){ try { return localStorage.getItem('gp-lang')||'en'; } catch(e){ return 'en'; } })();
function t(s){ return LANG==='km' ? (BUILTIN_KM[s] || s) : s; }
function toggleLang(){
  LANG = LANG==='km' ? 'en' : 'km';
  try { localStorage.setItem('gp-lang', LANG); } catch(e){}
  render();
}

/* ---------- helpers ---------- */
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;'); }
function todayStr(){ var d=new Date(); return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
function initials(name){ return String(name||'?').trim().split(/\s+/).map(function(w){return w[0];}).slice(0,2).join('').toUpperCase(); }
function deptOfMe(){ return S.me ? S.me.dept : ''; }

function run(fn, args, onOk){
  fetch('/.netlify/functions/api', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ fn: fn, args: args })
  }).then(function(res){
    if(!res.ok) throw new Error('HTTP '+res.status);
    return res.json();
  }).then(onOk).catch(function(){ showMsg("Connection problem — try again."); S.busy=false; render(); });
}

/* consecutive-day streak ending today or yesterday */
function streak(pred){
  var have={}; S.logs.forEach(function(l){ if(pred(l)) have[l.date]=1; });
  var d=new Date(); var n=0;
  // allow streak to still count if today not logged yet
  if(!have[fmtD(d)]) d.setDate(d.getDate()-1);
  while(have[fmtD(d)]){ n++; d.setDate(d.getDate()-1); }
  return n;
}

/* Forgiving streak: one missed day doesn't wipe the run, it spends the single
   grace day. Punitive streaks are why habit trackers get deleted in February. */
function graceStreak(pred){
  var have={}; S.logs.forEach(function(l){ if(pred(l)) have[l.date]=1; });
  var d=new Date();
  if(!have[fmtD(d)]) d.setDate(d.getDate()-1);   // today's not due yet
  var n=0, grace=1;
  while(true){
    if(have[fmtD(d)]){ n++; }
    else if(grace>0 && n>0){ grace--; }          // never start on a grace day
    else break;
    d.setDate(d.getDate()-1);
  }
  return n;
}
function bestStreak(pred){
  var days=S.logs.filter(pred).map(function(l){return l.date;}).sort();
  var best=0, run=0, prev=null;
  days.forEach(function(ds){
    if(prev){
      var gap=Math.round((new Date(ds+'T00:00:00')-new Date(prev+'T00:00:00'))/86400000);
      run = gap===1 ? run+1 : 1;
    } else run=1;
    if(run>best) best=run;
    prev=ds;
  });
  return best;
}
/* Habit results live in l.habits, but the original fixed columns (bible,
   workout, quietTime…) hold the history from before habits were configurable —
   fall back to them so nobody's streak resets to zero on this change. */
function didHabit(l, id){
  if(l.habits && l.habits[id]!==undefined) return !!l.habits[id];
  return !!l[id];
}
function habitPred(id){ return function(l){ return didHabit(l,id); }; }
function logForDate(ds){
  for(var i=0;i<S.logs.length;i++) if(S.logs[i].date===ds) return S.logs[i];
  return null;
}
function fmtD(d){ return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
function thisWeekLogs(){
  // Monday-based week matching the backend
  var d=new Date(); var day=(d.getDay()+6)%7; var mon=new Date(d); mon.setDate(d.getDate()-day); mon.setHours(0,0,0,0);
  var ms=fmtD(mon);
  return S.logs.filter(function(l){ return l.date>=ms; });
}
function sum(rows, f){ var acc=0; rows.forEach(function(r){ acc+=Number(f(r))||0; }); return acc; }
function count(rows, f){ var n=0; rows.forEach(function(r){ if(f(r)) n++; }); return n; }

/* ---------- boot ---------- */
function boot(){
  var saved = null;
  try { saved = JSON.parse(localStorage.getItem('gp-staff')||'null'); } catch(e){}
  if(saved && saved.user && saved.pin){
    S.auth = saved;
    run('staffLogin', [saved.user, saved.pin], function(d){
      if(d.ok){ S.me=d.staff; S.profile=d.profile; afterLogin(); }
      else { localStorage.removeItem('gp-staff'); render(); }
    });
  } else { render(); }
}
/* Small public snapshot so the dashboard's top-right chip can show your face
   and name without needing your PIN. Nothing private goes in here. */
function saveStaffCard(){
  try {
    localStorage.setItem('gp-staff-card', JSON.stringify({
      name: S.me.name, photo: S.me.photo || '', ministry: S.me.ministry || ''
    }));
  } catch(e){}
}

function afterLogin(){
  localStorage.setItem('gp-staff', JSON.stringify(S.auth));
  saveStaffCard();
  run('teamRoster', [], function(r){ S.roster = Array.isArray(r)?r:[]; render(); });
  run('getMyLogs', [S.auth.user, S.auth.pin], function(d){
    if(d.ok){
      S.logs=d.logs;
      if(d.habits) S.habits=d.habits;
      if(d.profile) S.profile=Object.assign(S.profile||{}, d.profile);
    }
    render();
  });
  run('getMyMentees', [S.auth.user, S.auth.pin], function(d){ if(d.ok){ S.mentees=d.mentees; } render(); });
  run('getMyMentorRequests', [S.auth.user, S.auth.pin], function(d){ if(d.ok){ S.mentorRequests=d.requests; } render(); });
  run('getMyWeekly', [S.auth.user, S.auth.pin], function(d){ if(d.ok){ S.goals=d.goals||[]; S.checkins=d.checkins||[]; } render(); });
  run('getMyMinistry', [S.auth.user, S.auth.pin], function(d){ if(d.ok){ S.ministry=d; } render(); });
  S.view='home'; render();
}
function logout(){
  localStorage.removeItem('gp-staff');
  localStorage.removeItem('gp-staff-card');
  S.me=null; S.auth={user:'',pin:''}; S.logs=[]; S.mentees=[];
  S.goals=[]; S.checkins=[]; S.ministry=null; S.goalDraft=null; S.weekDraft={}; S.kpiDraft={};
  render();
}

/* ---------- render root ---------- */
function render(){
  if(window.gpDead) return;   // an error message is on screen; leave it there
  var hb=document.getElementById('hbtns');
  var nav=document.getElementById('bottomNav');
  if(!S.me){
    hb.innerHTML = '<button class="hbtn" id="langBtn">'+(LANG==='km'?'EN':'ខ្មែរ')+'</button>'+'<button class="hbtn" id="backBtn">'+esc(t('Dashboard'))+'</button>';
    nav.classList.add('hidden');
    document.getElementById('main').innerHTML = S.regMode ? registerHtml() : loginHtml();
    bind();
    return;
  }
  hb.innerHTML = '<button class="hbtn" id="langBtn">'+(LANG==='km'?'EN':'ខ្មែរ')+'</button>'+'<button class="hbtn" id="backBtn">'+esc(t('Dashboard'))+'</button>';
  /* Four tabs, not six: today's check-in lives ON Home (a daily tool's daily
     thing shouldn't be a tab away), Profile folded into Me, and Mentor reached
     from Team. */
  var reqN=S.mentorRequests?S.mentorRequests.length:0;
  var tabs=[['home','Home','🏠'],['team','Team'+(reqN?' ('+reqN+')':''),'👥'],['me','Me','💚']];
  nav.classList.remove('hidden');
  nav.innerHTML = tabs.map(function(tab){
    return '<button class="'+(S.view===tab[0]?'on':'')+'" data-tab="'+tab[0]+'"><span class="ic">'+tab[2]+'</span>'+t(tab[1])+'</button>';
  }).join('');
  var m=document.getElementById('main');
  if(S.view==='home') m.innerHTML=homeHtml();
  else if(S.view==='me') m.innerHTML=meHtml();
  else if(S.view==='team') m.innerHTML=teamHtml();
  else if(S.view==='mentor') m.innerHTML=mentorHtml();
  else m.innerHTML=profileHtml();
  bind();
}

/* ---------- home: the first thing you see after logging in ---------- */
function greeting(){
  var h=new Date().getHours();
  return h<12 ? 'Good morning' : (h<18 ? 'Good afternoon' : 'Good evening');
}

/* The app knows what day it is. Monday you're setting goals, midweek you're
   keeping habits, Friday you're closing the week out — so the card that matters
   today sits at the top instead of the same fixed wall every day. */
function weekPhase(){
  var dow=new Date().getDay();               // 0 Sun … 6 Sat
  if(dow===1||dow===2) return 'plan';
  if(dow===5||dow===6||dow===0) return 'review';
  return 'work';
}
function phaseBanner(phase, wk){
  var rec=goalsForWeek(wk);
  var hasGoals=!!(rec && rec.items.some(function(i){return i.text;}));
  if(phase==='plan' && !hasGoals)
    return '<div class="banner big">🎯 <strong>Start of the week.</strong> Pick the three things that matter for week '+wk+'.'+
      ' <button class="linkbtn inline" id="jumpGoals">Set them now</button></div>';
  if(phase==='review'){
    var done=hasGoals ? rec.items.filter(function(i){return i.text&&i.done;}).length : 0;
    var tot=hasGoals ? rec.items.filter(function(i){return i.text;}).length : 0;
    if(hasGoals && done<tot)
      return '<div class="banner big">✅ <strong>End of the week.</strong> You’ve marked '+done+' of '+tot+
        ' goals done. <button class="linkbtn inline" id="jumpGoals">Close out week '+wk+'</button></div>';
    if(!thisWeekLogs().length)
      return '<div class="banner big">💚 <strong>End of the week.</strong> No days logged yet — '+
        'your week’s health figures come straight from these.'+
        ' <button class="linkbtn inline" id="jumpToday">Log today</button></div>';
  }
  return '';
}

function homeHtml(){
  var wk=thisWeek();
  var first=String(S.me.name||'').trim().split(/\s+/)[0];
  var wl=thisWeekLogs();
  var phase=weekPhase();

  /* --- who you are --- */
  var h='<div class="card"><div class="pcard">'+avatarHtml(S.me,'lg')+
    '<div><div class="pmeta">'+esc(greeting())+'</div>'+
    '<div class="pname">'+esc(first)+'</div>'+
    '<div class="pmeta">'+esc(t(S.me.role||S.me.dept))+
      (S.me.ministry?' · '+esc(t(S.me.ministry)):'')+'</div>'+
    '<div class="pmeta">'+esc(campusName(S.me.campus))+' · week '+wk+'</div></div></div>';
  // Streak only — hours live in the week summary below, and the per-habit
  // streaks live on Me. No need to say any of it three times.
  var st=graceStreak(function(){return true;});
  h+='<div class="chips" style="margin-top:12px">'+
    (st>0?'<span class="chip">🔥 '+st+'-day streak</span>'
        : '<span class="chip blue">'+wl.length+' of 7 days logged</span>')+
    '</div></div>';

  h+=phaseBanner(phase, wk);

  /* Today's habits come first on ordinary days; on planning and review days
     the weekly cards lead instead. */
  var daily = habitsCardHtml();
  var weekly = goalsCardHtml(wk);
  h += (phase==='work') ? (daily + weekly) : (weekly + daily);
  h += kpiCardHtml(wk);
  h += weekSummaryHtml(wk);
  return h;
}

/* One line, not a form. The week's health figures are computed from the daily
   check-ins — the old weekly survey asked the same eleven questions over
   again, so it's gone. Tap to see what the base will actually receive. */
function weekSummaryHtml(wk){
  var c=checkinForWeek(wk);
  var wl=thisWeekLogs();
  if(!c && !wl.length) return '';
  var open=S.weekOpen;
  // Your own weekly score, using exactly the maths the base dashboard uses on
  // the pooled data — so the chain daily → your week → base health is visible
  // rather than something that happens off-screen.
  var score = c ? compositeOf(c) : null;
  // No score until there's enough of a week to mean anything — showing a low
  // number built from one day would just be wrong, and it isn't sent to the
  // base either. Say how many more days instead.
  var short = MIN_WEEK_DAYS - wl.length;
  var sub = score!==null ? wl.length+' of 7 days logged'
    : (wl.length===0 ? 'log a day and this starts filling in'
                     : wl.length+' day'+(wl.length===1?'':'s')+' logged · '+short+' more for your score');
  var h='<div class="card slim"><button class="discloseBtn" id="weekToggle">'+
    '<span><strong>💚 My week '+wk+'</strong>'+
    '<div class="pmeta">'+esc(sub)+'</div></span>'+
    '<span class="'+(score===null?'chev':'pctBig')+'">'+
      (score===null ? (open?'▴':'▾') : score.toFixed(1))+'</span></button>';
  if(score!==null){
    h+='<div class="bar" style="margin-top:8px"><div class="barFill'+(score>=8?' done':'')+
       '" style="width:'+Math.round(score*10)+'%"></div></div>'+
       '<div class="pmeta">Health score out of 10, from the '+wl.length+' day'+(wl.length===1?'':'s')+
       ' you logged · feeds the base total for '+esc(campusName(S.me.campus))+'</div>';
  }
  if(open && c){
    var yn=function(v){ return v? 'yes':'no'; };
    var rows=[
      ['Loneliness (avg)', c.lonely||'—'],
      ['Clarity (avg)', c.clarity||'—'],
      ['Growth (avg)', c.growth||'—'],
      ['Exercised 3+ days', yn(c.exercise)],
      ['Regular quiet time', yn(c.quietTime)],
      ['One-on-one', yn(c.oneOnOne)],
      ['Shared faith', yn(c.sharedFaith)],
      ['Sabbath', yn(c.sabbath)],
      ['Language hours', c.langHours||0],
      ['Ministry hours', c.minHours||0]
    ];
    h+='<div style="margin-top:10px">';
    rows.forEach(function(r){
      h+='<div class="row"><span class="rowName">'+esc(r[0])+'</span><span class="pctSm">'+esc(String(r[1]))+'</span></div>';
    });
    h+='<p class="hint" style="margin-top:8px">Leaders only ever see these pooled with everyone else’s — never your name.</p></div>';
  } else if(open){
    h+='<p class="sub" style="margin:10px 0 0">Nothing yet for this week. It appears once you log a day.</p>';
  }
  return h+'</div>';
}

  });

     screen. They're the same daily entry, so they're folded in here behind a

      for(var i=1;i<=10;i++) h+='<button data-scale="'+q.id+'|'+i+'" class="'+(Number(d[q.id])===i?'on':'')+'">'+i+'</button>';

    h+='</div></div><div class="qBlock"><div class="qText">Did I look at porn today?</div><div class="seg">'+

    h+='<button class="btn" id="saveDayBtn">Save today</button>';

function todaySummaryLine(log){
  if(!log) return 'Not logged yet';
  var bits=[];
  if(log.langHours) bits.push(log.langHours+'h language');
  if(log.minHours) bits.push(log.minHours+'h ministry');
  if(log.clarity!=null) bits.push('clarity '+log.clarity);
  if(log.growth!=null) bits.push('growth '+log.growth);
  return bits.length ? bits.join(' · ') : 'Nothing added yet';
}


/* --- three weekly goals --- */
function goalsCardHtml(wk){
  var rec=goalsForWeek(wk);
  var editing = S.goalDraft !== null;
  var items = editing ? S.goalDraft
    : (rec && rec.items && rec.items.length ? rec.items : []);
  var written = items.filter(function(i){ return i && i.text; });

  var h='<h3>🎯 My 3 goals · week '+wk+'</h3>';

  if(!written.length && !editing){
    h+='<div class="card"><p class="sub" style="margin:4px 0 10px">No goals set for this week yet. Three is the whole point — pick the three that matter.</p>'+
      '<button class="btn" id="editGoals">Set this week’s goals</button></div>';
    h+=pastGoalsHtml(wk);
    return h;
  }

  h+='<div class="card">';
  if(editing){
    var mOpts=S.me.ministry ? metricsFor(S.me.campus,S.me.dept,S.me.ministry) : [];
    for(var i=0;i<3;i++){
      var gtext=(items[i]&&items[i].text)||'';
      var mk=(items[i]&&items[i].metricKey)||'';
      h+='<label class="f">Goal '+(i+1)+'</label>'+
        '<input type="text" maxlength="200" data-goaltext="'+i+'" value="'+esc(gtext)+'" placeholder="'+(i===0?'e.g. Disciple two students':'')+'">';
      // Linking a goal to one of your ministry's KPIs is what ties personal
      // follow-through to the numbers the base actually reports.
      if(mOpts.length){
        h+='<select data-goalmetric="'+i+'" class="goalSel"><option value="">— not tied to a KPI —</option>'+
          mOpts.map(function(mm){
            var key=S.me.dept+'|'+S.me.ministry+'|'+mm;
            return '<option value="'+esc(key)+'"'+(mk===key?' selected':'')+'>'+esc(t('moves'))+': '+esc(t(mm))+'</option>';
          }).join('')+'</select>';
      }
    }
    h+='<button class="btn" id="saveGoals">Save goals</button>'+
       '<button class="linkbtn" id="cancelGoals">Cancel</button>';
  } else {
    var pct=rec?rec.pct:null;
    h+='<div class="row" style="border:0;padding-top:0"><span class="rowName">End of week — did you get them done?</span>'+
       '<span class="pctBig">'+(pct===null?'—':pct+'%')+'</span></div>';
    h+='<div class="bar"><div class="barFill'+(pct>=100?' done':'')+'" style="width:'+(pct||0)+'%"></div></div>';
    written.forEach(function(g,i){
      var mm=g.metricKey?g.metricKey.split('|')[2]:'';
      h+='<div class="goalRow'+(g.done?' done':'')+'">'+
        '<button class="tick'+(g.done?' on':'')+'" data-goaltick="'+i+'" aria-label="Toggle goal '+(i+1)+'">'+(g.done?'✓':'')+'</button>'+
        '<span><span class="goalText">'+esc(g.text)+'</span>'+
        (mm?'<div class="goalLink">📊 moves '+esc(mm)+'</div>':'')+'</span></div>';
    });
    h+='<button class="btn ghost" id="editGoals" style="margin-top:12px">Edit goals</button>';
  }
  h+='</div>';
  h+=pastGoalsHtml(wk);
  return h;
}

function pastGoalsHtml(wk){
  var past=S.goals.filter(function(g){ return Number(g.week)!==Number(wk) && g.items.some(function(i){return i.text;}); });
  if(!past.length) return '';
  var hit=past.filter(function(g){ return g.pct!==null; });
  var avg=hit.length ? Math.round(hit.reduce(function(a,g){return a+g.pct;},0)/hit.length) : null;
  var h='<div class="card"><div class="row" style="border:0;padding-top:0"><span class="rowName">Previous weeks'+
    '<div class="pmeta">'+past.length+' week'+(past.length===1?'':'s')+' tracked</div></span>'+

/* --- your ministry's KPIs, editable without leaving this page --- */
function kpiCardHtml(wk){
  if(!S.me.ministry){
    return '<h3>📊 My ministry KPIs</h3><div class="card"><p class="sub" style="margin:4px 0 10px">'+
      'Set your ministry on the Profile tab and your team’s KPIs will show up here, ready to log.</p>'+
      '<button class="btn ghost" id="goProfile">Choose my ministry</button></div>';
  }
  var metrics=metricsFor(S.me.campus, S.me.dept, S.me.ministry);
  if(!metrics.length){
    return '<h3>📊 My ministry KPIs</h3><div class="card"><p class="sub" style="margin:4px 0">'+
      'No KPIs are defined for '+esc(S.me.ministry)+' yet.</p></div>';
  }
  /* Enter today; the week's figure is derived from the days on the server, so
     there's no separate weekly number to keep in step. */
  var entries=(S.ministry&&S.ministry.entries)||{};
  var daily=(S.ministry&&S.ministry.daily)||{};
  var pins=(S.ministry&&S.ministry.pins)||[];
  var today=todayStr();

  /* Only show what this person logs day to day. GP Media carries 29 metrics,
     and a 29-row daily form gets filled in never. No pins chosen yet means
     show everything, so nothing is hidden from someone who hasn't picked. */
  var showing = (pins.length && !S.kpiAll)
    ? metrics.filter(function(m){ return pins.indexOf(m)>-1; })
    : metrics;
  var hiddenN = metrics.length - showing.length;

  var h='<h3>📊 '+esc(t(S.me.ministry))+' <small>· today</small></h3><div class="card">';

  if(S.kpiPick){
    h+='<p class="sub" style="margin:2px 0 8px">Star the ones you log most days — '+
       'the rest stay one tap away under “show all”.</p>';
    metrics.forEach(function(metric){
      var on=pins.indexOf(metric)>-1;
      h+='<div class="habitPick">'+
        '<button class="hpBox'+(on?' on':'')+'" data-kpipin="'+esc(metric)+'">'+(on?'★':'')+'</button>'+
        '<span class="hpLabel">'+esc(t(metric))+'</span></div>';
    });
    return h+'<button class="btn" id="saveKpiPins" style="margin-top:12px">Done</button></div>';
  }

  h+='<p class="sub" style="margin:4px 0 10px">Log today’s numbers — week '+wk+
    ' adds up on its own.</p>';
  showing.forEach(function(metric){
    var mode=modeOf(metric);
    var days=daily[metric]||{};
    var cur = S.kpiDraft[metric]!==undefined ? S.kpiDraft[metric]
      : (days[today]!==undefined ? days[today] : '');
    var weekVal=(entries[metric]||{})[String(wk)];
    var label = mode==='latest' ? 'now' : (mode==='avg' ? 'week avg' : 'week total');
    h+='<div class="row"><span class="rowName">'+esc(t(metric))+
      '<div class="pmeta">'+label+' '+(weekVal===undefined?'—':weekVal)+'</div></span>'+
      '<input type="number" inputmode="decimal" class="kpiIn" data-kpi="'+esc(metric)+
      '" data-kpimode="'+mode+'" value="'+esc(String(cur))+'"></div>';
  });
  h+='<button class="btn" id="saveKpiBtn">Save today</button>';
  if(hiddenN>0) h+='<button class="linkbtn" id="kpiShowAll">Show all '+metrics.length+' ('+hiddenN+' hidden)</button>';
  else if(pins.length && S.kpiAll) h+='<button class="linkbtn" id="kpiShowLess">Show just my '+pins.length+'</button>';
  h+='<button class="linkbtn" id="pickKpis">'+(pins.length?'Change which I log daily':'Pick the ones I log daily')+'</button>';
  return h+'</div>';
}

/* ---------- me ---------- */
/* Me is the looking-back page: streaks, this week's totals, recent days,
   settings. Home already greets you and carries today's actions, so the
   identity card isn't repeated here — only the per-habit streaks Home
   doesn't show. */
function meHtml(){
  var wl=thisWeekLogs();
  var h='<h2>My progress</h2>';
  var runs=myHabits().map(function(hb){
    var meta=habitMeta(hb.id);
    return { label:meta.label, icon:meta.icon, now:graceStreak(habitPred(hb.id)), best:bestStreak(habitPred(hb.id)) };
  }).filter(function(r){ return r.now>0 || r.best>0; });
  if(runs.length){
    h+='<h3>🔥 Streaks</h3><div class="card">';
    runs.forEach(function(r){
      h+='<div class="row"><span class="rowName">'+r.icon+' '+esc(t(r.label))+
        '<div class="pmeta">best '+r.best+' day'+(r.best===1?'':'s')+'</div></span>'+
        '<span class="pctSm">'+r.now+'d</span></div>';
    });
    h+='</div>';
  }

  h+='<h3>📅 This week</h3><div class="grid">';
  var cells=[
    [sum(wl,function(r){return r.langHours;}).toFixed(1),'Language hrs'],
    [sum(wl,function(r){return r.minHours;}).toFixed(1),'Ministry hrs'],
    [count(wl,function(r){return r.workout;}),'Workout days'],
    [count(wl,function(r){return r.quietTime;}),'Quiet-time days'],
    [count(wl,function(r){return r.bible;}),'Bible days'],
    [count(wl,function(r){return r.oneOnOne;}),'One-on-ones'],
    [count(wl,function(r){return r.sharedFaith;}),'Shared faith'],
    [count(wl,function(r){return r.sabbath;}),'Sabbaths']
  ];
  cells.forEach(function(c){ h+='<div class="stat"><div class="statNum">'+c[0]+'</div><div class="statLabel">'+c[1]+'</div></div>'; });
  h+='</div>';

  h+='<h3>🗓️ Recent days</h3><div class="card">';
  if(!S.logs.length) h+='<p class="sub" style="margin:6px 0">No entries yet — log your first day on the Today tab.</p>';
  S.logs.slice(0,7).forEach(function(l){
    var bits=[];
    if(l.langHours) bits.push(l.langHours+'h lang');
    if(l.minHours) bits.push(l.minHours+'h min');
    if(l.workout) bits.push('workout');
    if(l.quietTime) bits.push('quiet time');
    if(l.bible) bits.push('Bible');
    h+='<div class="row"><span class="rowName">'+esc(l.date)+'<div class="pmeta">'+(bits.join(' · ')||'—')+'</div></span></div>';
  });
  h+='</div>';
  // Profile and settings live under Me now rather than owning a tab of their own.
  h+='<button class="btn ghost" id="goProfileFromMe">Profile &amp; settings</button>';
  return h;
}

  h+='<h2>My mentees <small>· '+S.mentees.length+'</small></h2>'+

  S.mentees.forEach(function(p){

/* ---------- photo resize + upload ---------- */
function handlePhoto(file){
  var reader=new FileReader();
  reader.onload=function(e){
    var img=new Image();
    img.onload=function(){
      var max=300, w=img.width, h=img.height;
      if(w>h && w>max){ h=Math.round(h*max/w); w=max; } else if(h>max){ w=Math.round(w*max/h); h=max; }
      var cv=document.createElement('canvas'); cv.width=w; cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      var data=cv.toDataURL('image/jpeg',0.7).split(',')[1];
      showMsg('Uploading photo…');
      run('uploadPhoto',[S.auth.user,S.auth.pin,data,'image/jpeg'],function(d){
        if(d.ok){ S.me.photo=d.photo; saveStaffCard(); showMsg('Photo updated'); render(); }
        else showMsg(d && d.err==='bad_type' ? 'That image type isn\u2019t supported' : (d && d.err==='too_large' ? 'Photo too large \u2014 try a smaller one' : 'Upload failed'));
      });
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}

/* Ministry dropdowns depend on the chosen department, so repopulate them in
   place rather than re-rendering the whole form and losing typed input. */
function fillMinistrySelect(selId, campusSelId, deptSelId, current){

}

/* Persist the habit set (and Bible-plan position) without blocking the UI. */
function pushHabits(){
  run('saveMyHabits',[S.auth.user,S.auth.pin,myHabits()],function(d){
    if(d && d.ok){ S.habits=d.habits; }
    render();
  });
}
/* Write today's habit ticks through the existing daily-log endpoint, merged
   with whatever else today already holds so the full check-in isn't clobbered. */
function saveTodayHabits(map){
  var today=todayStr();
  var log=logForDate(today)||{};
  var payload={
    langHours:log.langHours||0, minHours:log.minHours||0,
    workout:log.workout, bible:log.bible, quietTime:log.quietTime,
    oneOnOne:log.oneOnOne, sharedFaith:log.sharedFaith, sabbath:log.sabbath,
    clarity:log.clarity, growth:log.growth, lonely:log.lonely, porn:log.porn,
    habits:map
  };
  // Keep the legacy columns in step for habits that have one, so streaks and
  // the mentor view stay consistent with pre-habits history.
  ['workout','bible','quietTime','oneOnOne','sharedFaith','sabbath'].forEach(function(k){
    if(map[k]!==undefined) payload[k]=map[k];
  });
  run('saveDaily',[S.auth.user,S.auth.pin,today,payload],function(d){
    S.busy=false;
    if(d.ok){
      S.logs=d.logs;
      if(d.habits) S.habits=d.habits;
    }
    render();
  });
}
/* Keep the locally-held derived week row in step with what the server just
   recomputed, so the summary updates without another round trip. */
function upsertCheckin(week){
  if(!week) return;
  S.checkins=(S.checkins||[]).filter(function(c){ return Number(c.week)!==Number(week.week); });
  S.checkins.unshift(week);
}
function todayHabitMap(){
  var log=logForDate(todayStr());
  var map={};
  myHabits().forEach(function(hb){ map[hb.id]= !!(log && didHabit(log,hb.id)); });
  return map;
}

/* Promise flavour of run() for the refresh gesture. Always resolves, even on a
   failed request — otherwise a dropped connection would leave the spinner
   turning forever. */
function runP(fn, args){
  return fetch('/.netlify/functions/api', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ fn:fn, args:args })
  }).then(function(r){ return r.ok ? r.json() : null; }).catch(function(){ return null; });
}

function refreshAll(){
  if(!S.me) return Promise.resolve();
  var u=S.auth.user, k=S.auth.pin;
  return Promise.all([
    runP('teamRoster',[]).then(function(r){ if(Array.isArray(r)) S.roster=r; }),
    runP('getMyLogs',[u,k]).then(function(d){
      if(d&&d.ok){ S.logs=d.logs; if(d.habits) S.habits=d.habits; if(d.profile) S.profile=Object.assign(S.profile||{}, d.profile); }
    }),
    runP('getMyWeekly',[u,k]).then(function(d){ if(d&&d.ok){ S.goals=d.goals||[]; S.checkins=d.checkins||[]; } }),
    runP('getMyMinistry',[u,k]).then(function(d){ if(d&&d.ok) S.ministry=d; }),
    runP('getMyMentees',[u,k]).then(function(d){ if(d&&d.ok) S.mentees=d.mentees; }),
    runP('getMyMentorRequests',[u,k]).then(function(d){ if(d&&d.ok) S.mentorRequests=d.requests; })
  ]).then(function(){ render(); });
}

/* ---------- pull to refresh ----------
   Mirrors the dashboard: engages only at the top of the page, takes over from
   the native rubber-band, and never fires while a form is mid-edit. Haptics go
   through navigator.vibrate — Android feels them, iOS Safari doesn't implement
   the API. */
(function(){
  var ptr=document.getElementById('ptr');
  if(!ptr || !('ontouchstart' in window)) return;
  var THRESHOLD=68, MAX=108, RESIST=0.55;
  var startY=null, pull=0, armed=false, busy=false;

  function buzz(p){ if(navigator.vibrate){ try{ navigator.vibrate(p); }catch(e){} } }
  function setPull(px){
    pull=px;
    ptr.style.transform='translateY('+(Math.min(px,MAX)-60)+'px)';
    ptr.style.opacity=Math.min(1, px/THRESHOLD);
  }
  function reset(){
    ptr.classList.remove('dragging');
    ptr.style.transform=''; ptr.style.opacity='';
    startY=null; pull=0; armed=false;
  }

  document.addEventListener('touchstart', function(e){
    if(busy || e.touches.length!==1 || window.scrollY>0) return;
    // Don't hijack the gesture while someone is typing or picking things.
    var a=document.activeElement;
    if(a && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) return;
    startY=e.touches[0].clientY;
    ptr.classList.add('dragging');
  }, { passive:true });

  document.addEventListener('touchmove', function(e){
    if(startY===null || busy) return;
    var dy=e.touches[0].clientY-startY;
    if(dy<=0 || window.scrollY>0){ if(pull) reset(); return; }
    e.preventDefault();
    setPull(dy*RESIST);
    if(!armed && pull>=THRESHOLD){ armed=true; buzz(12); }
    else if(armed && pull<THRESHOLD){ armed=false; }
  }, { passive:false });

  document.addEventListener('touchend', function(){
    if(startY===null || busy) return;
    if(pull<THRESHOLD){ reset(); return; }
    busy=true; startY=null;
    ptr.classList.remove('dragging');
    ptr.classList.add('spinning');
    ptr.style.transform='translateY(14px)';
    ptr.style.opacity='1';
    buzz([8,40,12]);
    refreshAll().then(function(){
      ptr.classList.remove('spinning');
      busy=false; reset();
    });
  }, { passive:true });

  document.addEventListener('touchcancel', function(){ if(!busy) reset(); }, { passive:true });
})();

boot();
</script>
</body>
</html>
