<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>YWAM GP</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="YWAM GP">
<meta name="theme-color" content="#17150F">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="manifest" href="manifest.json">
<style>
@import url('https://fonts.googleapis.com/css2?family=Koulen&family=Archivo:wght@800;900&family=Kantumruy+Pro:wght@600&display=swap');
  html,body { margin:0; padding:0; height:100%; width:100%; overflow:hidden;
    position:fixed; overscroll-behavior:none; -webkit-overflow-scrolling:touch; background:#17150F; }
  iframe { border:0; width:100%; height:100%; display:block; }

  /* ---------- splash ---------- */
  #splash{
    position:fixed; inset:0; z-index:50; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:20px;
    background:radial-gradient(120% 90% at 50% 38%, #23306e 0%, #17150F 60%);
    transition:opacity .55s ease, transform .55s ease;
  }
  #splash.hide{ opacity:0; transform:scale(1.06); pointer-events:none; }
  .logoWrap{ position:relative; animation:pop .8s cubic-bezier(.2,.9,.2,1.1) both; }
  .logoWrap::after{ content:""; position:absolute; inset:-22%; border-radius:50%;
    background:radial-gradient(circle, rgba(31,68,255,.55), transparent 68%); filter:blur(10px); z-index:-1;
    animation:breathe 2.4s ease-in-out infinite; }
  .logoImg{ width:132px; height:auto; display:block; filter:drop-shadow(0 10px 24px rgba(0,0,0,.4)); }
  .spark{ position:absolute; top:-14px; right:-14px; color:#FFB323; font-size:34px; line-height:1;
    animation:twinkle 1.8s ease-in-out infinite; text-shadow:0 0 14px rgba(255,179,35,.7); }
  .wordKh{ font-family:'Koulen',sans-serif; color:#FAF6F0; font-size:40px; letter-spacing:2px; line-height:1;
    animation:rise .7s ease .25s both; }
  .wordEn{ font-family:'Archivo',sans-serif; font-weight:900; color:#FFB323; font-size:13px; letter-spacing:6px;
    text-transform:uppercase; animation:rise .7s ease .38s both; }
  .motto{ text-align:center; margin-top:6px; padding:0 24px; animation:rise .7s ease .55s both; }
  .mottoKh{ font-family:'Koulen',sans-serif; color:#FAF6F0; font-size:24px; letter-spacing:1px; line-height:1.25; }
  .mottoEn{ font-family:'Archivo',sans-serif; font-weight:800; color:#FFB323; font-size:12px; letter-spacing:5px; text-transform:uppercase; margin-top:4px; }
  .dots{ display:flex; gap:7px; margin-top:14px; animation:rise .7s ease .7s both; }
  .dots i{ width:8px; height:8px; border-radius:50%; background:#FFB323; opacity:.5; animation:blink 1.2s infinite; }
  .dots i:nth-child(2){ animation-delay:.2s; } .dots i:nth-child(3){ animation-delay:.4s; }

  @keyframes pop{ 0%{opacity:0; transform:scale(.6)} 100%{opacity:1; transform:scale(1)} }
  @keyframes rise{ 0%{opacity:0; transform:translateY(12px)} 100%{opacity:1; transform:translateY(0)} }
  @keyframes twinkle{ 0%,100%{transform:scale(1) rotate(0); opacity:1} 50%{transform:scale(1.35) rotate(18deg); opacity:.75} }
  @keyframes breathe{ 0%,100%{opacity:.55; transform:scale(1)} 50%{opacity:.9; transform:scale(1.08)} }
  @keyframes blink{ 0%,100%{opacity:.35; transform:translateY(0)} 50%{opacity:1; transform:translateY(-4px)} }
  @media (prefers-reduced-motion: reduce){ #splash *{ animation:none !important; } }
</style>
</head>

  frame.src = pageUrl(startP || 'index');

  // Dismiss the splash once the app has loaded (min shown time so the animation
  // completes; hard cap so it never sticks if the network is slow).
  var start = Date.now(), MIN = 1600, done = false;
  function dismiss(){
    if(done) return; done = true;
    var wait = Math.max(0, MIN - (Date.now() - start));
    setTimeout(function(){
      var sp = document.getElementById('splash');
      if(sp){ sp.classList.add('hide'); setTimeout(function(){ sp.remove(); }, 600); }
    }, wait);
  }
  frame.addEventListener('load', dismiss);
  setTimeout(dismiss, 5000); // fallback cap

  // Router: teams / help / any ?p= page stays inside the shell.
  window.addEventListener('message', function (e) {
    var d = e.data || {};
    if (d.gpPing && e.source) { e.source.postMessage({ gpPong: 1 }, '*'); return; }
    if (d.gpNav) { frame.src = pageUrl(d.gpNav); }
  });
</script>
</body>
</html>
