name: Deploy to Apps Script

on:
  push:
    branches: [main]
    paths:
      - 'appsscript/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Not secret — the deployment ID is already embedded in the live /exec
      # URL, and the script ID is just a project identifier.
      CLASP_SCRIPT_ID: 1J_EjguJF5lStk2Q6vI65S-QyfxZdq99z4H7RnFRQFPSwOp_oPFumpbr7
      CLASP_DEPLOYMENT_ID: AKfycbyjTDxTnM24NSr74KVAFseJIdFN3pU9mUkV9HiJc5J09TzkwNraOWeLLp6g1ic1IImo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install clasp
        run: npm install -g @google/clasp

      - name: Restore clasp credentials
        env:
          CLASP_CREDENTIALS: ${{ secrets.CLASP_CREDENTIALS }}
        run: echo "$CLASP_CREDENTIALS" > ~/.clasprc.json

      - name: Stage files for push
        # clasp expects server-side files with a .js extension locally
        # (it maps them to Apps Script's .gs server type on push), so stage
        # a copy rather than renaming the source-of-truth Code.gs in the repo.
        run: |
          mkdir -p .clasp-push
          cp appsscript/Code.gs .clasp-push/Code.js
          cp appsscript/Index.html .clasp-push/Index.html
          cp appsscript/Teams.html .clasp-push/Teams.html
          cp appsscript/Help.html .clasp-push/Help.html
          cp appsscript/appsscript.json .clasp-push/appsscript.json
          echo "{\"scriptId\":\"$CLASP_SCRIPT_ID\",\"rootDir\":\"./.clasp-push\"}" > .clasp.json

      - name: Push to Apps Script
        run: clasp push --force

      - name: Deploy new version (existing deployment, same /exec URL)
        run: clasp deploy -i "$CLASP_DEPLOYMENT_ID" -d "Auto-deploy from GitHub — ${{ github.sha }}"
